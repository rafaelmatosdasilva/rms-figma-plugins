name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Fail if the committed build output is stale — i.e. someone changed a
      # source file but committed without rebuilding. Keeps the sideloadable
      # code.js / ui.html in sync with src.
      - name: Check committed build output is up to date
        run: git diff --exit-code

      - name: Validate plugin manifests
        run: node scripts/check-manifests.mjs
