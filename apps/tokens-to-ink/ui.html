    const preserveSpot = !!(opts && opts.preserveSpot);
    const usedSpots = new Map();   // pantone → { name:'/SpotN', ink, cmyk }
    const spotSeen = new Set();    // every distinct fill/stroke hex seen (diagnostic)

    // ── Parse xref ──
    const sxm=pdf.lastIndexOf('startxref');
    if(sxm<0)throw new Error('Invalid PDF');
    const xrefOff=parseInt(pdf.substring(sxm+9).trim());
    const xrefArea=pdf.substring(xrefOff);
    const offsets={};

    if(xrefArea.trimStart().startsWith('xref')){
      const xb=xrefArea.substring(xrefArea.indexOf('\n')+1);
      const secRe=/(\d+)\s+(\d+)\s*[\r\n]+((?:\d{10}\s+\d{5}\s+[fn][\s\r\n]+)+)/g;
      let sm;
      while((sm=secRe.exec(xb))!==null){
        const first=parseInt(sm[1]),cnt=parseInt(sm[2]),lines=sm[3].trim().split(/\r?\n/);
        for(let i=0;i<Math.min(cnt,lines.length);i++){
          const p=lines[i].trim().split(/\s+/);
          if(p[2]==='n'&&(first+i)>0)offsets[first+i]=parseInt(p[0]);
        }
      }
    }else{
      // Fallback: scan for object markers
      const oRe=/(\d+)\s+0\s+obj\b/g;let om;
      while((om=oRe.exec(pdf))!==null)offsets[parseInt(om[1])]=om.index;
    }

    const tmRe=/trailer\s*<<([\s\S]*?)>>/;
    const tMatch=tmRe.exec(xrefArea)||tmRe.exec(pdf);
    const trailerDict=tMatch?tMatch[1]:' /Root 1 0 R /Size 1';

    // ── Parse objects ──
    const nums=Object.keys(offsets).map(Number).sort((a,b)=>offsets[a]-offsets[b]);
    const bounds=nums.map(n=>offsets[n]).concat(xrefOff).sort((a,b)=>a-b);
    function nextB(off){for(const b of bounds)if(b>off)return b;return N;}

    const objs={};
    for(const num of nums){
      const off=offsets[num],end=nextB(off);
      const chunk=pdf.substring(off,end);
      const hm=chunk.match(/^\d+\s+\d+\s+obj[\s\r\n]*/);
      if(!hm)continue;
      const bS=hm[0].length,eoI=chunk.lastIndexOf('endobj');
      const body=chunk.substring(bS,eoI>0?eoI:undefined).trim();

      const stIdx=body.indexOf('stream');
      if(stIdx>=0){
        const dict=body.substring(0,stIdx);
        const ch1=body.charCodeAt(stIdx+6),ch2=body.charCodeAt(stIdx+7);
        const dO=(ch1===13&&ch2===10)?stIdx+8:(ch1===10||ch1===13)?stIdx+7:stIdx+6;
        let len=null;
        const lr=dict.match(/\/Length\s+(\d+)\s+0\s+R/);
        if(lr){
          const ln=parseInt(lr[1]);
          if(offsets[ln]!=null){const lc=pdf.substring(offsets[ln],offsets[ln]+80);const lv=lc.match(/obj\s*[\r\n]*\s*(\d+)/);if(lv)len=parseInt(lv[1]);}
        }
        if(len==null){const ld=dict.match(/\/Length\s+(\d+)/);if(ld)len=parseInt(ld[1]);}
        if(len!=null){
          const abs=off+bS+dO;
          objs[num]={dict,streamRaw:raw.slice(abs,abs+len),isFlate:/\/FlateDecode/.test(dict),type:'stream'};
        }else{objs[num]={body,type:'plain'};}
      }else{objs[num]={body,type:'plain'};}
    }

    // ── Classify objects ──
    const iccRgb=new Set(),iccGray=new Set();
    for(const[n,o]of Object.entries(objs))
      if(o.type==='stream'){ if(/\/N\s+3\b/.test(o.dict))iccRgb.add(+n); else if(/\/N\s+1\b/.test(o.dict))iccGray.add(+n); }
    const {allImg,imgNums,imgCsRefs}=classifyImages(objs,iccRgb,iccGray);

    // ── Collect SMask Form XObject refs ──
    // Mask XObjects referenced by /SMask << /G N 0 R >> must be kept intact:
    // their Group must not be stripped (needed for correct mask compositing)
    // and their streams must not be color-converted (DeviceGray, not CMYK).
    const smaskNums=new Set();
    for(const[,obj]of Object.entries(objs)){
      const body=obj.type==='stream'?obj.dict:(obj.body||'');
      for(const m of body.matchAll(/\/SMask\s*<<[^>]*\/G\s+(\d+)\s+0\s+R/g))
        smaskNums.add(+m[1]);
    }

    // ── Convert SMask references to explicit W n clip paths ──
    // Modern Illustrator silently drops Figma's /SMask transparency clips
    // when opening PDFs (Preview honors them, Illustrator doesn't). Convert
    // each `/Name gs` that activates an SMask into an inline clip path so
    // Illustrator sees a native Clip Path and clips correctly.
    //
    // Strategy: scan every object body/dict globally for ExtGState entries
    // (inline or indirect) that contain /SMask << /G N 0 R >>, mapping
    // resource names → mask-XObject numbers. Then in every content stream
    // (page contents OR Form XObject), replace `/Name gs` with the mask's
    // path operators ending in `W n`.

    // Step 1: ExtGState plain-object → mask XObject number
    const extGSToMask=new Map();
    for(const[nS,obj]of Object.entries(objs)){
      const text=obj.type==='plain'?(obj.body||''):obj.dict;
      const m=text.match(/\/SMask\s*<<[^>]*\/G\s+(\d+)\s+0\s+R/);
      if(m&&!/\/SMask\s*<<[^>]*\/G\s+(\d+)\s+0\s+R[\s\S]*\/SMask/.test(text)){
        if(obj.type==='plain')extGSToMask.set(+nS,+m[1]);
      }
    }

    // Step 2: per-stream "name → mask XObject number" maps.
    //
    // CRITICAL: resource names like /E1 are LOCAL to each Form XObject's
    // (or Page's) /Resources dict — the page can use /E1 for one mask and
    // obj 22 can use /E1 for a totally different mask. Building a single
    // global map clobbers obj 22's scope with the page's, so the swatch
    // inside obj 22 gets clipped by the frame's mask rather than its own.
    //
    // Build the name→mask map fresh per processed stream using only that
    // stream's own Resources.
    function balancedDict(t,si){
      if(t.substr(si,2)!=='<<')return null;
      let d=0,i=si;
      while(i<t.length-1){
        if(t[i]==='<'&&t[i+1]==='<'){d++;i+=2;}
        else if(t[i]==='>'&&t[i+1]==='>'){d--;i+=2;if(d===0)return t.substring(si,i);}
        else i++;
      }
      return null;
    }
    function getResourcesText(dictOrBody){
      const re=/\/Resources\b/.exec(dictOrBody);
      if(!re)return '';
      let i=re.index+10;
      while(i<dictOrBody.length&&/\s/.test(dictOrBody[i]))i++;
      if(dictOrBody.substr(i,2)==='<<')return balancedDict(dictOrBody,i)||'';
      const mm=dictOrBody.substr(i,30).match(/^(\d+)\s+0\s+R/);
      if(mm){const t=objs[+mm[1]];return t&&t.type==='plain'?(t.body||''):'';}
      return '';
    }
    function buildScopedNameToMask(resText){
      const map=new Map();
      if(!resText)return map;
      for(const m of resText.matchAll(/\/(\w+)\s*<<[^<>]*?\/SMask\s*<<[^<>]*?\/G\s+(\d+)\s+0\s+R/g))
        map.set(m[1],+m[2]);
      for(const m of resText.matchAll(/\/(\w+)\s+(\d+)\s+0\s+R\b/g))
        if(extGSToMask.has(+m[2]))map.set(m[1],extGSToMask.get(+m[2]));
      return map;
    }
    // For page content streams (which don't carry their own Resources), map
    // each /Contents stream to its parent Page's Resources text up-front.
    const streamToResources=new Map();
    for(const[,obj]of Object.entries(objs)){
      if(obj.type!=='plain')continue;
      if(!/\/Type\s*\/Page\b/.test(obj.body))continue;
      if(/\/Type\s*\/Pages\b/.test(obj.body))continue;
      const cm=obj.body.match(/\/Contents\s+(\d+)\s+0\s+R/);
      const cmArr=obj.body.match(/\/Contents\s*\[\s*((?:\d+\s+0\s+R\s*)+)\]/);
      const contentNums=[];
      if(cm)contentNums.push(+cm[1]);
      if(cmArr)for(const mm of cmArr[1].matchAll(/(\d+)\s+0\s+R/g))contentNums.push(+mm[1]);
      if(!contentNums.length)continue;
      const resText=getResourcesText(obj.body);
      for(const cn of contentNums)streamToResources.set(cn,resText);
    }

    // Helper: extract a clip path from a mask Form XObject's stream.
    //
    // Walks the mask body, keeps `cm` + path operators, replaces each
    // painting op with `W n`, and emits the cumulative inverse `cm` at
    // the end so the transform applied by the mask's own `cm` ops does
    // NOT leak onto subsequent content drawn under the clip.
    //
    // Without that inverse, `/X_ Do` after the clip gets drawn translated
    // by whatever the mask was translated by — content appears offset
    // inside the clip region. We saw this in Frame 79 (mask cm 32,32).
    //
    // Fallback: if the mask has no painted shapes (e.g. `q /E_ gs /X_ Do Q`
    // — Figma's nested-mask pattern), recurse via `/Name gs` (inner SMask)
    // first, then `/Name Do`. Depth-limited cycle guard.
    function pdfMulCm(B,A){
      return[B[0]*A[0]+B[1]*A[2],B[0]*A[1]+B[1]*A[3],B[2]*A[0]+B[3]*A[2],B[2]*A[1]+B[3]*A[3],B[4]*A[0]+B[5]*A[2]+A[4],B[4]*A[1]+B[5]*A[3]+A[5]];
    }
    function pdfInvCm(m){
      const det=m[0]*m[3]-m[1]*m[2];
      if(Math.abs(det)<1e-12)return null;
      const id=1/det;
      return[m[3]*id,-m[1]*id,-m[2]*id,m[0]*id,(m[2]*m[5]-m[3]*m[4])*id,(m[1]*m[4]-m[0]*m[5])*id];
    }
    function pdfFmtN(v){const s=Number(v).toFixed(6);return s.replace(/0+$/,'').replace(/\.$/,'');}
    async function maskToClipPath(maskNum,depth=0,visited=new Set()){
      if(depth>4||visited.has(maskNum))return null;
      visited.add(maskNum);
      const mask=objs[maskNum];
      if(!mask||mask.type!=='stream')return null;
      let body;
      try{body=mask.isFlate?b2s(await inflateBuf(mask.streamRaw)):b2s(mask.streamRaw);}
      catch(e){return null;}
      const PATH_OPS=new Set(['m','l','c','v','y','h','re']);
      const PAINT_OPS=new Set(['f','F','f*','B','B*','b','b*','S','s']);
      const lines=body.split(/\r?\n/);
      const hasPaint=lines.some(l=>{const t=l.trim().split(/\s+/);return t.length&&PAINT_OPS.has(t[t.length-1]);});
      if(hasPaint){
        const out=[];
        let composedCm=[1,0,0,1,0,0];
        for(let line of lines){
          line=line.trim();
          if(!line)continue;
          const tokens=line.split(/\s+/);
          const op=tokens[tokens.length-1];
          if(op==='cm'&&tokens.length===7){
            const m=tokens.slice(0,6).map(parseFloat);
            if(m.every(v=>!isNaN(v))){composedCm=pdfMulCm(m,composedCm);out.push(line);}
          }else if(PATH_OPS.has(op)){
            out.push(line);
          }else if(PAINT_OPS.has(op)){
            out.push('W n');
          }
        }
        // Emit inverse cm so /X_ Do after the clip is drawn at the original
        // CTM (clip is preserved in device coords by W n; only the user-space
        // CTM is reverted).
        const inv=pdfInvCm(composedCm);
        if(inv)out.push(`${pdfFmtN(inv[0])} ${pdfFmtN(inv[1])} ${pdfFmtN(inv[2])} ${pdfFmtN(inv[3])} ${pdfFmtN(inv[4])} ${pdfFmtN(inv[5])} cm`);
        return out.join('\n');
      }
      // No painted shapes — try recursion through this mask's own resources.
      const xobjMap=new Map();
      const extGSMap=new Map();
      const xMatch=mask.dict.match(/\/XObject\s*<<([^<>]*)>>/);
      if(xMatch)for(const m of xMatch[1].matchAll(/\/(\w+)\s+(\d+)\s+0\s+R/g))xobjMap.set(m[1],+m[2]);
      const eMatch=mask.dict.match(/\/ExtGState\s*<<([\s\S]*?)>>\s*(?:\/[A-Z]|>>)/);
      if(eMatch)for(const m of eMatch[1].matchAll(/\/(\w+)\s*<<[^<>]*?\/SMask\s*<<[^<>]*?\/G\s+(\d+)\s+0\s+R/g))extGSMap.set(m[1],+m[2]);
      for(const m of body.matchAll(/\/(\w+)\s+gs\b/g)){
        const target=extGSMap.get(m[1]);
        if(target){const nested=await maskToClipPath(target,depth+1,visited);if(nested)return nested;}
      }
      for(const m of body.matchAll(/\/(\w+)\s+Do\b/g)){
        const target=xobjMap.get(m[1]);
        if(target){const nested=await maskToClipPath(target,depth+1,visited);if(nested)return nested;}
      }
      return null;
    }

    // Step 3: rewrite every content stream that uses a masking gs, using
    // the name→mask map scoped to THAT stream's own Resources.
    for(const[nS,obj]of Object.entries(objs)){
      if(obj.type!=='stream')continue;
      const n=+nS;
      if(iccRgb.has(n)||allImg.has(n)||smaskNums.has(n))continue;
      // Pick the right Resources text for this stream:
      //  - Form XObject → its own /Resources (inline or indirect)
      //  - Page content stream → the parent Page's /Resources (pre-mapped)
      let resText='';
      if(/\/Subtype\s*\/Form/.test(obj.dict))resText=getResourcesText(obj.dict);
      else if(streamToResources.has(n))resText=streamToResources.get(n);
      const scopedNameToMask=buildScopedNameToMask(resText);
      if(scopedNameToMask.size===0)continue;
      let body;
      try{body=obj.isFlate?b2s(await inflateBuf(obj.streamRaw)):b2s(obj.streamRaw);}
      catch(e){continue;}
      let modified=false;
      for(const[name,maskNum]of scopedNameToMask){
        const re=new RegExp('\\/'+name+'\\b\\s+gs\\b','g');
        if(!re.test(body))continue;
        const clip=await maskToClipPath(maskNum);
        if(!clip)continue;
        body=body.replace(re,clip);
        modified=true;
      }
      if(!modified)continue;
      const nb=s2b(body);
      obj.streamRaw=obj.isFlate?await deflateBuf(nb):nb;
      obj.dict=obj.dict.replace(/\/Length\s+\d+(\s+0\s+R)?/,'/Length '+obj.streamRaw.length);
    }

    // ── Replace /Group transparency with explicit BBox clip ──
    // Modern Illustrator misreads Figma's /Group << /S /Transparency >> on
    // every Form XObject and hides all content ("broken Clip Group" bug).
    // Stripping /Group alone restores visibility but kills the implicit
    // BBox clip that "Clip content" frames depend on. Solution: inject an
    // explicit `q [BBox] re W n ... Q` wrapper around each Form XObject's
    // stream, THEN strip /Group. Content stays visible and stays clipped.
    for(const[nS,obj]of Object.entries(objs)){
      if(obj.type!=='stream')continue;
      const n=+nS;
      if(iccRgb.has(n)||allImg.has(n)||smaskNums.has(n))continue;
      if(!/\/Subtype\s*\/Form/.test(obj.dict))continue;
      if(!/\/Group\s*<<[^>]*\/S\s*\/Transparency/.test(obj.dict))continue;
      const bbm=obj.dict.match(/\/BBox\s*\[\s*([-\d.]+)\s+([-\d.]+)\s+([-\d.]+)\s+([-\d.]+)\s*\]/);
      if(!bbm)continue;
      const x0=+bbm[1],y0=+bbm[2],x1=+bbm[3],y1=+bbm[4];
      const w=x1-x0,h=y1-y0;
      let body;
      try{body=obj.isFlate?b2s(await inflateBuf(obj.streamRaw)):b2s(obj.streamRaw);}
      catch(e){continue;}
      const wrapped=`q\n${x0} ${y0} ${w} ${h} re W n\n${body}\nQ`;
      const nb=s2b(wrapped);
      obj.streamRaw=obj.isFlate?await deflateBuf(nb):nb;
      obj.dict=obj.dict.replace(/\/Group\s*<<[^>]*>>\s*/g,'');
      obj.dict=obj.dict.replace(/\/Length\s+\d+(\s+0\s+R)?/,'/Length '+obj.streamRaw.length);
    }

    // ── Strip only /SMask /None from ExtGState objects ──
    // /None means "no mask" in PDF spec — safe to drop. Inline << >> SMask
    // dicts MUST be preserved when they contain a /G N 0 R reference, since
    // that IS Figma's clipping mask. The previous broad-strip regex was
    // silently removing those references and killing clip behavior.
    const sMaskRe=/\/SMask\s+\/None\b\s*/g;
    for(const[,obj]of Object.entries(objs)){
      if(obj.type==='plain'&&/\/SMask\s+\/None/.test(obj.body))
        obj.body=obj.body.replace(sMaskRe,'');
      else if(obj.type==='stream'&&/\/SMask\s+\/None/.test(obj.dict))
        obj.dict=obj.dict.replace(sMaskRe,'');
    }

    // ── Strip ICC RGB refs from non-image objects (mask Form XObjects etc.) ──
    // Preserved SMask Form XObjects may still reference ICC RGB profiles in their
    // dicts, causing Illustrator's "mixed color mode" dialog. Replace with DeviceGray.
    // (Only the dict is touched here — stream content is left intact for mask XObjects.)
    for(const[nS,obj]of Object.entries(objs)){
      const n=+nS;
      if(allImg.has(n)||imgCsRefs.has(n)||iccRgb.has(n))continue;
      const k=obj.type==='stream'?'dict':'body';
      for(const i of iccRgb){
        obj[k]=obj[k].replace(new RegExp('\\[\\s*/ICCBased\\s+'+i+'\\s+0\\s+R\\s*\\]','g'),'/DeviceGray');
        obj[k]=obj[k].replace(new RegExp('/CS\\s+'+i+'\\s+0\\s+R','g'),'/CS /DeviceGray');
      }
    }

    // ── Convert content stream colors ──
    function fmtF(v){if(v===0)return'0';if(v===1)return'1';return v.toFixed(5).replace(/0+$/,'').replace(/\.$/,'');}
    function cvtColors(txt){
      // Switch named color space selections to DeviceCMYK so transparency
      // groups that inherit the current CS get CMYK (not ICCBased RGB).
      // Without this, /Group << /S /Transparency >> (no /CS) inherits RGB
      // from the parent context but content uses k/K → blending mismatch.
      txt=txt.replace(/\/C\d+\s+cs\b/g,'/DeviceCMYK cs');
      txt=txt.replace(/\/C\d+\s+CS\b/g,'/DeviceCMYK CS');
      // All RGB color ops → k/K (direct DeviceCMYK, no CS dependency)
      txt=txt.replace(/([\d.]+)\s+([\d.]+)\s+([\d.]+)\s+(scn|SCN|rg|RG)\b/g,(m,rs,gs,bs,op)=>{
        const r=parseFloat(rs),g=parseFloat(gs),b=parseFloat(bs);
        if(isNaN(r)||isNaN(g)||isNaN(b)||r>1.001||g>1.001||b>1.001)return m;
        const isStroke=(op==='SCN'||op==='RG');
        // Pantone-tagged solid colour → emit a spot (Separation) selection at full tint.
        if(preserveSpot&&colorLookup){
          const hex='#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v*255))).toString(16).padStart(2,'0')).join('').toUpperCase();
          spotSeen.add(hex);
          const e=colorLookup[hex];
          if(e&&e.pantone){const nm=registerSpot(usedSpots,e.pantone,{c:e.c,m:e.m,y:e.y,k:e.k});return`${nm} ${isStroke?'CS':'cs'} 1 ${isStroke?'SCN':'scn'}`;}
        }
        const[c,mk,y,kv]=rgbFloatToCmykFloat(r,g,b,colorLookup);
        return`${fmtF(c)} ${fmtF(mk)} ${fmtF(y)} ${fmtF(kv)} ${isStroke?'K':'k'}`;
      });
      // 1-arg gray → k/K
      txt=txt.replace(/([\d.]+)\s+([gG])\b/g,(m,gs,op)=>{
        const v=parseFloat(gs);if(isNaN(v)||v>1.001)return m;
        return`0 0 0 ${fmtF(1-v)} ${op==='g'?'k':'K'}`;
      });
      return txt;
    }

    for(const[nS,obj]of Object.entries(objs)){
      const n=+nS;
      if(obj.type!=='stream'||allImg.has(n)||iccRgb.has(n)||smaskNums.has(n))continue;
      let txt;
      try{txt=obj.isFlate?b2s(await inflateBuf(obj.streamRaw)):b2s(obj.streamRaw);}catch(e){continue;}
      if(!/(scn|SCN|rg|RG)\b/.test(txt)&&!/[\d.]+\s+[gG]\b/.test(txt)&&!/\/C\d+\s+[cC][sS]\b/.test(txt))continue;
      const cvt=cvtColors(txt);
      const nb=s2b(cvt);
      obj.streamRaw=obj.isFlate?await deflateBuf(nb):nb;
      obj.dict=obj.dict.replace(/\/Length\s+\d+(\s+0\s+R)?/,'/Length '+obj.streamRaw.length);
    }

    // Spot colours: emit a Separation object per used spot and register /SpotN in every Resources.
    if(usedSpots.size) injectSpotColorSpaces(objs, nums, usedSpots, fmtF, balancedDict);
    if(preserveSpot) logSpotSummary(colorLookup, usedSpots, spotSeen);

    // ── Convert RGB raster images → DeviceCMYK (optionally downsampling to a DPI) ──
    let ds=null;
    if(opts&&opts.downsample&&opts.downsampleDpi>0)
      ds={dpi:opts.downsampleDpi,sizes:await imageDisplaySizes(objs,allImg)};
    window._lastPdfImagesUnconverted = await convertRgbImagesToCmyk(objs,imgNums,colorLookup,ds);

    // ── Crop / trim marks (print) — added last so they emit as clean DeviceCMYK ──
    if(opts&&(opts.cropMarks||opts.regMarks||opts.pageInfo||opts.colorBars||opts.bleedPt>0))addPrintMarks(objs,nums,opts.bleedPt,opts.trimBox,opts.cropMarks,opts.regMarks,opts.pageInfo,opts.pageInfoLeft,opts.pageInfoRight,opts.colorBars);

    // ── PDF/X-4 press-ready: embed the ICC output intent + XMP + per-page TrimBox ──
    const isPdfX = !!(opts && opts.pdfx) && applyPdfX(objs, nums, trailerDict, s2b);

    // ── Rebuild PDF ──
    const parts=[],newOff={};
    // Default version is PDF 1.4 — the highest fully supported by Illustrator CS6. PDF/X-4 needs 1.6
    // (it permits the transparency Figma emits), so the bump is scoped to the press-ready toggle.
    const hEnd=pdf.indexOf('\n',pdf.indexOf('\n')+1)+1;
    const hdrStr=pdf.substring(0,hEnd).replace(/%PDF-[\d.]+/, isPdfX?'%PDF-1.6':'%PDF-1.4');
    parts.push(s2b(hdrStr));
    const maxObj=Math.max(...nums);

    for(const num of nums){
      const obj=objs[num];if(!obj)continue;
      newOff[num]=parts.reduce((s,p)=>s+p.length,0);
      if(obj.type==='stream'){
        parts.push(s2b(num+' 0 obj\n'+obj.dict+'\nstream\n'));
        parts.push(obj.streamRaw);
        parts.push(s2b('\nendstream\nendobj\n'));
      }else{
        parts.push(s2b(num+' 0 obj\n'+obj.body+'\nendobj\n'));
      }
    }

    const xrS=parts.reduce((s,p)=>s+p.length,0);
    let xr='xref\n0 '+(maxObj+1)+'\n0000000000 65535 f \n';
    for(let i=1;i<=maxObj;i++)
      xr+=newOff[i]!=null?newOff[i].toString().padStart(10,'0')+' 00000 n \n':'0000000000 00000 f \n';
    let nTr=trailerDict.replace(/\/Size\s+\d+/,'/Size '+(maxObj+1)).replace(/\/Prev\s+\d+/,'');
    if(isPdfX&&!/\/ID\s*\[/.test(nTr)){const id=pdfxId();nTr+=` /ID [ <${id}> <${id}> ]`;}   // PDF/X requires /ID
    xr+='trailer\n<<'+nTr+'>>\nstartxref\n'+xrS+'\n%%EOF';
    parts.push(s2b(xr));

    const total=parts.reduce((s,p)=>s+p.length,0);
    const result=new Uint8Array(total);let pos=0;
    for(const p of parts){result.set(p,pos);pos+=p.length;}
    return result;
  }

  // ── PDF: Build CMYK PDF from scratch (300 DPI raster) ─────────────
  // Generates a valid PDF with a DeviceCMYK image, FlateDecode compressed.
  // Illustrator, Acrobat, and print RIPs see it as native CMYK.

  // ── Convert PNG to 4-channel CMYK (PDF — white bg for transparency) ──

  // ── TIFF: CMYK+Alpha at the chosen DPI (default 300) ──────────────

  // zip=true → Adobe Deflate (tag 8, zlib), lossless and widely supported → much smaller files.
  // zip=false → uncompressed (tag 1). Single strip either way. Async because deflate is.
  async function buildCmykaTiff(data,w,h,dpi,zip) {
    const res = Math.round(dpi) || 300;
    const strip = zip ? await deflateBuf(data) : data;   // compressed (or raw) strip bytes
    const stripLen = strip.length, compression = zip ? 8 : 1;
    const nT=15, iO=8, iSz=2+(nT*12)+4, eO=iO+iSz;
    // Extra data: BitsPerSample (5 shorts = 10 bytes) + XRes (8) + YRes (8)
    const bO=eO, xO=bO+10, yO=xO+8, sO=yO+8;
    const buf=new ArrayBuffer(sO+stripLen), v=new DataView(buf), b=new Uint8Array(buf);
    let p=0;
    const w16=x=>{v.setUint16(p,x,true);p+=2;}, w32=x=>{v.setUint32(p,x,true);p+=4;};
    function t(tag,type,cnt,val){w16(tag);w16(type);w32(cnt);if(type===3&&cnt===1){w16(val);w16(0);}else{w32(val);}}
    w16(0x4949); w16(42); w32(iO); w16(nT);
    t(256,4,1,w);           // ImageWidth
    t(257,4,1,h);           // ImageLength
    t(258,3,5,bO);          // BitsPerSample → offset (5 shorts: 8,8,8,8,8)
    t(259,3,1,compression); // Compression: 1 = none, 8 = Adobe Deflate (zlib)
    t(262,3,1,5);           // PhotometricInterpretation: CMYK
    t(273,4,1,sO);          // StripOffsets
    t(277,3,1,5);           // SamplesPerPixel: 5 (CMYK+A)
    t(278,4,1,h);           // RowsPerStrip
    t(279,4,1,stripLen);    // StripByteCounts (compressed length when zipped)
    t(282,5,1,xO);          // XResolution → offset (RATIONAL 300/1)
    t(283,5,1,yO);          // YResolution → offset (RATIONAL 300/1)
    t(284,3,1,1);           // PlanarConfiguration: chunky
    t(296,3,1,2);           // ResolutionUnit: inch
    t(332,3,1,1);           // InkSet: CMYK
    t(338,3,1,2);           // ExtraSamples: 2 = unassociated alpha (INLINE)
    w32(0); // next IFD
    // BitsPerSample
    p=bO; w16(8);w16(8);w16(8);w16(8);w16(8);
    // XResolution res/1, YResolution res/1
    p=xO; w32(res);w32(1);
    p=yO; w32(res);w32(1);
    // Pixel data (compressed or raw)
    b.set(strip, sO);
    return new Uint8Array(buf);
  }

  // 5-channel CMYK+Alpha (for TIFF — preserves transparency)
  // Un-premultiplies canvas alpha before CMYK conversion
  async function convertImageToCmyka(png, w, h, cl) {
    const rgba = await loadPngToCanvas(png, w, h, false);
    const out = new Uint8Array(w * h * 5);
    const lut = buildCmykLut(cl);   // packed-int colour table, built once for all pixels
    for (let i = 0, j = 0; i < rgba.length; i += 4, j += 5) {
      const a = rgba[i + 3];
      if (a === 0) { out[j] = out[j+1] = out[j+2] = out[j+3] = out[j+4] = 0; }
      else {
        let r = rgba[i], g = rgba[i+1], b = rgba[i+2];
        if (a > 0 && a < 255) {
          r = Math.min(255, Math.round(r * 255 / a));
          g = Math.min(255, Math.round(g * 255 / a));
          b = Math.min(255, Math.round(b * 255 / a));
        }
        writeCmyk(out, j, r, g, b, lut);   // CMYK into j..j+3
        out[j+4] = a;
      }
    }
    return out;
  }

  function downloadFile(bytes,name,mime){
    const blob=new Blob([bytes],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=url;a.download=name;a.click();URL.revokeObjectURL(url);
  }

  // ── Export ──────────────────────────────────────────────────────────

  function setExportBusy(busy) {
    document.getElementById("export-confirm-btn").disabled = busy;
  }

  function startExport(fmt) {
    if (window.__closeExportModal) window.__closeExportModal();
    _singleFileHandle = null;
    _exportCancelled = false; // reset here, not in export-batch-start

    // Show "Preparing…" immediately. Ask code.js how many frames will be exported
    // so we can show the right picker (directory vs single-file save-as).
    setExportBusy(true);
    _showExportProgress(`Preparing ${fmt.toUpperCase()} export…`);

    parent.postMessage({ pluginMessage: { type: "export-request", format: fmt, tiffDpi: _tiffDpi } }, "*");
  }

  // Called when code.js replies with the real exportable frame count.
  async function _onExportReady(count, fmt) {
    if (_exportCancelled) return;

    const isMulti = count > 1;
    const hasFSA  = typeof window.showSaveFilePicker === 'function'
                 && typeof window.showDirectoryPicker === 'function';

    if (hasFSA) {
      if (isMulti) {
        if (_dirHandle) {
          try {
            const perm = await _dirHandle.queryPermission({ mode: 'readwrite' });
            if (perm !== 'granted') {
              const req = await _dirHandle.requestPermission({ mode: 'readwrite' });
              if (req !== 'granted') _dirHandle = null;
            }
          } catch (_) { _dirHandle = null; }
        }
        if (!_dirHandle) {
          try {
            _dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
          } catch (err) {
            if (err.name === 'AbortError') {
              dismissProgress(); setExportBusy(false); return;
            }
            _dirHandle = null; // sandbox blocked — fall through to downloadFile
          }
        }
      } else {
        const ext  = fmt === 'pdf' ? 'pdf' : 'tiff';
        const mime = fmt === 'pdf' ? 'application/pdf' : 'image/tiff';
        try {
          _singleFileHandle = await window.showSaveFilePicker({
            suggestedName: `export_CMYK.${ext}`,
            types: [{ description: ext.toUpperCase() + ' file', accept: { [mime]: ['.' + ext] } }],
          });
        } catch (err) {
          if (err.name === 'AbortError') {
            dismissProgress(); setExportBusy(false); return;
          }
          _singleFileHandle = null; // sandbox blocked — fall through to downloadFile
        }
      }
    }

    parent.postMessage({ pluginMessage: { type: "export-frames" } }, "*");
  }

  // A pre-flight row: name + meta + the shared "Focus in canvas" button (a buttonTertiary
  // with the #icon-focus glyph, matching the source-focus-btn chips). Clicking focuses the node.
  function preflightRow(id, name, meta) {
    return `<div class="preflight-row">`
         + `<span class="pf-name">${esc(name)}</span>`
         + `<span class="pf-meta">${esc(meta)}</span>`
         + `<button class="buttonTertiary preflight-focus-btn" data-node-id="${esc(id)}" data-tip="Focus in canvas">${focusIcon}</button>`
         + `</div>`;
  }
  function wirePreflightFocus(listEl) {
    listEl.querySelectorAll(".preflight-focus-btn").forEach((btn) => {
      btn.addEventListener("click", () =>
        parent.postMessage({ pluginMessage: { type: "focus-node", nodeId: btn.dataset.nodeId } }, "*"));
    });
  }
  // Show the right cards for the chosen format. Marks-and-bleed applies to BOTH formats, so
  // it's always visible. The Output card (PDF/X, Pantone, downsample) is PDF-only; the Raster
  // card (resolution, compression) is TIFF-only.
  function applyExportLayout() {
    const pdf = _exportFormat === "pdf";
    const out = document.getElementById("card-output");
    const marks = document.getElementById("card-marks");
    const tiff = document.getElementById("card-tiff");
    if (out) out.hidden = !pdf;
    if (marks) marks.hidden = false;   // marks/bleed available for PDF and TIFF
    if (tiff) tiff.hidden = pdf;
  }
  // Fill one pre-flight list section (name + meta + focus button per row). Hidden when empty.
  function fillPreflightSection(secId, listId, rows) {
    const sec = document.getElementById(secId), list = document.getElementById(listId);
    if (!sec || !list) return;
    if (rows && rows.length) {
      list.innerHTML = rows.map((r) => preflightRow(r.id, r.name, r.meta)).join("");
      wirePreflightFocus(list);
      sec.hidden = false;
    } else {
      list.innerHTML = "";
      sec.hidden = true;
    }
  }
  // The scan reports whether the selection has any images (drives the tab reveal + the pending
  // open). Sent early — before the slower list scans — so the modal opens without waiting.
  function applyPreflightSelection(hasImages) {
    _hasImages = !!hasImages;
  }
  // The full pre-flight result: the low-res list (only when downsampling applies) and the
  // "won't convert to CMYK" list (always, whenever any image will stay RGB).
  function renderPreflightImages(msg) {
    if (typeof msg.hasImages === "boolean") applyPreflightSelection(msg.hasImages);
    // Low-res list: only where downsampling applies (PDF + toggle on) and something is below.
    // The header always reflects the CURRENT dpi target.
    const target = msg.target || _downsampleDpi;
    const imgs = (_exportFormat === "pdf" && _downsample) ? (msg.images || []) : [];
    const hdr = document.getElementById("preflight-images-header");
    if (hdr && imgs.length) hdr.textContent = `Images under ${target} dpi:`;
    fillPreflightSection("preflight-images-section", "preflight-images", imgs);
    // Un-convertible list: independent of downsampling (the CMYK conversion always runs).
    const bad = (_exportFormat === "pdf") ? (msg.unconvertible || []) : [];
    fillPreflightSection("preflight-cmyk-section", "preflight-cmyk", bad);
  }
  // Clear a warning immediately (no scan round-trip) — used when downsampling is switched off.
  function hidePreflightImages() { fillPreflightSection("preflight-images-section", "preflight-images", []); }
  function hidePreflightCmyk() { fillPreflightSection("preflight-cmyk-section", "preflight-cmyk", []); }
  // Drop the pre-flight warnings when the modal opens, so a reopen after scanning a different
  // selection never flashes the previous selection's images before the fresh scan returns.
  function clearPreflight() {
    hidePreflightImages();
    hidePreflightCmyk();
  }
  window.__renderPreflightImages = renderPreflightImages;
  window.__applyPreflightSelection = applyPreflightSelection;

  // Export modal — the shared DS modal shell. The title mirrors the format picked in the
  // overflow ("PDF CMYK Vector" / "TIFF CMYK Raster"). PDF splits into two tabs — "Marks and
  // bleeds" and "Image quality" — but the segmented control only appears when the selection
  // actually has images (otherwise there's nothing to downsample). TIFF is resolution-only.
  // Print state lives in _cropMarks/_bleedMm/… (persisted by code.js); format is session-only.
  (function initExportPanel() {
    const confirm = document.getElementById("export-confirm-btn");
    const confirmLabel = document.getElementById("export-confirm-label");
    const saveDefault = document.getElementById("export-savedefault-btn");
    const fmtPdf  = document.getElementById("fmt-pdf");
    const fmtTiff = document.getElementById("fmt-tiff");
    const exportPanel = document.getElementById("export-panel");
    const colorsPanel = document.getElementById("colors-panel");
    const viewTabs = document.getElementById("view-tabs");
    const colorsBtn = document.getElementById("view-colors-btn");
    const exportViewBtn = document.getElementById("view-export-btn");
    const toggle  = document.getElementById("cropmarks-toggle");
    const regmarks = document.getElementById("regmarks-toggle");
    const colorbars = document.getElementById("colorbars-toggle");
    const preservespot = document.getElementById("preservespot-toggle");
    const pdfxToggle = document.getElementById("pdfx-toggle");
    const pageinfo = document.getElementById("pageinfo-toggle");
    const bleedOn = document.getElementById("bleed-toggle");
    const bleed   = document.getElementById("bleed-input");
    const wrap    = document.getElementById("bleed-wrap");
    const downsample = document.getElementById("downsample-toggle");
    const dpi     = document.getElementById("dpi-input");
    const dpiWrap = document.getElementById("dpi-wrap");
    const tiffDpi = document.getElementById("tiff-dpi-input");
    const tiffZip = document.getElementById("tiff-zip-toggle");
    if (!confirm || !exportPanel || !toggle || !bleedOn || !bleed || !downsample || !dpi || !tiffDpi) return;

    const LABELS = { pdf: "Export PDF", tiff: "Export TIFF" };
    const exportVisible = () => exportPanel.style.display !== "none";

    // Enable/disable the amount inputs from their own toggles (dimmed, not hidden). The card
    // layout (which cards show for the format) is reconciled by applyExportLayout().
    const syncInputs = () => {
      bleed.disabled = !_bleedOn;
      wrap.classList.toggle("inputWrap--disabled", !_bleedOn);
      dpi.disabled = !_downsample;
      dpiWrap.classList.toggle("inputWrap--disabled", !_downsample);
    };
    const setFormat = (fmt) => {
      _exportFormat = fmt;
      confirmLabel.textContent = LABELS[fmt];
      if (fmtPdf)  fmtPdf.checked  = fmt === "pdf";
      if (fmtTiff) fmtTiff.checked = fmt === "tiff";
      syncInputs();
      applyExportLayout();
      // PDF always pre-flights (to surface un-convertible RGB images); the low-res list is
      // additionally gated on downsample inside requestPreflight (scanImages).
      if (fmt === "pdf") requestPreflight(); else hidePreflightImages();
    };
    const persist = () => parent.postMessage({ pluginMessage: {
      type: "save-settings", cropMarks: _cropMarks, regMarks: _regMarks, colorBars: _colorBars, preserveSpot: _preserveSpot, pdfx: _pdfx, pageInfo: _pageInfo, bleedOn: _bleedOn, bleedMm: _bleedMm,
      downsample: _downsample, downsampleDpi: _downsampleDpi, tiffDpi: _tiffDpi, tiffZip: _tiffZip,
    } }, "*");

    // Ask code.js to scan the selection: reports whether it has images and lists low-res images
    // when downsampling is on. Only runs while the Export view is visible.
    let _preflightTimer = null;
    const requestPreflight = () => {
      if (!exportVisible()) return;
      parent.postMessage({ pluginMessage: {
        type: "preflight-request", dpi: _downsampleDpi, scanImages: _exportFormat === "pdf" && _downsample,
      } }, "*");
    };
    const requestPreflightSoon = () => { if (_preflightTimer) clearTimeout(_preflightTimer); _preflightTimer = setTimeout(requestPreflight, 250); };

    toggle.addEventListener("change", () => { _cropMarks = toggle.checked; persist(); });
    regmarks.addEventListener("change", () => { _regMarks = regmarks.checked; persist(); });
    colorbars.addEventListener("change", () => { _colorBars = colorbars.checked; persist(); });
    if (preservespot) preservespot.addEventListener("change", () => { _preserveSpot = preservespot.checked; persist(); });
    if (pdfxToggle) pdfxToggle.addEventListener("change", () => { _pdfx = pdfxToggle.checked; persist(); });
    pageinfo.addEventListener("change", () => { _pageInfo = pageinfo.checked; persist(); });
    bleedOn.addEventListener("change", () => { _bleedOn = bleedOn.checked; syncInputs(); persist(); });
    downsample.addEventListener("change", () => {
      _downsample = downsample.checked; syncInputs(); persist();
      if (_downsample) requestPreflight(); else hidePreflightImages();   // off → clear the warning now
    });
    bleed.addEventListener("input", () => {
      const v = parseFloat(bleed.value);
      if (isNaN(v)) return;
      _bleedMm = Math.max(0, Math.min(20, v));
      persist();
    });
    bleed.addEventListener("blur", () => { bleed.value = String(_bleedMm); });
    dpi.addEventListener("input", () => {
      const v = parseFloat(dpi.value);
      if (isNaN(v)) return;
      _downsampleDpi = Math.max(72, Math.min(1200, Math.round(v)));
      persist();
      requestPreflightSoon();   // re-flag images against the new threshold
    });
    dpi.addEventListener("blur", () => { dpi.value = String(_downsampleDpi); });
    tiffDpi.addEventListener("input", () => {
      const v = parseFloat(tiffDpi.value);
      if (isNaN(v)) return;
      _tiffDpi = Math.max(72, Math.min(1200, Math.round(v)));
      persist();
    });
    tiffDpi.addEventListener("blur", () => { tiffDpi.value = String(_tiffDpi); });
    if (tiffZip) tiffZip.addEventListener("change", () => { _tiffZip = tiffZip.checked; persist(); });
    // Called when code.js sends back the persisted settings.
    window.__applyExportSettings = (s) => {
      s = s || {};
      _cropMarks = !!s.cropMarks;
      _regMarks = !!s.regMarks;
      _colorBars = !!s.colorBars;
      if (typeof s.preserveSpot === "boolean") _preserveSpot = s.preserveSpot;
      if (typeof s.pdfx === "boolean") _pdfx = s.pdfx;
      _pageInfo = !!s.pageInfo;
      _bleedOn = !!s.bleedOn;
      _downsample = !!s.downsample;
      if (typeof s.bleedMm === "number" && s.bleedMm >= 0) _bleedMm = s.bleedMm;
      if (typeof s.downsampleDpi === "number" && s.downsampleDpi > 0) _downsampleDpi = s.downsampleDpi;
      if (typeof s.tiffDpi === "number" && s.tiffDpi > 0) _tiffDpi = s.tiffDpi;
      if (typeof s.tiffZip === "boolean") _tiffZip = s.tiffZip;
      toggle.checked = _cropMarks;
      regmarks.checked = _regMarks;
      colorbars.checked = _colorBars;
      if (preservespot) preservespot.checked = _preserveSpot;
      if (pdfxToggle) pdfxToggle.checked = _pdfx;
      pageinfo.checked = _pageInfo;
      bleedOn.checked = _bleedOn;
      downsample.checked = _downsample;
      bleed.value = String(_bleedMm);
      dpi.value = String(_downsampleDpi);
      tiffDpi.value = String(_tiffDpi);
      if (tiffZip) tiffZip.checked = _tiffZip;
      syncInputs();
    };

    // Format radios (PDF / TIFF) — the two export paths stay separated; each shows its cards.
    if (fmtPdf)  fmtPdf.addEventListener("change",  () => { if (fmtPdf.checked)  setFormat("pdf"); });
    if (fmtTiff) fmtTiff.addEventListener("change", () => { if (fmtTiff.checked) setFormat("tiff"); });

    // Colors | Export view tabs. Export replaces the old flyover+modal — it's an inline view.
    const showView = (v) => {
      const exp = v === "export";
      if (colorsPanel) colorsPanel.style.display = exp ? "none" : "flex";
      exportPanel.style.display = exp ? "flex" : "none";
      if (colorsBtn) colorsBtn.classList.toggle("selected", !exp);
      if (exportViewBtn) exportViewBtn.classList.toggle("selected", exp);
      if (viewTabs && typeof updateSegPill === "function") requestAnimationFrame(() => updateSegPill(viewTabs));
      if (exp) { clearPreflight(); if (_exportFormat === "pdf") requestPreflight(); }
      if (window._notifyResize) setTimeout(window._notifyResize, 50);
    };
    if (colorsBtn) colorsBtn.addEventListener("click", () => showView("colors"));
    if (exportViewBtn) exportViewBtn.addEventListener("click", () => showView("export"));
    window.__showExportView = () => showView("export");
    window.__showColorsView = () => showView("colors");

    confirm.addEventListener("click", () => startExport(_exportFormat));
    if (saveDefault) saveDefault.addEventListener("click", persist);   // settings also persist on every change

    setFormat("pdf");
    parent.postMessage({ pluginMessage: { type: "get-settings" } }, "*");
  })();

  function doScan() {
    _startScanToastTimer();
    parent.postMessage({ pluginMessage: { type: "request-scan" } }, "*");
  }
  document.getElementById("rescan-btn").onclick = doScan;

  // ── Row add (instant) ───────────────────────────────────────────────
  function addRowAnimated(row) { /* instant — no animation */ }

  // ── Row removal (instant) ────────────────────────────────────────────
  function removeRowAnimated(row, onDone) {
    row.remove();
    if (onDone) onDone();
  }

  // ── Update button visibility based on available types ──
  function updateButtonVisibility(outputCell) {
    // Get types already present in this output cell
    const existingTypes = new Set(
      Array.from(outputCell.querySelectorAll('.output-text-wrap[data-output-type]'))
        .map(w => w.dataset.outputType)
    );
    const availableTypes = OUTPUT_TYPES.filter(t => !existingTypes.has(t.key));

    // Find existing add-row (last row containing .output-picker)
    let addRow = null;
    const rows = outputCell.querySelectorAll('.output-row');
    for (let i = rows.length - 1; i >= 0; i--) {
      if (rows[i].querySelector('.output-picker')) { addRow = rows[i]; break; }
    }

    // Never show add button for read-only (external library) cells
    if (outputCell.dataset.readonly === '1') {
      if (addRow) { addRow.style.visibility = 'hidden'; addRow.style.pointerEvents = 'none'; }
      updateForkArrows(outputCell);
      return;
    }

    if (availableTypes.length > 0) {
      if (!addRow) {
        // Add-row was destroyed by replace-in-place — recreate it
        const ref = outputCell.querySelector('.output-text-wrap[data-color-var-id]');
        const colorVarId = ref ? ref.dataset.colorVarId : '';
        const idx = ref ? ref.dataset.idx : '';
        const pickerBtns = OUTPUT_TYPES.map(t =>
          `<button class="buttonPrimary" data-output-type="${t.key}" data-color-var-id="${colorVarId}" data-idx="${idx}"><span>${t.label}</span></button>`
        ).join('');
        addRow = document.createElement('div');
        addRow.className = 'output-row output-add-row';
        addRow.innerHTML = `<div class="output-picker" data-color-var-id="${colorVarId}" data-idx="${idx}"><button class="buttonSecondary buttonAddOutput" data-tip="Add output"><svg width="16" height="16"><use href="#icon-plus"/></svg></button><div class="output-picker-flyout">${pickerBtns}</div></div>`;
        outputCell.appendChild(addRow);
        attachAddRowListeners(addRow, outputCell);
      }
      addRow.style.visibility = '';
      addRow.style.pointerEvents = '';
    } else if (addRow) {
      addRow.style.visibility = 'hidden';
      addRow.style.pointerEvents = 'none';
    }

    updateForkArrows(outputCell);
  }

  // ── Shared picker-item selection logic ──
  function handlePickerSelect(item) {
    const t = OUTPUT_TYPES.find(t => t.key === item.dataset.outputType);
    if (!t) return;
    const colorVarId = item.dataset.colorVarId || '';
    const idx = item.dataset.idx || '';
    const picker = item.closest('.output-picker');
    const outputCell = picker.closest('.output-cell');
    const addRow = picker.closest('.output-row');

    picker.querySelector('.output-picker-flyout').classList.remove('open');
    picker.classList.remove('picker-open');

    const existingAfter = new Set([
      ...Array.from(outputCell.querySelectorAll('.output-text-wrap[data-output-type]')).map(w => w.dataset.outputType),
      t.key
    ]);
    const pickerItems = picker.querySelectorAll('.output-picker-flyout .buttonPrimary');
    const moreAvailable = Array.from(pickerItems).some(i => !existingAfter.has(i.dataset.outputType));

    const inputRowHtml = `<div class="swatch color-swatch output-swatch output-swatch-${t.key} empty"></div><div class="inputWrap output-text-wrap" data-output-type="${t.key}" data-color-var-id="${colorVarId}" data-idx="${idx}"><span class="inputLabel output-lbl lbl-${t.key}">${t.label}</span><input class="inputField output-text-input" type="text" placeholder="" /></div><button class="buttonQuaternary buttonUnpair buttonUnpair-output" data-output-type="${t.key}" data-color-var-id="${colorVarId}" data-tip="Remove">${removeIcon}</button>`;

    let newRow;
    if (moreAvailable) {
      newRow = document.createElement('div');
      newRow.className = 'output-row';
      newRow.innerHTML = inputRowHtml;
      outputCell.insertBefore(newRow, addRow);
    } else {
      addRow.className = 'output-row';
      addRow.innerHTML = inputRowHtml;
      newRow = addRow;
    }

    addRowAnimated(newRow);
    updateButtonVisibility(outputCell);

    const wrap = newRow.querySelector('.output-text-wrap');
    const input = newRow.querySelector('.output-text-input');
    const cancelBtn = newRow.querySelector('.buttonUnpair-output');

    setTimeout(() => input.focus(), 50);
    if (t.key === 'pantone') input.addEventListener("input", () => updatePantoneSwatch(wrap, input.value));
    else if (t.key === 'ral')  input.addEventListener("input", () => updateRalSwatch(wrap, input.value));
    else if (t.key === 'vinyl') input.addEventListener("input", () => updateVinylSwatch(wrap, input.value));

    input.addEventListener("keydown", (ke) => {
      if (ke.key === "Escape") { ke.preventDefault(); removeRowAnimated(newRow, () => updateButtonVisibility(outputCell)); return; }
      if (ke.key === "Enter")  { ke.preventDefault(); input.blur(); }
    });
    input.addEventListener("blur", () => {
      setTimeout(() => {
        if (newRow.contains(document.activeElement)) return;
        if (!input.value.trim()) return;
        commitOutputWrap(wrap);
      }, 150);
    });
    cancelBtn.addEventListener("click", () => {
      removeRowAnimated(newRow, () => updateButtonVisibility(outputCell));
    });
  }

  // ── Wire event listeners onto a dynamically recreated add-row ──
  function attachAddRowListeners(addRow, outputCell) {
    const btn = addRow.querySelector('.buttonAddOutput');
    const flyout = addRow.querySelector('.output-picker-flyout');
    const picker = addRow.querySelector('.output-picker');
    if (!btn || !flyout || !picker) return;

    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const isOpen = flyout.classList.contains('open');
      document.querySelectorAll('.output-picker-flyout.open').forEach(f => f.classList.remove('open'));
      document.querySelectorAll('.output-picker.picker-open').forEach(p => p.classList.remove('picker-open'));
      if (!isOpen) {
        const existingTypes = new Set(
          Array.from(outputCell.querySelectorAll('.output-text-wrap[data-output-type]')).map(w => w.dataset.outputType)
        );
        flyout.querySelectorAll('.buttonPrimary').forEach(i => {
          i.style.display = existingTypes.has(i.dataset.outputType) ? 'none' : '';
        });
        flyout.classList.add('open');
        picker.classList.add('picker-open');
        setTimeout(() => {
          document.addEventListener('click', function closeFlyout(ev) {
            if (!picker.contains(ev.target)) {
              flyout.classList.remove('open');
              picker.classList.remove('picker-open');
              document.removeEventListener('click', closeFlyout);
            }
          });
        }, 0);
      }
    });

    flyout.querySelectorAll('.buttonPrimary').forEach(item => {
      item.addEventListener("click", (e) => { e.stopPropagation(); handlePickerSelect(item); });
    });
  }

  // ── Messages ───────────────────────────────────────────────────────

  window.onmessage = async (event) => {
    const msg = event.data.pluginMessage;
    if (!msg) return;

    if (msg.type === "settings") {
      if (window.__applyExportSettings) window.__applyExportSettings(msg);
      return;
    }

    if (msg.type === "preflight-selection") { applyPreflightSelection(msg.hasImages); return; }
    if (msg.type === "preflight-images") { renderPreflightImages(msg); return; }

    if (msg.type === "external-vars-resolved") {
      Object.entries(msg.libraries).forEach(([varId, libName]) => {
        const btn = document.querySelector(`.lib-info[data-color-var-id="${varId}"]`);
        if (btn) {
          btn.dataset.libName = libName;
          btn.dataset.tip = `Read-only because it comes from an external library. Edit it in ${libName}.`;
        }
      });
      return;
    }

    if (msg.type === "restore-height") {
      window._manualH = msg.height;
      return;
    }

    if (msg.type === "export-ready") {
      _onExportReady(msg.count, msg.format);
      return;
    }

    if (msg.type === "selection-count") {
      window._selectionCount = msg.count;
      // Scanning is manual, so the button has to say what the next click will do.
      document.getElementById("rescan-label").textContent =
        msg.count > 0 ? 'Scan selection' : 'Scan file';
      return;
    }

    // code.js kicked off a scan on its own (launch or selection change).
    if (msg.type === "scan-started") { _startScanToastTimer(); return; }


    if (msg.type === "error") {
      _clearScanToastTimer();
      setExportBusy(false);
      dismissProgress();
      showError(msg.message);
      return;
    }

    if (msg.type === "scan-results") {
      // If user cancelled the scan, discard results and dismiss bar immediately.
      if (_scanCancelled) { _clearScanToastTimer(true); return; }
      // Dismiss the scanning toast AFTER the browser paints the rebuilt UI —
      // the heavy DOM work below can block for a while on large result sets.
      // Wrap in arrow fn so rAF's timestamp argument doesn't get passed as
      // `immediate`, which would skip the slide-down animation.
      requestAnimationFrame(() => requestAnimationFrame(() => _clearScanToastTimer()));
      window._readOnly = !!msg.hasExternalVars;
      window._externalLibraryUrl = (msg.externalLibrary && msg.externalLibrary.url) || null;

      // Always update source chips regardless of result count
      const chipsEl = document.getElementById('source-chips');
      const hasSource = !!(msg.sourceNodes && msg.sourceNodes.length > 0);

      if (hasSource) {
          chipsEl.innerHTML = msg.sourceNodes.map(n =>
          `<button class="buttonTertiary source-focus-btn" data-node-id="${esc(n.id)}" data-tip="Focus in canvas"><span>${esc(n.name)}</span>${focusIcon}</button>`
        ).join('');
        chipsEl.querySelectorAll('.source-focus-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            parent.postMessage({ pluginMessage: { type: 'focus-node', nodeId: btn.dataset.nodeId } }, '*');
          });
        });
      } else {
        chipsEl.innerHTML = '<span class="actionbar-note">All color variables in this file</span>';
      }

      // Don't rebuild table while user is actively editing a field
      const ae = document.activeElement;
      if (ae && (
        ae.classList.contains("cmyk-box") ||
        ae.classList.contains("output-text-input") ||
        ae.classList.contains("pantone-input")
      )) return;

      const rows = Array.isArray(msg.data) ? msg.data : [];
      // Plain "raw" colors are skipped by the render loop below, so a selection whose
      // only colors are raw (no color variables) renders nothing. Treat that as empty —
      // otherwise the table is blank while the export button lingers with nothing to export.
      const renderable = rows.filter(r => r && r.source !== "raw");
      if (renderable.length === 0) {
        document.getElementById("color-body").innerHTML = '';
        document.querySelector('#no-colors-state .empty-state-desc').textContent = hasSource
          ? 'The current selection has no bound color variables.'
          : 'This file has no color variables to pair with print values.';
        document.getElementById("no-colors-state").style.display = 'flex';
        document.querySelector('.scroll-area').style.display = 'none';
        // Nothing to export → hide the Colors|Export tabs and stay on the Colors view.
        if (window.__showColorsView) window.__showColorsView();
        const vtr0 = document.getElementById("view-tabs-row"); if (vtr0) vtr0.style.display = 'none';
        setTimeout(() => { if (window._notifyResize) window._notifyResize(); }, 50);
        return;
      }

      document.getElementById("no-colors-state").style.display = 'none';
      document.querySelector('.scroll-area').style.display = '';
      // Without a selection there is no artwork to export — hide the Export tab (reference-only list).
      const vtr1 = document.getElementById("view-tabs-row");
      if (vtr1) vtr1.style.display = hasSource ? 'flex' : 'none';
      if (!hasSource && window.__showColorsView) window.__showColorsView();

      // Store scan data for reference
      window._lastScanData = msg.data;

      // Snapshot existing output order + pending (empty) inputs before rebuild
      const orderByKey = {};   // preserves current DOM order per row
      const pendingByKey = {}; // tracks empty/uncommitted inputs per row
      document.querySelectorAll('.output-text-wrap').forEach(wrap => {
        const input = wrap.querySelector('.output-text-input');
        const varId = wrap.dataset.colorVarId;
        const rowIdx = wrap.dataset.idx;
        const key = varId ? varId : ('idx:' + rowIdx);
        const type = wrap.dataset.outputType;
        if (!orderByKey[key]) orderByKey[key] = [];
        if (!orderByKey[key].includes(type)) orderByKey[key].push(type);
        if (input && input.value.trim() === '') {
          if (!pendingByKey[key]) pendingByKey[key] = [];
          if (!pendingByKey[key].includes(type)) pendingByKey[key].push(type);
        }
      });

      let html = "";
      msg.data.forEach((r, idx) => {
        if (r.source === "raw") return;
        if (r.source === "raw_unused") {
          const nodeIdList = (r.nodeIds || []).join(',');
          const focusBtn = r.nodeIds && r.nodeIds.length
            ? `<button class="buttonQuaternary buttonUnpair buttonUnpair-raw" data-node-ids="${nodeIdList}" data-tip="Select in canvas">${focusIcon}</button>`
            : '';
          html += `<tr class="row-raw">
            <td colspan="3"><div class="td-variable" style="padding-right:16px;">
              <div class="swatch color-swatch" style="background:${r.hex}"></div>
              <div class="var-info">
                <div class="var-name-row">
                  <span class="var-name">${r.hex}</span>
                  <span class="raw-warning-icon">${warningIcon}</span>
                  <span class="raw-warning-label">Not a variable</span>
                </div>
              </div>
              <div class="raw-warning-cell">
                ${focusBtn}
              </div>
            </div></td>
          </tr>`;
          return;
        }

        const cmyk = r.cmyk;
        const name = r.source === "variable" ? r.name : r.hex;
        const isSystem = r.hasCmykVariable;

        // Arrow column — left empty; updateForkArrows fills it after render
        const arrowCol = `<div class="status-cell"><div class="status-fork"></div></div>`;

        // CMYK swatch
        const cr = Math.round(255 * (1 - cmyk.c/100) * (1 - cmyk.k/100));
        const cg = Math.round(255 * (1 - cmyk.m/100) * (1 - cmyk.k/100));
        const cb = Math.round(255 * (1 - cmyk.y/100) * (1 - cmyk.k/100));
        const cmykHex = `#${[cr,cg,cb].map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,"0")).join("")}`;

        // Pre-compute auto CMYK from RGB for instant reset
        const autoC = r.rgb ? rgbToCmykAuto(r.rgb.r, r.rgb.g, r.rgb.b) : cmyk;

        // CMYK boxes row
        const readOnly = !!r.isExternal;
        const groupClass = readOnly ? 'cmyk-group cmyk-auto cmyk-readonly' : (isSystem ? 'cmyk-group' : 'cmyk-group cmyk-auto');
        const infoIcon = `<svg width="12" height="12"><use href="#icon-info"/></svg>`;
        const cmykUnpairBtn = readOnly
          ? `<span class="cmyk-spacer"></span>`
          : (isSystem
            ? `<button class="buttonQuaternary buttonUnpair buttonUnpair-cmyk" data-tip="Reset CMYK to auto" data-color-var-id="${r.colorVarId || ''}"><svg width="16" height="16"><use href="#icon-reset"/></svg></button>`
            : `<span class="cmyk-spacer"></span>`);
        const makeBox = (lbl, val) =>
          `<div class="inputWrap cmyk-box-wrap"><span class="inputLabel cmyk-lbl">${lbl}</span><input class="inputField cmyk-box" type="text" inputmode="numeric" maxlength="3" autocomplete="off" value="${val}"${readOnly ? ' readonly' : ''} /></div>`;
        const cmykRow = `<div class="output-row"><div class="swatch color-swatch cmyk-swatch" style="background:${cmykHex}"></div><div class="${groupClass}" data-color-var-id="${r.colorVarId || ''}" data-idx="${idx}" data-hex="${r.hex || ''}" data-auto-c="${autoC.c}" data-auto-m="${autoC.m}" data-auto-y="${autoC.y}" data-auto-k="${autoC.k}">${makeBox('C',cmyk.c)}${makeBox('M',cmyk.m)}${makeBox('Y',cmyk.y)}${makeBox('K',cmyk.k)}</div>${cmykUnpairBtn}</div>`;

        // Extra output rows (Pantone, RAL, Vinyl)
        // Render in the exact order they appeared in the DOM before rebuild,
        // appending any brand-new saved types at the end in OUTPUT_TYPES order.
        const pendingKey = r.colorVarId ? r.colorVarId : ('idx:' + idx);
        const pendingTypes = readOnly ? [] : (pendingByKey[pendingKey] || []);
        const existingOrder = orderByKey[pendingKey] || [];

        // All types that need a row: saved in data + pending empty
        const needsRow = new Set([
          ...OUTPUT_TYPES.filter(t => !!r[t.key]).map(t => t.key),
          ...pendingTypes
        ]);

        // Final order: existing DOM order (stable) + new types not yet seen
        const orderedKeys = [
          ...existingOrder.filter(k => needsRow.has(k)),
          ...OUTPUT_TYPES.filter(t => needsRow.has(t.key) && !existingOrder.includes(t.key)).map(t => t.key)
        ];

        let extraRows = '';
        const renderedTypes = new Set();
        orderedKeys.forEach(typeKey => {
          const t = OUTPUT_TYPES.find(x => x.key === typeKey);
          if (!t) return;
          renderedTypes.add(typeKey);
          const val = r[typeKey] || '';
          const hasSaved = !!r[typeKey];
          const resolvedHex = hasSaved
            ? (typeKey === 'pantone' ? pantoneToHex(val)
             : typeKey === 'ral'    ? ralToHex(val)
             : typeKey === 'vinyl'  ? vinylToHex(val)
             : null)
            : null;
          const swatchCls = `swatch color-swatch output-swatch output-swatch-${typeKey}${resolvedHex ? '' : ' empty'}`;
          const swatchStyle = resolvedHex ? ` style="background:${resolvedHex}"` : '';
          const removeBtn = readOnly ? `<span class="cmyk-spacer"></span>` : `<button class="buttonQuaternary buttonUnpair buttonUnpair-output" data-output-type="${typeKey}" data-color-var-id="${r.colorVarId || ''}" data-tip="Remove ${t.label}">${removeIcon}</button>`;
          extraRows += `<div class="output-row"><div class="${swatchCls}"${swatchStyle}></div><div class="inputWrap output-text-wrap${readOnly ? ' output-readonly' : ''}" data-output-type="${typeKey}" data-color-var-id="${r.colorVarId || ''}" data-idx="${idx}"><span class="inputLabel output-lbl lbl-${typeKey}">${t.label}</span><input class="inputField output-text-input" type="text" value="${esc(val)}"${readOnly ? ' readonly' : ''} /></div>${removeBtn}</div>`;
        });

        // Determine which types are still available to add (hidden in read-only)
        const availableTypes = OUTPUT_TYPES.filter(t => !renderedTypes.has(t.key));
        const pickerBtns = availableTypes.map(t =>
          `<button class="buttonPrimary" data-output-type="${t.key}" data-color-var-id="${r.colorVarId || ''}" data-idx="${idx}"><span>${t.label}</span></button>`
        ).join('');
        const addBtn = !readOnly && availableTypes.length > 0
          ? `<div class="output-picker" data-color-var-id="${r.colorVarId || ''}" data-idx="${idx}"><button class="buttonSecondary buttonAddOutput" data-tip="Add output"><svg width="16" height="16"><use href="#icon-plus"/></svg></button><div class="output-picker-flyout">${pickerBtns}</div></div>`
          : '';

        const cmykCell = `<div class="output-cell"${readOnly ? ' data-readonly="1"' : ''}>${cmykRow}${extraRows}${addBtn ? `<div class="output-row output-add-row">${addBtn}</div>` : ''}</div>`;

        const infoBtn = readOnly
          ? `<span class="tooltipButton lib-info" data-color-var-id="${r.colorVarId || ''}" data-lib-name="" data-tip="Read-only because it comes from an external library.">${infoIcon}</span>`
          : '';

        html += `<tr>
          <td><div class="td-variable">
            <div class="swatch color-swatch" style="background:${r.hex}"></div>
            <div class="var-info">
              <div class="var-name-row"><span class="var-name" data-tip="${esc(name.replace(/\//g, ' /\n'))}">${esc(name)}</span>${infoBtn}</div>
              <div class="var-hex-sub">${r.hex}</div>
            </div>
          </div></td>
          <td class="td-status">${arrowCol}</td>
          <td class="td-cmyk">${cmykCell}</td>
        </tr>`;
      });

      document.getElementById("color-body").innerHTML = html;


      // ── Raw focus buttons ──
      document.querySelectorAll('.buttonUnpair-raw').forEach(btn => {
        btn.addEventListener('click', () => {
          const ids = btn.dataset.nodeIds.split(',').filter(Boolean);
          parent.postMessage({ pluginMessage: { type: 'focus-nodes', nodeIds: ids } }, '*');
        });
      });

      // Update button visibility for all output cells
      document.querySelectorAll('.output-cell').forEach(cell => {
        updateButtonVisibility(cell);
      });

      // ── CMYK 4-box handlers ──
      document.querySelectorAll(".cmyk-group").forEach(group => {
        const boxes = group.querySelectorAll(".cmyk-box");
        group._original = null;

        boxes.forEach((box, i) => {
          box.addEventListener("focus", () => {
            _focusedGroup = group;
            if (group._original === null) {
              group._original = Array.from(boxes).map(b => b.value);
            }
            box.select();
          });
          box.addEventListener("blur", () => {
            setTimeout(() => {
              if (!group.contains(document.activeElement)) {
                if (_focusedGroup === group) _focusedGroup = null;
                group._original = null;
                // Don't commit if focus moved to a reset/unpair button — that action takes priority.
                const ae = document.activeElement;
                if (ae && (ae.classList.contains('buttonUnpair-cmyk') || ae.classList.contains('buttonUnpair-output') || ae.classList.contains('buttonUnpair'))) return;
                commitCmykGroup(group);
              }
            }, 0);
          });
          box.addEventListener("keydown", (e) => {
            if (e.key === "Tab" || e.key === "Enter") {
              e.preventDefault();
              updateSwatchPreview(group);
              if (i < boxes.length - 1) { boxes[i+1].focus(); boxes[i+1].select(); }
              else box.blur();
              return;
            }
            if (e.key === "ArrowUp" || e.key === "ArrowDown") {
              e.preventDefault();
              const dir = e.key === "ArrowUp" ? 1 : -1;
              box.value = String(Math.min(100, Math.max(0, (parseInt(box.value) || 0) + dir)));
              updateSwatchPreview(group);
              return;
            }
            const allowed = ['Backspace','Delete','ArrowLeft','ArrowRight','Home','End','Tab','Enter'];
            if (!allowed.includes(e.key) && !/^\d$/.test(e.key) && !e.metaKey && !e.ctrlKey) {
              e.preventDefault();
            }
          });
          box.addEventListener("input", () => {
            const v = parseInt(box.value, 10);
            if (!isNaN(v) && v > 100) box.value = '100';
            updateSwatchPreview(group);
            if (group.classList.contains('cmyk-auto')) {
              group.classList.remove('cmyk-auto');
            }
            // Show reset button immediately if only a spacer is present
            const sibling = group.nextElementSibling;
            if (sibling && sibling.classList.contains('cmyk-spacer')) {
              const colorVarId = group.dataset.colorVarId || '';
              const btn = document.createElement('button');
              btn.className = 'buttonQuaternary buttonUnpair buttonUnpair-cmyk';
              btn.dataset.colorVarId = colorVarId;
              btn.dataset.tip = 'Reset CMYK to auto';
              btn.innerHTML = `<svg width="16" height="16"><use href="#icon-reset"/></svg>`;
              sibling.replaceWith(btn);
              btn.addEventListener('click', () => {
                const ac = parseInt(group.dataset.autoC, 10);
                const am = parseInt(group.dataset.autoM, 10);
                const ay = parseInt(group.dataset.autoY, 10);
                const ak = parseInt(group.dataset.autoK, 10);
                if (![ac, am, ay, ak].some(isNaN)) {
                  const boxes = group.querySelectorAll('.cmyk-box');
                  [ac, am, ay, ak].forEach((val, i) => { boxes[i].value = val; });
                  group.classList.add('cmyk-auto');
                  const swatch = group.closest('.output-row')?.querySelector('.cmyk-swatch');
                  if (swatch) {
                    const cr = Math.round(255 * (1 - ac/100) * (1 - ak/100));
                    const cg = Math.round(255 * (1 - am/100) * (1 - ak/100));
                    const cb = Math.round(255 * (1 - ay/100) * (1 - ak/100));
                    swatch.style.background = `#${[cr,cg,cb].map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,"0")).join("")}`;
                  }
                  btn.replaceWith(Object.assign(document.createElement('span'), { className: 'cmyk-spacer' }));
                }
                parent.postMessage({ pluginMessage: { type: 'delete-cmyk-variable', colorVarId } }, '*');
              });
            }
          });
        });
      });

      // ── CMYK unpair buttons ──
      document.querySelectorAll(".buttonUnpair-cmyk").forEach(btn => {
        btn.addEventListener("click", () => {
          const colorVarId = btn.dataset.colorVarId;
          if (!colorVarId) return;

          // Instantly reset boxes to auto values without waiting for rescan
          const group = btn.closest('.output-row')?.querySelector('.cmyk-group');
          if (group) {
            const ac = parseInt(group.dataset.autoC, 10);
            const am = parseInt(group.dataset.autoM, 10);
            const ay = parseInt(group.dataset.autoY, 10);
            const ak = parseInt(group.dataset.autoK, 10);
            if (![ac, am, ay, ak].some(isNaN)) {
              const boxes = group.querySelectorAll('.cmyk-box');
              [ac, am, ay, ak].forEach((v, i) => { boxes[i].value = v; });
              group.classList.add('cmyk-auto');
              const swatch = group.closest('.output-row')?.querySelector('.cmyk-swatch');
              if (swatch) {
                const cr = Math.round(255 * (1 - ac/100) * (1 - ak/100));
                const cg = Math.round(255 * (1 - am/100) * (1 - ak/100));
                const cb = Math.round(255 * (1 - ay/100) * (1 - ak/100));
                swatch.style.background = `#${[cr,cg,cb].map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,"0")).join("")}`;
              }
            }
          }

          parent.postMessage({ pluginMessage: { type: "delete-cmyk-variable", colorVarId }}, "*");
        });
      });

      // ── Output text wrap handlers (Pantone, RAL, Vinyl) ──
      document.querySelectorAll(".output-text-wrap").forEach(wrap => {
        const input = wrap.querySelector(".output-text-input");
        if (!input) return;
        // Update swatch live based on output type
        if (wrap.dataset.outputType === 'pantone') {
          updatePantoneSwatch(wrap, input.value);
          input.addEventListener("input", () => updatePantoneSwatch(wrap, input.value));
        } else if (wrap.dataset.outputType === 'ral') {
          updateRalSwatch(wrap, input.value);
          input.addEventListener("input", () => updateRalSwatch(wrap, input.value));
        } else if (wrap.dataset.outputType === 'vinyl') {
          updateVinylSwatch(wrap, input.value);
          input.addEventListener("input", () => updateVinylSwatch(wrap, input.value));
        }
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") { e.preventDefault(); input.blur(); }
        });
        input.addEventListener("blur", () => {
          const v = input.value.trim();
          if (!v) return;
          const ae = document.activeElement;
          if (ae && (ae.classList.contains('buttonUnpair-output') || ae.classList.contains('buttonUnpair'))) return;
          commitOutputWrap(wrap);
        });
      });

      // ── Generic unpair buttons (Pantone, RAL, Vinyl) ──
      document.querySelectorAll(".buttonUnpair-output").forEach(btn => {
        btn.addEventListener("click", () => {
          const outputType = btn.dataset.outputType;
          const colorVarId = btn.dataset.colorVarId;
          if (!colorVarId || !outputType) return;
          const outputCell = btn.closest('.output-cell');
          const row = btn.closest('.output-row');
          if (row) {
            removeRowAnimated(row, () => {
              updateButtonVisibility(outputCell);
            });
          }
          parent.postMessage({ pluginMessage: { type: `delete-${outputType}-variable`, colorVarId }}, "*");
        });
      });

      // ── Add output (+) buttons ──
      document.querySelectorAll(".buttonAddOutput").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const picker = btn.closest('.output-picker');
          const outputCell = picker.closest('.output-cell');
          const flyout = picker.querySelector('.output-picker-flyout');
          const isOpen = flyout.classList.contains('open');

          // Close all open flyouts and reset icons
          document.querySelectorAll('.output-picker-flyout.open').forEach(f => f.classList.remove('open'));
          document.querySelectorAll('.output-picker.picker-open').forEach(p => p.classList.remove('picker-open'));

          if (!isOpen) {
            // Hide items whose type is already in the output cell
            const existingTypes = new Set(
              Array.from(outputCell.querySelectorAll('.output-text-wrap[data-output-type]'))
                .map(w => w.dataset.outputType)
            );
            flyout.querySelectorAll('.buttonPrimary').forEach(i => {
              i.style.display = existingTypes.has(i.dataset.outputType) ? 'none' : '';
            });
            flyout.classList.add('open');
            picker.classList.add('picker-open');

            // Deferred one-shot close listener — attached after this click finishes
            setTimeout(() => {
              document.addEventListener('click', function closeFlyout(ev) {
                if (!picker.contains(ev.target)) {
                  flyout.classList.remove('open');
                  picker.classList.remove('picker-open');
                  document.removeEventListener('click', closeFlyout);
                }
              });
            }, 0);
          }
        });
      });

      // Handle picker item clicks — exclude system buttons (cancel, export).
      document.querySelectorAll('.buttonPrimary[data-output-type]').forEach(item => {
        item.addEventListener("click", (e) => { e.stopPropagation(); handlePickerSelect(item); });
      });

      // Resize window to fit new table content
      setTimeout(() => { if (window._notifyResize) window._notifyResize(); }, 50);
    }

    if (msg.type === "export-batch-start") {
      exportedCount = 0; exportTotal = msg.total; _exportFmt = msg.format; _exportFailures = []; _exportRgbImages = 0; _exportRgbFrames = [];
      _exportLookup = null; _exportUsedFSA = false; _pendingFiles = []; _usedNames = new Set();
      // Don't reset _exportCancelled — user may have clicked Cancel during
      // the Preparing phase. If so, tell code.js to stop immediately.
      if (_exportCancelled) {
        parent.postMessage({ pluginMessage: { type: 'cancel-export' } }, '*');
        return;
      }
      showProgress(`Exporting 0 / ${msg.total} ${msg.format.toUpperCase()} files…`);
    }

    if (msg.type === "export-data") {
      if (_exportCancelled) return;
      try {
        const safe = msg.frameName.replace(/[^a-zA-Z0-9_-]/g,"_");

        // Cache lookup once per batch — all frames share the same variable set.
        if (!_exportLookup) {
          _exportLookup = Object.assign({}, msg.colorLookup || {});
          document.querySelectorAll('.cmyk-group[data-hex]').forEach(group => {
            const hex = (group.dataset.hex || '').toUpperCase();
            if (!hex) return;
            const entry = { ...(_exportLookup[hex] || {}) };
            const boxes = group.querySelectorAll('.cmyk-box');
            if (boxes.length === 4) {
              const [c, m, y, k] = Array.from(boxes).map(b => {
                const v = parseInt(b.value, 10);
                return isNaN(v) ? 0 : Math.max(0, Math.min(100, v));
              });
              entry.c = c; entry.m = m; entry.y = y; entry.k = k;   // live CMYK from the table
            }
            // Read the LIVE Pantone from the same colour row (shared data-idx) so a just-edited or
            // not-yet-persisted Pantone still exports as a spot — matching how the CMYK boxes work.
            const idx = group.dataset.idx;
            const pw = idx ? document.querySelector('.output-text-wrap[data-output-type="pantone"][data-idx="' + idx + '"] .output-text-input') : null;
            const pv = pw && typeof pw.value === 'string' ? pw.value.trim() : '';
            entry.pantone = pv || entry.pantone || null;
            _exportLookup[hex] = entry;
          });
        }

        let fileBytes, fileName, fileMime;
        if (msg.format === "pdf") {
          const now = new Date();
          const pad = (n) => String(n).padStart(2, "0");
          const stamp = `${pad(now.getDate())}/${pad(now.getMonth() + 1)}/${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
          fileBytes = await convertPdfToCmyk(msg.pdfBytes, _exportLookup,
            { cropMarks: _cropMarks, regMarks: _regMarks, colorBars: _colorBars, preserveSpot: _preserveSpot, pdfx: _pdfx, bleedPt: _bleedOn ? _bleedMm * 72 / 25.4 : 0,
              downsample: _downsample, downsampleDpi: _downsampleDpi, trimBox: msg.trimBox,
              pageInfo: _pageInfo,
              pageInfoLeft: [msg.fileName, msg.frameName].filter(Boolean).join("  ·  "),
              pageInfoRight: stamp });
          _exportRgbImages += window._lastPdfImagesUnconverted;
          if (window._lastPdfImagesUnconverted > 0) _exportRgbFrames.push(msg.frameName);
          fileName = `${safe}_CMYK.pdf`; fileMime = "application/pdf";
        } else {
          const cmyka = await convertImageToCmyka(msg.pngBytes, msg.width, msg.height, _exportLookup);
          fileBytes = await buildCmykaTiff(cmyka, msg.width, msg.height, msg.dpi, _tiffZip);
          fileName = `${safe}_CMYK.tiff`; fileMime = "image/tiff";
        }
        // Disambiguate against earlier files this batch so same-named items don't
        // overwrite each other (folder export) or collide in the ZIP.
        fileName = uniqueName(fileName);

        if (_exportCancelled) return;

        if (_singleFileHandle) {
          const wr = await _singleFileHandle.createWritable();
          await wr.write(fileBytes); await wr.close();
          _singleFileHandle = null;
          _exportUsedFSA = true;
        } else if (_dirHandle) {
          try {
            const fh = await _dirHandle.getFileHandle(fileName, { create: true });
            const wr = await fh.createWritable();
            await wr.write(fileBytes); await wr.close();
            _exportUsedFSA = true;
          } catch (_) {
            _dirHandle = null;
            _pendingFiles.push({ name: fileName, data: fileBytes });
          }
        } else if (msg.total === 1) {
          downloadFile(fileBytes, fileName, fileMime);
        } else {
          _pendingFiles.push({ name: fileName, data: fileBytes });
        }

        exportedCount++;
        if (exportedCount < msg.total) {
          showProgress(`Exporting ${exportedCount} / ${msg.total} ${msg.format.toUpperCase()} files…`);
          parent.postMessage({ pluginMessage: { type: 'export-frame-ack', nextIndex: msg.index + 1 } }, '*');
        } else {
          const _fmt = msg.format.toUpperCase();
          dismissProgress();
          setExportBusy(false);

          if (_pendingFiles.length > 0) {
            const zipBytes = _buildZip(_pendingFiles);
            _pendingFiles = [];
            downloadFile(zipBytes, `CMYK_Export_${_fmt}.zip`, 'application/zip');
          }
          // A batch that ends on a SUCCESS must still report any earlier failures,
          // otherwise a frame that failed mid-batch is dropped from the print output
          // with no warning. Only when the whole batch was clean do we confirm success —
          // and that confirmation waits until the file is actually saved (see below).
          const clean = _exportFailures.length === 0 && _exportRgbImages === 0;
          reportExportFailures();
          if (clean) confirmExportSaved();
        }
      } catch (err) {
        if (_exportCancelled) return;
        exportedCount++;
        parent.postMessage({ pluginMessage: { type: 'export-frame-ack', nextIndex: msg.index + 1 } }, '*');
        _exportFailures.push({ name: msg.frameName, message: (err && err.message) || String(err) });
        if (exportedCount >= msg.total) {
          dismissProgress();
          setExportBusy(false);
          reportExportFailures();
        }
      }
    }

    if (msg.type === "export-item-error") {
      if (_exportCancelled) return;
      exportedCount++;
      parent.postMessage({ pluginMessage: { type: 'export-frame-ack', nextIndex: msg.index + 1 } }, '*');
      _exportFailures.push({ name: msg.frameName, message: msg.message });
      if (exportedCount >= msg.total) {
        dismissProgress();
        setExportBusy(false);
        reportExportFailures();
      }
    }
  };

  // ── Auto-resize plugin window to content ─────────────────────────────
  (function () {
    const MIN_H = 100;

    // Shared content-height measurement — also used as drag minimum.
    window._contentHeight = function () {
      let h = 0;
      const resultsUi  = document.getElementById('results-ui');
      const progCont   = document.getElementById('progress-container');
      if (progCont  && progCont.offsetHeight)  h += progCont.offsetHeight;
      if (resultsUi && resultsUi.style.display !== 'none') {
        const bar   = document.getElementById('actionbar');
        const table = document.querySelector('.color-table');
        if (bar)   h += bar.offsetHeight;
        if (table) h += table.scrollHeight;
        h += 48;
      }
      return Math.max(h, MIN_H);
    };

    function sendHeight() {
      // Skip mid-drag, and skip entirely once user has manually set a height.
      if (window._manualResizing || window._manualH) return;
      parent.postMessage({ pluginMessage: { type: 'ui-resize', width: window.innerWidth, height: window._contentHeight() } }, '*');
    }
    window._notifyResize = sendHeight;
    const ro = new ResizeObserver(sendHeight);
    ['actionbar'].forEach(id => {
      const el = document.getElementById(id);
      if (el) ro.observe(el);
    });
    const tbl = document.querySelector('.color-table');
    if (tbl) ro.observe(tbl);
    sendHeight();
  })();

  // Override default constraints for this plugin.
  initWindowResize({ minW: 320, minH: 200 });
</script>

</body>
</html>
