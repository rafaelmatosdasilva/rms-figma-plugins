<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<!--@THEME-->
<style>
  /* Plugin-local vars — no DS token equivalent */
  :root { --pantone-focus: #b06aff; }

  .color-table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }

  /* Output column takes half the table so the CMYK / Pantone / Vinyl inputs grow
     with the window — at the 600px default this still resolves to the old 300px. */
  .color-table col:nth-child(1) { width: auto; }
  .color-table col:nth-child(2) { width: 56px; }
  .color-table col:nth-child(3) { width: 50%; }

  .color-table td {
    height: auto;
    padding: var(--padding-l) 0;
    vertical-align: middle;
    font-size: var(--m-size);
    overflow: visible;
  }

  .color-table td:first-child { padding-left: var(--padding-l); }
  .color-table td:last-child  { padding-right: var(--padding-l); }

  .color-table tr:not(:last-child) {
    background-image: linear-gradient(var(--border), var(--border));  /* dividerLine (N700 both modes) — horizontal row separator */
    background-size: calc(100% - 32px) 1.2px;
    background-position: 16px bottom;
    background-repeat: no-repeat;
  }

  .td-variable {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: var(--gap-m);
    min-width: 0;
    height: 100%;
  }
  .td-variable .var-info {
    display: flex;
    flex-direction: column;
    gap: var(--gap-xs);
    min-width: 0;
    flex: 1;
  }

  .var-name-row {
    display: flex;
    align-items: center;
    gap: 0;
    min-width: 0;
  }

  /* Swatch identity (size, radius, border, empty stripes) comes from the DS .swatch base
     in theme.css — .color-swatch only adds plugin-local stacking context. */
  .color-swatch {
    position: relative;
    z-index: 2;
  }
  .var-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
    color: var(--text);
    font-size: var(--l-size);
    font-weight: 500;
    position: relative;
    cursor: default;
  }

  .var-hex-sub {
    display: flex;
    align-items: center;
    font-size: var(--m-size);
    color: var(--hex-sub-color);
    white-space: nowrap;
    gap: var(--gap-s);
  }

  /* ── Raw (non-variable) color row ── */
  .raw-warning-icon {
    flex-shrink: 0;
    color: var(--semantic-warning);
    display: flex;
    align-items: center;
    margin-left: var(--gap-s);
  }
  .raw-warning-label {
    font-size: var(--s-size);
    color: var(--semantic-warning);
    font-weight: var(--s-weight);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .raw-warning-cell {
    display: flex;
    align-items: center;
    gap: var(--gap-s);
    margin-left: auto;
    margin-right: -8px;
  }
  .color-table tr.row-raw .var-name {
    color: var(--text-muted);
    font-weight: 500;
  }

  .td-cmyk {
    font-family: inherit;
    font-size: var(--m-size);
    color: var(--text);
    vertical-align: top;
    padding-left: 0;
    padding-right: var(--padding-l);
  }

  /* ── Fork status column ── */
  .td-status {
    vertical-align: top;
    padding-left: var(--padding-l) !important;
    padding-right: 0 !important;
    padding-top: var(--padding-l) !important;
    width: 56px;
    min-width: 56px;
    max-width: 56px;
  }

  /* Wrapper: swatch on left, arrows on right */
  .status-cell {
    display: flex;
    align-items: flex-start;
    gap: 0;
    width: 100%;
  }
  /* Container for all fork arrows */
  .status-fork {
    display: flex;
    flex-direction: column;
    gap: var(--gap-m);
    width: 16px;
    min-width: 16px;
    max-width: 16px;
    position: relative;
    overflow: visible;
    flex-shrink: 0;
    margin-left: auto;
    margin-right: 0;
  }

  /* One arrow row */
  .fork-item {
    display: flex;
    align-items: center;
    height: var(--button-min-height);
    width: 100%;
    position: relative;
  }

  /* Left segment — used only for single (non-forked) arrow */
  .fork-item .f-left {
    height: var(--thickness);
    background: var(--border);
    flex-shrink: 0;
    flex: 1;
  }
  /* In forked mode the SVG handles the left side; reserve space with invisible placeholder */
  .status-fork.is-forked .fork-item .f-left {
    width: 16px;
    flex: none;
    background: transparent;
  }

  /* Right flex line */
  .fork-item .f-right {
    flex: 1;
    height: var(--thickness);
    background: var(--border);
  }

  /* Arrowhead */
  .fork-item .f-head {
    width: var(--dividerSection-height);
    height: var(--dividerSection-height);
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .fork-item .f-head svg {
    display: block;
    stroke: var(--border);
    stroke-width: var(--thickness);
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
  }

  /* SVG fork overlay */
  .fork-svg {
    position: absolute;
    top: 0;
    left: 0;
    pointer-events: none;
    overflow: visible;
  }


  /* ── CMYK 4-box inputs ── */
  .cmyk-group {
    display: flex;
    align-items: stretch;
    gap: 0;
    flex: 1;
    min-width: 0;
    overflow: visible;
  }
  .cmyk-box-wrap {
    border-radius: 0;
    padding: 0 var(--gap-xs) 0 var(--padding-s);
    gap: 0; flex: 1; min-width: 0;
  }
  .cmyk-box-wrap:first-child { border-radius: 16px 0 0 16px; }
  .cmyk-box-wrap:nth-child(4) { border-radius: 0 16px 16px 0; }
  .cmyk-box-wrap + .cmyk-box-wrap { margin-left: -1.5px; }
  .cmyk-group:not(.cmyk-readonly):hover .cmyk-box-wrap { border-color: var(--input-border-hover); }
  .cmyk-box-wrap:focus-within { border-color: var(--input-border-focus); z-index: 2; position: relative; }
  .cmyk-box { width: 100%; text-align: left; }
  /* Auto rows: subtler boxes */
  .cmyk-group.cmyk-auto .cmyk-box-wrap {
    border-color: var(--input-auto-border);
  }
  .cmyk-group.cmyk-auto .cmyk-box {
    color: var(--text);
  }
  .cmyk-group.cmyk-auto .cmyk-box-wrap:focus-within {
    border-color: var(--input-border-focus);
    background: var(--surface);
  }

  .cmyk-spacer { width: var(--button-min-height); flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; }
  .cmyk-group.cmyk-readonly .cmyk-box-wrap { background: transparent; border-color: var(--input-auto-border); }
  .cmyk-box[readonly], .output-text-input[readonly] { pointer-events: none; opacity: 0.8; }
  /* Placement only — appearance comes from .tooltipButton in the base. This is a TABLE
     row (.td-variable), not a buttonList, so the DS buttonList flush-tooltip rule does
     not apply here; the small margin keeps it legible next to the variable name. */
  .lib-info { vertical-align: middle; margin-left: var(--gap-s); }

  /* ── Output cell (CMYK + optional outputs stacked) ── */
  .output-cell {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: var(--gap-m);
    width: 100%;
  }
  .output-row {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    column-gap: var(--gap-s);
  }
  .output-row > * { margin-left: 0 !important; margin-right: 0 !important; }
  .output-add-row {
    justify-content: flex-start;
    width: 100%;
    overflow: visible;
  }

  /* ── Pantone / RAL / Vinyl input ── */
  .output-text-wrap { flex: 1; min-width: 0; }
  .output-text-wrap.output-readonly { background: transparent; border-color: var(--input-auto-border); pointer-events: none; opacity: 0.8; }
  .output-text-wrap:not(.output-readonly):hover { border-color: var(--input-border-hover); }
  .output-text-wrap:not(.output-readonly):focus-within { border-color: var(--input-border-focus) !important; }  .output-text-input { padding: 0 var(--padding-xs); }
  .pantone-input { padding: 0; }

  /* Stands in for the source chips when the list isn't tied to a selection. */
  .actionbar-note {
    font-size: var(--m-size);
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }

  /* ── Export button (top-right) ── */
  .export-picker {
    flex-shrink: 0;
    margin-left: auto;
  }
  /* ── Export modal fields (in the shared DS modal slot) ── */
  .export-modal-card { width: 300px; }
  .export-field { display: flex; flex-direction: column; gap: var(--gap-l); width: 100%; }
  .export-format-desc {
    font-size: var(--s-size); font-weight: var(--s-weight);
    color: var(--text-secondary);
    min-height: 1.2em;
  }
  /* Crop marks and bleed are independent print options, stacked in the modal slot. */
  .export-print {
    display: flex;
    flex-direction: column;
    gap: var(--gap-l);   /* DS slot item spacing = gap/l (12) */
    width: 100%;
    font-size: var(--s-size);
    font-weight: var(--s-weight);
    color: var(--text-secondary);
    white-space: nowrap;
    user-select: none;
  }
  /* The per-format wrappers carry no box of their own — display:contents lets their
     rows sit directly in the slot and inherit its spacing, so the wrapper doesn't
     change the rhythm. Only the active format's rows are shown. */
  #pdf-options, #tiff-options { display: contents; }
  #pdf-options[hidden], #tiff-options[hidden] { display: none; }
  .export-bleed-row { display: flex; align-items: center; gap: var(--gap-m); }
  /* DS input (.inputWrap + .inputField), sized to content. Only the compact width,
     right-aligned value, and spinner removal are added here. */
  .cropmarks-bleed { min-width: 0; gap: var(--gap-xs); flex: none; }
  .cropmarks-bleed-input {
    flex: none;
    width: 4ch;
    text-align: right;
    font-size: var(--s-size);
    appearance: textfield;
    -webkit-appearance: none;
  }
  .cropmarks-bleed-input::-webkit-inner-spin-button,
  .cropmarks-bleed-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  #dpi-input, #tiff-dpi-input { width: 5ch; }   /* room for a 4-digit dpi (e.g. 1200) */
  .cropmarks-unit { color: var(--input-label); font-size: var(--s-size); }
  /* ── Pre-flight lists (output size + low-res images) ── */
  .preflight-section { display: flex; flex-direction: column; gap: var(--gap-xs); width: 100%; }
  /* Author display beats the UA [hidden] rule — restore it so an empty section (no
     artworks, or no images below target) shows nothing at all, not a stray header. */
  .preflight-section[hidden] { display: none; }
  .preflight-header { font-size: var(--s-size); font-weight: var(--s-weight); color: var(--input-label); }
  .preflight-list { display: flex; flex-direction: column; max-height: 132px; overflow-y: auto; }
  .preflight-row {
    display: flex; align-items: center; gap: var(--gap-s);
    height: 32px; padding: 0 var(--padding-xs);
    border-bottom: var(--thickness) solid var(--border);
  }
  .preflight-row .pf-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--m-size); }
  .preflight-row .pf-meta { flex-shrink: 0; color: var(--text-secondary); font-size: var(--s-size); white-space: nowrap; }
  .preflight-focus-btn { flex-shrink: 0; }   /* buttonTertiary icon button — "Focus in canvas" */
</style>
</head>
<body>

<div id="progress-container"></div>

<!-- Results -->
<div id="results-ui" style="display:flex; flex-direction:column; flex:1; min-height:0;">
  <div id="actionbar" class="actionbar">
    <!-- source chips, rescan btn, and export picker injected by JS -->
    <div id="source-chips" style="display:flex;flex-wrap:wrap;align-items:center;gap:var(--gap-m);flex:1;min-width:0;"></div>
    <div class="export-picker" id="export-picker" style="display:none;">
      <button class="buttonSecondary buttonAddOutput" id="export-btn" data-tip="Export CMYK">
        <svg width="16" height="16"><use href="#icon-download"/></svg>
      </button>
    </div>
    <!-- Label swaps with the selection — see the selection-count handler. -->
    <button id="rescan-btn" class="buttonPrimary">
      <svg width="16" height="16"><use href="#icon-update"/></svg><span id="rescan-label">Scan file</span>
    </button>
  </div>
  <div class="dividerLine"></div>
  <div id="no-colors-state" class="empty-state" style="display:none;">
    <div class="empty-state-content">
      <svg width="56" height="56"><use href="#icon-empty-colors"/></svg>
      <div class="empty-state-text">
        <p class="empty-state-title">No color variables found</p>
        <p class="empty-state-desc">The current selection has no bound color variables.</p>
      </div>
    </div>
  </div>
  <div class="scroll-area">
    <table class="color-table">
      <colgroup>
        <col /><col /><col />
      </colgroup>
      <tbody id="color-body"></tbody>
    </table>
  </div>
</div>

<div id="toast-container"></div>
<canvas id="convert-canvas" style="display:none"></canvas>

<!-- Export modal — the shared DS modal shell (title → slot → footer). The slot
     holds the format choice and print options; the shell is the design system's. -->
<div id="export-modal" class="modal">
  <div class="modal-overlay"></div>
  <div class="modal-card export-modal-card">
    <h2 class="modal-title">Choose export settings:</h2>
    <div class="modal-slot">
      <div class="export-field">
        <div class="segmented-control full-width" id="export-format">
          <div class="seg-pill"></div>
          <button type="button" id="format-pdf" class="selected"><span class="tab-label">PDF</span></button>
          <button type="button" id="format-tiff"><span class="tab-label">TIFF</span></button>
        </div>
        <span class="export-format-desc" id="export-format-desc"></span>
      </div>
      <div class="export-print" id="export-print">
        <!-- PDF print options: crop marks, bleed and image downsampling -->
        <div id="pdf-options">
          <label class="checkbox">
            <input type="checkbox" id="cropmarks-toggle" class="checkbox-input">
            <span class="checkbox-box"><svg class="checkbox-check" viewBox="0 0 16 16" fill="none"><path d="M3.81 8.435L6.31 10.935L12.185 5.06" stroke="currentColor" stroke-width="2"/></svg></span>
            <span class="checkbox-text">Crop marks</span>
          </label>
          <div class="export-bleed-row">
            <label class="checkbox">
              <input type="checkbox" id="bleed-toggle" class="checkbox-input">
              <span class="checkbox-box"><svg class="checkbox-check" viewBox="0 0 16 16" fill="none"><path d="M3.81 8.435L6.31 10.935L12.185 5.06" stroke="currentColor" stroke-width="2"/></svg></span>
              <span class="checkbox-text">Bleed</span>
            </label>
            <div class="inputWrap cropmarks-bleed" id="bleed-wrap">
              <input type="number" id="bleed-input" class="inputField cropmarks-bleed-input" min="0" max="20" step="0.5" value="3" aria-label="Bleed in millimetres">
              <span class="cropmarks-unit">mm</span>
            </div>
          </div>
          <label class="checkbox">
            <input type="checkbox" id="regmarks-toggle" class="checkbox-input">
            <span class="checkbox-box"><svg class="checkbox-check" viewBox="0 0 16 16" fill="none"><path d="M3.81 8.435L6.31 10.935L12.185 5.06" stroke="currentColor" stroke-width="2"/></svg></span>
            <span class="checkbox-text">Registration marks</span>
          </label>
          <label class="checkbox">
            <input type="checkbox" id="pageinfo-toggle" class="checkbox-input">
            <span class="checkbox-box"><svg class="checkbox-check" viewBox="0 0 16 16" fill="none"><path d="M3.81 8.435L6.31 10.935L12.185 5.06" stroke="currentColor" stroke-width="2"/></svg></span>
            <span class="checkbox-text">Page information</span>
          </label>
          <div class="export-bleed-row">
            <label class="checkbox">
              <input type="checkbox" id="downsample-toggle" class="checkbox-input">
              <span class="checkbox-box"><svg class="checkbox-check" viewBox="0 0 16 16" fill="none"><path d="M3.81 8.435L6.31 10.935L12.185 5.06" stroke="currentColor" stroke-width="2"/></svg></span>
              <span class="checkbox-text">Downsample images to</span>
            </label>
            <div class="inputWrap cropmarks-bleed" id="dpi-wrap">
              <input type="number" id="dpi-input" class="inputField cropmarks-bleed-input" min="72" max="1200" step="10" value="300" aria-label="Target resolution in DPI">
              <span class="cropmarks-unit">dpi</span>
            </div>
          </div>
          <div class="preflight-section" id="preflight-images-section" hidden>
            <span class="preflight-header" id="preflight-images-header">Images under target dpi:</span>
            <div class="preflight-list" id="preflight-images"></div>
          </div>
        </div>
        <!-- TIFF is a raster export: crop marks and bleed don't apply — only the resolution -->
        <div id="tiff-options" hidden>
          <div class="export-bleed-row">
            <span class="checkbox-text export-res-label">Resolution</span>
            <div class="inputWrap cropmarks-bleed" id="tiff-dpi-wrap">
              <input type="number" id="tiff-dpi-input" class="inputField cropmarks-bleed-input" min="72" max="1200" step="10" value="300" aria-label="Export resolution in DPI">
              <span class="cropmarks-unit">dpi</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="buttonSecondary" id="export-cancel-btn"><span>Cancel</span></button>
      <button class="buttonPrimary" id="export-confirm-btn"><span id="export-confirm-label">Export PDF</span></button>
    </div>
  </div>
</div>

<div id="tt"></div>
<!--@UI-->
<script>
  // Request saved window height as soon as the UI is ready.
  parent.postMessage({ pluginMessage: { type: 'get-saved-height' } }, '*');

  let exportedCount = 0, exportTotal = 0, scanToastTimer = null;
  // Output filenames used so far this batch. Two selected items can share a name
  // (filenames come from the frame name), so without this the second write would
  // overwrite the first on disk / collide in the ZIP — only one file would survive.
  let _usedNames = new Set();
  // Give a filename a numeric suffix (Logo_CMYK.pdf → Logo-2_CMYK.pdf) if its name
  // is already taken this batch, so every exported item lands as its own file.
  function uniqueName(name) {
    if (!_usedNames.has(name)) { _usedNames.add(name); return name; }
    const dot = name.lastIndexOf('.');
    const base = dot > 0 ? name.slice(0, dot) : name;
    const ext  = dot > 0 ? name.slice(dot)   : '';
    let i = 2, cand;
    do { cand = `${base}-${i}${ext}`; i++; } while (_usedNames.has(cand));
    _usedNames.add(cand);
    return cand;
  }
  // Per-frame export failures, reported as ONE toast when the batch ends —
  // a toast per failed frame would stampede on a big selection.
  let _exportFailures = [];
  // Raster images that couldn't be converted to CMYK across the batch (kept as RGB).
  // Surfaced at batch end so a non-CMYK image never ships silently in a print file.
  let _exportRgbImages = 0;
  // The frames that shipped at least one such image, so the warning can name the
  // artwork the user has to look at — a bare count leaves them hunting.
  let _exportRgbFrames = [];
  // Set by convertPdfToCmyk after each frame; read by the export handler.
  window._lastPdfImagesUnconverted = 0;

  // One frame failing names it; several report the count, since the toast is a
  // single line and a list of names would overflow it. A failure takes priority over
  // the RGB-image warning (only one toast shows at a time); otherwise, if some images
  // stayed RGB, warn about that.
  function reportExportFailures() {
    if (_exportFailures.length) {
      const f = _exportFailures;
      showError(f.length === 1
        ? `Failed to export ${f[0].name} — ${f[0].message}`
        : `${f.length} of ${exportTotal} frames failed to export`);
      _exportFailures = [];
      _exportRgbImages = 0;
      _exportRgbFrames = [];
      return;
    }
    if (_exportRgbImages > 0) {
      const imgWord = _exportRgbImages === 1 ? `1 image` : `${_exportRgbImages} images`;
      const names = _exportRgbFrames.map(n => `"${n}"`);
      let where;
      if (names.length === 1)      where = ` in ${names[0]}`;
      else if (names.length <= 3)  where = ` across ${names.length} frames (${names.join(', ')})`;
      else                         where = ` across ${names.length} frames (${names.slice(0, 3).join(', ')}, +${names.length - 3} more)`;
      showError(`${imgWord}${where} couldn't be converted to CMYK — left as RGB`);
      _exportRgbImages = 0;
      _exportRgbFrames = [];
    }
  }
  let _exportFmt = null, _exportLookup = null;
  let _exportCancelled = false;
  let _exportUsedFSA = false;   // true if at least one file was confirmed written via FSA
  let _dirHandle = null;        // persisted folder handle (multi-file) — prompt once per session
  let _singleFileHandle = null; // one-shot handle from showSaveFilePicker (single file)
  let _pendingFiles = [];       // accumulates files for ZIP when FSA is unavailable (multi-file)
  let _cropMarks = false;       // add crop/trim marks to the CMYK PDF (print) — off by default
  let _regMarks = false;        // add registration (plate-alignment) targets — off by default
  let _pageInfo = false;        // print the file name + timestamp in the slug — off by default
  let _bleedOn = false;         // add a bleed margin around the trim — off by default
  let _bleedMm = 3;             // configurable bleed amount, in millimetres (used only when _bleedOn)
  let _downsample = false;      // downsample embedded images on PDF export — off by default
  let _downsampleDpi = 300;     // target resolution for downsampling, in DPI (used only when _downsample)
  let _tiffDpi = 300;           // TIFF raster export resolution, in DPI

  // ── Minimal ZIP builder (store/no-compression) for multi-file fallback ──
  function _buildZip(files) {
    function u16(n){const b=new Uint8Array(2);new DataView(b.buffer).setUint16(0,n,true);return b;}
    function u32(n){const b=new Uint8Array(4);new DataView(b.buffer).setUint32(0,n,true);return b;}
    function cat(aa){const t=aa.reduce((s,a)=>s+a.length,0),o=new Uint8Array(t);let p=0;for(const a of aa){o.set(a,p);p+=a.length;}return o;}
    function crc32(d){let c=0xFFFFFFFF;for(let i=0;i<d.length;i++){c^=d[i];for(let j=0;j<8;j++)c=(c&1)?(c>>>1)^0xEDB88320:c>>>1;}return(c^0xFFFFFFFF)>>>0;}
    const enc=new TextEncoder(), lp=[], cp=[];
    let off=0;
    for(const f of files){
      const nm=enc.encode(f.name), d=f.data instanceof Uint8Array?f.data:new Uint8Array(f.data);
      const crc=crc32(d), sz=d.length;
      const lh=cat([new Uint8Array([0x50,0x4B,0x03,0x04]),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(sz),u32(sz),u16(nm.length),u16(0),nm,d]);
      lp.push(lh);
      cp.push(cat([new Uint8Array([0x50,0x4B,0x01,0x02]),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(sz),u32(sz),u16(nm.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(off),nm]));
      off+=lh.length;
    }
    const cdsz=cp.reduce((s,p)=>s+p.length,0);
    return cat([...lp,...cp,cat([new Uint8Array([0x50,0x4B,0x05,0x06]),u16(0),u16(0),u16(files.length),u16(files.length),u32(cdsz),u32(off),u16(0)])]);
  }

  // Auto CMYK from 0-255 RGB (mirrors code.js logic)
  function rgbToCmykAuto(r, g, b) {
    const rn = r / 255, gn = g / 255, bn = b / 255;
    if (rn === 0 && gn === 0 && bn === 0) return { c: 0, m: 0, y: 0, k: 100 };
    const k = 1 - Math.max(rn, gn, bn);
    const d = 1 - k;
    return {
      c: Math.round((1 - rn - k) / d * 100),
      m: Math.round((1 - gn - k) / d * 100),
      y: Math.round((1 - bn - k) / d * 100),
      k: Math.round(k * 100),
    };
  }

  const removeIcon = `<svg width="16" height="16"><use href="#icon-clear"/></svg>`;

  // ── Rebuild fork arrows for a row based on live output count ─────────
  function updateForkArrows(outputCell) {
    const row = outputCell.closest('tr');
    if (!row) return;
    const statusCell = row.querySelector('.status-fork');
    if (!statusCell) return;

    const count = Array.from(outputCell.querySelectorAll('.output-row'))
      .filter(r => !r.classList.contains('output-row-removing') && r.style.visibility !== 'hidden').length;

    const arrowItem = () => `<div class="fork-item"><span class="f-left"></span><span class="f-right"></span></div>`;

    if (count <= 1) {
      statusCell.className = 'status-fork';
      statusCell.innerHTML = Array(Math.max(count,1)).fill(0).map(() => arrowItem()).join('');
      return;
    }

    // Build SVG path for the fork
    const ITEM_H = 24, GAP = 8, STEP = ITEM_H + GAP;
    const W = 16, R = 6, S = 1.5;
    const totalH = count * ITEM_H + (count - 1) * GAP;
    const color = 'var(--border)';

    // Center Y of each item
    const cy = i => i * STEP + ITEM_H / 2;
    const top = cy(0), bot = cy(count - 1);

    // Trunk: vertical line between first and last branch centres
    // Rounded top corner (curves right) and bottom corner (curves right)
    let d = '';
    // Top-left corner: arc from going-down to going-right
    d += `M ${R},${top} Q 0,${top} 0,${top + R}`;
    // Trunk body
    d += ` L 0,${bot - R}`;
    // Bottom-left corner: arc from going-down to going-right
    d += ` Q 0,${bot} ${R},${bot}`;
    // Top branch horizontal
    d += ` M ${R},${top} L ${W},${top}`;
    // Bottom branch horizontal
    d += ` M ${R},${bot} L ${W},${bot}`;
    // Middle branches
    for (let i = 1; i < count - 1; i++) {
      d += ` M 0,${cy(i)} L ${W},${cy(i)}`;
    }

    const svg = `<svg class="fork-svg" width="${W}" height="${totalH}" viewBox="0 0 ${W} ${totalH}">
      <path d="${d}" fill="none" stroke="${color}" stroke-width="${S}" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`;

    statusCell.className = 'status-fork is-forked';
    statusCell.innerHTML = svg + Array(count).fill(0).map(() => arrowItem()).join('');
  }

  // Document-level capture so we intercept before any browser native undo on the input
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
      if (_focusedGroup && _focusedGroup._original !== null) {
        e.preventDefault();
        e.stopImmediatePropagation();
        const boxes = _focusedGroup.querySelectorAll('.cmyk-box');
        boxes.forEach((b, j) => { b.value = _focusedGroup._original[j]; });
        // Revert swatch
        const orig = _focusedGroup._original.map(Number);
        const swatch = _focusedGroup.closest('td').querySelector('.cmyk-swatch');
        if (swatch) {
          const cr = Math.round(255 * (1 - orig[0]/100) * (1 - orig[3]/100));
          const cg = Math.round(255 * (1 - orig[1]/100) * (1 - orig[3]/100));
          const cb = Math.round(255 * (1 - orig[2]/100) * (1 - orig[3]/100));
          swatch.style.background = `#${[cr,cg,cb].map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,"0")).join("")}`;
        }
        _focusedGroup._original = null;
      }
    }
  }, true); // capture phase — fires before browser default

  let _scanShownAt = 0;
  let _scanCancelled = false;

  function _setScanBusy(busy) {
    const btn = document.getElementById('rescan-btn');

  function _startScanToastTimer() {
    // Never overwrite an active export progress bar.
    if (document.querySelector('#progress-container .progress-msg:not(.progress-scan)')) return;
    _clearScanToastTimer(true);
    _scanCancelled = false;
    _scanShownAt = Date.now();
    _setScanBusy(true);
    // Mirrors the scan button — the bar names the same target the click did.
    const label = window._selectionCount > 0 ? 'Scanning selection…' : 'Scanning file…';
    showProgress(label, { cls: 'progress-scan', cancel: (e) => {
      if (e) e.stopPropagation();
      _scanCancelled = true;
      parent.postMessage({ pluginMessage: { type: 'cancel-scan' } }, '*');
      _clearScanToastTimer(false);
    }});
  }

  function _clearScanToastTimer(immediate) {
    if (scanToastTimer) { clearTimeout(scanToastTimer); scanToastTimer = null; }
    _setScanBusy(false);
    const m = document.querySelector('.progress-msg.progress-scan');
    if (!m) return;
    if (immediate) { m.remove(); return; }
    if (_scanCancelled) { dismissProgress(); return; }
    // Keep visible for at least 2s.
    const elapsed = Date.now() - _scanShownAt;
    const remaining = Math.max(0, 2000 - elapsed);
    setTimeout(() => {
      if (document.querySelector('.progress-msg.progress-scan')) dismissProgress();
    }, remaining);
  }

  // ── Live swatch preview update ───────────────────────────────────────

  function updateSwatchPreview(group) {
    const boxes = group.querySelectorAll(".cmyk-box");
    const vals = Array.from(boxes).map(b => Math.min(100, Math.max(0, parseInt(b.value, 10) || 0)));
    const [c, m, y, k] = vals;
    const swatch = group.closest('td').querySelector(".cmyk-swatch");
    if (!swatch) return;
    const cr = Math.round(255 * (1 - c/100) * (1 - k/100));
    const cg = Math.round(255 * (1 - m/100) * (1 - k/100));
    const cb = Math.round(255 * (1 - y/100) * (1 - k/100));
    swatch.style.background = `#${[cr,cg,cb].map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,"0")).join("")}`;
  }

  // ── CMYK 4-box commit ───────────────────────────────────────────────

  function clamp(v) { return Math.min(100, Math.max(0, Math.round(v) || 0)); }

  function commitCmykGroup(group) {
    const boxes = group.querySelectorAll(".cmyk-box");
    const idx   = parseInt(group.dataset.idx, 10);
    const scanData = window._lastScanData;

    const vals = Array.from(boxes).map(b => {
      const n = parseInt(b.value, 10);
      return isNaN(n) ? null : clamp(n);
    });

    // Revert boxes that have invalid values
    if (vals.some(v => v === null)) {
      if (scanData && scanData[idx]) {
        const cm = scanData[idx].cmyk;
        const keys = ['c','m','y','k'];
        boxes.forEach((b, i) => { b.value = cm[keys[i]]; });
      }
      return;
    }

    const [c, m, y, k] = vals;
    boxes.forEach(b => { b.value = clamp(parseInt(b.value, 10)); });

    // Update the swatch preview
    const swatch = group.closest('td').querySelector(".cmyk-swatch");
    if (swatch) {
      const cr = Math.round(255 * (1 - c/100) * (1 - k/100));
      const cg = Math.round(255 * (1 - m/100) * (1 - k/100));
      const cb = Math.round(255 * (1 - y/100) * (1 - k/100));
      swatch.style.background = `#${[cr,cg,cb].map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,"0")).join("")}`;
    }

    // Skip if unchanged
    if (scanData && scanData[idx]) {
      const prev = scanData[idx].cmyk;
      if (prev.c === c && prev.m === m && prev.y === y && prev.k === k) return;
    }

    // Switch auto group to edited style immediately
    if (group.classList.contains('cmyk-auto')) {
      group.classList.remove('cmyk-auto');
    }

    const cmykValue = `${c},${m},${y},${k}`;
    parent.postMessage({ pluginMessage: {
      type: "update-cmyk-variable",
      colorVarId: group.dataset.colorVarId || null,
      cmykValue
    }}, "*");
  }

  function pantoneToHex(code) {
    if (!code) return null;
    const key = code.trim();
    // Try exact match
    if (PANTONE_COLORS[key]) return PANTONE_COLORS[key];
    // Try case-insensitive match
    const lower = key.toLowerCase();
    for (const k in PANTONE_COLORS) {
      if (k.toLowerCase() === lower) return PANTONE_COLORS[k];
    }
    // Try numeric prefix (e.g. "485 C" → "485")
    const num = key.replace(/\s*[CcUu]$/, '').trim();
    if (PANTONE_COLORS[num]) return PANTONE_COLORS[num];
    return null;
  }

    if (!swatch) return;

    const avery = AVERY_COLORS[raw] || AVERY_COLORS[raw.toUpperCase()];
    if (avery) return avery;
    return null;

  // CMYK byte values: 0 = no ink, 255 = full ink
  // For paired variables, use the stored values directly
  // For calculated, use standard RGB→CMYK with ink threshold cleanup
  function rgbPixelToCmyk(r, g, b, cl) {
    const hex = "#" + [r,g,b].map(v=>v.toString(16).padStart(2,"0")).join("").toUpperCase();
    if (cl && cl[hex]) {
      const m = cl[hex];
      return [Math.round(m.c * 2.55), Math.round(m.m * 2.55), Math.round(m.y * 2.55), Math.round(m.k * 2.55)];
    }
    const rn = r / 255, gn = g / 255, bn = b / 255;
    if (rn === 0 && gn === 0 && bn === 0) return [0, 0, 0, 255];
    const k = 1 - Math.max(rn, gn, bn);
    const c = (1 - rn - k) / (1 - k);
    const m = (1 - gn - k) / (1 - k);
    const y = (1 - bn - k) / (1 - k);
    let cb = Math.round(c * 255), mb = Math.round(m * 255),
        yb = Math.round(y * 255), kb = Math.round(k * 255);
    // Remove trace ink < ~1.2% that causes visible screen color casts
    if (cb <= 3) cb = 0;
    if (mb <= 3) mb = 0;
    if (yb <= 3) yb = 0;
    return [cb, mb, yb, kb];
  }

  // Load PNG into canvas and return raw RGBA pixel data
  function loadPngToCanvas(png, w, h, whiteBg) {
    return new Promise(resolve => {
      const blob = new Blob([new Uint8Array(png)], { type: "image/png" });
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => {
        const cv = document.getElementById("convert-canvas");
        cv.width = w; cv.height = h;
        const ctx = cv.getContext("2d");
        if (whiteBg) { ctx.fillStyle = "#FFFFFF"; ctx.fillRect(0, 0, w, h); }
        else { ctx.clearRect(0, 0, w, h); }
        ctx.drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        resolve(ctx.getImageData(0, 0, w, h).data);
      };
      img.src = url;
    });
  }

  // Decode an encoded image (JPEG/PNG/…) to RGBA via the browser, sized to w×h.
  // The PDF CMYK converter uses this to turn Figma's DCTDecode images into pixels.
  // Kept as a named global so headless tests can stub it (jsdom has no real canvas).
  function decodeImageToRgba(bytes, w, h, mime) {
    return new Promise((resolve, reject) => {
      try {
        const blob = new Blob([new Uint8Array(bytes)], { type: mime || "image/jpeg" });
        const url = URL.createObjectURL(blob);
        const im = new Image();
        im.onload = () => {
          try {
            const cv = document.getElementById("convert-canvas");
            cv.width = w; cv.height = h;
            const ctx = cv.getContext("2d");
            ctx.clearRect(0, 0, w, h);
            ctx.drawImage(im, 0, 0, w, h);
            URL.revokeObjectURL(url);
            resolve(ctx.getImageData(0, 0, w, h).data);
          } catch (e) { reject(e); }
        };
        im.onerror = () => { URL.revokeObjectURL(url); reject(new Error("image decode failed")); };
        im.src = url;
      } catch (e) { reject(e); }
    });
  }

  // ── Compress with deflate ──────────────────────────────────────────

  async function deflateBuf(raw) {
    const cs=new CompressionStream("deflate"); const w=cs.writable.getWriter(); w.write(raw); w.close();
    const chunks=[]; const r=cs.readable.getReader();
    while(true){const{done,value}=await r.read();if(done)break;chunks.push(value);}
    const total=chunks.reduce((s,c)=>s+c.length,0); const out=new Uint8Array(total); let off=0;
    for(const c of chunks){out.set(c,off);off+=c.length;} return out;
  }

  // ── Decompress FlateDecode ─────────────────────────────────────────
  async function inflateBuf(compressed) {
    const ds=new DecompressionStream("deflate");const wr=ds.writable.getWriter();wr.write(compressed);wr.close();
    const chunks=[];const rd=ds.readable.getReader();
    while(true){const{done,value}=await rd.read();if(done)break;chunks.push(value);}
    const total=chunks.reduce((s,c)=>s+c.length,0);const out=new Uint8Array(total);let o=0;
    for(const c of chunks){out.set(c,o);o+=c.length;}return out;
  }

  // ── RGB float [0-1] → CMYK float [0-1] with color lookup ──────────
  function rgbFloatToCmykFloat(r,g,b,cl){
    if(cl){
      const ri=Math.round(r*255),gi=Math.round(g*255),bi=Math.round(b*255);
      const hex="#"+[ri,gi,bi].map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,"0")).join("").toUpperCase();
      if(cl[hex]){const m=cl[hex];return[m.c/100,m.m/100,m.y/100,m.k/100];}
    }
    if(r===0&&g===0&&b===0)return[0,0,0,1];
    const k=1-Math.max(r,g,b);
    const c=(1-r-k)/(1-k),m=(1-g-k)/(1-k),y=(1-b-k)/(1-k);
    return[c<=0.012?0:c,m<=0.012?0:m,y<=0.012?0:y,k];
  }

  // Classify every image XObject in a parsed PDF (see convertPdfToCmyk). Returns:
  //   allImg    — all image object numbers; their binary streams are never content
  //               and must never be run through the colour-op converter.
  //   imgNums   — RGB images to convert to CMYK. Figma writes an image's colour
  //               space as an INDIRECT ref (/ColorSpace n 0 R → [ /ICCBased m 0 R ]),
  //               never a literal /DeviceRGB, so resolve one hop to decide RGB-ness.
  //   imgCsRefs — objects used as an image's /ColorSpace; the ICC-strip pass must
  //               leave these intact, or the image's colour space stops matching its
  //               data (this was the "images vanish" bug: [ /ICCBased 6 0 R ] → /DeviceGray).
  function classifyImages(objs, iccRgb) {
    const allImg = new Set(), imgNums = new Set(), imgCsRefs = new Set();
    function isRgb(dict) {
      if (/\/ColorSpace\s*\/DeviceRGB/.test(dict)) return true;
      let m = dict.match(/\/ColorSpace\s*\[\s*\/ICCBased\s+(\d+)\s+0\s+R/);
      if (m && iccRgb.has(+m[1])) return true;
      m = dict.match(/\/ColorSpace\s+(\d+)\s+0\s+R/);
      if (m) {
        imgCsRefs.add(+m[1]);
        const co = objs[+m[1]], cb = co ? (co.type === 'plain' ? (co.body || '') : co.dict) : '';
        if (/\/DeviceRGB/.test(cb)) return true;
        const im = cb.match(/\/ICCBased\s+(\d+)\s+0\s+R/);
        if (im && iccRgb.has(+im[1])) return true;
      }
      for (const i of iccRgb) if (dict.includes(i + ' 0 R')) return true;
      return false;
    }
    for (const [n, o] of Object.entries(objs))
      if (o.type === 'stream' && /\/Subtype\s*\/Image/.test(o.dict)) {
        allImg.add(+n);
        if (isRgb(o.dict)) imgNums.add(+n);
      }
    return { allImg, imgNums, imgCsRefs };
  }

  // Concatenate two PDF affine matrices [a b c d e f] (row-vector convention:
  // the result applies `a` first, then `b`). Used to track the CTM while walking a
  // content stream so we can recover each image's on-page size.
  function matMul(a, b) {
    return [
      a[0]*b[0] + a[1]*b[2],
      a[0]*b[1] + a[1]*b[3],
      a[2]*b[0] + a[3]*b[2],
      a[2]*b[1] + a[3]*b[3],
      a[4]*b[0] + a[5]*b[2] + b[4],
      a[4]*b[1] + a[5]*b[3] + b[5],
    ];
  }

  // Walk a content stream, tracking the graphics-state matrix (q/Q stack + cm), and
  // record the on-page size of each drawn image XObject. An image is painted over the
  // unit square, so at a `/Name Do` the CTM's basis vectors give its width/height in
  // points: wPt = |(a,b)|, hPt = |(c,d)|. `nameToImg` maps XObject names → object
  // numbers; `sizes` is filled with the LARGEST placement seen per object.
  function scanContentForImageSizes(txt, nameToImg, sizes) {
    const re = /(\/[A-Za-z0-9._#+-]+)|(-?\d*\.?\d+)|([A-Za-z*'"]+)/g;
    let ctm = [1,0,0,1,0,0]; const stack = []; let ops = []; let name = null; let m;
    while ((m = re.exec(txt)) !== null) {
      if (m[1]) { name = m[1].slice(1); continue; }        // /Name — an operand
      if (m[2]) { ops.push(parseFloat(m[2])); continue; }  // number — an operand
      const op = m[3];                                     // operator — acts, then clears operands
      if (op === 'q') stack.push(ctm.slice());
      else if (op === 'Q') { if (stack.length) ctm = stack.pop(); }
      else if (op === 'cm' && ops.length >= 6) ctm = matMul(ops.slice(-6), ctm);
      else if (op === 'Do' && name && nameToImg[name] != null) {
        const num = nameToImg[name];
        const wPt = Math.hypot(ctm[0], ctm[1]), hPt = Math.hypot(ctm[2], ctm[3]);
        const cur = sizes[num];
        if (!cur || wPt*hPt > cur.wPt*cur.hPt) sizes[num] = { wPt, hPt };
      }
      ops = []; name = null;
    }
  }

  // Compute the on-page size (in points) of every image XObject, so downsampling can
  // work out each image's true DPI. Maps XObject names → object numbers from every
  // /XObject resource dict, then walks each page's content stream(s). Returns
  // { objNum: {wPt, hPt} }; images whose placement can't be found are simply absent
  // (the caller then leaves them at full resolution rather than guessing).
  async function imageDisplaySizes(objs, allImg) {
    const bs = (u) => { let s = ''; for (let i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return s; };
    const sizes = {}, nameToImg = {};
    for (const o of Object.values(objs)) {
      const t = o.type === 'plain' ? (o.body || '') : o.dict;
      const xo = t.match(/\/XObject\s*<<([^>]*)>>/);
      if (!xo) continue;
      let mm; const nr = /\/([A-Za-z0-9._#+-]+)\s+(\d+)\s+0\s+R/g;
      while ((mm = nr.exec(xo[1])) !== null) if (allImg.has(+mm[2])) nameToImg[mm[1]] = +mm[2];
    }
    if (!Object.keys(nameToImg).length) return sizes;
    const contentNums = new Set();
    for (const o of Object.values(objs)) {
      const body = o.type === 'plain' ? (o.body || '') : '';
      if (!/\/Type\s*\/Page\b/.test(body) || /\/Type\s*\/Pages\b/.test(body)) continue;
      const arr = body.match(/\/Contents\s*\[([^\]]*)\]/);
      const single = body.match(/\/Contents\s+(\d+)\s+0\s+R/);
      if (arr) { let mm; const rr=/(\d+)\s+0\s+R/g; while ((mm=rr.exec(arr[1]))!==null) contentNums.add(+mm[1]); }
      else if (single) contentNums.add(+single[1]);
    }
    for (const cn of contentNums) {
      const o = objs[cn]; if (!o || o.type !== 'stream') continue;
      let txt;
      try { txt = o.isFlate ? bs(await inflateBuf(o.streamRaw)) : bs(o.streamRaw); }
      catch (e) { continue; }
      scanContentForImageSizes(txt, nameToImg, sizes);
    }
    return sizes;
  }

  // Nearest-neighbour downsample of an RGBA buffer (fallback for raw FlateDecode
  // pixel images; the DCTDecode path re-decodes at the target size via canvas, which
  // resamples with smoothing). Only ever called to shrink, never to enlarge.
  function resizeRgbaNearest(rgba, w, h, tw, th) {
    const out = new Uint8Array(tw * th * 4);
    for (let y = 0; y < th; y++) {
      const sy = Math.min(h - 1, Math.floor((y * h) / th));
      for (let x = 0; x < tw; x++) {
        const sx = Math.min(w - 1, Math.floor((x * w) / tw));
        const si = (sy * w + sx) * 4, di = (y * tw + x) * 4;
        out[di] = rgba[si]; out[di+1] = rgba[si+1]; out[di+2] = rgba[si+2]; out[di+3] = rgba[si+3];
      }
    }
    return out;
  }

  // Nearest-neighbour downsample of a single-channel (grey) buffer.
  function resizeGrayNearest(g, w, h, tw, th) {
    const out = new Uint8Array(tw * th);
    for (let y = 0; y < th; y++) {
      const sy = Math.min(h - 1, Math.floor((y * h) / th));
      for (let x = 0; x < tw; x++) {
        const sx = Math.min(w - 1, Math.floor((x * w) / tw));
        out[y * tw + x] = g[sy * w + sx];
      }
    }
    return out;
  }

  // Downsample a soft-mask image (the DeviceGray /SMask of a base image) to tw×th so it
  // stays the same size as the base after the base is downsampled. A base/mask size
  // mismatch makes Illustrator mis-scale the mask — the image then renders half-clipped
  // or vanishes. Re-encodes the mask as FlateDecode grey and rewrites /Width /Height /
  // Length. Returns false (leaving the mask untouched) if it can't be decoded, so the
  // caller can keep the base at full size and preserve the match.
  async function downsampleGrayImage(obj, tw, th) {
    if (!obj || obj.type !== 'stream') return false;
    const wm = obj.dict.match(/\/Width\s+(\d+)/), hm = obj.dict.match(/\/Height\s+(\d+)/);
    if (!wm || !hm) return false;
    const w = parseInt(wm[1]), h = parseInt(hm[1]); if (!w || !h) return false;
    if (tw >= w && th >= h) return true;   // already no larger than the target
    let gray = null;
    try {
      if (/\/DCTDecode\b/.test(obj.dict)) {
        const rgba = await decodeImageToRgba(obj.streamRaw, tw, th, 'image/jpeg');
        gray = new Uint8Array(tw * th);
        for (let i = 0, j = 0; i < gray.length; i++, j += 4) gray[i] = rgba[j];
      } else if (obj.isFlate) {
        const d = await inflateBuf(obj.streamRaw);
        if (d.length === w * h) gray = resizeGrayNearest(d, w, h, tw, th);
        else if (d.length === w * h * 4) { const g0 = new Uint8Array(w * h); for (let i = 0, j = 0; i < g0.length; i++, j += 4) g0[i] = d[j]; gray = resizeGrayNearest(g0, w, h, tw, th); }
      }
    } catch (e) { gray = null; }
    if (!gray) return false;
    obj.streamRaw = await deflateBuf(gray);
    obj.dict = obj.dict.replace(/\/Width\s+\d+/, '/Width ' + tw);
    obj.dict = obj.dict.replace(/\/Height\s+\d+/, '/Height ' + th);
    obj.dict = obj.dict.replace(/\/Filter\s*(\/\w+|\[[^\]]*\])/, '/Filter /FlateDecode');
    obj.dict = obj.dict.replace(/\/DecodeParms\s*(<<[\s\S]*?>>|\[[^\]]*\]|\d+\s+0\s+R)/, '');
    obj.dict = obj.dict.replace(/\/Length\s+\d+(\s+0\s+R)?/, '/Length ' + obj.streamRaw.length);
    return true;
  }

  // Convert each RGB image XObject to a FlateDecode /DeviceCMYK image, preserving its
  // /SMask. Figma embeds photos as DCTDecode (JPEG), so decode via the browser (it
  // handles JPEG and PNG alike) rather than assuming raw FlateDecode pixels. If an
  // image can't be decoded it is left untouched — it still renders (in RGB) rather
  // than being dropped or corrupted. Returns the count of images that could NOT be
  // converted, so the caller can WARN the user (an RGB image in a "CMYK" print file
  // must never pass silently).
  //
  // `ds`, when set to { dpi, sizes }, downsamples any image finer than `dpi` at its
  // on-page size down to `dpi` (see imageDisplaySizes) before the CMYK pass — the
  // image is re-decoded/resampled to the smaller pixel grid and its /Width /Height
  // are rewritten. Images with no known placement, or already at/under `dpi`, are
  // left at full resolution (downsampling never enlarges).
  async function convertRgbImagesToCmyk(objs, imgNums, colorLookup, ds) {
    let unconverted = 0;
    for (const n of imgNums) {
      const obj = objs[n]; if (!obj || obj.type !== 'stream') { unconverted++; continue; }
      const wm = obj.dict.match(/\/Width\s+(\d+)/), hm = obj.dict.match(/\/Height\s+(\d+)/);
      if (!wm || !hm) { unconverted++; continue; }
      const w = parseInt(wm[1]), h = parseInt(hm[1]); if (!w || !h) { unconverted++; continue; }
      // Target pixel size: shrink to the requested DPI at the image's on-page size.
      // Never enlarge (downsampling only) and never drop below 1px.
      let tw = w, th = h;
      if (ds && ds.dpi > 0 && ds.sizes && ds.sizes[n]) {
        const dw = Math.max(1, Math.round((ds.sizes[n].wPt / 72) * ds.dpi));
        const dh = Math.max(1, Math.round((ds.sizes[n].hPt / 72) * ds.dpi));
        if (dw < w) tw = dw;
        if (dh < h) th = dh;
      }
      let shrink = (tw !== w || th !== h);
      // A base image and its soft-mask image must stay the same size, or Illustrator
      // mis-scales the mask (image half-clipped or invisible). Resize the mask to match;
      // if it can't be resized, keep the base at full size so the pair stays consistent.
      if (shrink) {
        const smRef = obj.dict.match(/\/SMask\s+(\d+)\s+0\s+R/);
        if (smRef && !(await downsampleGrayImage(objs[+smRef[1]], tw, th))) { tw = w; th = h; shrink = false; }
      }
      let rgba = null;
      try {
        if (/\/DCTDecode\b/.test(obj.dict)) rgba = await decodeImageToRgba(obj.streamRaw, tw, th, 'image/jpeg');
        else if (obj.isFlate) {
          const d = await inflateBuf(obj.streamRaw);
          let full = null;
          if (d.length === w * h * 4) full = d;
          else if (d.length === w * h * 3) { full = new Uint8Array(w * h * 4); for (let i = 0, j = 0; i < d.length; i += 3, j += 4) { full[j] = d[i]; full[j+1] = d[i+1]; full[j+2] = d[i+2]; full[j+3] = 255; } }
          if (full) rgba = shrink ? resizeRgbaNearest(full, w, h, tw, th) : full;
        }
      } catch (e) { rgba = null; }
      if (!rgba) { unconverted++; continue; } // undecodable → left intact (RGB); warn the user
      const cmyk = new Uint8Array(tw * th * 4);
      for (let p = 0, q = 0; p < tw * th * 4; p += 4, q += 4) {
        const c = rgbPixelToCmyk(rgba[p], rgba[p+1], rgba[p+2], colorLookup);
        cmyk[q] = c[0]; cmyk[q+1] = c[1]; cmyk[q+2] = c[2]; cmyk[q+3] = c[3];
      }
      obj.streamRaw = await deflateBuf(cmyk);
      obj.dict = obj.dict.replace(/\/ColorSpace\s*(\/\w+|\[[^\]]*\]|\d+\s+0\s+R)/, '/ColorSpace /DeviceCMYK');
      obj.dict = obj.dict.replace(/\/Filter\s*(\/\w+|\[[^\]]*\])/, '/Filter /FlateDecode');
      obj.dict = obj.dict.replace(/\/DecodeParms\s*(<<[\s\S]*?>>|\[[^\]]*\]|\d+\s+0\s+R)/, '');
      obj.dict = obj.dict.replace(/\/Decode\s*\[[^\]]*\]/, '');
      if (shrink) {
        obj.dict = obj.dict.replace(/\/Width\s+\d+/, '/Width ' + tw);
        obj.dict = obj.dict.replace(/\/Height\s+\d+/, '/Height ' + th);
      }
      obj.dict = obj.dict.replace(/\/Length\s+\d+(\s+0\s+R)?/, '/Length ' + obj.streamRaw.length);
    }
    return unconverted;
  }

  // Add crop (trim) marks to a parsed PDF for print. The Figma frame IS the trim size,
  // so a mark sits just outside each corner — offset `bleedPt` out from the trim and
  // running a further 18pt (¼") outward — and the page (MediaBox) grows by bleed + mark
  // length on every side, with /TrimBox and /BleedBox declared. Marks are stroked in
  // registration colour (all four plates) as clean DeviceCMYK, so this MUST run after the
  // colour passes. One content stream is added per page; the page dict is edited in place.
  // Mutates `objs` and `nums` so the rebuild writes and indexes the new stream. Returns
  // how many pages got marks.
  // Apply print bleed and/or crop marks. These are INDEPENDENT: bleed extends the page
  // (BleedBox) whether or not marks are drawn, and crop marks can be drawn with zero bleed
  // (right at the trim). The trim box is the frame's own cut line (may be smaller than the
  // page box when art spills outside the frame).
  function addPrintMarks(objs, nums, bleedPt, trimBox, cropMarks, regMarks, pageInfo, piLeft, piRight) {
    const b = Math.max(0, bleedPt || 0);
    const LEN = 18, WGT = 0.25;
    const REG_R = 4, REG_CROSS = 13, REG_OFF = 13; // InDesign-style target: small circle, long crosshair reaching well past it
    let M = b;                                     // margin the page box must add on every side
    if (cropMarks) M = Math.max(M, b + LEN + 4);
    if (regMarks)  M = Math.max(M, b + REG_OFF + REG_CROSS);
    // Page info sits in the slug BELOW whatever marks are present, so it never overlaps them.
    if (pageInfo)  M = Math.max(M, b + Math.max(cropMarks ? LEN + 4 : 0, regMarks ? REG_OFF + REG_CROSS : 0) + 12);
    if (M <= 0) return 0;                          // nothing to do (no bleed, no marks)
    const f = (v) => (Math.round(v * 1000) / 1000).toString();
    const toBytes = (s) => { const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i) & 0xFF; return u; };
    const escPdf = (str) => String(str).replace(/[\\()]/g, (c) => '\\' + c);
    let added = 0;
    for (const num of [...nums]) {
      const obj = objs[num];
      if (!obj || obj.type !== 'plain') continue;
      if (!/\/Type\s*\/Page\b/.test(obj.body) || /\/Type\s*\/Pages\b/.test(obj.body)) continue;
      const mb = obj.body.match(/\/MediaBox\s*\[\s*([-\d.]+)\s+([-\d.]+)\s+([-\d.]+)\s+([-\d.]+)\s*\]/);
      if (!mb) continue;
      const mx0 = +mb[1], my0 = +mb[2], mx1 = +mb[3], my1 = +mb[4];
      const t = (trimBox && isFinite(trimBox.x0)) ? trimBox : { x0: mx0, y0: my0, x1: mx1, y1: my1 };
      let body = obj.body;
      // ── Clip the page content to the bleed box (trim ± bleed; when there is no bleed this
      // is the frame's own bounding box). Overflow beyond the bleed is dropped from the
      // export — Figma may not clip the frame's own overflow, so we do it here — which both
      // makes the output represent the selected frame (not the whole spilling artwork) and
      // keeps the mark margin clean, so crop / registration marks stay visible over dark art.
      // The marks are drawn OUTSIDE this clip so they are never clipped away themselves. ──
      const bx0 = t.x0 - b, by0 = t.y0 - b, bw = (t.x1 - t.x0) + 2 * b, bh = (t.y1 - t.y0) + 2 * b;
      const arr = body.match(/\/Contents\s*\[([^\]]*)\]/);
      const single = body.match(/\/Contents\s+(\d+)\s+0\s+R/);
      const origRefs = arr ? arr[1].trim() : (single ? `${single[1]} 0 R` : null);
      if (origRefs !== null) {
        // New objects take sequential numbers above the current max — one per mark stream.
        let nextNum = Math.max(...nums) + 1;
        const addStream = (raw) => { objs[nextNum] = { type: 'stream', dict: `<< /Length ${raw.length} >>`, streamRaw: raw }; nums.push(nextNum); return nextNum++; };
        const addObj = (bodyStr) => { objs[nextNum] = { type: 'plain', body: bodyStr }; nums.push(nextNum); return nextNum++; };
        const clipOpen = addStream(toBytes(`q ${f(bx0)} ${f(by0)} ${f(bw)} ${f(bh)} re W n\n`));
        const clipClose = addStream(toBytes(`Q\n`));
        let contents = `${clipOpen} 0 R ${origRefs} ${clipClose} 0 R`;
        // ── Crop marks (optional): 8 corner lines, offset out from the trim by the bleed ──
        if (cropMarks) {
          const seg = [];
          const h = (xa, xb, y) => seg.push(`${f(xa)} ${f(y)} m ${f(xb)} ${f(y)} l`); // horizontal
          const v = (x, ya, yb) => seg.push(`${f(x)} ${f(ya)} m ${f(x)} ${f(yb)} l`); // vertical
          h(t.x0 - b, t.x0 - b - LEN, t.y0); h(t.x0 - b, t.x0 - b - LEN, t.y1);  // left of BL / TL
          h(t.x1 + b, t.x1 + b + LEN, t.y0); h(t.x1 + b, t.x1 + b + LEN, t.y1);  // right of BR / TR
          v(t.x0, t.y0 - b, t.y0 - b - LEN); v(t.x1, t.y0 - b, t.y0 - b - LEN);  // below BL / BR
          v(t.x0, t.y1 + b, t.y1 + b + LEN); v(t.x1, t.y1 + b, t.y1 + b + LEN);  // above TL / TR
          contents += ` ${addStream(toBytes(`q 1 1 1 1 K ${f(WGT)} w\n${seg.join('\n')}\nS Q\n`))} 0 R`;
        }
        // ── Registration marks (optional): a target (circle + crosshair) centred on each side,
        // out past the bleed, stroked in registration colour so it prints on every plate. ──
        if (regMarks) {
          const seg = [];
          const cx = (t.x0 + t.x1) / 2, cy = (t.y0 + t.y1) / 2;
          const k = REG_R * 0.5523;                 // cubic-bézier handle length for a circle
          const target = (x, y) => {
            seg.push(`${f(x + REG_R)} ${f(y)} m`);
            seg.push(`${f(x + REG_R)} ${f(y + k)} ${f(x + k)} ${f(y + REG_R)} ${f(x)} ${f(y + REG_R)} c`);
            seg.push(`${f(x - k)} ${f(y + REG_R)} ${f(x - REG_R)} ${f(y + k)} ${f(x - REG_R)} ${f(y)} c`);
            seg.push(`${f(x - REG_R)} ${f(y - k)} ${f(x - k)} ${f(y - REG_R)} ${f(x)} ${f(y - REG_R)} c`);
            seg.push(`${f(x + k)} ${f(y - REG_R)} ${f(x + REG_R)} ${f(y - k)} ${f(x + REG_R)} ${f(y)} c`);
            seg.push(`${f(x - REG_CROSS)} ${f(y)} m ${f(x + REG_CROSS)} ${f(y)} l`);   // horizontal crosshair
            seg.push(`${f(x)} ${f(y - REG_CROSS)} m ${f(x)} ${f(y + REG_CROSS)} l`);   // vertical crosshair
          };
          target(cx, t.y1 + b + REG_OFF);   // top
          target(cx, t.y0 - b - REG_OFF);   // bottom
          target(t.x0 - b - REG_OFF, cy);   // left
          target(t.x1 + b + REG_OFF, cy);   // right
          contents += ` ${addStream(toBytes(`q 1 1 1 1 K ${f(WGT)} w\n${seg.join('\n')}\nS Q\n`))} 0 R`;
        }
        // ── Page information (optional): file name (left) + timestamp (right) in the bottom
        // slug, the way InDesign prints it. Needs a font — declare the standard Helvetica
        // (no embedding needed) and register it in the page's resources as /HB. ──
        if (pageInfo && (piLeft || piRight)) {
          const resRef = body.match(/\/Resources\s+(\d+)\s+0\s+R/);
          const resObj = resRef ? objs[+resRef[1]] : null;
          if (resObj && resObj.type === 'plain') {
            const fontNum = addObj('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>');
            resObj.body = /\/Font\s*<</.test(resObj.body)
              ? resObj.body.replace(/\/Font\s*<</, `/Font << /HB ${fontNum} 0 R`)
              : resObj.body.replace('<<', `<< /Font << /HB ${fontNum} 0 R >>`);
            const SZ = 6, ly = t.y0 - M + 5;                 // 6pt text, near the very bottom edge (below the marks)
            let ops = `q 1 1 1 1 k BT /HB ${SZ} Tf\n`;
            if (piLeft)  ops += `1 0 0 1 ${f(t.x0)} ${f(ly)} Tm (${escPdf(piLeft)}) Tj\n`;
            if (piRight) { const rw = SZ * 0.5 * String(piRight).length; ops += `1 0 0 1 ${f(t.x1 - rw)} ${f(ly)} Tm (${escPdf(piRight)}) Tj\n`; }
            ops += `ET Q\n`;
            contents += ` ${addStream(toBytes(ops))} 0 R`;
          }
        }
        body = arr
          ? body.replace(/\/Contents\s*\[([^\]]*)\]/, `/Contents [ ${contents} ]`)
          : body.replace(/\/Contents\s+\d+\s+0\s+R/, `/Contents [ ${contents} ]`);
      }
      // ── Page box = trim ± bleed ± mark length. The real clip above bounds the artwork to
      // the bleed box; the MediaBox then frames that plus the room the marks need. ──
      const nx0 = t.x0 - M, ny0 = t.y0 - M;
      const nx1 = t.x1 + M, ny1 = t.y1 + M;
      body = body.replace(/\/MediaBox\s*\[[^\]]*\]/,
        `/MediaBox [ ${f(nx0)} ${f(ny0)} ${f(nx1)} ${f(ny1)} ]`);
      if (!/\/TrimBox/.test(body))
        body = body.replace(/\/MediaBox\s*\[[^\]]*\]/, (m) =>
          `${m}\n     /TrimBox [ ${f(t.x0)} ${f(t.y0)} ${f(t.x1)} ${f(t.y1)} ]` +
          `\n     /BleedBox [ ${f(t.x0 - b)} ${f(t.y0 - b)} ${f(t.x1 + b)} ${f(t.y1 + b)} ]`);
      obj.body = body;
      added++;
    }
    return added;
  }

  // ── Vector PDF RGB → CMYK converter ────────────────────────────────
  // Takes Figma's native vector PDF and converts ICCBased RGB colors to
  // DeviceCMYK while preserving paths, text, images, and structure.
  async function convertPdfToCmyk(pdfBytesArr, colorLookup, opts) {
    const raw=new Uint8Array(pdfBytesArr), N=raw.length;
    function b2s(b,f,t){let s='';for(let i=f||0;i<(t||b.length);i++)s+=String.fromCharCode(b[i]);return s;}
    function s2b(s){const b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i)&0xFF;return b;}
    const pdf=b2s(raw);

    // ── Parse xref ──
    const sxm=pdf.lastIndexOf('startxref');
    if(sxm<0)throw new Error('Invalid PDF');
    const xrefOff=parseInt(pdf.substring(sxm+9).trim());
    const xrefArea=pdf.substring(xrefOff);
    const offsets={};

    if(xrefArea.trimStart().startsWith('xref')){
      const xb=xrefArea.substring(xrefArea.indexOf('\n')+1);
      const secRe=/(\d+)\s+(\d+)\s*[\r\n]+((?:\d{10}\s+\d{5}\s+[fn][\s\r\n]+)+)/g;
      let sm;
      while((sm=secRe.exec(xb))!==null){
        const first=parseInt(sm[1]),cnt=parseInt(sm[2]),lines=sm[3].trim().split(/\r?\n/);
        for(let i=0;i<Math.min(cnt,lines.length);i++){
          const p=lines[i].trim().split(/\s+/);
          if(p[2]==='n'&&(first+i)>0)offsets[first+i]=parseInt(p[0]);
        }
      }
    }else{
      // Fallback: scan for object markers
      const oRe=/(\d+)\s+0\s+obj\b/g;let om;
      while((om=oRe.exec(pdf))!==null)offsets[parseInt(om[1])]=om.index;
    }

    const tmRe=/trailer\s*<<([\s\S]*?)>>/;
    const tMatch=tmRe.exec(xrefArea)||tmRe.exec(pdf);
    const trailerDict=tMatch?tMatch[1]:' /Root 1 0 R /Size 1';

    // ── Parse objects ──
    const nums=Object.keys(offsets).map(Number).sort((a,b)=>offsets[a]-offsets[b]);
    const bounds=nums.map(n=>offsets[n]).concat(xrefOff).sort((a,b)=>a-b);
    function nextB(off){for(const b of bounds)if(b>off)return b;return N;}

    const objs={};
    for(const num of nums){
      const off=offsets[num],end=nextB(off);
      const chunk=pdf.substring(off,end);
      const hm=chunk.match(/^\d+\s+\d+\s+obj[\s\r\n]*/);
      if(!hm)continue;
      const bS=hm[0].length,eoI=chunk.lastIndexOf('endobj');
      const body=chunk.substring(bS,eoI>0?eoI:undefined).trim();

      const stIdx=body.indexOf('stream');
      if(stIdx>=0){
        const dict=body.substring(0,stIdx);
        const ch1=body.charCodeAt(stIdx+6),ch2=body.charCodeAt(stIdx+7);
        const dO=(ch1===13&&ch2===10)?stIdx+8:(ch1===10||ch1===13)?stIdx+7:stIdx+6;
        let len=null;
        const lr=dict.match(/\/Length\s+(\d+)\s+0\s+R/);
        if(lr){
          const ln=parseInt(lr[1]);
          if(offsets[ln]!=null){const lc=pdf.substring(offsets[ln],offsets[ln]+80);const lv=lc.match(/obj\s*[\r\n]*\s*(\d+)/);if(lv)len=parseInt(lv[1]);}
        }
        if(len==null){const ld=dict.match(/\/Length\s+(\d+)/);if(ld)len=parseInt(ld[1]);}
        if(len!=null){
          const abs=off+bS+dO;
          objs[num]={dict,streamRaw:raw.slice(abs,abs+len),isFlate:/\/FlateDecode/.test(dict),type:'stream'};
        }else{objs[num]={body,type:'plain'};}
      }else{objs[num]={body,type:'plain'};}
    }

    // ── Classify objects ──
    const iccRgb=new Set();
    for(const[n,o]of Object.entries(objs))
      if(o.type==='stream'&&/\/N\s+3\b/.test(o.dict))iccRgb.add(+n);
    const {allImg,imgNums,imgCsRefs}=classifyImages(objs,iccRgb);

    // ── Collect SMask Form XObject refs ──
    // Mask XObjects referenced by /SMask << /G N 0 R >> must be kept intact:
    // their Group must not be stripped (needed for correct mask compositing)
    // and their streams must not be color-converted (DeviceGray, not CMYK).
    const smaskNums=new Set();
    for(const[,obj]of Object.entries(objs)){
      const body=obj.type==='stream'?obj.dict:(obj.body||'');
      for(const m of body.matchAll(/\/SMask\s*<<[^>]*\/G\s+(\d+)\s+0\s+R/g))
        smaskNums.add(+m[1]);
    }

    // ── Convert SMask references to explicit W n clip paths ──
    // Modern Illustrator silently drops Figma's /SMask transparency clips
    // when opening PDFs (Preview honors them, Illustrator doesn't). Convert
    // each `/Name gs` that activates an SMask into an inline clip path so
    // Illustrator sees a native Clip Path and clips correctly.
    //
    // Strategy: scan every object body/dict globally for ExtGState entries
    // (inline or indirect) that contain /SMask << /G N 0 R >>, mapping
    // resource names → mask-XObject numbers. Then in every content stream
    // (page contents OR Form XObject), replace `/Name gs` with the mask's
    // path operators ending in `W n`.

    // Step 1: ExtGState plain-object → mask XObject number
    const extGSToMask=new Map();
    for(const[nS,obj]of Object.entries(objs)){
      const text=obj.type==='plain'?(obj.body||''):obj.dict;
      const m=text.match(/\/SMask\s*<<[^>]*\/G\s+(\d+)\s+0\s+R/);
      if(m&&!/\/SMask\s*<<[^>]*\/G\s+(\d+)\s+0\s+R[\s\S]*\/SMask/.test(text)){
        if(obj.type==='plain')extGSToMask.set(+nS,+m[1]);
      }
    }

    // Step 2: per-stream "name → mask XObject number" maps.
    //
    // CRITICAL: resource names like /E1 are LOCAL to each Form XObject's
    // (or Page's) /Resources dict — the page can use /E1 for one mask and
    // obj 22 can use /E1 for a totally different mask. Building a single
    // global map clobbers obj 22's scope with the page's, so the swatch
    // inside obj 22 gets clipped by the frame's mask rather than its own.
    //
    // Build the name→mask map fresh per processed stream using only that
    // stream's own Resources.
    function balancedDict(t,si){
      if(t.substr(si,2)!=='<<')return null;
      let d=0,i=si;
      while(i<t.length-1){
        if(t[i]==='<'&&t[i+1]==='<'){d++;i+=2;}
        else if(t[i]==='>'&&t[i+1]==='>'){d--;i+=2;if(d===0)return t.substring(si,i);}
        else i++;
      }
      return null;
    }
    function getResourcesText(dictOrBody){
      const re=/\/Resources\b/.exec(dictOrBody);
      if(!re)return '';
      let i=re.index+10;
      while(i<dictOrBody.length&&/\s/.test(dictOrBody[i]))i++;
      if(dictOrBody.substr(i,2)==='<<')return balancedDict(dictOrBody,i)||'';
      const mm=dictOrBody.substr(i,30).match(/^(\d+)\s+0\s+R/);
      if(mm){const t=objs[+mm[1]];return t&&t.type==='plain'?(t.body||''):'';}
      return '';
    }
    function buildScopedNameToMask(resText){
      const map=new Map();
      if(!resText)return map;
      for(const m of resText.matchAll(/\/(\w+)\s*<<[^<>]*?\/SMask\s*<<[^<>]*?\/G\s+(\d+)\s+0\s+R/g))
        map.set(m[1],+m[2]);
      for(const m of resText.matchAll(/\/(\w+)\s+(\d+)\s+0\s+R\b/g))
        if(extGSToMask.has(+m[2]))map.set(m[1],extGSToMask.get(+m[2]));
      return map;
    }
    // For page content streams (which don't carry their own Resources), map
    // each /Contents stream to its parent Page's Resources text up-front.
    const streamToResources=new Map();
    for(const[,obj]of Object.entries(objs)){
      if(obj.type!=='plain')continue;
      if(!/\/Type\s*\/Page\b/.test(obj.body))continue;
      if(/\/Type\s*\/Pages\b/.test(obj.body))continue;
      const cm=obj.body.match(/\/Contents\s+(\d+)\s+0\s+R/);
      const cmArr=obj.body.match(/\/Contents\s*\[\s*((?:\d+\s+0\s+R\s*)+)\]/);
      const contentNums=[];
      if(cm)contentNums.push(+cm[1]);
      if(cmArr)for(const mm of cmArr[1].matchAll(/(\d+)\s+0\s+R/g))contentNums.push(+mm[1]);
      if(!contentNums.length)continue;
      const resText=getResourcesText(obj.body);
      for(const cn of contentNums)streamToResources.set(cn,resText);
    }

    // Helper: extract a clip path from a mask Form XObject's stream.
    //
    // Walks the mask body, keeps `cm` + path operators, replaces each
    // painting op with `W n`, and emits the cumulative inverse `cm` at
    // the end so the transform applied by the mask's own `cm` ops does
    // NOT leak onto subsequent content drawn under the clip.
    //
    // Without that inverse, `/X_ Do` after the clip gets drawn translated
    // by whatever the mask was translated by — content appears offset
    // inside the clip region. We saw this in Frame 79 (mask cm 32,32).
    //
    // Fallback: if the mask has no painted shapes (e.g. `q /E_ gs /X_ Do Q`
    // — Figma's nested-mask pattern), recurse via `/Name gs` (inner SMask)
    // first, then `/Name Do`. Depth-limited cycle guard.
    function pdfMulCm(B,A){
      return[B[0]*A[0]+B[1]*A[2],B[0]*A[1]+B[1]*A[3],B[2]*A[0]+B[3]*A[2],B[2]*A[1]+B[3]*A[3],B[4]*A[0]+B[5]*A[2]+A[4],B[4]*A[1]+B[5]*A[3]+A[5]];
    }
    function pdfInvCm(m){
      const det=m[0]*m[3]-m[1]*m[2];
      if(Math.abs(det)<1e-12)return null;
      const id=1/det;
      return[m[3]*id,-m[1]*id,-m[2]*id,m[0]*id,(m[2]*m[5]-m[3]*m[4])*id,(m[1]*m[4]-m[0]*m[5])*id];
    }
    function pdfFmtN(v){const s=Number(v).toFixed(6);return s.replace(/0+$/,'').replace(/\.$/,'');}
    async function maskToClipPath(maskNum,depth=0,visited=new Set()){
      if(depth>4||visited.has(maskNum))return null;
      visited.add(maskNum);
      const mask=objs[maskNum];
      if(!mask||mask.type!=='stream')return null;
      let body;
      try{body=mask.isFlate?b2s(await inflateBuf(mask.streamRaw)):b2s(mask.streamRaw);}
      catch(e){return null;}
      const PATH_OPS=new Set(['m','l','c','v','y','h','re']);
      const PAINT_OPS=new Set(['f','F','f*','B','B*','b','b*','S','s']);
      const lines=body.split(/\r?\n/);
      const hasPaint=lines.some(l=>{const t=l.trim().split(/\s+/);return t.length&&PAINT_OPS.has(t[t.length-1]);});
      if(hasPaint){
        const out=[];
        let composedCm=[1,0,0,1,0,0];
        for(let line of lines){
          line=line.trim();
          if(!line)continue;
          const tokens=line.split(/\s+/);
          const op=tokens[tokens.length-1];
          if(op==='cm'&&tokens.length===7){
            const m=tokens.slice(0,6).map(parseFloat);
            if(m.every(v=>!isNaN(v))){composedCm=pdfMulCm(m,composedCm);out.push(line);}
          }else if(PATH_OPS.has(op)){
            out.push(line);
          }else if(PAINT_OPS.has(op)){
            out.push('W n');
          }
        }
        // Emit inverse cm so /X_ Do after the clip is drawn at the original
        // CTM (clip is preserved in device coords by W n; only the user-space
        // CTM is reverted).
        const inv=pdfInvCm(composedCm);
        if(inv)out.push(`${pdfFmtN(inv[0])} ${pdfFmtN(inv[1])} ${pdfFmtN(inv[2])} ${pdfFmtN(inv[3])} ${pdfFmtN(inv[4])} ${pdfFmtN(inv[5])} cm`);
        return out.join('\n');
      }
      // No painted shapes — try recursion through this mask's own resources.
      const xobjMap=new Map();
      const extGSMap=new Map();
      const xMatch=mask.dict.match(/\/XObject\s*<<([^<>]*)>>/);
      if(xMatch)for(const m of xMatch[1].matchAll(/\/(\w+)\s+(\d+)\s+0\s+R/g))xobjMap.set(m[1],+m[2]);
      const eMatch=mask.dict.match(/\/ExtGState\s*<<([\s\S]*?)>>\s*(?:\/[A-Z]|>>)/);
      if(eMatch)for(const m of eMatch[1].matchAll(/\/(\w+)\s*<<[^<>]*?\/SMask\s*<<[^<>]*?\/G\s+(\d+)\s+0\s+R/g))extGSMap.set(m[1],+m[2]);
      for(const m of body.matchAll(/\/(\w+)\s+gs\b/g)){
        const target=extGSMap.get(m[1]);
        if(target){const nested=await maskToClipPath(target,depth+1,visited);if(nested)return nested;}
      }
      for(const m of body.matchAll(/\/(\w+)\s+Do\b/g)){
        const target=xobjMap.get(m[1]);
        if(target){const nested=await maskToClipPath(target,depth+1,visited);if(nested)return nested;}
      }
      return null;
    }

    // Step 3: rewrite every content stream that uses a masking gs, using
    // the name→mask map scoped to THAT stream's own Resources.
    for(const[nS,obj]of Object.entries(objs)){
      if(obj.type!=='stream')continue;
      const n=+nS;
      if(iccRgb.has(n)||allImg.has(n)||smaskNums.has(n))continue;
      // Pick the right Resources text for this stream:
      //  - Form XObject → its own /Resources (inline or indirect)
      //  - Page content stream → the parent Page's /Resources (pre-mapped)
      let resText='';
      if(/\/Subtype\s*\/Form/.test(obj.dict))resText=getResourcesText(obj.dict);
      else if(streamToResources.has(n))resText=streamToResources.get(n);
      const scopedNameToMask=buildScopedNameToMask(resText);
      if(scopedNameToMask.size===0)continue;
      let body;
      try{body=obj.isFlate?b2s(await inflateBuf(obj.streamRaw)):b2s(obj.streamRaw);}
      catch(e){continue;}
      let modified=false;
      for(const[name,maskNum]of scopedNameToMask){
        const re=new RegExp('\\/'+name+'\\b\\s+gs\\b','g');
        if(!re.test(body))continue;
        const clip=await maskToClipPath(maskNum);
        if(!clip)continue;
        body=body.replace(re,clip);
        modified=true;
      }
      if(!modified)continue;
      const nb=s2b(body);
      obj.streamRaw=obj.isFlate?await deflateBuf(nb):nb;
      obj.dict=obj.dict.replace(/\/Length\s+\d+(\s+0\s+R)?/,'/Length '+obj.streamRaw.length);
    }

    // ── Replace /Group transparency with explicit BBox clip ──
    // Modern Illustrator misreads Figma's /Group << /S /Transparency >> on
    // every Form XObject and hides all content ("broken Clip Group" bug).
    // Stripping /Group alone restores visibility but kills the implicit
    // BBox clip that "Clip content" frames depend on. Solution: inject an
    // explicit `q [BBox] re W n ... Q` wrapper around each Form XObject's
    // stream, THEN strip /Group. Content stays visible and stays clipped.
    for(const[nS,obj]of Object.entries(objs)){
      if(obj.type!=='stream')continue;
      const n=+nS;
      if(iccRgb.has(n)||allImg.has(n)||smaskNums.has(n))continue;
      if(!/\/Subtype\s*\/Form/.test(obj.dict))continue;
      if(!/\/Group\s*<<[^>]*\/S\s*\/Transparency/.test(obj.dict))continue;
      const bbm=obj.dict.match(/\/BBox\s*\[\s*([-\d.]+)\s+([-\d.]+)\s+([-\d.]+)\s+([-\d.]+)\s*\]/);
      if(!bbm)continue;
      const x0=+bbm[1],y0=+bbm[2],x1=+bbm[3],y1=+bbm[4];
      const w=x1-x0,h=y1-y0;
      let body;
      try{body=obj.isFlate?b2s(await inflateBuf(obj.streamRaw)):b2s(obj.streamRaw);}
      catch(e){continue;}
      const wrapped=`q\n${x0} ${y0} ${w} ${h} re W n\n${body}\nQ`;
      const nb=s2b(wrapped);
      obj.streamRaw=obj.isFlate?await deflateBuf(nb):nb;
      obj.dict=obj.dict.replace(/\/Group\s*<<[^>]*>>\s*/g,'');
      obj.dict=obj.dict.replace(/\/Length\s+\d+(\s+0\s+R)?/,'/Length '+obj.streamRaw.length);
    }

    // ── Strip only /SMask /None from ExtGState objects ──
    // /None means "no mask" in PDF spec — safe to drop. Inline << >> SMask
    // dicts MUST be preserved when they contain a /G N 0 R reference, since
    // that IS Figma's clipping mask. The previous broad-strip regex was
    // silently removing those references and killing clip behavior.
    const sMaskRe=/\/SMask\s+\/None\b\s*/g;
    for(const[,obj]of Object.entries(objs)){
      if(obj.type==='plain'&&/\/SMask\s+\/None/.test(obj.body))
        obj.body=obj.body.replace(sMaskRe,'');
      else if(obj.type==='stream'&&/\/SMask\s+\/None/.test(obj.dict))
        obj.dict=obj.dict.replace(sMaskRe,'');
    }

    // ── Strip ICC RGB refs from non-image objects (mask Form XObjects etc.) ──
    // Preserved SMask Form XObjects may still reference ICC RGB profiles in their
    // dicts, causing Illustrator's "mixed color mode" dialog. Replace with DeviceGray.
    // (Only the dict is touched here — stream content is left intact for mask XObjects.)
    for(const[nS,obj]of Object.entries(objs)){
      const n=+nS;
      if(allImg.has(n)||imgCsRefs.has(n)||iccRgb.has(n))continue;
      const k=obj.type==='stream'?'dict':'body';
      for(const i of iccRgb){
        obj[k]=obj[k].replace(new RegExp('\\[\\s*/ICCBased\\s+'+i+'\\s+0\\s+R\\s*\\]','g'),'/DeviceGray');
        obj[k]=obj[k].replace(new RegExp('/CS\\s+'+i+'\\s+0\\s+R','g'),'/CS /DeviceGray');
      }
    }

    // ── Convert content stream colors ──
    function fmtF(v){if(v===0)return'0';if(v===1)return'1';return v.toFixed(5).replace(/0+$/,'').replace(/\.$/,'');}
    function cvtColors(txt){
      // Switch named color space selections to DeviceCMYK so transparency
      // groups that inherit the current CS get CMYK (not ICCBased RGB).
      // Without this, /Group << /S /Transparency >> (no /CS) inherits RGB
      // from the parent context but content uses k/K → blending mismatch.
      txt=txt.replace(/\/C\d+\s+cs\b/g,'/DeviceCMYK cs');
      txt=txt.replace(/\/C\d+\s+CS\b/g,'/DeviceCMYK CS');
      // All RGB color ops → k/K (direct DeviceCMYK, no CS dependency)
      txt=txt.replace(/([\d.]+)\s+([\d.]+)\s+([\d.]+)\s+(scn|SCN|rg|RG)\b/g,(m,rs,gs,bs,op)=>{
        const r=parseFloat(rs),g=parseFloat(gs),b=parseFloat(bs);
        if(isNaN(r)||isNaN(g)||isNaN(b)||r>1.001||g>1.001||b>1.001)return m;
        const[c,mk,y,kv]=rgbFloatToCmykFloat(r,g,b,colorLookup);
        const isStroke=(op==='SCN'||op==='RG');
        return`${fmtF(c)} ${fmtF(mk)} ${fmtF(y)} ${fmtF(kv)} ${isStroke?'K':'k'}`;
      });
      // 1-arg gray → k/K
      txt=txt.replace(/([\d.]+)\s+([gG])\b/g,(m,gs,op)=>{
        const v=parseFloat(gs);if(isNaN(v)||v>1.001)return m;
        return`0 0 0 ${fmtF(1-v)} ${op==='g'?'k':'K'}`;
      });
      return txt;
    }

    for(const[nS,obj]of Object.entries(objs)){
      const n=+nS;
      if(obj.type!=='stream'||allImg.has(n)||iccRgb.has(n)||smaskNums.has(n))continue;
      let txt;
      try{txt=obj.isFlate?b2s(await inflateBuf(obj.streamRaw)):b2s(obj.streamRaw);}catch(e){continue;}
      if(!/(scn|SCN|rg|RG)\b/.test(txt)&&!/[\d.]+\s+[gG]\b/.test(txt)&&!/\/C\d+\s+[cC][sS]\b/.test(txt))continue;
      const cvt=cvtColors(txt);
      const nb=s2b(cvt);
      obj.streamRaw=obj.isFlate?await deflateBuf(nb):nb;
      obj.dict=obj.dict.replace(/\/Length\s+\d+(\s+0\s+R)?/,'/Length '+obj.streamRaw.length);
    }

    // ── Convert RGB raster images → DeviceCMYK (optionally downsampling to a DPI) ──
    let ds=null;
    if(opts&&opts.downsample&&opts.downsampleDpi>0)
      ds={dpi:opts.downsampleDpi,sizes:await imageDisplaySizes(objs,allImg)};
    window._lastPdfImagesUnconverted = await convertRgbImagesToCmyk(objs,imgNums,colorLookup,ds);

    // ── Crop / trim marks (print) — added last so they emit as clean DeviceCMYK ──
    if(opts&&(opts.cropMarks||opts.regMarks||opts.pageInfo||opts.bleedPt>0))addPrintMarks(objs,nums,opts.bleedPt,opts.trimBox,opts.cropMarks,opts.regMarks,opts.pageInfo,opts.pageInfoLeft,opts.pageInfoRight);

    // ── Rebuild PDF ──
    const parts=[],newOff={};
    // Set version to PDF 1.4 — the highest version fully supported by
    // Illustrator CS6. 1.4 introduced transparency, so all Figma features
    // are representable. Using a higher version caused CS6 to choke on
    // cross-reference streams and advanced transparency operators.
    const hEnd=pdf.indexOf('\n',pdf.indexOf('\n')+1)+1;
    const hdrStr=pdf.substring(0,hEnd).replace(/%PDF-[\d.]+/,'%PDF-1.4');
    parts.push(s2b(hdrStr));
    const maxObj=Math.max(...nums);

    for(const num of nums){
      const obj=objs[num];if(!obj)continue;
      newOff[num]=parts.reduce((s,p)=>s+p.length,0);
      if(obj.type==='stream'){
        parts.push(s2b(num+' 0 obj\n'+obj.dict+'\nstream\n'));
        parts.push(obj.streamRaw);
        parts.push(s2b('\nendstream\nendobj\n'));
      }else{
        parts.push(s2b(num+' 0 obj\n'+obj.body+'\nendobj\n'));
      }
    }

    const xrS=parts.reduce((s,p)=>s+p.length,0);
    let xr='xref\n0 '+(maxObj+1)+'\n0000000000 65535 f \n';
    for(let i=1;i<=maxObj;i++)
      xr+=newOff[i]!=null?newOff[i].toString().padStart(10,'0')+' 00000 n \n':'0000000000 00000 f \n';
    const nTr=trailerDict.replace(/\/Size\s+\d+/,'/Size '+(maxObj+1)).replace(/\/Prev\s+\d+/,'');
    xr+='trailer\n<<'+nTr+'>>\nstartxref\n'+xrS+'\n%%EOF';
    parts.push(s2b(xr));

    const total=parts.reduce((s,p)=>s+p.length,0);
    const result=new Uint8Array(total);let pos=0;
    for(const p of parts){result.set(p,pos);pos+=p.length;}
    return result;
  }

  // ── PDF: Build CMYK PDF from scratch (300 DPI raster) ─────────────
  // Generates a valid PDF with a DeviceCMYK image, FlateDecode compressed.
  // Illustrator, Acrobat, and print RIPs see it as native CMYK.

  // ── Convert PNG to 4-channel CMYK (PDF — white bg for transparency) ──

  // ── TIFF: CMYK+Alpha at the chosen DPI (default 300) ──────────────

  function buildCmykaTiff(data,w,h,dpi) {
    const res = Math.round(dpi) || 300;
    const pxSz=w*h*5, nT=15, iO=8, iSz=2+(nT*12)+4, eO=iO+iSz;
    // Extra data: BitsPerSample (5 shorts = 10 bytes) + XRes (8) + YRes (8)
    const bO=eO, xO=bO+10, yO=xO+8, sO=yO+8;
    const buf=new ArrayBuffer(sO+pxSz), v=new DataView(buf), b=new Uint8Array(buf);
    let p=0;
    const w16=x=>{v.setUint16(p,x,true);p+=2;}, w32=x=>{v.setUint32(p,x,true);p+=4;};
    function t(tag,type,cnt,val){w16(tag);w16(type);w32(cnt);if(type===3&&cnt===1){w16(val);w16(0);}else{w32(val);}}
    w16(0x4949); w16(42); w32(iO); w16(nT);
    t(256,4,1,w);           // ImageWidth
    t(257,4,1,h);           // ImageLength
    t(258,3,5,bO);          // BitsPerSample → offset (5 shorts: 8,8,8,8,8)
    t(259,3,1,1);           // Compression: None
    t(262,3,1,5);           // PhotometricInterpretation: CMYK
    t(273,4,1,sO);          // StripOffsets
    t(277,3,1,5);           // SamplesPerPixel: 5 (CMYK+A)
    t(278,4,1,h);           // RowsPerStrip
    t(279,4,1,pxSz);        // StripByteCounts
    t(282,5,1,xO);          // XResolution → offset (RATIONAL 300/1)
    t(283,5,1,yO);          // YResolution → offset (RATIONAL 300/1)
    t(284,3,1,1);           // PlanarConfiguration: chunky
    t(296,3,1,2);           // ResolutionUnit: inch
    t(332,3,1,1);           // InkSet: CMYK
    t(338,3,1,2);           // ExtraSamples: 2 = unassociated alpha (INLINE)
    w32(0); // next IFD
    // BitsPerSample
