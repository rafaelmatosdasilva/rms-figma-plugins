<script>

// Returns the selection highlight color — matches .node.node-selected border
// Uses #D4D4D4 in dark mode, accent blue in light mode
function getSelectionColor() {
  var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  return getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || (isDark ? '#ededed' : '#0a0a0a');
}

// ─── State ────────────────────────────────────────────────────────────────────

var _variables           = [];
var _collections         = [];
var _remoteVariables     = [];
// How much a remote variable is actually used. When one library variable arrives under
// several per-file ids, the entry with usage is the one components reference — keep it.
function remoteVarUsage(v) {
  return (v.aliasCount || 0) + (v.dependentCount || 0) + (v.componentCount || 0);
}
// One library variable can arrive under several per-file ids; only its key is stable.
function dedupeRemoteByKey(list) {
  var byKey = {}, out = [];
  var usage = remoteVarUsage;
  for (var i = 0; i < list.length; i++) {
    var v = list[i];
    if (!v.libraryKey) { out.push(v); continue; }
    if (byKey[v.libraryKey] === undefined) { byKey[v.libraryKey] = out.length; out.push(v); continue; }
    var at = byKey[v.libraryKey];
    if (usage(v) > usage(out[at])) out[at] = v;
  }
  return out;
}
var _remoteCollections   = [];
var _filterQuery         = '';
var _searchTimer         = null;
var _selectedId          = null;
var _selectedRemoteId    = null;
var _currentComponents   = null;   // null = not yet fetched; [] = empty
// Node ids the backend labelled focusable (had a pageId) but that turned out to
// be unreachable when focus was attempted — i.e. actually external. Once known,
// their rows render as a library badge instead of a focus button.
var _unreachableNodes    = new Set();
var _componentIndexBuilt = false;

// Graph state
var _currentChain        = null;
var _varComponentCounts  = {};
var _viewMode            = 'graph';
var _detailMode          = null;   // 'variable' | 'component' | null — what the right panel is showing
var _currentComp         = null;   // the comp object when _detailMode === 'component'
var _graphDescVars       = [];     // descendant vars currently visible in col-2
var _graphCompList       = [];     // component nodes currently visible in col-3
var _allDescVars         = [];     // full descendant list (for expand)
var _allCompList         = [];     // full sorted component list (for expand)
var _descCompEdges       = [];     // [{descIdx, compIdx}] for alias→component edges
var _rootCompIdxs        = [];     // compIdx[] for components that bind to the root variable directly
var _edgeRafPending      = false;
var _selectedGraphNodeEl = null;   // currently highlighted graph node
var _collapseTimer       = null;   // timer for display:none after fade

// Section-divider tracking — unstick the selected item's own divider once
// the next section's divider has scrolled into its sticky position.
var _trackedSelDiv  = null;   // divider that owns the selected item
var _trackedNextDiv = null;   // next divider after the selected item
var _trackedNextTop = 0;      // natural offsetTop of the next divider
var _trackedList    = null;   // scroll container being tracked

// Component browser state
var _browserMode          = 'all';  // 'all' | 'tokens' | 'components'
var _allBrowserComponents = [];
var _selectedCompNodeId   = null;
var _compBrowserLoaded    = false;

// Origin scroll positions — restored when a sticky-selected item is re-clicked
var _selectedVarOriginScroll  = null;
var _selectedCompOriginScroll = null;

// Canvas deep-scan state
var _displayDepth        = 1;      // What depth is currently displayed (can go up or down freely)
var _hasExternalLibraries = false; // Detected at init — hides Extended if false
var _externalScanDone    = false;  // Remote vars loaded (now happens automatically at init)
var _lastScanDepth       = null;   // persisted across sessions via clientStorage
var _lastScanTimestamp   = null;   // Unix ms of last completed scan (from cache or fresh)
var _canvasScanDone      = false;  // Level 3 completed (canvas instance count)
var _canvasScanRunning   = false;
var _canvasBindings      = {}; // varId → total (instances + direct)
var _canvasInstanceCounts = {}; // varId → instance count
var _canvasDirectCounts   = {}; // varId → direct canvas-node count
var _canvasComponents     = []; // per-component canvas scan results


// Column resize state

// ─── Boot ──────────────────────────────────────────────────────────────────────

window.onmessage = function (event) {
  var msg = event.data.pluginMessage;
  if (!msg) return;
  switch (msg.type) {
    case 'init-data':         return onInitData(msg);
    case 'init-progress':     return onInitProgress(msg);
    case 'index-progress':    return onIndexProgress(msg.text, msg.scanned, msg.total);
    case 'index-ready':       return onIndexReady(msg.components, msg.remoteVars, msg.remoteColls, msg.varComponentCounts, msg.varImpactScores);
    case 'chain-result':           return onChainResult(msg.chain, msg.styles, msg.components, msg.impact);
    case 'referenced-by':          return onReferencedBy(msg);
    case 'usage-scan-progress':    return onCanvasScanProgress(msg.pct);
    case 'usage-scan-ready':       return onCanvasScanReady(msg);
    case 'usage-scan-error':       return onCanvasScanError(msg.message);
    case 'usage-scan-cancelled':   return onCanvasScanCancelled();
    case 'scan-cache-write-failed':
      showError('Cache write #' + msg.attempt + ' failed: ' + (msg.error || '?'));
      return;
    case 'place-progress':
      return showScanProgress('Placing components… ' + Math.round((msg.done / msg.total) * 100) + '%', msg.eta || '');
    case 'place-done':        return onPlaceDone(msg);
    case 'place-cancelled':
      _placing = false;
      return dismissProgress();
    case 'place-error':
      _placing = false;
      dismissProgress();
      showError(msg.message || 'Could not place components');
      return;
    case 'focus-unavailable':
      // A user clicked focus and it failed — retag that row and tell them why.
      markNodeUnreachable(msg.nodeId);
      showToast('This component lives in an external library — it has no canvas location.');
      return;
    case 'error':             return onError(msg.message);
  }
};

_initStartTime = Date.now();
showScanProgress('Loading…', '', function () {
  parent.postMessage({ pluginMessage: { type: 'close' } }, '*');
});
parent.postMessage({ pluginMessage: { type: 'init' } }, '*');

// ─── Init ──────────────────────────────────────────────────────────────────────

var _initStartTime      = null;
var _initTargetPct      = 0;
var _initDisplayPct     = 0;
var _initTickTimer      = null;
var _initHasCachedScan  = false;
var _initLabel          = 'Local scan';

function _initTick() {
  _initTickTimer = null;
  if (_initDisplayPct >= 99) { _updateInitDisplay(); return; }

  var gap = _initTargetPct - _initDisplayPct;
  if (gap > 0.5) {
    // Behind real target — catch up with easing
    _initDisplayPct += Math.max(0.5, gap * 0.06);
  } else {
    // Reached target — keep slowly creeping (max 8% ahead of real target, cap 99)
    var cap = Math.min(99, _initTargetPct + 8);
    if (_initDisplayPct < cap) _initDisplayPct += 0.08;
  }
  _initDisplayPct = Math.min(_initDisplayPct, 99);
  _updateInitDisplay();
  _initTickTimer = setTimeout(_initTick, 120);
}

var _initEtaShown = false; // once ETA appears, never remove it

function _updateInitDisplay() {
  var pct     = Math.round(_initDisplayPct);
  var eta     = '';
  var elapsed = (Date.now() - _initStartTime) / 1000;
  if (_initDisplayPct > 0 && elapsed >= 5) {
    // Use display pct so ETA updates continuously, not just on backend messages
    // Apply 1.5x multiplier for conservative estimate
    var remaining = Math.round(elapsed / _initDisplayPct * (100 - _initDisplayPct) * 1.5);
    if (remaining >= 60) {
      var m = Math.floor(remaining / 60), s = remaining % 60;
      eta = '~' + m + 'm ' + (s > 0 ? s + 's' : '') + ' remaining';
    } else if (remaining > 0) {
      eta = '~' + remaining + 's remaining';
    }
  }
  if (eta) _initEtaShown = true;
  showScanProgress(_initLabel + '… ' + pct + '%', _initEtaShown ? (eta || '…') : '');
}

function onInitProgress(msg) {
  var pct = (msg && typeof msg === 'object' ? msg.pct : msg) || 0;
  if (msg && msg.hasCachedScan) {
    _initHasCachedScan = true;
    var d = msg.cachedDepth;
    _initLabel = d >= 3 ? 'Full scan' : d === 2 ? 'Extended scan' : 'Local scan';
    return; // toast stays — onInitData dismisses it when content is ready
  }
  if (_initHasCachedScan) return; // suppress bar — cached view renders on init-data
  _initTargetPct = Math.max(_initTargetPct, pct); // never go backward
  if (!_initStartTime) _initStartTime = Date.now();
  if (!_initTickTimer) _initTickTimer = setTimeout(_initTick, 0);
}

function onInitData(msg) {
  _variables         = msg.variables   || [];
  _collections       = msg.collections || [];
  // Collapse on the library key here too: a single payload can already carry the
  // same variable under two ids when the file is on an older library publish.
  _remoteVariables   = dedupeRemoteByKey(msg.remoteVars || []);
  _remoteCollections = msg.remoteColls || [];

  // Component index is always built at startup — absorb data immediately
  _componentIndexBuilt = true;
  _varComponentCounts  = msg.varComponentCounts || {};
  // External libraries are considered present when the library API reports them
  // OR when the file actually references remote tokens (the API is unreliable —
  // it misses libraries that are used but not formally added to the file).
  _hasExternalLibraries = !!msg.hasExternalLibraries || _remoteVariables.length > 0;
  // Mark external vars as loaded if remote vars came in with init-data
  if (_remoteVariables.length > 0) _externalScanDone = true;
  // _lastScanDepth is session-only — set by triggerCanvasScan(), never loaded from storage

  var allVarsInit = _variables.concat(_remoteVariables);
  for (var k = 0; k < allVarsInit.length; k++) {
    var vid = allVarsInit[k].id;
    if (msg.varImpactScores && msg.varImpactScores[vid] !== undefined)
      allVarsInit[k].impactScore = msg.varImpactScores[vid];
    if (_varComponentCounts[vid] !== undefined)
      allVarsInit[k].componentCount = _varComponentCounts[vid];
  }

  // Component browser data included with init — mark as loaded immediately
  if (msg.browserComponents) {
    _allBrowserComponents = (msg.browserComponents || []).filter(function (c) { return c.nodeName && c.nodeName.trim() !== ''; });
    _compBrowserLoaded    = true;
  }

  _initStartTime     = null;
  _initTargetPct     = 0;
  _initDisplayPct    = 0;
  _initEtaShown      = false;
  _initHasCachedScan = false;
  if (_initTickTimer) { clearTimeout(_initTickTimer); _initTickTimer = null; }
  var progCont = document.getElementById('progress-container');
  if (progCont) progCont.innerHTML = '';

  document.getElementById('browser-loading').classList.add('hidden');
  // Default to Tokens tab
  _browserMode = 'tokens';
  syncBrowserModeButtons('tokens');
  updatePlaceholderText('tokens');
  var phIcon = document.getElementById('right-placeholder-icon');
  if (phIcon) phIcon.setAttribute('href', '#icon-empty-token');

  if (msg.cachedScan) {
    // Restore cached canvas scan in the same paint as init — no double-render
    _lastScanTimestamp = msg.cachedScan.ts;
    _lastScanDepth     = msg.cachedScan.depth;
    var cs = Object.assign({}, msg.cachedScan, { _fromCache: true });
    onCanvasScanReady(cs);
    showScanBar(msg.cachedScan.ts, msg.cachedScan.depth);
  } else {
    // No cached canvas scan — the local analysis that just finished IS the scan,
    // so surface it. Without this the bar (and rescan) only ever appeared after a
    // canvas scan, which read as a broken build to anyone opening a fresh file.
    _lastScanTimestamp = Date.now();
    _lastScanDepth     = 1;
    showScanBar(_lastScanTimestamp, 1);
    renderBrowser();
  }
}

// ─── Divider component (used by list and graph views) ───────────────────────

function makeDivider(label, tier, count) {
  return '<div class="dividerSection"><div class="dividerSection-content">' +
    (tier ? '<span class="tier-dot ' + tier + '"></span>' : '') +
    label +
    '<span class="div-sep">·</span>' +
    '<span class="count">' + count + '</span>' +
  '</div></div>';
}

// Inner content only — for pre-existing .dividerSection containers (#list-alias-hdr, #list-comp-hdr)
// that must not be double-wrapped in another .dividerSection div.
function makeDividerContent(label, tier, count) {
  return '<div class="dividerSection-content">' +
    (tier ? '<span class="tier-dot ' + tier + '"></span>' : '') +
    label +
    '<span class="div-sep">·</span>' +
    '<span class="count">' + count + '</span>' +
  '</div>';
}

// ─── Left panel browser ──────────────────────────────────────────────────────

// Loose multi-word search: every space-separated word must appear somewhere
// in the combined searchable string (name + "/" + collectionName).
// Searching "border color" matches "buttonSecondary/border/color".
function matchesSearch(name, collectionName, query) {
  if (!query) return true;
  var haystack = (name + '/' + (collectionName || '')).toLowerCase();
  var words = query.toLowerCase().split(/\s+/);
  for (var wi = 0; wi < words.length; wi++) {
    if (words[wi] && haystack.indexOf(words[wi]) === -1) return false;
  }
  return true;
}

// Update tab empty-state based on current search query results
function updateBrowserTabStates() {
  if (!_filterQuery) {
    // No search — all tabs always have content (or at least aren't search-empty)
    var btnT = document.getElementById('btn-mode-tokens');
    var btnC = document.getElementById('btn-mode-comps');
    if (btnT) btnT.classList.remove('tab-empty');
    if (btnC) btnC.classList.remove('tab-empty');
    return;
  }
  var q = _filterQuery.toLowerCase();
  var hasVars = false;
  for (var i = 0; i < _variables.length; i++) {
    if (matchesSearch(_variables[i].name, _variables[i].collectionName, q)) { hasVars = true; break; }
  }
  if (!hasVars && _displayDepth >= 2) {
    for (var j = 0; j < _remoteVariables.length; j++) {
      if (matchesSearch(_remoteVariables[j].name, _remoteVariables[j].collectionName, q)) { hasVars = true; break; }
    }
  }
  var hasComps = false;
  for (var k = 0; k < _allBrowserComponents.length; k++) {
    var c = _allBrowserComponents[k];
    if (_displayDepth < 2 && c.isRemote) continue;
    if (matchesSearch(c.nodeName, '', q)) { hasComps = true; break; }
  }
  var btnTokens = document.getElementById('btn-mode-tokens');
  var btnComps  = document.getElementById('btn-mode-comps');
  if (btnTokens) btnTokens.classList.toggle('tab-empty', !hasVars);
  if (btnComps)  btnComps.classList.toggle('tab-empty',  !hasComps);
  // If the active tab has no results but the other does, switch immediately
  if (_browserMode === 'tokens' && !hasVars && hasComps) {
    switchBrowserMode('components');
  } else if (_browserMode === 'components' && !hasComps && hasVars) {
    switchBrowserMode('tokens');
  }
}

function renderBrowser() {
  if (_browserMode === 'components') { renderComponentBrowser(); return; }
  var q = _filterQuery.toLowerCase();

  // All tokens — local AND external library — are graded by impact and grouped
  // into the same High/Medium/Low/Unused tiers. Remote tokens only appear once
  // an Extended/Full scan has surfaced them (and their component counts).
  var allVars = [];
  for (var i = 0; i < _variables.length; i++) {
    if (matchesSearch(_variables[i].name, _variables[i].collectionName, q)) allVars.push(_variables[i]);
  }
  if (_displayDepth >= 2) {
    for (var j = 0; j < _remoteVariables.length; j++) {
      if (matchesSearch(_remoteVariables[j].name, _remoteVariables[j].collectionName, q)) allVars.push(_remoteVariables[j]);
    }
  }

  var listEl  = document.getElementById('var-list');
  if (allVars.length === 0) {
    listEl.innerHTML = '';
    showBrowserEmpty(true);
    document.body.classList.add('browser-empty');
    if (q) updateBrowserTabStates();
    return;
  }
  showBrowserEmpty(false);
  document.body.classList.remove('browser-empty');

  var high = [], medium = [], low = [], none = [];
  for (var k = 0; k < allVars.length; k++) {
    var v = allVars[k];
    var s = varImpactScore(v);
    if (s === 0)      none.push(v);
    else if (s > 100) high.push(v);
    else if (s > 40)  medium.push(v);
    else              low.push(v);
  }

  function scoreAlphSort(arr) {
    return arr.slice().sort(function(a, b) {
      var diff = varImpactScore(b) - varImpactScore(a);
      return diff !== 0 ? diff : (a.name < b.name ? -1 : a.name > b.name ? 1 : 0);
    });
  }

  var html = '';
  function renderSection(label, tier, vars) {
    if (vars.length === 0) return;
    html += makeDivider(label, tier, vars.length);
    var sorted = scoreAlphSort(vars);
    for (var i = 0; i < sorted.length; i++) html += renderVarRow(sorted[i]);
  }
  renderSection('High',   'high',   high);
  renderSection('Medium', 'medium', medium);
  renderSection('Low',    'low',    low);
  renderSection('Unused', 'none',   none);

  listEl.innerHTML = html;
  document.getElementById('comp-list').classList.add('hidden');
  listEl.classList.remove('hidden');
  setupDividerTracking('var-list');
  updateBrowserTabStates();
}

function renderVarRow(v) {
  var isRemote   = !!v.isRemote;
  var isSelected = isRemote ? v.id === _selectedRemoteId : v.id === _selectedId;
  // External-library tokens get the same library indicator + tooltip as external
  // components, so their origin is clear at a glance.
  var libBadge = isRemote
    ? '<span class="tooltipButton lib-badge" data-tip="From an external library."><svg width="12" height="12"><use href="#icon-library"/></svg></span>'
    : '';
  return '<button class="node var-item' + (isSelected ? ' node-selected' : '') + '" data-id="' + esc(v.id) + '" data-remote="' + (isRemote ? '1' : '0') + '">' +
    '<div class="var-type-icon">' + varTypeIconHtml(v.resolvedType, 16) + '</div>' +
    '<span class="var-name">' + esc(nodeLabelName(v.name)) + '</span>' +
    libBadge +
    '<span class="node-goto-btn var-item-chevron"><svg width="16" height="16"><use href="#icon-arrow-right"/></svg></span>' +
  '</button>';
}

function varImpactScoreBase(v) {
  if (v.isRemote) return (v.aliasCount || 0) * 6 + (v.componentCount || 0) * 4;
  return (v.dependentCount || 0) * 6 + (v.componentCount || 0) * 4;
}

function varImpactScore(v) {
  // depth=1 → local only (component count + token refs, no canvas instances)
  if (_displayDepth <= 1) return varImpactScoreBase(v);
  // depth=2 → component-based (extended libs included, but no instance traversal)
  if (_displayDepth === 2) return v._preCanvasScore !== undefined ? v._preCanvasScore : varImpactScoreBase(v);
  // depth=3 → full (includes canvas instance counts)
  if (v.impactScore !== undefined) return v.impactScore;
  return varImpactScoreBase(v);
}

// ─── Single source of truth for selection clearing ────────────────────────────
// Call this before setting any new selection so no stale .node-selected can survive.
function clearAllSelections() {
  _selectedId               = null;
  _selectedRemoteId         = null;
  _selectedCompNodeId       = null;
  _currentComponents        = null;
  _selectedVarOriginScroll  = null;
  _selectedCompOriginScroll = null;
  if (_trackedSelDiv) _trackedSelDiv.classList.remove('divider-away');
  _trackedSelDiv = null; _trackedNextDiv = null; _trackedList = null;
  ['all-list', 'var-list', 'comp-list'].forEach(function (id) {
    var el = document.getElementById(id);
    if (!el) return;
    el.classList.remove('has-list-selection');
    el.querySelectorAll('.node-selected').forEach(function (n) { n.classList.remove('node-selected'); });
  });
}

function onVarClick(e) {
  // Support both direct call (currentTarget = item) and delegated call (item passed as arg)
  var item     = (e instanceof Event) ? e.target.closest('.var-item') : e;
  if (!item) return;
  if (e instanceof Event && e.target.closest('.node-drill-btn, .node-focus-btn')) return;
  // The chevron always SELECTS — never toggles — so it can't deselect an
  // already-selected row the way the row body does.
  var viaChevron = (e instanceof Event) && !!e.target.closest('.node-goto-btn, .var-item-chevron');
  var id       = item.getAttribute('data-id');
  var isRemote = item.getAttribute('data-remote') === '1';
  if (!id) return;

  var alreadySelected = (isRemote && id === _selectedRemoteId) || (!isRemote && id === _selectedId);
  // Chevron on the already-selected token → no-op. It must never deselect, and
  // re-running the analyze would re-fetch and re-render, flickering the content.
  if (viaChevron && alreadySelected) return;

  var _activeVarList = document.getElementById('var-list');

  // Re-click the row body on an already-selected item → scroll to origin, then
  // deselect. Not reachable via the chevron (handled above).
  if (!viaChevron && alreadySelected) {
    var originScroll = _selectedVarOriginScroll;
    if (originScroll !== null) _activeVarList.scrollTo({ top: originScroll, behavior: 'smooth' });
    setTimeout(function () {
      clearAllSelections();
      resetRightPanel();
    }, 320);
    return;
  }

  // Record origin scroll, then wipe every other selection
  var savedScroll = _activeVarList.scrollTop;
  clearAllSelections();
  _selectedVarOriginScroll = savedScroll;

  if (isRemote) {
    _selectedRemoteId = id;
    _selectedId       = null;
  } else {
    _selectedId       = id;
    _selectedRemoteId = null;
    _currentComponents = null;
  }
  var items = _activeVarList.querySelectorAll('.var-item');
  for (var i = 0; i < items.length; i++) {
    var iid  = items[i].getAttribute('data-id');
    var irem = items[i].getAttribute('data-remote') === '1';
    items[i].classList.toggle('node-selected', iid === id && irem === isRemote);
  }
  _activeVarList.classList.add('has-list-selection');
  setupDividerTracking('var-list');

  var col3El = document.getElementById('gcol-3');
  if (col3El) col3El.scrollTop = 0;

  if (isRemote) {
    _currentComponents = null;
    resetRightPanel();
    var rv = findRemoteVar(id);
    parent.postMessage({ pluginMessage: {
      type: 'analyze-remote', variableId: id,
      varName:        rv ? rv.name        : null,
      resolvedType:   rv ? rv.resolvedType : null,
      collectionName: rv ? (rv.collectionName || rv.libraryName || '') : '',
    } }, '*');
  } else {
    resetRightPanel();
    parent.postMessage({ pluginMessage: { type: 'analyze', variableId: id } }, '*');
  }
}

// ─── Panel visibility ─────────────────────────────────────────────────────────

function showRightPanel(which) {
  document.getElementById('right-placeholder').classList.toggle('hidden', which !== 'placeholder');
  document.getElementById('right-detail').classList.toggle('hidden', which !== 'detail');
  var libEl = document.getElementById('right-library');
  libEl.classList.toggle('hidden', which !== 'library');
  libEl.style.display = which === 'library' ? 'flex' : 'none';

  // Re-position the pill whenever the detail panel becomes visible —
  // offsetLeft/offsetWidth are 0 on hidden elements so init can't do it.
  if (which === 'detail') {
    updateSegPill(document.getElementById('view-mode-toggle'), true);
  }
}

function resetRightPanel() {
  // Always clear selection state before rebuilding the graph
  clearGraphSelectionState();
  _detailMode  = null;
  _currentComp = null;

  var col2 = document.getElementById('gcol-2');
  var col3 = document.getElementById('gcol-3');
  if (col2) col2.innerHTML = '';
  if (col3) col3.innerHTML = '';
  var svg = document.getElementById('graph-edges');
  if (svg) svg.innerHTML = '';
  clearCrossEdges();
  var bodyEl = document.getElementById('graph-body');
  if (bodyEl) bodyEl.classList.remove('has-content', 'comp-mode');
  var lbl2reset = document.getElementById('gcol-2-lbl');
  if (lbl2reset) lbl2reset.textContent = 'Alias tokens';
  var c2 = document.getElementById('gcol-2-count');
  var c3 = document.getElementById('gcol-3-count');
  if (c2) c2.textContent = '';
  if (c3) c3.textContent = '';
  var g3hdr = document.getElementById('gcol-3-lbl-wrap');
  setColHdrVisible(g3hdr, false); // stays in the flex row so column widths hold
  _graphDescVars = [];
  _graphCompList = [];
  _allDescVars   = [];
  _allCompList   = [];
  _descCompEdges = [];
  var ccEl = document.getElementById('sb-canvas-count');
  if (ccEl) ccEl.classList.add('hidden');
  var focusBtn = document.getElementById('sb-focus-btn');
  if (focusBtn) focusBtn.classList.add('hidden');

  // Delay the placeholder — if content arrives within 120ms we skip the flash
  clearTimeout(_placeholderTimer);
  _placeholderTimer = setTimeout(function () {
    showRightPanel('placeholder');
  }, 120);
}

// ─── Chain result ─────────────────────────────────────────────────────────────

function onChainResult(chain, styles, components, impact) {
  clearTimeout(_placeholderTimer); // content arrived — skip placeholder flash
  _currentChain      = chain;
  _currentComponents = (components !== null && components !== undefined) ? components : null;
  _detailMode        = 'variable';
  _currentComp       = null;
  // Impact score is canonical from init/canvas scan — do not overwrite with detail analysis result.

  // Reset detail view scroll on every new selection
  var viewList = document.getElementById('view-list');
  if (viewList) viewList.scrollTop = 0;
  var gcol2 = document.getElementById('gcol-2');
  var gcol3 = document.getElementById('gcol-3');
  if (gcol2) gcol2.scrollTop = 0;
  if (gcol3) gcol3.scrollTop = 0;

  renderGraph(chain);
  if (_viewMode === 'list') {
    renderListView(chain);
    renderListComponents(_currentComponents);
  }

  // Auto-select the single item when there's only one linked alias or component
  requestAnimationFrame(function () {
    var descs = chain.descendants || [];
    var comps = _currentComponents || [];
    if (_viewMode === 'list') {
      if (descs.length === 1 && comps.length !== 1) {
        var aliasRow = document.querySelector('#list-alias-body .buttonList[data-id]');
        if (aliasRow) onListAliasClick({ currentTarget: aliasRow, target: aliasRow });
      } else if (comps.length === 1 && descs.length !== 1) {
        var compRow = document.querySelector('#list-comp-body .buttonList[data-node-id]');
        if (compRow) onListCompClick({ target: compRow });
      }
    } else {
      if (descs.length === 1 && comps.length !== 1) {
        var descNode = document.querySelector('#gcol-2 .var-node');
        if (descNode) descNode.click();
      } else if (comps.length === 1 && descs.length !== 1) {
        var compNode = document.querySelector('#gcol-3 .comp-item');
        if (compNode) compNode.click();
      }
    }
  });

  updateStatusBar(chain, _currentComponents !== null ? _currentComponents.length : null);
  var sb = document.getElementById('status-bar');
  if (sb) sb.classList.remove('hidden');
  showRightPanel('detail');

  // When reached via drill/navigation the selected list row smooth-scrolls into
  // view, so the first edge draw can measure it mid-scroll (or before it's marked
  // selected) and end up drawing nothing. Redraw once the scroll settles so the
  // connectors always appear — harmless (idempotent) when the first draw succeeded.
  if (_viewMode === 'graph') setTimeout(scheduleDrawEdges, 380);
 

  // Component index is built at init — no lazy scan needed
}

// ─── Graph rendering ──────────────────────────────────────────────────────────

// Show/hide a graph column's header label. Both columns stay in the flex row
// either way so the two columns keep their alignment — but a hidden label also
// drops the divider's background, since an empty opaque strip would clip the
// edge lines drawn underneath it.
function setColHdrVisible(el, visible) {
  if (!el) return;
  el.style.visibility = visible ? '' : 'hidden';
  el.classList.toggle('col-empty', !visible);
}

function renderGraph(chain) {
  if (!chain) return;

  var col2 = document.getElementById('gcol-2');
  var col3 = document.getElementById('gcol-3');
  if (!col2 || !col3) return;

  col2.innerHTML = '';
  col3.innerHTML = '';
  _graphDescVars       = [];
  _graphCompList       = [];
  _allDescVars         = [];
  _allCompList         = [];
  _descCompEdges       = [];
  _rootCompIdxs        = [];
  _selectedGraphNodeEl = null;

  var svg = document.getElementById('graph-edges');
  if (svg) svg.innerHTML = '';

  // ── Col 2: Descendants ──
  var descendants = chain.descendants || [];
  _allDescVars   = descendants;
  _graphDescVars = descendants;
  var graphEmptyEl = document.getElementById('graph-empty');
  if (graphEmptyEl) graphEmptyEl.classList.add('hidden');

  var hasDescs = descendants.length > 0;
  var hasComps = _currentComponents !== null && _currentComponents.length > 0;

  var cnt2        = document.getElementById('gcol-2-count');
  var gcol2lbl    = document.getElementById('gcol-2-lbl-wrap');
  var gcol3lbl    = document.getElementById('gcol-3-lbl-wrap');
  var gcol2wrap   = document.getElementById('gcol-2-wrap');
  var gcol3wrap   = document.getElementById('gcol-3-wrap');
  var colHeaders  = document.getElementById('graph-col-headers');
  var bodyElG     = document.getElementById('graph-body');

  if (cnt2) cnt2.textContent = hasDescs ? descendants.length : '';

  // Both columns always visible — divider labels hidden via visibility (not display)
  // to preserve column alignment in the flex header row
  setColHdrVisible(gcol2lbl, hasDescs);
  if (gcol2wrap) gcol2wrap.style.display     = '';
  setColHdrVisible(gcol3lbl, hasComps);
  if (gcol3wrap) gcol3wrap.style.display     = '';
  if (colHeaders) colHeaders.style.display = (hasDescs || hasComps) ? '' : 'none';
  if (bodyElG) bodyElG.classList.add('has-content');

  // ── Col 2: Descendants ──
  if (hasDescs) {
    var descHtml = '';
    for (var di = 0; di < descendants.length; di++) {
      descHtml += makeVarNode(descendants[di], 'desc', descendants[di].id);
    }
    col2.innerHTML = descHtml;
  } else {
    col2.innerHTML = '';
  }

  // ── Col 3: Components ──
  if (_currentComponents !== null) {
    renderComponents(_currentComponents);
  } else {
    col3.innerHTML = '<div class="col-placeholder"><div class="spinner"></div><span id="comp-load-text">Indexing…</span></div>';
    if (bodyElG) bodyElG.classList.add('has-content');
    scheduleDrawEdges();
  }

  scheduleDrawEdges();
}

function makeVarNode(v, cssClass, dataId) {
  var isExternal = !!(v && v.isExternal);
  // External vars are not in the local list — don't set data-id or drill button
  var idAttr   = (dataId && !isExternal) ? ' data-id="' + esc(dataId) + '"' : '';
  var externalAttr = isExternal ? ' data-external="1"' : '';
  var drillBtn = (cssClass === 'desc' && !isExternal)
    ? '<button class="node-drill-btn" data-drill-id="' + esc(dataId) + '" data-tip="Select in list">' +
        '<svg width="16" height="16"><use href="#icon-arrow-right"/></svg>' +
      '</button>'
    : '';
  var externalBadge = isExternal
    ? '<span class="tooltipButton lib-badge node-lib-badge" data-tip="From external library — run Full scan to explore">' +
        '<svg width="12" height="12"><use href="#icon-library"/></svg></span>'
    : '';
  return '<div class="node graph-node ' + cssClass + (isExternal ? ' node-external' : '') + '"' + idAttr + externalAttr + '>' +
    '<div class="node-type-icon">' + varTypeIconHtml(v.resolvedType, 16) + '</div>' +
    '<div class="node-body">' +
      '<div class="node-name" title="' + esc(v.name) + '">' + esc(nodeLabelName(v.name)) + '</div>' +
      externalBadge +
    '</div>' +
    drillBtn +
  '</div>';
}

function nodeLabelName(name) {
  return name || '';
}

// A component the backend marked focusable turned out to be unreachable (external).
// Record it so every future render shows a library badge, and patch the rows already
// on screen without a full re-render — swap each focus control for the library badge.
var LIB_BADGE_HTML = '<span class="tooltipButton lib-badge" data-tip="From an external library. No canvas focus."><svg width="12" height="12"><use href="#icon-library"/></svg></span>';
function markNodeUnreachable(nodeId) {
  if (!nodeId || _unreachableNodes.has(nodeId)) return;
  _unreachableNodes.add(nodeId);
  var sel = '.node-focus-btn[data-node-id="' + nodeId + '"], ' +
            '.buttonList-action[data-node-id="' + nodeId + '"], ' +
            '.comp-item-focus-btn[data-node-id="' + nodeId + '"]';
  var btns = document.querySelectorAll(sel);
  for (var i = 0; i < btns.length; i++) {
    var tmp = document.createElement('template');
    tmp.innerHTML = LIB_BADGE_HTML;
    btns[i].replaceWith(tmp.content.firstChild);
  }
}

function makeCompNodeHtml(c) {
  var count = c.boundCount || 1;
  var gotoBtn =
    '<button class="node-goto-btn" data-goto-node-id="' + esc(c.nodeId) + '" data-tip="Select component">' +
      '<svg width="16" height="16"><use href="#icon-arrow-right"/></svg>' +
    '</button>';
  var focusBtn = (c.pageId && !_unreachableNodes.has(c.nodeId))
    ? '<button class="node-focus-btn" data-node-id="' + esc(c.nodeId) + '" data-page-id="' + esc(c.pageId) + '" data-tip="Focus on canvas">' +
        '<svg width="16" height="16"><use href="#icon-focus"/></svg>' +
      '</button>'
    : '<span class="tooltipButton lib-badge" data-tip="From an external library. No canvas focus."><svg width="12" height="12"><use href="#icon-library"/></svg></span>';
  return '<div class="node graph-node comp" data-node-id="' + esc(c.nodeId) + '" data-page-id="' + esc(c.pageId) + '">' +
    '<div class="node-type-icon">' + nodeTypeIcon(c.nodeType) + '</div>' +
    '<div class="node-body">' +
      '<div class="node-name" title="' + esc(c.nodeName) + '">' + esc(nodeLabelName(c.nodeName)) + '</div>' +
    '</div>' +
    focusBtn +
    gotoBtn +
  '</div>';
}

// ─── Component rendering ──────────────────────────────────────────────────────

function renderComponents(components) {
  _graphCompList = [];
  _allCompList   = [];
  _descCompEdges = [];
  _rootCompIdxs  = [];

  var col3 = document.getElementById('gcol-3');
  if (!col3) return;

  // Filter out nameless components and respect display depth
  components = (!components ? [] : components).filter(function (c) {
    if (_displayDepth < 2 && c.isRemote) return false;
    return c.nodeName && c.nodeName.trim() !== '';
  });

  var cnt3      = document.getElementById('gcol-3-count');
  var bodyElC   = document.getElementById('graph-body');
  var gcol3hdr  = document.getElementById('gcol-3-lbl-wrap');
  var gcol3wrap = document.getElementById('gcol-3-wrap');
  var colHdrs   = document.getElementById('graph-col-headers');
  var hasAlias  = _graphDescVars.length > 0;
  if (components.length === 0) {
    col3.innerHTML = '';
    if (cnt3)      cnt3.textContent = '';
    // Keep col-3 in the layout even with nothing in it — collapsing it would let
    // col-2 stretch to the full width, so alias-token nodes would render wider
    // than the identical nodes in a chain that also has components.
    if (gcol3hdr)  gcol3hdr.style.display  = '';
    setColHdrVisible(gcol3hdr, false);
    if (gcol3wrap) gcol3wrap.style.display  = '';
    if (colHdrs)   colHdrs.style.display    = hasAlias ? '' : 'none';
    var ge = document.getElementById('graph-empty');
    if (ge) ge.classList.toggle('hidden', hasAlias);
    if (bodyElC) bodyElC.classList.toggle('has-content', hasAlias);
    scheduleDrawEdges();
    return;
  }
  // Components exist — ensure col-3 is visible. renderGraph may have hidden the
  // label when the component list was still null, so restore it here too.
  if (gcol3hdr)  gcol3hdr.style.display  = '';
  setColHdrVisible(gcol3hdr, true);
  if (gcol3wrap) gcol3wrap.style.display  = '';
  if (colHdrs)   colHdrs.style.display    = '';
  if (cnt3) cnt3.textContent = components.length;
  if (bodyElC) bodyElC.classList.add('has-content');

  // Sort by bound count desc
  var sorted = components.slice().sort(function (a, b) {
    return (b.boundCount || 0) - (a.boundCount || 0);
  });
  _allCompList   = sorted;
  _graphCompList = sorted;

  // Build id→descIdx and name→descIdx for edge matching.
  // ID matching is preferred (reliable across name normalization); name is a fallback.
  var descIdIdx   = {};
  var descNameIdx = {};
  for (var d = 0; d < _graphDescVars.length; d++) {
    if (_graphDescVars[d].id)   descIdIdx[_graphDescVars[d].id]     = d;
    if (_graphDescVars[d].name) descNameIdx[_graphDescVars[d].name] = d;
  }
  var rootId   = (_currentChain && _currentChain.self) ? _currentChain.self.id   : null;
  var rootName = (_currentChain && _currentChain.self) ? _currentChain.self.name : null;

  for (var ci = 0; ci < sorted.length; ci++) {
    var comp = sorted[ci];
    var seen = {};
    var bindsRoot = false;
    var bindsAnyAlias = false;
    for (var bvi = 0; bvi < (comp.boundVars || []).length; bvi++) {
      var bv = comp.boundVars[bvi];
      // Root binding (id preferred, name fallback)
      if ((bv.id && bv.id === rootId) || (!bv.id && bv.name === rootName)) bindsRoot = true;
      // Alias binding
      var dIdx;
      if (bv.id   && descIdIdx[bv.id]     !== undefined) dIdx = descIdIdx[bv.id];
      else if (bv.name && descNameIdx[bv.name] !== undefined) dIdx = descNameIdx[bv.name];
      if (dIdx !== undefined && !seen[dIdx]) {
        seen[dIdx] = true;
        bindsAnyAlias = true;
        _descCompEdges.push({ descIdx: dIdx, compIdx: ci });
      }
    }
    // If the component binds directly to the root (or doesn't bind to any alias
    // but is in the chain anyway), track it for root→component edge drawing.
    if (bindsRoot || !bindsAnyAlias) _rootCompIdxs.push(ci);
  }

  var html = '';
  for (var i = 0; i < sorted.length; i++) {
    html += makeCompNodeHtml(sorted[i]);
  }
  col3.innerHTML = html;

  // Stamp root-bound nodes with a "direct" badge + tooltip
  var col3Nodes   = Array.from(col3.querySelectorAll('.graph-node.comp'));
  var rootVarName = (_currentChain && _currentChain.self) ? _currentChain.self.name : '';
  for (var ri = 0; ri < _rootCompIdxs.length; ri++) {
    var rEl = col3Nodes[_rootCompIdxs[ri]];
    if (!rEl) continue;
    rEl.setAttribute('data-binds-root', '1');
  }

  // Re-apply selection state: gcol-3 was just rebuilt so all new nodes need
  // gnode classes. If the selected node is still in the DOM (gcol-0/1/2),
  // re-run selectGraphNode to mark the new component nodes correctly.
  // If the selected node was a gcol-3 node it is now gone — clear selection.
  if (_selectedGraphNodeEl) {
    if (_selectedGraphNodeEl.isConnected) {
      selectGraphNode(_selectedGraphNodeEl);
    } else {
      clearGraphSelectionState();
      scheduleDrawEdges();
    }
    return;
  }

  scheduleDrawEdges();
}



// ─── Graph node selection ─────────────────────────────────────────────────────

var _GRAPH_COL_IDS = ['gcol-2', 'gcol-3'];

function _showAllGraphNodes() {
  // No-op: nodes are never display:none, dimming is CSS-only
}

// Compute the strict HIGHLIGHT set (drives gnode-selected class).
// Per spec: variable click → only that + its directly bound components.
// Component click → only that + variables that directly bind to it.
function computeHighlightSet(colId, nodeIdx) {
  var h = { 'gcol-2': {}, 'gcol-3': {} };
  h[colId][nodeIdx] = true;
  if (colId === 'gcol-2') {
    for (var ei = 0; ei < _descCompEdges.length; ei++) {
      if (_descCompEdges[ei].descIdx === nodeIdx) h['gcol-3'][_descCompEdges[ei].compIdx] = true;
    }
  } else if (colId === 'gcol-3') {
    for (var ej = 0; ej < _descCompEdges.length; ej++) {
      if (_descCompEdges[ej].compIdx === nodeIdx) h['gcol-2'][_descCompEdges[ej].descIdx] = true;
    }
  }
  return h;
}

function selectGraphNode(node) {
  if (_collapseTimer) { clearTimeout(_collapseTimer); _collapseTimer = null; }
  _selectedGraphNodeEl = node;

  var col = node.closest('.graph-col');
  if (!col) return;
  var colId    = col.id;
  var colNodes = Array.from(col.querySelectorAll('.graph-node:not(.more)'));
  var nodeIdx  = colNodes.indexOf(node);

  var bodyEl = document.getElementById('graph-body');
  if (bodyEl) bodyEl.classList.add('has-selection');

  // Visual highlight set (strict)
  var highlight = computeHighlightSet(colId, nodeIdx);
  for (var c = 0; c < _GRAPH_COL_IDS.length; c++) {
    var curColId = _GRAPH_COL_IDS[c];
    var colEl    = document.getElementById(curColId);
    if (!colEl) continue;
    var nodes = Array.from(colEl.querySelectorAll('.graph-node'));
    for (var n = 0; n < nodes.length; n++) {
      nodes[n].classList.toggle('node-selected', highlight[curColId][n] === true);
    }
  }

  // Edge connected set — ALWAYS include col-1[0] so the path back to the
  // origin variable is drawn even if col-1 isn't visually highlighted.
  var connected = buildConnectedSet(colId, nodeIdx);

  if (colId === 'gcol-2' || colId === 'gcol-3') {
    var _cid = colId, _idx = nodeIdx, _conn = connected;
    requestAnimationFrame(function () { drawEdges(_cid, _idx, _conn); drawCrossEdges(); });
  } else {
    drawEdges(colId, nodeIdx, connected);
    drawCrossEdges();
  }
}

function clearGraphSelectionState() {
  _selectedGraphNodeEl = null;
  if (_collapseTimer) { clearTimeout(_collapseTimer); _collapseTimer = null; }

  // Restore collapsed nodes to display:block BEFORE removing has-selection
  // so the opacity fade-in plays from 0 → natural value
  _showAllGraphNodes();

  var bodyEl = document.getElementById('graph-body');
  if (bodyEl) bodyEl.classList.remove('has-selection');

  var nodes = document.querySelectorAll('#graph-body .graph-node');
  for (var i = 0; i < nodes.length; i++) {
    nodes[i].classList.remove('node-selected');
  }
}

function clearGraphSelection() {
  clearGraphSelectionState();
  drawEdges();
  drawCrossEdges();
}

function buildConnectedSet(colId, nodeIdx) {
  var connected = {};
  function add(cid, idx) {
    if (!connected[cid]) connected[cid] = {};
    connected[cid][idx] = true;
  }
  // Wrap in a has() shim since we're not using Set
  function has(obj, idx) { return obj && obj[idx] === true; }

  if (colId === 'gcol-2') {
    // Direct components only
    for (var ei = 0; ei < _descCompEdges.length; ei++) {
      if (_descCompEdges[ei].descIdx === nodeIdx) {
        add('gcol-3', _descCompEdges[ei].compIdx);
      }
    }
  }
  else if (colId === 'gcol-3') {
    // Only the alias vars that directly feed this component
    for (var ei2 = 0; ei2 < _descCompEdges.length; ei2++) {
      if (_descCompEdges[ei2].compIdx === nodeIdx) {
        add('gcol-2', _descCompEdges[ei2].descIdx);
      }
    }
  }

  // Attach has helper
  connected._has = has;
  return connected;
}

// ─── Edge drawing ─────────────────────────────────────────────────────────────

function scheduleDrawEdges() {
  if (_edgeRafPending) return;
  _edgeRafPending = true;
  requestAnimationFrame(function () {
    _edgeRafPending = false;
    // Preserve selection if still valid
    if (_selectedGraphNodeEl && _selectedGraphNodeEl.isConnected) {
      var col = _selectedGraphNodeEl.closest('.graph-col');
      if (col) {
        var colId    = col.id;
        var colNodes = Array.from(col.querySelectorAll('.graph-node:not(.more)'));
        var idx      = colNodes.indexOf(_selectedGraphNodeEl);
        if (idx !== -1) {
          drawEdges(colId, idx, buildConnectedSet(colId, idx));
          drawCrossEdges();
          return;
        }
      }
    }
    drawEdges();
    drawCrossEdges();
  });
}

function drawEdges(selColId, selNodeIdx, connected) {
  if (_viewMode !== 'graph') return;
  var svg = document.getElementById('graph-edges');
  if (!svg) return;
  svg.innerHTML = '';

  // No graph selection → draw all alias→component edges as dashed overview lines
  if (selColId === undefined) {
    var bodyElOv = document.getElementById('graph-body');
    if (!bodyElOv || _descCompEdges.length === 0) return;
    var bodyRectOv = bodyElOv.getBoundingClientRect();
    var accentOv   = getComputedStyle(document.documentElement).getPropertyValue('--text-muted').trim() || '#595959';
    var col2Ov = Array.from(document.querySelectorAll('#gcol-2 .graph-node:not(.more)'));
    var col3Ov = Array.from(document.querySelectorAll('#gcol-3 .graph-node:not(.more)'));
    for (var oi = 0; oi < _descCompEdges.length; oi++) {
      var oe = _descCompEdges[oi];
      if (oe.descIdx >= col2Ov.length || oe.compIdx >= col3Ov.length) continue;
      var dr = col2Ov[oe.descIdx].getBoundingClientRect();
      var cr = col3Ov[oe.compIdx].getBoundingClientRect();
      var ox1 = dr.right  - bodyRectOv.left, oy1 = dr.top  + dr.height / 2 - bodyRectOv.top;
      var ox2 = cr.left   - bodyRectOv.left, oy2 = cr.top  + cr.height / 2 - bodyRectOv.top;
      var ocx = (ox1 + ox2) / 2;
      var op  = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      op.setAttribute('d', 'M' + ox1 + ',' + oy1 + ' C' + ocx + ',' + oy1 + ' ' + ocx + ',' + oy2 + ' ' + ox2 + ',' + oy2);
      op.setAttribute('fill', 'none');
      op.setAttribute('stroke', accentOv);
      op.setAttribute('stroke-width', '1.5');
      op.setAttribute('stroke-opacity', '0.2');
      svg.appendChild(op);
    }
    return;
  }

  var bodyEl = document.getElementById('graph-body');
  if (!bodyEl) return;
  var bodyRect = bodyEl.getBoundingClientRect();

  var hasSel = true;

  function nr(el) {
    var r = el.getBoundingClientRect();
    return { x: r.left - bodyRect.left, y: r.top - bodyRect.top, w: r.width, h: r.height };
  }

  function bezier(x1, y1, x2, y2) {
    var cx = (x1 + x2) / 2;
    return 'M' + x1 + ',' + y1 + ' C' + cx + ',' + y1 + ' ' + cx + ',' + y2 + ' ' + x2 + ',' + y2;
  }

  function addEdge(x1, y1, x2, y2, fromCol, fromIdx, toCol, toIdx, fallbackDash) {
    var fromSel  = fromCol === selColId && fromIdx === selNodeIdx;
    var toSel    = toCol   === selColId && toIdx   === selNodeIdx;
    var fromConn = connected._has(connected[fromCol], fromIdx);
    var toConn   = connected._has(connected[toCol],   toIdx);

    // For alias/component selections: both endpoints must be selected or
    // connected — prevents unrelated upstream edges from lighting up.
    // For ancestor/semantic selections: either endpoint is enough.
    var active;
    if (selColId === 'gcol-2' || selColId === 'gcol-3') {
      active = (fromSel || fromConn) && (toSel || toConn);
    } else {
      active = (fromSel || toSel || fromConn || toConn);
    }

    // Only draw highlighted edges; skip all non-active ones
    if (!active) return;

    var strokeColor = getSelectionColor();
    var stroke = strokeColor, width = 1.5, opacity = 1, dash = undefined;

    var p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', bezier(x1, y1, x2, y2));
    p.setAttribute('fill', 'none');
    p.setAttribute('stroke', stroke);
    p.setAttribute('stroke-width', String(width));
    p.setAttribute('stroke-opacity', String(opacity));
    if (dash) p.setAttribute('stroke-dasharray', dash);
    svg.appendChild(p);
  }

  var col2 = Array.from(document.querySelectorAll('#gcol-2 .graph-node:not(.more)'));
  var col3 = Array.from(document.querySelectorAll('#gcol-3 .graph-node:not(.more)'));

  // Descendant → component edges
  if (_descCompEdges.length > 0) {
    for (var ei = 0; ei < _descCompEdges.length; ei++) {
      var e    = _descCompEdges[ei];
      var dIdx = e.descIdx;
      var cIdx = e.compIdx;
      if (dIdx < col2.length && cIdx < col3.length) {
        var dr2 = nr(col2[dIdx]);
        var cr  = nr(col3[cIdx]);
        addEdge(dr2.x + dr2.w, dr2.y + dr2.h / 2, cr.x, cr.y + cr.h / 2,
                'gcol-2', dIdx, 'gcol-3', cIdx);
      }
    }
  } else if (col2.length > 0 && col3.length > 0 &&
             selColId !== 'gcol-2' && selColId !== 'gcol-3') {
    // Fallback dashed edges only shown for ancestor/semantic selections —
    // suppressed for alias/component selections to avoid spurious fan lines.
    for (var fdi = 0; fdi < col2.length; fdi++) {
      for (var fci = 0; fci < col3.length; fci++) {
        var fdr = nr(col2[fdi]);
        var fcr = nr(col3[fci]);
        addEdge(fdr.x + fdr.w, fdr.y + fdr.h / 2, fcr.x, fcr.y + fcr.h / 2,
                'gcol-2', fdi, 'gcol-3', fci, '4 3');
      }
    }
  }
}

// ─── Cross-panel edges (left list → graph) ────────────────────────────────────

function clearCrossEdges() {
  var sp = document.getElementById('ce-spine');
  var br = document.getElementById('ce-bracket');
  if (sp) { sp.setAttribute('d', ''); sp.setAttribute('stroke-opacity', '0'); }

  var svg = document.getElementById('cross-edges');
  if (svg) {
    var dyn = svg.querySelectorAll('.ce-dynamic');
    for (var i = dyn.length - 1; i >= 0; i--) dyn[i].parentNode.removeChild(dyn[i]);
  }

function drawCrossEdges() {
  if (_viewMode !== 'graph') { clearCrossEdges(); return; }

  // Scope to the active (visible) list so hidden lists with stale
  // node-selected items don't return a getBoundingClientRect of {0,0,0,0}
  var _ceListId = _browserMode === 'components' ? 'comp-list' : 'var-list';
  var _ceList = document.getElementById(_ceListId);

  } else if (_selectedId || _selectedRemoteId) {
    selItem = _ceList ? _ceList.querySelector('.var-item.node-selected')
                      : document.querySelector('.var-item.node-selected');
  }
  if (!selItem) { clearCrossEdges(); return; }

  // Guard: if selItem is inside a hidden container its rect will be {0,0,0,0}
  var _tmpRect = selItem.getBoundingClientRect();
  if (_tmpRect.width === 0 && _tmpRect.height === 0) { clearCrossEdges(); return; }

  var svg = document.getElementById('cross-edges');
  if (!svg) return;

  // Remove previous dynamic paths
  var prev = svg.querySelectorAll('.ce-dynamic');
  for (var d = prev.length - 1; d >= 0; d--) prev[d].parentNode.removeChild(prev[d]);

  var hasGraphSel = !!_selectedGraphNodeEl;

  var targets;
  if (hasGraphSel && _selectedGraphNodeEl.getAttribute('data-binds-root') === '1') {
    targets = [_selectedGraphNodeEl];
  } else if (hasGraphSel) {
    var aa = document.querySelectorAll('#gcol-2 .graph-node:not(.more)');
    targets = aa.length === 0
      ? document.querySelectorAll('#gcol-3 .graph-node.node-selected')
      : document.querySelectorAll('#gcol-2 .graph-node.node-selected');
  } else {
    var fanT = document.querySelectorAll('#gcol-2 .graph-node:not(.more)');
    targets = fanT.length > 0 ? fanT : document.querySelectorAll('#gcol-3 .graph-node:not(.more)');
  }

  if (!targets || targets.length === 0) { clearCrossEdges(); return; }

  var strokeColor = hasGraphSel
    ? getSelectionColor()
    : (getComputedStyle(document.documentElement).getPropertyValue('--text-muted').trim() || '#595959');
  var opacity = hasGraphSel ? '1' : '0.2';

  var selRect = selItem.getBoundingClientRect();
  var x1 = selRect.right;
  var y1 = selRect.top + selRect.height / 2;

  for (var i = 0; i < targets.length; i++) {
    var r  = targets[i].getBoundingClientRect();
    // Skip nodes with zero size (hidden container) or fully outside the viewport
    if (r.width === 0 && r.height === 0) continue;
    if (r.bottom < 0 || r.top > window.innerHeight) continue;
    var x2 = r.left;
    var y2 = r.top + r.height / 2;
    var cx = (x1 + x2) / 2;
    var p  = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('class', 'ce-dynamic');
    p.setAttribute('d', 'M'+x1+','+y1+' C'+cx+','+y1+' '+cx+','+y2+' '+x2+','+y2);
    p.setAttribute('fill', 'none');
    p.setAttribute('stroke', strokeColor);
    p.setAttribute('stroke-width', '1.5');
    p.setAttribute('stroke-opacity', opacity);
    svg.appendChild(p);
  }
}

// ─── Status bar ───────────────────────────────────────────────────────────────


function updateStatusBar(chain, compCount) {
  if (!chain) return;
  var v = chain.self;

  document.getElementById('sb-type-icon').innerHTML = varTypeIconHtml(v.resolvedType, 16);
  document.getElementById('sb-name').textContent    = v.name;

  var sv    = _selectedId ? findVar(_selectedId) : findRemoteVar(_selectedRemoteId);
  var score = sv ? varImpactScore(sv) : 0;
  // If stored score is 0 but we have live component data, use component count as floor
  if (score === 0 && _currentComponents && _currentComponents.length > 0) {
    score = _currentComponents.length;
  }
  var chip  = document.getElementById('sb-impact');
  if (score === 0) {
    chip.textContent = 'Unused';
    chip.className   = 'badge none';
  } else {
    var tier = score <= 40 ? 'low' : score <= 100 ? 'medium' : 'high';
    chip.textContent = tier.charAt(0).toUpperCase() + tier.slice(1);
    chip.className   = 'badge ' + tier;
  }

  var ccEl = document.getElementById('sb-canvas-count');
  if (ccEl) ccEl.classList.add('hidden');

  // Focus is component-only, so always hide it for a variable.
  var focusBtn = document.getElementById('sb-focus-btn');
  if (focusBtn) focusBtn.classList.add('hidden');
  // Library indicator: show it for a token that comes from an external library,
  // matching the list rows and the component header.
  var sbLib = document.getElementById('sb-lib-badge');
  if (sbLib) {
    var isExternalToken = !!_selectedRemoteId || !!(v && v.isRemote);
    if (isExternalToken) {
      sbLib.setAttribute('data-tip', 'From an external library.');
      sbLib.classList.remove('hidden');
    } else {
      sbLib.classList.add('hidden');
    }
  }

  // Hide export and tree/list toggle when there is nothing to report or browse
  var hasDescs = (chain.descendants || []).length > 0;
  var hasComps = compCount !== null && compCount > 0;
  var exportBtn = document.getElementById('sb-export-btn');
  if (exportBtn) exportBtn.classList.toggle('hidden', !hasDescs && !hasComps);
  // The Place action now lives on the "Affected components" divider, so it needs
  // no status-bar visibility handling here.
  var toggle = document.getElementById('view-mode-toggle');
  if (toggle) toggle.classList.toggle('hidden', !hasDescs && !hasComps);
}

function renderListView(chain) {
  if (!chain) return;

  var aliasHdr   = document.getElementById('list-alias-hdr');
  var aliasBody  = document.getElementById('list-alias-body');
  var compHdrEl  = document.getElementById('list-comp-hdr');
  var compBodyEl = document.getElementById('list-comp-body');

  // Restore components section in case component was previously selected
  if (compHdrEl)  { compHdrEl.classList.remove('hidden'); }
  if (compBodyEl) compBodyEl.style.display = '';

  var descs = (chain.descendants || []).slice();
  if (aliasHdr) {
    if (descs.length === 0) {
      aliasHdr.classList.add('hidden');
    } else {
      aliasHdr.innerHTML = makeDividerContent('Alias tokens', null, descs.length);
      aliasHdr.classList.remove('hidden');
    }
  }
  if (aliasBody) {
    var aliasHtml = '';
    for (var di = 0; di < descs.length; di++) {
      var d = descs[di];
      aliasHtml += '<div class="buttonList" data-id="' + esc(d.id) + '">' +

        '<span class="lrow-name">' + esc(nodeLabelName(d.name)) + '</span>' +
        '<svg width="16" height="16" class="buttonList-arrow"><use href="#icon-arrow-right"/></svg>' +
      '</div>';

    aliasBody.innerHTML = aliasHtml;
    aliasBody.style.display = descs.length === 0 ? 'none' : '';
  }

  // When there are no alias tokens, the comp header is the first visible item —
  // ensure it is shown and labelled even before renderListComponents fills the count.
  if (descs.length === 0 && compHdrEl) {

    }

function renderListComponents(components) {
  var compHdr  = document.getElementById('list-comp-hdr');
  var compBody = document.getElementById('list-comp-body');
  if (!compBody) return;

  if (components === null) {
    if (compHdr) { compHdr.innerHTML = makeDividerContent('Affected components', null, ''); compHdr.classList.remove('hidden'); }
    compBody.style.display = '';
    compBody.innerHTML = '<div class="lrow dimmed" style="justify-content:center;gap:8px;">' +
      '<div class="spinner" style="width:12px;height:12px;border-width:1.5px;"></div>' +
      '<span style="font-size:var(--s-size);color:var(--text-muted)">Indexing components…</span>' +
    '</div>';
    return;
  }

  var filteredComps = (components || []).filter(function (c) {
    if (_displayDepth < 2 && c.isRemote) return false;
    return c.nodeName && c.nodeName.trim() !== '';
  });

  if (filteredComps.length === 0) {
    if (compHdr) compHdr.classList.add('hidden');
    compBody.style.display = 'none';
    return;
  }

  if (compHdr) { compHdr.innerHTML = makeDividerContent('Affected components', null, filteredComps.length) + placeActionBtnHtml(); compHdr.classList.remove('hidden'); }
  compBody.style.display = '';

  var sorted = filteredComps.slice().sort(function (a, b) {
    return (b.boundCount || 0) - (a.boundCount || 0);
  });
  var html = '';
  for (var i = 0; i < sorted.length; i++) {
    var c = sorted[i];
    html += '<div class="buttonList" data-node-id="' + esc(c.nodeId) + '" data-page-id="' + esc(c.pageId) + '">' +
      '<div class="lrow-icon">' + nodeTypeIcon(c.nodeType) + '</div>' +
      '<span class="lrow-name">' + esc(c.nodeName) + '</span>' +
      // Focus only for local components — a library master lives in another file
      // and can't be navigated to. Library components get a muted indicator instead.
      ((c.pageId && !_unreachableNodes.has(c.nodeId))

function onIndexProgress(text, scanned, total) {
  var el = document.getElementById('comp-load-text');
  if (!el) return;
  if (scanned != null && total != null && total > 0) {
    el.textContent = scanned + ' / ' + total;
  } else if (text) {
    el.textContent = text;
  }
}

function onIndexReady(components, remoteVars, remoteColls, varComponentCounts, varImpactScores) {
  _componentIndexBuilt = true;
  _currentComponents   = components || [];
  _varComponentCounts  = varComponentCounts || {};

  // 1. Merge remote vars from component scan
  {
    var remoteIdxMap    = {};
    var remoteLibKeyMap = {};
    for (var i = 0; i < _remoteVariables.length; i++) {
      remoteIdxMap[_remoteVariables[i].id] = i;
      if (_remoteVariables[i].libraryKey) remoteLibKeyMap[_remoteVariables[i].libraryKey] = i;
    }

    // Only merge remote vars into the list if a Full scan has been run —
    // prevents external vars discovered during analysis from appearing prematurely
    if (remoteVars && remoteVars.length > 0 && _externalScanDone) {
      for (var j = 0; j < remoteVars.length; j++) {
        var rv = remoteVars[j];
        if (remoteIdxMap[rv.id] !== undefined) {
          _remoteVariables[remoteIdxMap[rv.id]].componentCount = rv.dependentCount;
        } else if (rv.libraryKey && remoteLibKeyMap[rv.libraryKey] !== undefined) {
          var stub = _remoteVariables[remoteLibKeyMap[rv.libraryKey]];
          stub.id             = rv.id;
          stub.libraryKey     = rv.libraryKey;
          stub.componentCount = rv.dependentCount;
          if (rv.hex) stub.hex = rv.hex;
          remoteIdxMap[rv.id] = remoteLibKeyMap[rv.libraryKey];
        } else {
          _remoteVariables.push({
            id: rv.id, libraryKey: rv.libraryKey || null, name: rv.name,
            resolvedType: rv.resolvedType, variableCollectionId: rv.variableCollectionId,
            hex: rv.hex, aliasCount: 0, componentCount: rv.dependentCount, isRemote: true,
          });
        }
      }
    }

    if (varComponentCounts) {
      for (var rc = 0; rc < _remoteVariables.length; rc++) {
        var rvid = _remoteVariables[rc].id;
        if (rvid && rvid.indexOf('LIB_KEY:') !== 0 && varComponentCounts[rvid] !== undefined) {
          _remoteVariables[rc].componentCount = varComponentCounts[rvid];
        }
      }
    }

    if (remoteColls && remoteColls.length > 0) {
      var rcIdxMap = {};
      for (var rci = 0; rci < _remoteCollections.length; rci++) rcIdxMap[_remoteCollections[rci].id] = true;
      for (var rcj = 0; rcj < remoteColls.length; rcj++) {
        if (!rcIdxMap[remoteColls[rcj].id]) _remoteCollections.push(remoteColls[rcj]);
      }
    }
  }

  // 2. Update local vars
  var idxMap = {};
  for (var li = 0; li < _variables.length; li++) idxMap[_variables[li].id] = li;
  if (remoteVars) {
    for (var lj = 0; lj < remoteVars.length; lj++) {
      if (idxMap[remoteVars[lj].id] !== undefined) {
        _variables[idxMap[remoteVars[lj].id]].dependentCount = remoteVars[lj].dependentCount;
      }
    }
  }

  // 3. Stamp impact scores and component counts
  for (var k = 0; k < _variables.length; k++) {
    var vid = _variables[k].id;
    if (varImpactScores && varImpactScores[vid] !== undefined) _variables[k].impactScore = varImpactScores[vid];
    if (varComponentCounts && varComponentCounts[vid] !== undefined) _variables[k].componentCount = varComponentCounts[vid];
  }

  // 4. Re-render list
  renderBrowser();

  // Scroll selected var back into view after list re-render (tiers may have shifted)
  requestAnimationFrame(function () {
    var activeId  = _selectedId || _selectedRemoteId;
    var isRemote  = !_selectedId && !!_selectedRemoteId;
    if (activeId) {
      var sel = document.querySelector(
        '.var-item[data-id="' + activeId + '"][data-remote="' + (isRemote ? '1' : '0') + '"]'
      );
      if (sel) scrollVarToCenter(sel);
    }
  });

  // 5. Update graph components
  renderComponents(_currentComponents);

  // 6. Update list view components
  if (_viewMode === 'list') renderListComponents(_currentComponents);

  // 7. Update status bar
  if (_currentChain) updateStatusBar(_currentChain, _currentComponents.length);
}

// Sliding pill: updateSegPill + init + ResizeObserver come from ui-shared.js (base) —

// Sync the 3-way browser-mode segmented control so exactly the active mode's button is selected.
function syncBrowserModeButtons(mode) {
  var btnTokens = document.getElementById('btn-mode-tokens');
  var btnComps  = document.getElementById('btn-mode-comps');
  if (btnTokens) btnTokens.classList.toggle('selected', mode === 'tokens');
  if (btnComps)  btnComps.classList.toggle('selected',  mode === 'components');
  var toggle = document.getElementById('browser-mode-toggle');
  updateSegPill(toggle);
  // These buttons are `flex:1 1 0; width:0`, so offsetWidth is only correct once
  // flex layout has resolved. When this runs inside a search-driven auto-switch
  // the measurement can land mid-layout and collapse the pill to a sliver, so
  // re-measure on the next frame.
  requestAnimationFrame(function () { updateSegPill(toggle, true); });
}

function switchBrowserMode(mode) {
  if (_browserMode === mode) return;
  _browserMode = mode;
  updatePlaceholderText(mode);
  // Swap placeholder icon based on active tab
  var phIcon = document.getElementById('right-placeholder-icon');
  if (phIcon) {
    phIcon.setAttribute('href',
      mode === 'components' ? '#icon-empty-component' : '#icon-empty-token');
  }

  var varList  = document.getElementById('var-list');
  var compList = document.getElementById('comp-list');

    if (compList) { compList.classList.remove('has-list-selection'); compList.querySelectorAll('.node-selected').forEach(function (el) { el.classList.remove('node-selected'); }); }
  }
  if (mode !== 'tokens') {

    if (varList) { varList.classList.remove('has-list-selection'); varList.querySelectorAll('.node-selected').forEach(function (el) { el.classList.remove('node-selected'); }); }
  }

  if (_trackedSelDiv) _trackedSelDiv.classList.remove('divider-away');
  _trackedSelDiv = null; _trackedNextDiv = null; _trackedList = null;
  _selectedVarOriginScroll  = null;

  if (mode === 'components') {
    if (varList)  varList.classList.add('hidden');
    if (compList) compList.classList.remove('hidden');

    if (_selectedCompNodeId) compList.classList.add('has-list-selection');
    renderComponentBrowser();
    if (_selectedCompNodeId) {
      var selComp = null;
      for (var sci = 0; sci < _allBrowserComponents.length; sci++) {
        if (_allBrowserComponents[sci].nodeId === _selectedCompNodeId) { selComp = _allBrowserComponents[sci]; break; }
      }
      if (selComp) {
        renderComponentDetail(selComp);
        requestAnimationFrame(function () {
          var selEl = compList.querySelector('.comp-item.node-selected');
          if (selEl) scrollVarToCenter(selEl, compList, 'instant');
          setupDividerTracking('comp-list');
          scheduleDrawEdges();

    } else { resetRightPanel(); }
  } else {
    var bodyEl2 = document.getElementById('graph-body');
    if (bodyEl2) bodyEl2.classList.remove('comp-mode');
    var lbl2 = document.getElementById('gcol-2-lbl');
    if (lbl2) lbl2.textContent = 'Alias tokens';
    if (compList) compList.classList.add('hidden');
    if (varList)  varList.classList.remove('hidden');

    if (_selectedId || _selectedRemoteId) varList.classList.add('has-list-selection');
    renderBrowser();
    if (_selectedId || _selectedRemoteId) {
      requestAnimationFrame(function () {
        var selEl = varList.querySelector('.var-item.node-selected');
        if (selEl) scrollVarToCenter(selEl, varList, 'instant');
        setupDividerTracking('var-list');
        scheduleDrawEdges();
      });
    } else { resetRightPanel(); }
  }

  if (varList)  varList.scrollTop  = 0;
  if (compList) compList.scrollTop = 0;
  _selectedVarOriginScroll  = null;
  _selectedCompOriginScroll = null;
}

function makeCompItem(c) {
  var isSelected = c.nodeId === _selectedCompNodeId;

  if (isSelected) classes += ' node-selected';

    ? '<span class="comp-item-focus-btn" data-node-id="' + esc(c.nodeId) + '" data-page-id="' + pageIdAttr + '" data-tip="Focus on canvas"><svg width="16" height="16"><use href="#icon-focus"/></svg></span>'
    : '<span class="tooltipButton lib-badge" data-tip="From an external library. No canvas focus."><svg width="12" height="12"><use href="#icon-library"/></svg></span>';

function renderComponentBrowser() {
  var compList = document.getElementById('comp-list');
  var emptyEl  = document.getElementById('browser-empty');
  if (!compList) return;

  if (!_compBrowserLoaded) {
    compList.innerHTML = '<div class="empty-state"><div class="empty-state-content"><p>Component data loads with init.<br>Run a Usage Scan to add instance counts.</p></div></div>';
    return;
  }

  var q = _filterQuery.toLowerCase();
  var filtered = _allBrowserComponents.filter(function (c) {
    if (_displayDepth < 2 && c.isRemote) return false;
    return matchesSearch(c.nodeName, '', q);
  });

  if (filtered.length === 0) {
    compList.innerHTML = '';
    // Check if tokens have results and auto-switch before showing empty state
    updateBrowserTabStates();
    if (_browserMode !== 'components') return; // switched away — don't render empty state here
    if (emptyEl) {
      var p = emptyEl.querySelector('p');
      if (p) p.innerHTML = _allBrowserComponents.length === 0
        ? 'No components with<br>bound variables found.'
        : 'No components match<br>your search.';
      showBrowserEmpty(true);
    }
    document.body.classList.add('browser-empty');
    return;
  }
  showBrowserEmpty(false);
  document.body.classList.remove('browser-empty');

  // Group by bound-token count tiers
  var high = [], medium = [], low = [];
  for (var gi = 0; gi < filtered.length; gi++) {
    var bc = filtered[gi].boundCount || 1;
    if (bc >= 5)      high.push(filtered[gi]);
    else if (bc >= 2) medium.push(filtered[gi]);
    else              low.push(filtered[gi]);
  }

  function compScoreSort(arr) {
    return arr.slice().sort(function(a, b) {
      var diff = (b.boundCount || 0) - (a.boundCount || 0);
      return diff !== 0 ? diff : (a.nodeName < b.nodeName ? -1 : a.nodeName > b.nodeName ? 1 : 0);
    });
  }

  function makeCompSection(label, tier, items) {
    if (items.length === 0) return '';
    var s = makeDivider(label, tier, items.length);
    var sorted = compScoreSort(items);
    for (var si = 0; si < sorted.length; si++) s += makeCompItem(sorted[si]);
    return s;
  }

  var html = makeCompSection('High',   'high',   high) +
             makeCompSection('Medium', 'medium', medium) +
             makeCompSection('Low',    'low',    low);
  compList.innerHTML = html;
  compList.classList.toggle('has-list-selection', !!_selectedCompNodeId);
  updateBrowserTabStates();

  // Listeners are handled by the delegated handler on #comp-list — nothing to attach here.
}

function onCompItemClick(e) {
  if (e instanceof Event) {
    var focusTarget = e.target.closest('.comp-item-focus-btn, .node-focus-btn');
    if (focusTarget) {
      var fnId = focusTarget.getAttribute('data-node-id');
      var fnPage = focusTarget.getAttribute('data-page-id');
      if (fnId) parent.postMessage({ pluginMessage: { type: 'focus-node', nodeId: fnId, pageId: fnPage } }, '*');
      return;
    }
  }
  // The chevron always SELECTS its node — never toggles — so clicking it can't
  // accidentally deselect an already-selected row the way the row body does.
  var viaChevron = (e instanceof Event) && !!e.target.closest('.node-goto-btn, .var-item-chevron');

  var btn    = (e instanceof Event) ? e.target.closest('.comp-item') : e;
  if (!btn) return;
  var nodeId = btn.getAttribute('data-node-id');
  if (!nodeId) return;
  // The search survives selecting a result — it's the working set, and you may
  // want to click through several matches. Only drilling out of the detail panel
  // (navigateToComponent, drillIntoVar) clears it, since the target may sit
  // outside the query. Matches the token list, which never cleared here.

  // Chevron on the already-selected component → no-op (never deselect, never
  // re-run the render), matching the token list.
  if (viaChevron && nodeId === _selectedCompNodeId) return;

  var _activeCompList = document.getElementById('comp-list');

  // Re-click the row body on an already-selected item → scroll to origin, then
  // deselect. Not reachable via the chevron (handled above).
  if (nodeId === _selectedCompNodeId && !viaChevron) {
    var originScroll2 = _selectedCompOriginScroll;
    if (originScroll2 !== null) _activeCompList.scrollTo({ top: originScroll2, behavior: 'smooth' });
    setTimeout(function () {
      clearAllSelections();
      resetRightPanel();
    }, 320);
    return;
  }

  // Record origin scroll, then wipe every other selection
  var savedCompScroll = _activeCompList.scrollTop;
  clearAllSelections();
  _selectedCompOriginScroll = savedCompScroll;
  _selectedCompNodeId = nodeId;

  var items = _activeCompList.querySelectorAll('.comp-item');
  for (var i = 0; i < items.length; i++) {
    items[i].classList.toggle('node-selected', items[i].getAttribute('data-node-id') === nodeId);
  }
  _activeCompList.classList.add('has-list-selection');
  setupDividerTracking('comp-list');

  var comp = null;
  for (var j = 0; j < _allBrowserComponents.length; j++) {
    if (_allBrowserComponents[j].nodeId === nodeId) { comp = _allBrowserComponents[j]; break; }
  }
  if (!comp) return;
  renderComponentDetail(comp);
  scheduleDrawEdges();
}

  // Focus button — only meaningful for local components (library masters

  var isLibComp = comp.isRemote === true || !comp.pageId;

  var ccEl2 = document.getElementById('sb-canvas-count');

  // Only show export when component has bound tokens (otherwise nothing to report)
  var exportBtnComp = document.getElementById('sb-export-btn');
  if (exportBtnComp) exportBtnComp.classList.toggle('hidden', (comp.boundVars || []).length === 0);

  // The Place action lives on the "Affected components" divider, which never shows
  // in the component detail (this view has no affected-components column), so there
  // is nothing to hide here.

  // Keep list view in sync if it's the active view
  if (_viewMode === 'list') renderListComponentDetail(comp);

  scheduleDrawEdges();
}

function drillToTokenMode(varId) {
  var bodyEl = document.getElementById('graph-body');
  if (bodyEl) bodyEl.classList.remove('comp-mode');
  var lbl2 = document.getElementById('gcol-2-lbl');
  if (lbl2) lbl2.textContent = 'Alias tokens';

  _browserMode = 'tokens';
  syncBrowserModeButtons('tokens');

  var varList  = document.getElementById('var-list');
  var compList = document.getElementById('comp-list');
  if (compList) compList.classList.add('hidden');
  if (varList)  varList.classList.remove('hidden');

  // Route to local or remote path depending on where the variable lives
  if (findVar(varId)) {
    drillIntoVar(varId);
  } else {
    // Drop the component we drilled out of. The local branch gets this via
    // drillIntoVar; without it _selectedCompNodeId survives into token mode and
    // drawCrossEdges hunts for a .comp-item inside #var-list, finds none, and
    // clears every connector — the token renders with no lines to its components.
    clearAllSelections();
    _selectedRemoteId  = varId;
    clearSearchIfActive(); // clear before DOM query so remote var-item is in the list
    var items = varList.querySelectorAll('.var-item');
    for (var i = 0; i < items.length; i++) {
      var match = items[i].getAttribute('data-id') === varId && items[i].getAttribute('data-remote') === '1';
      items[i].classList.toggle('node-selected', match);
    }
    varList.classList.add('has-list-selection');
    var selEl = varList.querySelector('.var-item.node-selected');
    if (selEl) scrollVarToCenter(selEl);
    resetRightPanel();
    var rv = findRemoteVar(varId);
    parent.postMessage({ pluginMessage: {
      type: 'analyze-remote', variableId: varId,
      varName:        rv ? rv.name        : null,
      resolvedType:   rv ? rv.resolvedType : null,
      collectionName: rv ? (rv.collectionName || rv.libraryName || '') : '',
    } }, '*');
  }
}
