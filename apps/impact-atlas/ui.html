// ─── Canvas scan ─────────────────────────────────────────────────────────────

var _scanStartTime = null;
var _scanEtaShown  = false;

function onCanvasScanProgress(pct) {
  if (!_canvasScanRunning) return; // cancelled — ignore stale progress from backend
  pct = pct || 0;

  var eta = '';
  var elapsed = (Date.now() - _scanStartTime) / 1000;
  if (pct > 0 && elapsed >= 5) {
    var remaining = Math.round(elapsed / pct * (100 - pct) * 1.5);
    if (remaining >= 60) {
      var m = Math.floor(remaining / 60), s = remaining % 60;
      eta = '~' + m + 'm ' + (s > 0 ? s + 's' : '') + ' remaining';
    } else if (remaining > 0) {
      eta = '~' + remaining + 's remaining';
    }
  }

  if (eta) _scanEtaShown = true;
  var scanLabel = _lastScanDepth === 3 ? 'Full scan… ' : 'Extended scan… ';
  showScanProgress(scanLabel + pct + '%', _scanEtaShown ? (eta || '…') : '');
}

// label format: "Some text… 42%" — we split at the last space before the pct
function _splitLabelPct(label) {
  var m = label.match(/^(.*?)\s+(\d+%)$/);
  return m ? { text: m[1], pct: m[2] } : { text: label, pct: '' };
}

function showScanProgress(label, eta, onCancel) {
  var cont = document.getElementById('progress-container');
  if (!cont) return;
  var parts = _splitLabelPct(label);
  var existing = cont.querySelector('.progress-msg');
  if (existing) {
    var textEl  = existing.querySelector('.scan-text');
    var pctEl   = existing.querySelector('.scan-pct');
    var etaEl   = existing.querySelector('.scan-eta');
    var hasEta  = !!(eta && eta.length);
    if (textEl) textEl.textContent = parts.text;
    if (pctEl) {
      pctEl.textContent = parts.pct;
      pctEl.classList.toggle('pct-visible', !!(parts.pct && parts.pct !== '0%'));
    }
    if (etaEl)  etaEl.textContent  = eta || '';
    existing.classList.toggle('has-eta', hasEta);
    return;
  }
  cont.innerHTML =
    '<div class="progress-msg progress-msg--scan">' +
      '<div class="toast-content">' +
        '<div class="toast-spinner"></div>' +
        '<div class="scan-info">' +
          '<span class="scan-label"><span class="scan-text">' + parts.text + '</span> <span class="scan-pct">' + parts.pct + '</span></span>' +
          '<span class="scan-eta">' + (eta || '') + '</span>' +
        '</div>' +
      '</div>' +
      '<button class="buttonTertiary" id="scan-cancel-btn"><span>Cancel</span></button>' +
    '</div>';
  var cancelBtn = document.getElementById('scan-cancel-btn');
  if (cancelBtn) {
    cancelBtn.addEventListener('click', function () {
      var c = document.getElementById('progress-container');
      if (c) c.innerHTML = '';
      if (typeof onCancel === 'function') onCancel();
    });
  }
}

function onCanvasScanCancelled() {
  _canvasScanRunning = false;
  // Cancelled scan doesn't count — revert lastScanDepth to current display depth
  // so the modal pre-selects the right level and the timestamp stays unchanged.
  _lastScanDepth = _displayDepth;
  var btn = document.getElementById('canvas-scan-btn');
  if (btn) btn.classList.remove('scanning');
  var rescanBtn = document.getElementById('rescan-btn');
  if (rescanBtn) rescanBtn.disabled = false;
  dismissProgress();
}

function formatScanAge(ts) {
  var d = Date.now() - ts;
  var m = Math.floor(d / 60000);
  if (m < 1)  return 'just now';
  if (m < 60) return m + 'm ago';
  var h = Math.floor(m / 60);
  if (h < 24) return h + 'h ago';
  var days = Math.floor(h / 24);
  if (days < 7) return days + ' day' + (days === 1 ? '' : 's') + ' ago';
  var dt = new Date(ts);
  var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var label = dt.getDate() + ' ' + months[dt.getMonth()];
  if (dt.getFullYear() !== new Date().getFullYear()) label += ' ' + dt.getFullYear();
  return label;
}

function showScanBar(ts, depth) {
  var bar = document.getElementById('last-scan-bar');
  if (!bar) return;
  var lbl = document.getElementById('scan-age-label');
  if (lbl) lbl.textContent = formatScanAge(ts);
  bar.classList.remove('hidden');
  // Re-wire rescan button (clone to drop any stale listener)
  var btn = document.getElementById('rescan-btn');
  if (btn) {
    var fresh = btn.cloneNode(true);
    btn.parentNode.replaceChild(fresh, btn);
    fresh.addEventListener('click', function() {
      if (_displayDepth <= 1) {
        triggerFullRescan(); // local analysis re-runs via init
      } else {
        triggerCanvasScan(_displayDepth);
      }
    });
  }
}

function onCanvasScanReady(msg) {
  var scanDepth = msg.depth || 3;
  _externalScanDone = scanDepth >= 2;
  _canvasScanDone   = scanDepth >= 3;
  _displayDepth     = scanDepth;
  _canvasScanRunning = false;
  updateScanState();
  _canvasInstanceCounts = msg.instanceCounts || {};
  _canvasDirectCounts   = msg.directCounts   || {};

  // Merge into a single total for convenience
  _canvasBindings = {};
  var allIds = new Set(Object.keys(_canvasInstanceCounts).concat(Object.keys(_canvasDirectCounts)));
  allIds.forEach(function (id) {
    _canvasBindings[id] = (_canvasInstanceCounts[id] || 0) + (_canvasDirectCounts[id] || 0);
  });

  var total = msg.total || 0;

  // Merge remote/library vars discovered during Phase 2 into the browser
  if (msg.remoteVars && msg.remoteVars.length > 0) {
    var existingRemoteIds = {};
    for (var ri = 0; ri < _remoteVariables.length; ri++) existingRemoteIds[_remoteVariables[ri].id] = true;
    for (var rj = 0; rj < msg.remoteVars.length; rj++) {
      if (!existingRemoteIds[msg.remoteVars[rj].id]) _remoteVariables.push(msg.remoteVars[rj]);
    }
  }
  if (msg.remoteColls && msg.remoteColls.length > 0) {
    var existingCollIds = {};
    for (var rci = 0; rci < _remoteCollections.length; rci++) existingCollIds[_remoteCollections[rci].id] = true;
    for (var rcj = 0; rcj < msg.remoteColls.length; rcj++) {
      if (!existingCollIds[msg.remoteColls[rcj].id]) _remoteCollections.push(msg.remoteColls[rcj]);
    }
  }
  // A scan that surfaced remote tokens proves the file uses an external library,
  // regardless of what the library API reported at init.
  if (_remoteVariables.length > 0) _hasExternalLibraries = true;

  var btn = document.getElementById('canvas-scan-btn');
  if (btn) btn.classList.remove('scanning');

  _scanStartTime = null;
  _scanEtaShown  = false;
  var progCont = document.getElementById('progress-container');
  if (progCont) progCont.innerHTML = '';

  var newCompCounts  = msg.updatedComponentCounts || null;
  var newScores      = msg.updatedImpactScores    || null;

  // Replace the local variable list with the freshly-scanned one so deletions,
  // additions and renames are reflected — the scores/counts below re-attach to it.
  // (Remote vars are reconciled separately above; only local vars are replaced here.)
  if (Array.isArray(msg.variables)) _variables = msg.variables;
  if (Array.isArray(msg.collections)) _collections = msg.collections;

  // Bake canvas data into each variable's cached impact score (local + remote)
  var allVarsForCanvas = _variables.concat(_remoteVariables);
  for (var i = 0; i < allVarsForCanvas.length; i++) {
    var v = allVarsForCanvas[i];
    var instCount = _canvasInstanceCounts[v.id] || 0;
    var dirCount  = _canvasDirectCounts[v.id]   || 0;
    v.canvasInstances = instCount;
    v.canvasDirect    = dirCount;
    // Apply rebuilt component count (library components merged in)
    if (newCompCounts && newCompCounts[v.id] !== undefined) {
      v.componentCount = newCompCounts[v.id];
    }
    // Apply rebuilt impact score, then add canvas contribution on top
    if (newScores && newScores[v.id] !== undefined) {
      v.impactScore = newScores[v.id];
    }
    // Save pre-canvas score (depth=2 view uses this)
    v._preCanvasScore = v.impactScore !== undefined ? v.impactScore : varImpactScoreBase(v);
    if (instCount > 0 || dirCount > 0) {
      var base = v._preCanvasScore;
      v.impactScore = base + instCount * 5 + dirCount * 2;
    }
  }

  // Merge newly discovered library components into the browser list
  var newLibComps = msg.newLibraryComponents || [];
  for (var li = 0; li < newLibComps.length; li++) {
    var lc = newLibComps[li];
    var alreadyIn = false;
    for (var ai = 0; ai < _allBrowserComponents.length; ai++) {
      if (_allBrowserComponents[ai].nodeId === lc.nodeId) { alreadyIn = true; break; }
    }
    if (!alreadyIn) _allBrowserComponents.push(lc);
  }

  // Reset all selections and go back to Tokens tab
  _selectedId              = null;
  _selectedRemoteId        = null;
  _selectedCompNodeId      = null;
  _currentComponents       = null;
  _selectedVarOriginScroll = null;
  _selectedCompOriginScroll = null;

  resetRightPanel();
  switchBrowserMode('tokens');

  // Instance counts merged — re-render
  renderBrowser();

  // Update last-scan bar (only for fresh scans — cache restore calls showScanBar separately)
  if (!msg._fromCache) {
    _lastScanTimestamp = Date.now();
    showScanBar(_lastScanTimestamp, scanDepth);
    // Re-enable rescan button (was disabled by triggerCanvasScan)
    var rescanBtn = document.getElementById('rescan-btn');
    if (rescanBtn) rescanBtn.disabled = false;
  }
}

  if (progCont) progCont.innerHTML = '';

// ─── Section-divider unstick tracking ────────────────────────────────────────

function setupDividerTracking(listId) {
  // Clear old state
  if (_trackedSelDiv) _trackedSelDiv.classList.remove('divider-away');
  _trackedSelDiv = null; _trackedNextDiv = null; _trackedList = null; _trackedNextTop = 0;

  var container = document.getElementById(listId);
  if (!container) return;
  var selEl = container.querySelector('.node-selected');
  if (!selEl) return;

  // Walk backwards to find the divider that owns this item
  var el = selEl.previousElementSibling;
  while (el) {
    if (el.classList.contains('dividerSection')) { _trackedSelDiv = el; break; }
    el = el.previousElementSibling;
  }
  // Walk forwards to find the next divider
  el = selEl.nextElementSibling;
  while (el) {
    if (el.classList.contains('dividerSection')) { _trackedNextDiv = el; break; }
    el = el.nextElementSibling;
  }

  if (!_trackedSelDiv || !_trackedNextDiv) return; // last section — nothing to do

  _trackedList    = container;
  _trackedNextTop = _trackedNextDiv.offsetTop; // natural position relative to .scroll-area
}

function updateDividerTracking() {
  if (!_trackedSelDiv || !_trackedNextDiv || !_trackedList) return;
  // Swap 14px before the next divider reaches its pinned top (86px, was 84 when
  // the DS divider was 42px tall) so the collapse starts just ahead of contact
  var pinned = _trackedList.scrollTop >= _trackedNextTop - 72;
  _trackedSelDiv.classList.toggle('divider-away', pinned);
}

document.getElementById('search-input').addEventListener('input', function (e) {

// Switch to the Components left-panel view and select the given component,
// mirroring what happens when the user clicks it directly in the comp list.
function navigateToComponent(nodeId) {
  var compList = document.getElementById('comp-list');
  if (!compList) return;

  // Find comp data — check both the browser list and the current variable's component list
  var comp = null;
  for (var i = 0; i < _allBrowserComponents.length; i++) {
    if (_allBrowserComponents[i].nodeId === nodeId) { comp = _allBrowserComponents[i]; break; }
  }
  if (!comp && _currentComponents) {
    for (var ci = 0; ci < _currentComponents.length; ci++) {
      if (_currentComponents[ci].nodeId === nodeId) { comp = _currentComponents[ci]; break; }
    }
  }
  if (!comp) return;

  // Ensure comp is in _allBrowserComponents so renderComponentBrowser renders it
  var inBrowser = false;
  for (var bi = 0; bi < _allBrowserComponents.length; bi++) {
    if (_allBrowserComponents[bi].nodeId === nodeId) { inBrowser = true; break; }
  }
  if (!inBrowser) _allBrowserComponents.push(comp);

  // Wipe everything, then set comp selection
  clearAllSelections();
  _selectedCompNodeId = nodeId;

  // Clear active search NOW — comp is in _allBrowserComponents and _selectedCompNodeId is set,
  // so renderBrowser() (called inside) will include and pre-select the comp in the DOM.
  clearSearchIfActive();

  // Switch to components mode
  if (_browserMode !== 'components') switchBrowserMode('components');

  _selectedCompOriginScroll = compList.scrollTop;

  var items = compList.querySelectorAll('.comp-item');
  var targetEl = null;
  for (var j = 0; j < items.length; j++) {
    var match = items[j].getAttribute('data-node-id') === nodeId;
    items[j].classList.toggle('node-selected', match);
    if (match) targetEl = items[j];
  }
  compList.classList.add('has-list-selection');
  setupDividerTracking('comp-list');
  renderComponentDetail(comp);

  if (targetEl) {
    requestAnimationFrame(function () {
      var saved = targetEl.style.position;
      targetEl.style.position = 'static';
      var naturalTop = targetEl.offsetTop;
      targetEl.style.position = saved;
      var top = naturalTop - (compList.clientHeight / 2) + (targetEl.offsetHeight / 2);
      compList.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
      scheduleDrawEdges();
    });
  } else {
    scheduleDrawEdges();
  }
}

function clearSearchSelection() {
  _selectedId          = null;
  _selectedRemoteId    = null;
  _selectedCompNodeId  = null;
  _currentChain        = null;

// ─── Export ──────────────────────────────────────────────────────────────────

function buildExportText() {
  var lines = [];

  function typLabel(t) {
    return t === 'COLOR' ? 'Color' : t === 'FLOAT' ? 'Number' : t === 'STRING' ? 'String' : t === 'BOOLEAN' ? 'Boolean' : t || 'Variable';
  }


  if (_detailMode === 'variable' && _currentChain) {
    var v = _currentChain.self;
    var sv = _selectedId ? findVar(_selectedId) : findRemoteVar(_selectedRemoteId);
    var score = sv ? varImpactScore(sv) : varImpactScore(v);
    var tier  = score === 0 ? 'Unused' : score <= 40 ? 'Low' : score <= 100 ? 'Medium' : 'High';

    lines.push(v.name);
    var headerParts = [typLabel(v.resolvedType)];
    if (v.collectionName) headerParts.push(v.collectionName);
    headerParts.push(tier);
    lines.push(headerParts.join('  ·  '));
    lines.push('');

    var descs = _currentChain.descendants || [];
    if (descs.length > 0) {
      lines.push('Alias tokens (' + descs.length + ')');
      for (var di = 0; di < descs.length; di++) {
        var d = descs[di];
        lines.push('  • ' + d.name + '  ' + typLabel(d.resolvedType) + (d.collectionName ? '  · ' + d.collectionName : ''));
      }
      lines.push('');
    }

    var comps = _currentComponents || [];
    if (comps.length > 0) {
      lines.push('Components (' + comps.length + ')');
      for (var ci = 0; ci < comps.length; ci++) {
        lines.push('  • ' + comps[ci].nodeName);
      }
    }

  } else if (_detailMode === 'component' && _currentComp) {
    var c = _currentComp;
    lines.push(c.nodeName);
    lines.push('');

    var bvars = c.boundVars || [];
    if (bvars.length > 0) {
      lines.push('Bound tokens (' + bvars.length + ')');
      for (var bvi = 0; bvi < bvars.length; bvi++) {
        var bv = bvars[bvi];
        lines.push('  • ' + bv.name + '  ' + typLabel(bv.resolvedType) + (bv.collectionName ? '  · ' + bv.collectionName : ''));
      }
    }
  }

  return lines.join('\n');
}


;

function currentCompletedDepth() {

function updateScanState() {
  // Update toolbar label — reflect display depth, not max completed
  var el = document.getElementById('scan-status-level');
  var depthLabels = { 1: 'Local Scan', 2: 'Extended Scan', 3: 'Full Scan' };
  if (el) el.textContent = depthLabels[_displayDepth] || 'Local Scan';

  var doneDepth = _canvasScanDone ? 3 : (_externalScanDone ? 2 : 1);

function updateSelectionState() {
  var selected = document.querySelector('input[name="scan-depth"]:checked');
  var depth = selected ? parseInt(selected.value, 10) : 0;

  if (!container) return;

function updateApplyBtn() {

    ? 'Apply' : 'Apply and Scan';
}

function openDeepScanModal() {
  var modal = document.getElementById('deep-scan-modal');
  if (!modal) return;
  if (_closeModalTimer) { clearTimeout(_closeModalTimer); _closeModalTimer = null; modal.classList.remove('is-closing'); }

  // Pre-select current display depth; fall back to completed; retry cancelled scan if deeper
  var completed = currentCompletedDepth();
  var defaultDepth = (_lastScanDepth && _lastScanDepth > completed)
    ? _lastScanDepth
    : _displayDepth;
  document.querySelectorAll('input[name="scan-depth"]').forEach(function (r) { r.checked = false; });
  var radio = document.getElementById('depth-radio-' + defaultDepth);
  if (radio) radio.checked = true;

  var opt2 = document.getElementById('depth-opt-2');
  var opt3 = document.getElementById('depth-opt-3');
  if (opt2) opt2.classList.toggle('unavailable', !_hasExternalLibraries);
  if (opt2) opt2.classList.toggle('done', _externalScanDone);
  if (opt3) opt3.classList.toggle('done', _canvasScanDone);

  updateScanState();
  updateSelectionState();
  updateApplyBtn();
  modal.classList.add('is-open');
}

var _closeModalTimer = null;

function closeDeepScanModal() {
  var modal = document.getElementById('deep-scan-modal');
  if (!modal) return;
  modal.classList.add('is-closing');
  _closeModalTimer = setTimeout(function () {
    modal.classList.remove('is-open', 'is-closing');
    _closeModalTimer = null;
    // Reset radios back to current display depth so next open is always clean
    var container = document.querySelector('.depth-options');
    if (container) container.removeAttribute('data-depth');
    document.querySelectorAll('input[name="scan-depth"]').forEach(function (r) { r.checked = false; });
    var radio = document.getElementById('depth-radio-' + _displayDepth);
    if (radio) radio.checked = true;
  }, 160);
}

document.getElementById('scan-status-change-btn').addEventListener('click', function (e) {
  e.preventDefault();
  openDeepScanModal();
});

document.getElementById('modal-cancel-btn').addEventListener('click', closeDeepScanModal);

document.getElementById('modal-confirm-btn').addEventListener('click', function () {
  var selected = document.querySelector('input[name="scan-depth"]:checked');
  var depth = selected ? parseInt(selected.value, 10) : 3;
  closeDeepScanModal();
  if (depth <= currentCompletedDepth()) {
    // Already have the data — just update display depth and re-render instantly
    _displayDepth = depth;
    updateScanState();
    renderBrowser();
    // Re-render detail badge so it matches the updated list tiers
    if (_currentChain) updateStatusBar(_currentChain, _currentComponents ? _currentComponents.length : null);
  } else {
    // Need new data — trigger scan
    triggerCanvasScan(depth);
  }
});

// Make entire depth-option row clickable (JS delegation — belt-and-suspenders)
;[1, 2, 3].forEach(function (d) {
  var opt = document.getElementById('depth-opt-' + d);
  if (!opt) return;
  opt.addEventListener('click', function () {
    var radio = document.getElementById('depth-radio-' + d);
    if (radio && !radio.checked) { radio.checked = true; updateSelectionState(); updateApplyBtn(); }
  });
  var radio = document.getElementById('depth-radio-' + d);
  if (radio) radio.addEventListener('change', function () { updateSelectionState(); updateApplyBtn(); });
});


document.getElementById('deep-scan-modal').querySelector('.modal-overlay').addEventListener('click', closeDeepScanModal);


// ─── Place on canvas ─────────────────────────────────────────────────────────

function selectedTierLabel() {
  var sv = _selectedId ? findVar(_selectedId) : (_selectedRemoteId ? findRemoteVar(_selectedRemoteId) : null);
  var score = sv ? varImpactScore(sv) : 0;
  if (score === 0 && _currentComponents && _currentComponents.length > 0) score = _currentComponents.length;
  return score === 0 ? 'Unused' : score <= 40 ? 'Low' : score <= 100 ? 'Medium' : 'High';
}

// Returns { title, subtitle, date, components } for the sandbox, or null when
// there's nothing to place. The cell only renders the component name, so the
// payload no longer carries per-component token lists.
function buildPlacePayload() {
  // Local date + time (YYYY-MM-DD HH:MM) so repeated placements are distinguishable
  // in the layers panel, not just by day.
  var _now = new Date();
  function _p(n) { return (n < 10 ? '0' : '') + n; }
  var today = _now.getFullYear() + '-' + _p(_now.getMonth() + 1) + '-' + _p(_now.getDate()) +
              ' ' + _p(_now.getHours()) + ':' + _p(_now.getMinutes());

  if (_detailMode === 'component' && _currentComp) {
    var c = _currentComp;
    var cTokens = (c.boundVars || []).length;
    return {
      title:    c.nodeName,
      subtitle: cTokens + (cTokens === 1 ? ' bound token' : ' bound tokens') + '  ·  ' + today,
      date:     today,
      components: [{ nodeId: c.nodeId, name: c.nodeName }],
    };
  }

  if (!_currentChain || !_currentComponents || _currentComponents.length === 0) return null;

  var name  = _currentChain.self ? _currentChain.self.name : 'Token';
  var comps = _currentComponents.map(function (comp) {
    return { nodeId: comp.nodeId, name: comp.nodeName };
  });
  return {
    title:    name,
    subtitle: selectedTierLabel() + ' impact  ·  ' + comps.length +
              (comps.length === 1 ? ' component' : ' components') + '  ·  ' + today,
    date:     today,
    components: comps,
  };
}

var _placing = false;

// The Place button now lives on the "Affected components" divider (graph header +
// list header). The list header is re-rendered on every selection, so bind via
// delegation rather than to a specific element.
function placeActionBtnHtml() {
  return '<button class="dividerSection-action buttonSecondary place-action-btn" data-tip="Place affected components on canvas"><svg width="16" height="16"><use href="#icon-fit"/></svg></button>';
}

function startPlace() {
  if (_placing) return;
  // The progress bar is shared with the canvas scan — don't let the two fight
  // over it (and over the Cancel button bound to whichever started first).
  if (_canvasScanRunning) { showToast('Wait for the scan to finish'); return; }

  var payload = buildPlacePayload();
  if (!payload) return;
  _placing = true;
  showScanProgress('Placing components… 0%', '', function () {
    parent.postMessage({ pluginMessage: { type: 'place-cancel' } }, '*');
    _placing = false;
    dismissProgress();
  });
  parent.postMessage({ pluginMessage: {
    type:       'place-components',
    title:      payload.title,
    subtitle:   payload.subtitle,
    date:       payload.date,
    components: payload.components,
  } }, '*');
}

document.addEventListener('click', function (e) {
  if (e.target && e.target.closest && e.target.closest('.place-action-btn')) startPlace();
});

function onPlaceDone(msg) {
  _placing = false;
  dismissProgress();
  var parts = [];
  parts.push('Placed ' + msg.placed + (msg.placed === 1 ? ' component' : ' components') +
             ' on the ' + (msg.pageName || 'Impact Atlas Previews') + ' page');
  if (msg.skipped)   parts.push(msg.skipped + " couldn't be placed");
  if (msg.truncated) parts.push('showing the ' + (msg.placed + msg.skipped) + ' most affected');
  showToast(parts.join(' · '));
}

document.getElementById('sb-export-btn').addEventListener('click', function () {
  var text = buildExportText();
  if (!text) return;
  // Figma plugin iframes don't have navigator.clipboard — use execCommand fallback
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none;';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try {
    document.execCommand('copy');
    showToast('Copied to clipboard');
  } catch (err) {
    showError('Copy failed — select text manually');
  }
  document.body.removeChild(ta);
});

document.getElementById('btn-view-graph').addEventListener('click', function () { switchView('graph'); });
document.getElementById('btn-view-list').addEventListener('click',  function () { switchView('list');  });
document.getElementById('btn-mode-tokens').addEventListener('click', function () { switchBrowserMode('tokens');     });
document.getElementById('btn-mode-comps').addEventListener('click',  function () { switchBrowserMode('components'); });


// Update pill position on window resize

// ── Delegated click handlers (one listener per container, never re-attached) ──
document.getElementById('var-list').addEventListener('click', onVarClick);
document.getElementById('comp-list').addEventListener('click', onCompItemClick);
document.getElementById('list-alias-body').addEventListener('click', function (e) {
  var row = e.target.closest('.buttonList[data-id]');
  if (row) onListAliasClick({ currentTarget: row, target: e.target });
});
document.getElementById('list-comp-body').addEventListener('click', function (e) {
  var focusBtn = e.target.closest('.buttonList-action[data-node-id]');
  if (focusBtn) {
    var nodeId = focusBtn.getAttribute('data-node-id');
    var pageId = focusBtn.getAttribute('data-page-id');
    if (nodeId) parent.postMessage({ pluginMessage: { type: 'focus-node', nodeId: nodeId, pageId: pageId } }, '*');
    return;
  }
  if (e.target.closest('.buttonList[data-node-id]')) onListCompClick(e);
});

// Scroll a var-item to vertical centre of #var-list.
// Forces position:static momentarily so offsetTop reflects the natural flow
// position regardless of any active sticky constraint.
function scrollVarToCenter(el, containerOrBehavior, behavior) {
  // Accepts (el, container, behavior) or legacy (el, behavior) where container is inferred
  var container = (containerOrBehavior && typeof containerOrBehavior === 'object')
    ? containerOrBehavior
    : document.getElementById(_browserMode === 'components' ? 'comp-list' : 'var-list');
  if (typeof containerOrBehavior === 'string') behavior = containerOrBehavior;
  if (!el || !container) return;
  var saved = el.style.position;
  el.style.position = 'static';
  var naturalTop = el.offsetTop;
  el.style.position = saved;
  var top = naturalTop - (container.clientHeight / 2) + (el.offsetHeight / 2);
  container.scrollTo({ top: Math.max(0, top), behavior: behavior || 'smooth' });
}


function drillIntoVar(id) {
  if (!id) return;

  var drillList = document.getElementById('var-list');

  clearAllSelections();
  _selectedId = id;

  // Clear active search now — _selectedId is set so renderBrowser() (called inside)
  // will render the var-item with node-selected, ensuring the DOM query below finds it
  // even if the alias token didn't match the original search query.
  clearSearchIfActive();

  var items = drillList.querySelectorAll('.var-item');

  // Find the match element — measure BEFORE adding sticky class
  var matchEl = null;
  for (var i = 0; i < items.length; i++) {
    var isMatch = items[i].getAttribute('data-id') === id && items[i].getAttribute('data-remote') !== '1';
    if (isMatch) matchEl = items[i];
  }

  // Measure natural offsetTop while element has no sticky position applied
  var scrollTarget = null;
  if (matchEl) {
    var naturalTop = matchEl.offsetTop;
    scrollTarget = Math.max(0, naturalTop - (drillList.clientHeight / 2) + (matchEl.offsetHeight / 2));
    matchEl.classList.add('node-selected');
  }

  // Record origin so re-clicking the sticky item scrolls back to it
  _selectedVarOriginScroll = scrollTarget !== null ? scrollTarget : drillList.scrollTop;

  drillList.classList.add('has-list-selection');
  if (scrollTarget !== null) drillList.scrollTo({ top: scrollTarget, behavior: 'smooth' });
  setupDividerTracking('var-list');

  resetRightPanel();
  var col3 = document.getElementById('gcol-3');
  if (col3) col3.scrollTop = 0;
  parent.postMessage({ pluginMessage: { type: 'analyze', variableId: id } }, '*');
}

// Unified delegated click handler on graph body
document.getElementById('graph-body').addEventListener('click', function (e) {
  // Drill button on alias nodes → select in list + re-analyze
  var drillBtn = e.target.closest('.node-drill-btn');
  if (drillBtn) {
    var drillId = drillBtn.getAttribute('data-drill-id');
    if (_browserMode === 'components') drillToTokenMode(drillId);
    else drillIntoVar(drillId);
    return;
  }

  // Focus button on comp nodes → navigate Figma, don't change selection
  var gotoBtn = e.target.closest('.node-goto-btn');
  if (gotoBtn) {
    e.stopPropagation();
    var gotoNodeId = gotoBtn.getAttribute('data-goto-node-id');
    if (gotoNodeId) navigateToComponent(gotoNodeId);
    return;
  }

  var focusBtn = e.target.closest('.node-focus-btn');
  if (focusBtn) {
    var nodeId = focusBtn.getAttribute('data-node-id');
    var pageId = focusBtn.getAttribute('data-page-id');
    if (nodeId) parent.postMessage({ pluginMessage: { type: 'focus-node', nodeId: nodeId, pageId: pageId } }, '*');
    return;
  }

  // Selection — works for ALL node types (anc, sel, desc, comp)
  var node = e.target.closest('.graph-node:not(.more)');
  if (node) {
    if (node === _selectedGraphNodeEl) {
      clearGraphSelection();
    } else {
      selectGraphNode(node);
    }
  } else {
    // Clicked empty space — deselect
    clearGraphSelection();
  }
});

// Redraw edges when columns are scrolled — throttled so we skip intermediate
// scroll pixels and only fire once the user pauses (or at most every 60ms).
var _edgeScrollTimer    = null;
var _placeholderTimer   = null; // delay before showing empty/placeholder state
function scheduleDrawEdgesThrottled() {
  if (_edgeScrollTimer) return; // already scheduled
  _edgeScrollTimer = setTimeout(function () {
    _edgeScrollTimer = null;
    scheduleDrawEdges();
  }, 60);
}
['gcol-2', 'gcol-3'].forEach(function (id) {
  var col = document.getElementById(id);
  if (col) col.addEventListener('scroll', scheduleDrawEdgesThrottled, { passive: true });
});

// Redraw edges when the graph body is resized (window resize)
if (typeof ResizeObserver !== 'undefined') {
  new ResizeObserver(function () { scheduleDrawEdgesThrottled(); })
    .observe(document.getElementById('graph-body'));
}

// Redraw cross-edges when the left list is scrolled; also update divider tracking
document.getElementById('var-list').addEventListener('scroll', function () {
  requestAnimationFrame(drawCrossEdges);
  updateDividerTracking();
}, { passive: true });

document.getElementById('comp-list').addEventListener('scroll', function () {
  requestAnimationFrame(drawCrossEdges);
  updateDividerTracking();
}, { passive: true });



// ─── Helpers ──────────────────────────────────────────────────────────────────

function findVar(id) {
  for (var i = 0; i < _variables.length; i++) {
    if (_variables[i].id === id) return _variables[i];
  }
  return null;
}

function findRemoteVar(id) {
  for (var i = 0; i < _remoteVariables.length; i++) {
    if (_remoteVariables[i].id === id) return _remoteVariables[i];
  }
  return null;
}

function nodeTypeIcon(type) {
  switch (type) {
    case 'TEXT':         return '<svg width="16" height="16"><use href="#icon-object-text"/></svg>';
    case 'COMPONENT':
    case 'COMPONENT_SET':
    case 'INSTANCE':    return '<svg width="16" height="16" style="flex-shrink:0"><use href="#icon-object-component"/></svg>';
    default:            return '<svg width="16" height="16"><use href="#icon-object-frame"/></svg>';
  }
}

function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
