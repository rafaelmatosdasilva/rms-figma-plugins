<style>

/* ─── Root ───────────────────────────────────────────────────────────────── */

* { box-sizing: border-box; }
/* Scrollbars never add layout shift — space is always reserved inside padding */
/* scrollbar-gutter removed — overlay scrollbars don't push content */

.plugin-wrapper {
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
  margin: 0 -16px; /* cancel body padding from theme */
}

/* Actionbar sits above the fixed cross-edges SVG (z-index:6) */
.plugin-wrapper .actionbar {
  margin: 0; /* plugin-wrapper already cancels body padding */
  position: relative;
  isolation: isolate;
  z-index: 7;
}

.plugin-layout {
  display: flex;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}

/* ─── Left panel ────────────────────────────────────────────────────────── */

.left-panel {
  flex: 1;
  min-width: 120px;
  border-right: 1px solid var(--divider);
  background: var(--bg);
  position: relative;
  z-index: 5;
  display: flex;
  flex-direction: column;
  overflow-x: clip; /* clip horizontal overflow without affecting the scrollbar */
  overflow-y: visible;
}
/* Toolbar + segmented control sit above the fixed cross-edges SVG (z-index:6).
   They need isolation:isolate so their z-index is evaluated against the SVG. */


.search-wrap {
  position: relative;
  display: flex;
  align-items: center;
  width: 344px;
  flex-shrink: 0;
}
/* .actionbar identity (flex, gap, padding, height) comes from theme.css base */
.actionbar-split {
  justify-content: space-between; /* consumer layout: spread slot groups */
}
.last-scan-row {
  display: flex;
  align-items: center;
  gap: var(--gap-m);
  flex-shrink: 0;
  white-space: nowrap;
}
.scan-age-text { font-size: var(--m-size); color: var(--text-muted); font-weight: var(--m-weight); white-space: nowrap; }
/* Search icon — always visible on the left inside the field */
.search-wrap svg.search-icon {
  position: absolute;
  left: var(--padding-s); /* DS input icon inset = padding/s */
  top: 50%;
  transform: translateY(-50%);
  width: 16px;  /* DS Input icon = 16×16 (component 1:5) */
  height: 16px;
  color: var(--input-icon);
  pointer-events: none;
}

.search-input {
  width: 100%;
  height: 24px;
  padding: 0 10px 0 28px;
  background: var(--surface);
  border: var(--thickness) solid var(--border);
  border-radius: var(--radius-full);
  font-size: var(--m-size);
  font-weight: var(--m-weight);
  color: var(--text);
  font-family: inherit;
  outline: none;
}
.search-input::placeholder { color: var(--input-value-empty); }
.search-input:focus { border-color: var(--input-border-focus); }
.search-input.has-value { padding-right: 26px; }

.search-clear {
  position: absolute;
  right: 6px;
  top: 50%;
  transform: translateY(-50%);
  width: 16px;
  height: 16px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 0;
  border-radius: 50%;
}
.search-clear:hover { color: var(--text); }
.search-input.has-value ~ .search-clear { display: flex; }

/* Extends base .scroll-area — adds layout-specific overrides only */
.scroll-area {
  flex: 1;
  padding: 0 var(--padding-s) var(--padding-l) var(--padding-m);
  margin: 0; /* cancel base -16px margin — this layout uses its own padding */
  position: relative;
  scrollbar-gutter: stable; /* always reserve 8px for scrollbar so content never shifts */
}
/* Nothing above the first divider — its own padding/xl top is the spacing */
.scroll-area .dividerSection:first-child { margin-top: 0; }
/* Section divider of the selected item: unstick once the next divider has arrived */
.scroll-area .dividerSection.divider-away {
  position: static;
}

/* ─── Variable list items ───────────────────────────────────────────────── */

/* ─── Base node component — defined in theme.css ──────────────────────── */

#var-list.has-list-selection .var-item:not(.node-selected),
#comp-list.has-list-selection .comp-item:not(.node-selected) {
  background: transparent;
  border-color: var(--border);
  color: var(--node-label-unselected); /* DS unselected state — matches --text-muted in dark, but correct N300 in light too */
}

#var-list .var-item.node-selected,
#comp-list .comp-item.node-selected {
  position: sticky;
  top: 44px; /* sit below own section divider (DS 44px height) */
  bottom: 0;
  z-index: 4;
  background: var(--surface);
  transition: top 0.18s ease;
}

/* When the selected item's own divider scrolls away (divider-away = position:static),
   flow selected item up to fill the gap — but keep a gap/xl breathing space so it
   never sits flush against the mode toggle above the scroll area */
#var-list .dividerSection.divider-away ~ .var-item.node-selected,
#comp-list .dividerSection.divider-away ~ .comp-item.node-selected {
  top: var(--gap-xl);
}

/* When own divider is gone, next divider sits directly below selected item
   (16 gap + 34 item + 6) not 70px */
#var-list .dividerSection.divider-away ~ .var-item.node-selected ~ .dividerSection,
#comp-list .dividerSection.divider-away ~ .comp-item.node-selected ~ .dividerSection {
  top: 56px;
  transition: top 0.18s ease;
}

/* .node-external appearance — defined in theme.css (disabled tokens, no opacity) */
.node-external-badge {
  font-size: var(--fs-xs, 9px);
  color: var(--text-muted);
  background: var(--bg-secondary);
  border-radius: var(--radius-sm);
  padding: 1px 4px;
  margin-top: var(--gap-xs);
  display: inline-block;
}

/* .node-disabled — defined in theme.css */

/* Variable list node (left panel) — same .node base + list-specific layout */
.var-item {
  width: 100%;
  margin-bottom: var(--gap-m);
}

.var-name {
  flex: 1;
  min-width: 0;
  font-size: var(--m-size);
  color: inherit; /* node label color comes from the .node state classes (node/label/* tokens) */
  line-height: 1.4;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  direction: rtl;
  text-align: left;
}

.var-type-icon {
  width: 14px; height: 14px;
  flex-shrink: 0;
  color: var(--text-muted);
  display: flex; align-items: center; justify-content: center;
}

/* ─── Impact tier section dividers ─────────────────────────────────────── */

/* .tier-dot severity variants moved to theme.css (base-first) */

/* ─── Empty / loading states ────────────────────────────────────────────── */

/* .empty-state defined in theme.css base */

.loading-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex: 1;
  gap: 10px;
  color: var(--text-muted);
}


/* ─── Right panel ───────────────────────────────────────────────────────── */

.right-panel {
  flex: 2;
  min-width: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
body.browser-empty .right-panel {
  display: none;
}

/* #right-placeholder uses .empty-state base class */
#right-placeholder {
  background: var(--bg-detail);
}

#right-detail {
  display: flex;
  flex-direction: column;
  flex: 1;
  overflow: hidden;
  background: var(--bg-detail); /* semantic/background/color N1000 */
}

/* list scroll-area context: full-bleed sticky headers at the DS dividerSection
   geometry (44px = padding/xl top + 16px content + padding/xs bottom, from theme.css).
   Compact 28px/20px variants retired 2026-07-11 — the DS frame uses full-height
   dividers in every list and tree context. Only layout concerns live here:
   full-bleed margins, list gutters, stacking. Locked by RENDERED_ASSERTIONS (Gate [16]). */
.scroll-area .dividerSection {
  position: sticky;
  top: 0;
  height: 44px; /* DS dividerSection h — fixed (equals base hug: 24+16+4) so Gate [16] can assert it in hidden views */
  margin-left: -12px;
  margin-right: -8px;
  padding-left: var(--padding-m);
  padding-right: var(--padding-s);
  margin-top: var(--gap-m);
  margin-bottom: var(--gap-m);
  z-index: 7;
  isolation: isolate;
}
/* Detail list view: sections stack flush (DS Frame 111 gap 0, pad 0) — the divider's
   own padding/xl top is the only separation between sections */
#list-alias-hdr,
#list-comp-hdr { margin-top: 0; margin-bottom: 0; }

/* Dividers that come AFTER the selected item stick below: 44 (divider) + 34 (item) + 8 (gap) */
#var-list.has-list-selection .var-item.node-selected ~ .dividerSection,
#comp-list.has-list-selection .comp-item.node-selected ~ .dividerSection {
  top: 86px; /* 44 (own divider) + 34 (item) + 8 (gap) */
  z-index: 7;
  transition: top 0.18s ease;
}


.mode-toggle-row {
  /* DS panel "Top" frame = pad [16,16,0,16]: padding/l top + LR, ZERO bottom.
     A non-zero bottom padding here stacks on top of the first divider's own
     padding/xl and reads as an over-tall divider. Locked by RENDERED_ASSERTIONS. */
  padding: var(--padding-l) var(--padding-l) 0 var(--padding-l);
  flex-shrink: 0;
  position: relative;
  isolation: isolate;
  z-index: 7;
  background: var(--bg);
}

/* segmented-control tab-empty state moved to theme.css (base-first) */
/* full-width segmented control (browser mode toggle) */
.segmented-control.full-width { width: 100%; }
/* Each segment takes equal share — content changes (label show/hide) never shift widths */
.segmented-control.full-width button { flex: 1 1 0; min-width: 0; width: 0; }
/* View-mode toggle: equal fixed width, icon stays centred — gap must stay 0 */
#view-mode-toggle button,
#view-mode-toggle button.selected { width: 52px; flex-shrink: 0; justify-content: center; gap: 0; }

/* Progress toast sizing — ensure content isn't clipped */

/* ─── Graph view ────────────────────────────────────────────────────────── */

#view-graph {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-height: 0;
}

#graph-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  background: var(--bg-detail);
}

/* Full-width header row — one dividerSection per column, seamless background.
   Dividers render at the DS base geometry (44px) — same height as every other
   dividerSection in the plugin (compact variants retired 2026-07-11). */
#graph-col-headers {
  display: flex;
  flex-shrink: 0;
  position: sticky;
  top: 0;
  z-index: 7;
  /* No background here — each dividerSection paints its own (see #right-detail
     .dividerSection). The two are flex:1 so together they still read as one
     seamless strip, but an empty column can now opt out of the fill. */
}
/* A column with no label has nothing to occlude, and its opaque strip visibly
   clips the edge lines that run underneath it. Let them through. */
#graph-col-headers .dividerSection.col-empty { background: transparent; }
#right-detail .dividerSection { background: var(--bg-detail); } /* same surface for sticky bg */
#graph-col-headers .dividerSection {
  flex: 1;
  position: static; /* wrapper is the sticky element */
  height: 44px; /* DS dividerSection h — same fixed height as the list contexts */
  margin: 0;
  padding-left: var(--padding-l);
  padding-right: var(--padding-l);
}
#graph-body:not(.has-content) #graph-col-headers { display: none; }

/* Inner cols row holds the two scrollable columns */
#graph-cols {
  flex: 1;
  display: flex;
  min-height: 0;
  overflow: hidden;
  position: relative;
}

.graph-col-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
  z-index: 1;
}




.graph-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  padding: 6px 16px 18px;
  overflow-y: auto;
  overflow-x: hidden;
  box-sizing: border-box;
}



#graph-edges {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  overflow: visible;
  z-index: 2;
}

/* ─── Graph node — same .node base + graph-specific layout ─────────────── */

.graph-node {
  width: 100%;
  min-width: 0;
  flex-shrink: 0;
  margin-bottom: var(--gap-m);
}

/* In the graph, when any node is selected, the others recede.
   Appearance (disabled tokens + hover) lives in theme.css against
   .has-selection — token-driven, no opacity, no per-plugin override. */

.graph-node.more {
  justify-content: center;
  border-style: dashed;
  color: var(--text-muted);
  font-size: var(--s-size);
  background: transparent;
  border-color: var(--border);
}
.graph-node.more:hover {
  border-color: var(--text-muted);
  color: var(--text);
  background: var(--bg-secondary);
}

.node-type-icon {
  width: 14px; height: 14px;
  flex-shrink: 0;
  color: var(--text-muted);
  display: flex; align-items: center; justify-content: center;
}

.node-body {
  flex: 1;
  min-width: 0;
}

.node-name {
  font-size: var(--m-size);
  color: inherit; /* node label color comes from the .node state classes (node/label/* tokens) */
  line-height: 1.4;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  direction: rtl;
  text-align: left;
}


/* connection count badge — top-right of comp nodes */
.node-conn-badge {
  position: absolute;
  top: -7px;
  right: -7px;
  min-width: 16px;
  height: 16px;
  border-radius: var(--radius-md);
  background: var(--neutral-300);
  color: var(--neutral-1000);
  font-size: var(--s-size);
  font-weight: var(--s-weight);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 var(--padding-xs);
}
.node-conn-badge.dim { background: var(--neutral-600); }

/* focus button on comp nodes (visible on hover) */
/* ── Node action buttons (focus / drill / goto) — shared base ── */
.node-focus-btn,
.node-goto-btn,
.node-drill-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  right: 6px;
  /* use buttonTertiary sizing */
  width: 24px;
  height: 24px;
  padding: 0;
  border: var(--thickness) solid var(--buttonTertiary-background);
  border-radius: var(--radius-full);
  background: var(--buttonTertiary-background);
  color: var(--buttonTertiary-text);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.1s, background 0.15s, color 0.15s;
  pointer-events: none;
  flex-shrink: 0;
}
.node-focus-btn:hover,
.node-goto-btn:hover,
.node-drill-btn:hover {
  background: var(--buttonTertiary-background-active);
  color: var(--buttonTertiary-text-active);
  border-color: transparent;
}

/* show on hover */
.graph-node.comp:hover .node-focus-btn,
.graph-node.comp:hover .node-goto-btn,
.graph-node.desc:hover .node-drill-btn,
.var-item:hover .var-item-chevron,
.comp-item:hover .var-item-chevron { opacity: 1; pointer-events: auto; }

/* focus + goto buttons on graph comp nodes — focus left, goto right */
.graph-node.comp .node-focus-btn { right: 34px; }
.graph-node.comp .node-goto-btn  { right: 6px; }

/* focus button on browser comp-item rows — sits left of the chevron */
.comp-item-focus-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  right: 34px; /* 6px chevron pos + 24px chevron width + 4px gap */
  width: 24px; height: 24px;
  padding: 0;
  border: var(--thickness) solid var(--buttonTertiary-background);
  border-radius: var(--radius-full);
  background: var(--buttonTertiary-background);
  color: var(--buttonTertiary-text);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  opacity: 0;
  transition: opacity 0.1s, background 0.15s, color 0.15s;
  pointer-events: none;
  flex-shrink: 0;
}
.comp-item-focus-btn:hover {
  background: var(--buttonTertiary-background-active);
  color: var(--buttonTertiary-text-active);
  border-color: transparent;
}

/* Explicitly target SVGs inside action buttons — prevents .node svg (theme.css)
   from overriding icon color via direct targeting (direct beats inherited) */
.node-focus-btn svg,
.node-goto-btn svg,
.node-drill-btn svg,
.comp-item-focus-btn svg { color: var(--buttonTertiary-text); }

.node-focus-btn:hover svg,
.node-goto-btn:hover svg,
.node-drill-btn:hover svg,
.comp-item-focus-btn:hover svg { color: var(--buttonTertiary-text-active); }


/* col placeholder/loading state */
.col-placeholder {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 7px;
  color: var(--text-muted);
  padding: var(--padding-xl) var(--padding-m);
  text-align: center;
  font-size: var(--s-size);
  opacity: 0.55;
  width: 100%;
}

/* ─── List view ─────────────────────────────────────────────────────────── */

#view-list {
  flex: 1;
  min-height: 0;
  margin: 0;
  padding: 0 var(--padding-l);
}


.list-sec-body { flex-shrink: 0; padding-bottom: 0; } /* Rows→next divider flush (pad 0, gap 0) */

.lrow.dimmed { opacity: 0.65; }

.lrow-icon {
  width: 14px; height: 14px;
  flex-shrink: 0;
  color: var(--buttonList-iconPrimary);
  display: flex; align-items: center; justify-content: center;
}

.lrow-name {
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.lrow-coll {
  font-size: var(--s-size);
  color: var(--listItem-description);
  flex-shrink: 0;
  white-space: nowrap;
}

.lrow-badge {
  font-size: var(--s-size);
  font-weight: var(--s-weight);
  background: var(--text);
  color: var(--surface);
  border-radius: var(--radius-full);
  padding: 1px 6px;
  flex-shrink: 0;
}

.lrow-selected-tag {
  font-size: var(--s-size);
  color: var(--text-muted);
  font-style: italic;
  flex-shrink: 0;
}



/* ─── External var detail (library) ────────────────────────────────────── */


.detail-header {
  padding: var(--padding-s) var(--padding-m);
  border-bottom: var(--thickness) solid var(--divider);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: var(--gap-m);
  min-height: 36px;
}

.detail-var-name {
  flex: 1;
  min-width: 0;
  font-size: var(--m-size);
  font-weight: var(--m-weight);
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* layout padding only — base styles in theme.css */
.section-label { padding: var(--padding-s) var(--padding-m) var(--padding-xs); }

.ref-var-row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px;
  min-height: 28px;
}
.ref-var-row:hover { background: var(--bg-secondary); }

.ref-var-name {
  flex: 1;
  min-width: 0;
  font-size: var(--m-size);
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ref-coll-tag {
  font-size: var(--s-size);
  color: var(--text-muted);
  flex-shrink: 0;
}

/* ─── Status bar ────────────────────────────────────────────────────────── */

#status-bar {
  border-bottom: var(--thickness) solid var(--divider);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  background: var(--bg-detail);
  order: -1;
  position: relative;
  z-index: 7;
}
/* #sb-main-row geometry comes from the .statusBar base class in theme.css */
#sb-main-row .badge {
  align-self: center;
}

.sb-type-icon {
  width: 14px; height: 14px;
  flex-shrink: 0;
  color: var(--statusbar-icon);
  display: flex; align-items: center; justify-content: center;
}

#sb-name {
  font-size: var(--l-size);
  font-weight: var(--m-weight);
  color: var(--statusbar-text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
  flex-shrink: 1;
}

.sb-divider {
  width: 1px;
  height: 16px;
  background: var(--divider);
  flex-shrink: 0;
}

.sb-stat {
  display: flex;
  align-items: center;
  gap: var(--gap-s);
  flex-shrink: 0;
}
.sb-num {
  font-size: var(--m-size);
  font-weight: var(--s-weight);
  color: var(--statusbar-text);
  min-width: 12px;
  text-align: center;
}
.sb-label {
  font-size: var(--s-size);
  font-weight: var(--m-weight);
  color: var(--statusbar-icon);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

/* ─── Misc ──────────────────────────────────────────────────────────────── */

.color-swatch {
  width: 13px; height: 13px;
  border-radius: 50%;
  border: var(--thickness) solid rgba(0,0,0,0.12);
  flex-shrink: 0;
}
.color-swatch-empty {
  width: 13px; height: 13px;
  border-radius: 50%;
  border: var(--thickness) solid var(--swatch-border-empty);
  background: repeating-linear-gradient(-45deg, var(--border) 0px, var(--border) 1.2px, transparent 1.2px, transparent 5.6px);
  flex-shrink: 0;
}

/* ─── Component browser ─────────────────────────────────────────────── */
#comp-list { flex: 1; overflow-y: overlay; }
.comp-item { width: 100%; margin-bottom: var(--gap-m); }
.comp-token-count {
  flex-shrink: 0;
  font-size: var(--s-size);
  font-weight: var(--m-weight);
  color: var(--text-muted);
  background: var(--bg-secondary);
  border: var(--thickness) solid var(--border);
  border-radius: var(--radius-full);
  padding: 1px 6px;

  min-width: 18px;
  text-align: center;
}
/* Deselected items when selection is active — consolidated above with var-list/all-list */
/* col-3 hidden in component detail mode */
/* comp-mode: col3 stays visible but empty — consistent two-column layout */

/* Library/remote component marker — explicit element placed before the name */
.comp-library-tag {
  flex-shrink: 0;
  margin-right: 6px;
  font-size: var(--s-size);
  font-weight: var(--m-weight);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
  opacity: 0.55;
}
/* Component names render LTR so leading punctuation (e.g. ".tableCell")
   keeps its prefix in the right visual position. The rtl-start ellipsis
   used by variable names is not needed for short component names. */
.comp-item .var-name {
  direction: ltr;
}

/* comp-list sticky rules now merged with var-list rules above */


/* ─── Canvas scan ───────────────────────────────────────────────────────── */
#canvas-scan-btn { flex-shrink: 0; display: flex; align-items: center; gap: 6px; }
#canvas-scan-btn.scanning { opacity: 0.6; pointer-events: none; }
.scan-status-label { font-size: var(--m-size); color: var(--text-muted); white-space: nowrap; font-weight: var(--m-weight); }
.scan-status-change { height: 24px; padding: 0 9px; font-size: var(--m-size); flex-shrink: 0; }
.scan-status-change.icon-only { padding: 0 var(--padding-xs); display: inline-flex; align-items: center; justify-content: center; }

#canvas-scan-bar {
  padding: 5px 12px;
  display: flex;
  align-items: center;
  gap: var(--gap-m);
  font-size: var(--s-size);
  color: var(--text-muted);
  border-bottom: var(--thickness) solid var(--divider);
  flex-shrink: 0;
}
#canvas-scan-bar .spinner { width: 11px; height: 11px; border-width: 1.5px; flex-shrink: 0; }

/* canvas usage count on var-items */
.var-canvas-count {
  flex-shrink: 0;
  font-size: var(--m-size);
  font-weight: var(--m-weight);
  color: var(--text-muted);
  opacity: 0.7;
  white-space: nowrap;
}

#toast-container { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); z-index: 9999; }
.tt { position: fixed; z-index: 9998; pointer-events: none; }

/* ─── Modal ──────────────────────────────────────────────────────────────── */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  align-items: center;
  justify-content: center;
  z-index: 10000;
}
.modal.is-open {
  display: flex;
}
.modal-overlay {
  position: absolute;
  inset: 0;
  background: var(--overlay-bg);
  backdrop-filter: blur(4px);
}
.modal-card {
  position: relative;
  background: var(--modal-background);
  border-radius: var(--radius-modal);
  z-index: 10001;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: var(--padding-l);
  gap: var(--gap-s);
  width: 288px;
  animation: modal-in var(--modal-duration) var(--modal-easing) both;
}
.modal.is-closing .modal-card    { animation: modal-out var(--modal-duration-out) var(--modal-easing-out) both; }
.modal-overlay                   { animation: modal-bg-in var(--modal-duration) var(--modal-easing) both; }
.modal.is-closing .modal-overlay { animation: modal-bg-out var(--modal-duration-out) var(--modal-easing-out) both; }
.modal-icon {
  color: var(--text-muted);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: var(--gap-m);
}
.modal-card h2 {
  font-size: var(--l-size);
  font-weight: var(--m-weight);
  margin: 0;
  color: var(--modal-title);
}
.modal-body {
  font-size: var(--m-size);
  color: var(--text-muted);
  line-height: 1.5;
  margin: var(--gap-s) 0 0;
}
.modal-body p { margin: 0; }
.modal-footer {
  display: flex;
  flex-direction: row;
  gap: var(--gap-m);
  width: 100%;
  margin-top: var(--gap-l);
}
.modal-footer button {
  flex: 1;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
}
#modal-confirm-btn:disabled { opacity: 0.24; pointer-events: none; }

/* ─── Depth selector modal ───────────────────────────────────────────────── */
#deep-scan-modal .modal-card {
  width: 320px;
  align-items: flex-start;
  text-align: left;
  gap: 0;
}
#deep-scan-modal .modal-icon { margin-bottom: var(--gap-l); }
#deep-scan-modal h2 { font-size: var(--l-size); margin-bottom: 24px; }
#deep-scan-modal .modal-subtitle {
  font-size: var(--m-size);
  color: var(--text-muted);
  margin: 0 0 var(--gap-xl);
}

.depth-options {
  /* Single source for the label's line box — the circle column and the connector
     both derive their vertical geometry from it. */
  --depth-label-lh: calc(var(--m-size) * 1.3);
  /* Ring + connector share one stroke weight so they read as a single track.
     Deliberately 2px, not general/thickness (1.5px) — at 16px the thinner ring
     disappears next to the connector. Local to this control by design. */
  --depth-stroke: 2px;
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: var(--gap-s);
  margin-bottom: -4px;
}
.depth-option {
  display: flex;
  align-items: flex-start;
  gap: var(--gap-m);
  position: relative;
  padding-bottom: 0;
}
/* Vertical connector — accent colour always, hidden via scaleY(0), grows from top dot */
.depth-option:not(:last-child)::after {
  content: '';
  position: absolute;
  left: 7px;
  top: calc(var(--depth-label-lh) / 2 + 8px); /* circle centre + radius = its bottom edge */
  bottom: -4px;
  width: 0;
  border-left: var(--depth-stroke) dashed var(--accent);
  transform: scaleY(0);
  transform-origin: top center;
  transition: transform    0.32s cubic-bezier(0.4, 0, 0.2, 1),
              border-style 0.28s cubic-bezier(0.4, 0, 0.2, 1);
}

/* ── Selection: dashed, grow down ── */
.depth-options[data-depth="2"] #depth-opt-1::after,
.depth-options[data-depth="3"] #depth-opt-1::after { transform: scaleY(1); border-left-style: dashed; }
.depth-options[data-depth="3"] #depth-opt-2::after { transform: scaleY(1); border-left-style: dashed; }

/* ── Sequential stagger: growing deeper → 1→2 first at 2x speed, 2→3 follows ── */
.depth-options.lines-going-deeper #depth-opt-1::after,
.depth-options.lines-going-deeper[data-depth="3"] #depth-opt-2::after { transition-duration: 0.16s; }
.depth-options.lines-going-deeper[data-depth="3"] #depth-opt-2::after { transition-delay: 0.16s; }
/* ── Sequential stagger: going back → 2→3 shrinks at 2x speed, 1→2 follows ── */
.depth-options.lines-going-back #depth-opt-2::after,
.depth-options.lines-going-back[data-depth="1"] #depth-opt-1::after { transition-duration: 0.16s; }
.depth-options.lines-going-back[data-depth="1"] #depth-opt-1::after { transition-delay: 0.16s; }

/* ── Done: solid, grow down (declared after selection so it overrides dashed) ── */
.depth-options[data-done="2"] #depth-opt-1::after,
.depth-options[data-done="3"] #depth-opt-1::after { transform: scaleY(1); border-left-style: solid; }
.depth-options[data-done="3"] #depth-opt-2::after { transform: scaleY(1); border-left-style: solid; }

/* Pass-through circles: no outer ring, just the inner dot in accent */
.depth-options[data-depth="2"] #depth-opt-1 .depth-circle,
.depth-options[data-depth="3"] #depth-opt-1 .depth-circle,
.depth-options[data-depth="3"] #depth-opt-2 .depth-circle {
  border-color: transparent;
  background: transparent;
}
.depth-options[data-depth="2"] #depth-opt-1 .depth-circle::after,
.depth-options[data-depth="3"] #depth-opt-1 .depth-circle::after,
.depth-options[data-depth="3"] #depth-opt-2 .depth-circle::after { background: var(--accent); transform: scale(1); }

/* Dot scales in from 0.6 when a depth is selected */
.depth-circle::after { transform: scale(0.6); }
.depth-options[data-depth="1"] .depth-circle::after,
.depth-options[data-depth="2"] .depth-circle::after,
.depth-options[data-depth="3"] .depth-circle::after { transform: scale(1); }

/* Endpoint circle: accent ring, no fill, accent dot — ID selector beats .done specificity */
.depth-options[data-depth="1"] #depth-opt-1 .depth-circle,
.depth-options[data-depth="2"] #depth-opt-2 .depth-circle,
.depth-options[data-depth="3"] #depth-opt-3 .depth-circle { border-color: var(--accent); background: transparent; }
.depth-options[data-depth="1"] #depth-opt-1 .depth-circle::after,
.depth-options[data-depth="2"] #depth-opt-2 .depth-radio-input:checked + .depth-circle::after,
.depth-options[data-depth="3"] #depth-opt-3 .depth-circle::after { background: var(--accent); }

.depth-circle-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  /* Match the label's first line box and centre the 16px circle inside it, so the
     dot sits on the label's optical centre. A fixed top padding can't do this —
     it drifts as soon as the type scale changes. */
  height: var(--depth-label-lh);
  justify-content: center;
  flex-shrink: 0;
}
.depth-radio-input { display: none; }

.depth-circle {
  width: 16px; height: 16px;
  border-radius: 50%;
  border: var(--depth-stroke) solid var(--radioButton-border-unselected);
  background: var(--radioButton-background);
  flex-shrink: 0;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: border-color 0.24s cubic-bezier(0.4, 0, 0.2, 1),
              background   0.24s cubic-bezier(0.4, 0, 0.2, 1),
              transform    0.24s cubic-bezier(0.4, 0, 0.2, 1),
              opacity      0.24s cubic-bezier(0.4, 0, 0.2, 1);
  box-sizing: border-box;
}
.depth-circle::after {
  content: '';
  width: 6px; height: 6px;
  border-radius: 50%;
  background: transparent;
  transition: background 0.24s cubic-bezier(0.4, 0, 0.2, 1),
              transform  0.24s cubic-bezier(0.4, 0, 0.2, 1);
}
/* Completed/done state */
.depth-option.done .depth-circle {
  border-color: var(--radioButton-border-selected);
  background: var(--radioButton-border-selected);
}
/* Default checked state */
.depth-radio-input:checked + .depth-circle { border-color: var(--radioButton-border-current); background: var(--radioButton-background-selected); }
.depth-radio-input:checked + .depth-circle::after { background: var(--radioButton-border-current); }
/* Done dot — declared after :checked so it overrides and contrasts the filled background */
.depth-option.done .depth-circle::after { background: var(--radioButton-background); }

/* ── No external libraries: disable Level 2 ── */
/* Connectors only appear when Level 3 is selected (handled by data-depth="3" rules above) */
.depth-option.unavailable { pointer-events: none; opacity: 0.4; }
.depth-option.unavailable .depth-radio-input { pointer-events: none; }
/* Unavailable circle: center dot only, no outer ring */
.depth-option.unavailable .depth-circle {
  border-color: transparent;
  background: transparent;
}
.depth-option.unavailable .depth-circle::after { background: var(--radioButton-border); }
.depth-desc-unavailable { display: none; }
.depth-option.unavailable .depth-desc-default { display: none; }
.depth-option.unavailable .depth-desc-unavailable { display: block; }

/* ── "Would be un-done" feedback: selecting a lower level un-fills circles above it ── */
.depth-options[data-depth="1"] #depth-opt-2.done .depth-circle,
.depth-options[data-depth="1"] #depth-opt-3.done .depth-circle,
.depth-options[data-depth="2"] #depth-opt-3.done .depth-circle {
  background: transparent;
  border-color: var(--radioButton-border);
}
.depth-options[data-depth="1"] #depth-opt-2.done .depth-circle::after,
.depth-options[data-depth="1"] #depth-opt-3.done .depth-circle::after,
.depth-options[data-depth="2"] #depth-opt-3.done .depth-circle::after { background: transparent; }

/* Shrink done connectors above selection back to top dot */
.depth-options[data-done="2"][data-depth="1"] #depth-opt-1::after,
.depth-options[data-done="3"][data-depth="1"] #depth-opt-1::after { transform: scaleY(0); }
.depth-options[data-done="3"][data-depth="2"] #depth-opt-2::after { transform: scaleY(0); }
/* When Local is selected, also hide the Extended→Full connector */
.depth-options[data-done="3"][data-depth="1"] #depth-opt-2::after { transform: scaleY(0); }

.depth-option { cursor: pointer; }
.depth-text-col {
  flex: 1;
  padding-bottom: var(--padding-l);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: var(--gap-xs);
}
.depth-text-col .depth-label {
  display: block;
  font-size: var(--m-size);
  color: var(--radioButton-text);
  line-height: var(--depth-label-lh);
}
.depth-option.done .depth-label { color: var(--radioButton-text-selected); }
/* "Would be un-done" options revert to unselected text styling */
.depth-options[data-depth="1"] #depth-opt-2 .depth-label,
.depth-options[data-depth="1"] #depth-opt-3 .depth-label,
.depth-options[data-depth="2"] #depth-opt-3 .depth-label { color: var(--radioButton-text-unselected); }
.depth-text-col .depth-desc {
  font-size: var(--m-size);
  color: var(--radioButton-description);
  line-height: 1.4;
}
/* Selected endpoint label: full contrast */
.depth-options[data-depth="1"] #depth-opt-1 .depth-label,
.depth-options[data-depth="2"] #depth-opt-2 .depth-label,
.depth-options[data-depth="3"] #depth-opt-3 .depth-label { color: var(--radioButton-text-current); }

</style>

<body>

<div class="plugin-wrapper">

  <!-- ═══════════════════════ TOP ACTIONBAR -->
  <div class="actionbar actionbar-split">
    <div id="canvas-scan-btn" class="scan-status-row">
      <button class="buttonTertiary scan-status-change icon-only" id="scan-status-change-btn" title="Change scan type">
        <svg width="16" height="16"><use href="#icon-settings"/></svg>
      </button>
      <span class="scan-status-label" id="scan-status-level">Local Scan</span>
    </div>

    <div class="search-wrap" id="search-wrap">
      <svg class="search-icon" width="16" height="16"><use href="#icon-search"/></svg>
      <input class="search-input" id="search-input" type="text" placeholder="Search…" autocomplete="off"/>
      <button class="search-clear" id="search-clear" tabindex="-1" aria-label="Clear search">
        <svg width="16" height="16"><use href="#icon-clear"/></svg>
      </button>
    </div>

    <div id="last-scan-bar" class="last-scan-row hidden">
      <span class="scan-age-text">Scanned <span id="scan-age-label">—</span></span>
      <button id="rescan-btn" class="buttonTertiary buttonRescan" title="Rescan">
        <svg width="16" height="16"><use href="#icon-update"/></svg>
      </button>
    </div>
  </div>
  <div class="dividerLine"></div>

  <div class="plugin-layout">

    <!-- ═══════════════════════════════════════════ LEFT PANEL: VAR LIST -->
    <div class="left-panel">

      <div class="mode-toggle-row">
        <div class="segmented-control full-width" id="browser-mode-toggle">
          <span class="seg-pill" aria-hidden="true"></span>
          <button id="btn-mode-tokens" class="selected"><svg width="16" height="16"><use href="#icon-variable"/></svg><span class="tab-label">Tokens</span></button>
          <button id="btn-mode-comps"><svg width="16" height="16"><use href="#icon-component"/></svg><span class="tab-label">Components</span></button>
        </div>
      </div>

      <div id="canvas-scan-bar" class="hidden"></div>

      <div id="browser-body" style="flex:1;min-height:0;position:relative;display:flex;flex-direction:column;">
        <div id="browser-loading" class="loading-state hidden">
          <span id="loading-text" style="font-size:var(--m-size)">Loading…</span>
        </div>

        <div id="all-list" class="scroll-area hidden"></div>
        <div id="var-list" class="scroll-area hidden"></div>
        <div id="comp-list" class="scroll-area hidden"></div>

        <div id="browser-empty" class="empty-state hidden" style="position:absolute;inset:0;">
          <div class="empty-state-content">
            <svg width="28" height="28"><use href="#icon-empty-search"/></svg>
            <p id="browser-empty-text">No results match<br>your search.</p>
            <button class="buttonSecondary" id="browser-empty-clear"><span>Clear search</span></button>
          </div>
        </div>
      </div>

    </div>

    <!-- ═══════════════════════════════════════════ RIGHT PANEL -->
    <div class="right-panel">

      <!-- Placeholder: no var selected -->
      <div id="right-placeholder" class="empty-state">
        <div class="empty-state-content">
          <svg width="48" height="48"><use href="#icon-empty-token" id="right-placeholder-icon"/></svg>
          <p id="right-placeholder-text">Select an item<br>to see what it affects.</p>
        </div>
      </div>

      <!-- Graph / list detail (shown after selecting a local var) -->
      <div id="right-detail" class="hidden">

        <!-- Status bar — ancestors breadcrumb (top row) + name/impact/toggle (main row) -->
        <div id="status-bar" class="hidden">
          <div id="sb-main-row" class="statusBar">
            <div class="statusBar-title">
              <div class="sb-type-icon" id="sb-type-icon"></div>
              <span id="sb-name"></span>
            </div>
            <span id="sb-impact" class="badge"></span>
            <span id="sb-canvas-count" class="var-canvas-count hidden"></span>
            <button id="sb-focus-btn" class="buttonTertiary hidden" data-tip="Focus on canvas">
              <svg width="16" height="16"><use href="#icon-focus"/></svg>
            </button>
            <div style="flex:1;"></div>
            <button id="sb-export-btn" class="buttonQuaternary" data-tip="Copy report to clipboard">
              <svg width="16" height="16"><use href="#icon-copy"/></svg>
            </button>
            <div class="segmented-control" id="view-mode-toggle" style="flex-shrink:0;">
              <span class="seg-pill" aria-hidden="true"></span>
              <button id="btn-view-graph" class="selected" title="Graph view">
                <svg width="14" height="14"><use href="#icon-tree"/></svg>
              </button>
              <button id="btn-view-list" title="List view">
                <svg width="16" height="16"><use href="#icon-list"/></svg>
              </button>
            </div>
          </div>
        </div>

        <!-- Toolbar: column headers + view toggle -->
        <!-- ── Graph view ── -->
        <div id="view-graph">
          <div id="graph-body">
            <!-- Single full-width header row spanning both columns -->
            <div id="graph-col-headers">
              <div class="dividerSection" id="gcol-2-lbl-wrap"><span id="gcol-2-lbl">Alias tokens</span><span class="div-sep">·</span><span class="count" id="gcol-2-count"></span></div>
              <div class="dividerSection" id="gcol-3-lbl-wrap">Components<span class="div-sep">·</span><span class="count" id="gcol-3-count"></span></div>
            </div>
            <div id="graph-cols">
              <div class="graph-col-wrap" id="gcol-2-wrap">
                <div class="graph-col" id="gcol-2"></div>
              </div>
              <div class="graph-col-wrap" id="gcol-3-wrap">
                <div class="graph-col" id="gcol-3"></div>
              </div>
            </div>
            <svg id="graph-edges" aria-hidden="true"></svg>
            <div id="graph-empty" class="empty-state hidden" style="position:absolute;inset:0;z-index:1;">
              <div class="empty-state-content">
                <svg width="32" height="32"><use href="#icon-empty-graph"/></svg>
                <p>No alias tokens or components<br>reference this variable.</p>
              </div>
            </div>
          </div>
        </div>

        <!-- ── List view ── -->
        <div id="view-list" class="scroll-area hidden">

          <div class="dividerSection hidden" id="list-alias-hdr"></div>
          <div class="list-sec-body" id="list-alias-body"></div>

          <div class="dividerSection hidden" id="list-comp-hdr"></div>
          <div class="list-sec-body" id="list-comp-body"></div>

        </div>

      </div>

      <!-- Library variable detail (remote var selected) -->
      <div id="right-library" class="hidden" style="display:flex;flex-direction:column;flex:1;overflow:hidden;">
        <div class="detail-header">
          <div class="var-type-icon" id="lib-detail-type"></div>
          <span class="detail-var-name" id="lib-detail-name"></span>
        </div>
        <div style="padding:4px 12px 6px;font-size:var(--s-size);color:var(--text-muted);flex-shrink:0;border-bottom:1px solid var(--divider);" id="lib-detail-coll"></div>
        <div class="section-label">Referenced by</div>
        <div id="lib-ref-list" style="flex:1;overflow-y:auto;"></div>
        <div id="lib-ref-empty" class="empty-state hidden"><div class="empty-state-content"><p>No local variables alias this.</p></div></div>
      </div>

    </div>

  </div><!-- /.plugin-layout -->

</div><!-- /.plugin-wrapper -->

<!-- Cross-panel connection lines: left list → graph nodes -->
<svg id="cross-edges" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:6;">
  <path id="ce-spine" fill="none" stroke-linecap="round"/>
  <path id="ce-bracket" fill="none" stroke-linecap="round"/>
</svg>

<div id="toast-container"></div>
<div id="progress-container"></div>

<!-- Depth Selector Modal -->
<div id="deep-scan-modal" class="modal">
  <div class="modal-overlay"></div>
  <div class="modal-card">
    <h2>Choose scan type</h2>

    <div class="depth-options">

      <!-- Level 1: always done — status only, not a radio -->
      <div class="depth-option done" id="depth-opt-1">
        <div class="depth-circle-col">
          <input class="depth-radio-input" type="radio" name="scan-depth" id="depth-radio-1" value="1"/>
          <label class="depth-circle" for="depth-radio-1"></label>
        </div>
        <label class="depth-text-col" for="depth-radio-1">
          <span class="depth-label">Local</span>
          <span class="depth-desc">Scans only the current file for tokens, components, and their relationships.</span>
        </label>
      </div>

      <!-- Level 2: radio -->
      <div class="depth-option" id="depth-opt-2">
        <div class="depth-circle-col">
          <input class="depth-radio-input" type="radio" name="scan-depth" id="depth-radio-2" value="2"/>
          <label class="depth-circle" for="depth-radio-2"></label>
        </div>
        <label class="depth-text-col" for="depth-radio-2">
          <span class="depth-label">Extended</span>
          <span class="depth-desc depth-desc-default">Scans the current file and linked libraries for token and component relationships.</span>
          <span class="depth-desc depth-desc-unavailable">No external libraries linked to this file.</span>
        </label>
      </div>

      <!-- Level 3: radio -->
      <div class="depth-option" id="depth-opt-3">
        <div class="depth-circle-col">
          <input class="depth-radio-input" type="radio" name="scan-depth" id="depth-radio-3" value="3"/>
          <label class="depth-circle" for="depth-radio-3"></label>
        </div>
        <label class="depth-text-col" for="depth-radio-3">
          <span class="depth-label">Full</span>
          <span class="depth-desc">Scans everything above, then checks the entire canvas to find every component usage.</span>
        </label>
      </div>

    </div>

    <div class="modal-footer">
      <button class="buttonSecondary" id="modal-cancel-btn"><span>Cancel</span></button>
      <button class="buttonPrimary" id="modal-confirm-btn">Apply and Scan</button>
    </div>
  </div>
</div>

<div id="tt" class="tt"></div>

// Returns the selection highlight color — matches .node.node-selected border
// Uses #D4D4D4 in dark mode, accent blue in light mode
function getSelectionColor() {
  var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  return getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || (isDark ? '#ededed' : '#0a0a0a');
}

// ─── State ────────────────────────────────────────────────────────────────────

var _variables           = [];
var _collections         = [];
var _remoteVariables     = [];
var _remoteCollections   = [];
var _filterQuery         = '';
var _searchTimer         = null;
var _selectedId          = null;
var _selectedRemoteId    = null;
var _currentComponents   = null;   // null = not yet fetched; [] = empty
var _componentIndexBuilt = false;
var _indexBuilding       = false;

// Graph state
var _currentChain        = null;
var _varComponentCounts  = {};
var _viewMode            = 'graph';
var _detailMode          = null;   // 'variable' | 'component' | null — what the right panel is showing
var _currentComp         = null;   // the comp object when _detailMode === 'component'
var _graphDescVars       = [];     // descendant vars currently visible in col-2
var _graphCompList       = [];     // component nodes currently visible in col-3
var _allDescVars         = [];     // full descendant list (for expand)
var _allCompList         = [];     // full sorted component list (for expand)
var _descCompEdges       = [];     // [{descIdx, compIdx}] for alias→component edges
var _rootCompIdxs        = [];     // compIdx[] for components that bind to the root variable directly
var _edgeRafPending      = false;
var _selectedGraphNodeEl = null;   // currently highlighted graph node
var _collapseTimer       = null;   // timer for display:none after fade

// Section-divider tracking — unstick the selected item's own divider once
// the next section's divider has scrolled into its sticky position.
var _trackedSelDiv  = null;   // divider that owns the selected item
var _trackedNextDiv = null;   // next divider after the selected item
var _trackedNextTop = 0;      // natural offsetTop of the next divider

// Component browser state
var _browserMode          = 'all';  // 'all' | 'tokens' | 'components'
var _allBrowserComponents = [];
var _selectedCompNodeId   = null;
var _compBrowserLoaded    = false;

// Origin scroll positions — restored when a sticky-selected item is re-clicked
var _selectedVarOriginScroll  = null;

var _displayDepth        = 1;      // What depth is currently displayed (can go up or down freely)

var _canvasBindings      = {}; // varId → total (instances + direct)
