<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<!--@THEME-->
<style>

/* ─── Root ───────────────────────────────────────────────────────────────── */

* { box-sizing: border-box; }
/* Scrollbars never add layout shift — space is always reserved inside padding */
/* scrollbar-gutter removed — overlay scrollbars don't push content */

.plugin-wrapper {
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
  margin: 0 -16px; /* cancel body padding from theme */
}

/* Actionbar sits above the fixed cross-edges SVG (z-index:6) */
.plugin-wrapper .actionbar {
  margin: 0; /* plugin-wrapper already cancels body padding */
  position: relative;
  isolation: isolate;
  z-index: 7;
}

.plugin-layout {
  display: flex;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}

/* ─── Left panel ────────────────────────────────────────────────────────── */

.left-panel {
  flex: 1;
  min-width: 120px;
  border-right: var(--thickness) solid var(--divider);
  background: var(--bg);
  position: relative;
  z-index: 5;
  display: flex;
  flex-direction: column;
  overflow-x: clip; /* clip horizontal overflow without affecting the scrollbar */
  overflow-y: visible;
}
/* Toolbar + segmented control sit above the fixed cross-edges SVG (z-index:6).
   They need isolation:isolate so their z-index is evaluated against the SVG. */


.search-wrap {
  position: relative;
  display: flex;
  align-items: center;
  width: 344px;
  flex-shrink: 0;
}
/* .actionbar identity (flex, gap, padding, height) comes from theme.css base */
.actionbar-split {
  justify-content: space-between; /* consumer layout: spread slot groups */
}
.last-scan-row {
  display: flex;
  align-items: center;
  gap: var(--gap-m);
  flex-shrink: 0;
  white-space: nowrap;
}
.scan-age-text { font-size: var(--m-size); color: var(--text-muted); font-weight: var(--m-weight); white-space: nowrap; }
/* Search icon — always visible on the left inside the field */
.search-wrap svg.search-icon {
  position: absolute;
  left: var(--padding-s); /* DS input icon inset = padding/s */
  top: 50%;
  transform: translateY(-50%);
  width: 16px;  /* DS Input icon = 16×16 (component 1:5) */
  height: 16px;
  color: var(--input-icon);
  pointer-events: none;
}

.search-input {
  width: 100%;
  height: var(--button-min-height);
  /* Left inset clears the absolutely-positioned search icon: its own padding/s offset
     + the 16px DS icon box + gap/s. Composed from tokens rather than the old flat 28px
     so it tracks the DS if any of the three change. */
  padding: 0 var(--padding-s) 0 calc(var(--padding-s) + 16px + var(--gap-s));
  background: var(--input-background);
  /* input/border/default — NOT --border (dividerLine). The two are the same N700 in
     light but one ramp step apart in dark (#454545 vs #303030), so a divider token
     here reads correct in light and too dim in dark. */
  border: var(--thickness) solid var(--input-border);
  border-radius: var(--radius-full);
  font-size: var(--m-size);
  font-weight: var(--m-weight);
  color: var(--text);
  font-family: inherit;
  outline: none;
}
.search-input::placeholder { color: var(--input-value-empty); }
.search-input:focus { border-color: var(--input-border-focus); }
.search-input.has-value { padding-right: 26px; }

.search-clear {
  position: absolute;
  right: 6px;
  top: 50%;
  transform: translateY(-50%);
  width: 16px;
  height: 16px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 0;
  border-radius: 50%;
}
.search-clear:hover { color: var(--text); }
.search-input.has-value ~ .search-clear { display: flex; }

/* Extends base .scroll-area — adds layout-specific overrides only */
.scroll-area {
  flex: 1;
  padding: 0 var(--padding-s) var(--padding-l) var(--padding-m);
  margin: 0; /* cancel base -16px margin — this layout uses its own padding */
  position: relative;
  scrollbar-gutter: stable; /* always reserve 8px for scrollbar so content never shifts */
}
/* Nothing above the first divider — its own padding/xl top is the spacing */
.scroll-area .dividerSection:first-child { margin-top: 0; }
/* Section divider of the selected item: unstick once the next divider has arrived */
.scroll-area .dividerSection.divider-away {
  position: static;
}

/* ─── Variable list items ───────────────────────────────────────────────── */

/* ─── Base node component — defined in theme.css ──────────────────────── */

#var-list.has-list-selection .var-item:not(.node-selected),
#comp-list.has-list-selection .comp-item:not(.node-selected) {
  background: transparent;
  border-color: var(--border);
  color: var(--node-label-idle); /* DS idle state (node/label/idle) — the DS retired node/label/unselected on 2026-07-22 */
}

#var-list .var-item.node-selected,
#comp-list .comp-item.node-selected {
  position: sticky;
  top: 44px; /* sit below own section divider (DS 44px height) */
  bottom: 0;
  z-index: 8; /* above the sticky dividers (z-index 7) so the selection ring is never clipped by them */
  background: var(--surface);
  transition: top 0.18s ease;
}

/* When the selected item's own divider scrolls away (divider-away = position:static),
   flow selected item up to fill the gap — but keep a gap/xl breathing space so it
   never sits flush against the mode toggle above the scroll area */
#var-list .dividerSection.divider-away ~ .var-item.node-selected,
#comp-list .dividerSection.divider-away ~ .comp-item.node-selected {
  top: var(--gap-xl);
}

/* When own divider is gone, next divider sits directly below selected item
   (16 gap + 34 item + 6) not 70px */
#var-list .dividerSection.divider-away ~ .var-item.node-selected ~ .dividerSection,
#comp-list .dividerSection.divider-away ~ .comp-item.node-selected ~ .dividerSection {
  top: 56px;
  transition: top 0.18s ease;
}

/* .node-external appearance — defined in theme.css (disabled tokens, no opacity) */
/* External-library marker on a graph node. Same icon + .tooltipButton appearance
   as every other external indicator (list rows, status bar) — it used to be the
   only one rendering the word "Library", which read as a different concept. */
.node-lib-badge { margin-top: var(--gap-xs); }

/* .node-disabled — defined in theme.css */

/* Variable list node (left panel) — same .node base + list-specific layout */
.var-item {
  width: 100%;
  margin-bottom: var(--gap-m);
}

.var-name {
  flex: 1;
  min-width: 0;
  font-size: var(--m-size);
  color: inherit; /* node label color comes from the .node state classes (node/label/* tokens) */
  line-height: 1.4;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  direction: rtl;
  text-align: left;
}

.var-type-icon {
  width: 16px; height: 16px;
  flex-shrink: 0;
  color: var(--text-muted);
  display: flex; align-items: center; justify-content: center;
}

/* ─── Impact tier section dividers ─────────────────────────────────────── */

/* .tier-dot severity variants moved to theme.css (base-first) */

/* ─── Empty / loading states ────────────────────────────────────────────── */

/* .empty-state defined in theme.css base */

.loading-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex: 1;
  gap: var(--gap-m);
  color: var(--text-muted);
}


/* ─── Right panel ───────────────────────────────────────────────────────── */

.right-panel {
  flex: 2;
  min-width: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
body.browser-empty .right-panel {
  display: none;
}

/* #right-placeholder uses .empty-state base class */
#right-placeholder {
  background: var(--bg-detail);
}

#right-detail {
  display: flex;
  flex-direction: column;
  flex: 1;
  overflow: hidden;
  background: var(--bg-detail); /* semantic/background/color N1000 */
}

/* list scroll-area context: full-bleed sticky headers at the DS dividerSection
   geometry (44px = padding/xl top + 16px content + padding/xs bottom, from theme.css).
   Compact 28px/20px variants retired 2026-07-11 — the DS frame uses full-height
   dividers in every list and tree context. Only layout concerns live here:
   full-bleed margins, list gutters, stacking. Locked by RENDERED_ASSERTIONS (Gate [16]). */
.scroll-area .dividerSection {
  position: sticky;
  top: 0;
  height: 44px; /* DS dividerSection h — fixed (equals base hug: 24+16+4) so Gate [16] can assert it in hidden views */
  margin-left: -12px;
  margin-right: -8px;
  padding-left: var(--padding-m);
  padding-right: var(--padding-s);
  margin-top: var(--gap-m);
  margin-bottom: var(--gap-m);
  z-index: 7;
  isolation: isolate;
}
/* Detail list view: sections stack flush (DS Frame 111 gap 0, pad 0) — the divider's
   own padding/xl top is the only separation between sections */
#list-alias-hdr,
#list-comp-hdr { margin-top: 0; margin-bottom: 0; }

/* Dividers that come AFTER the selected item stick below: 44 (divider) + 34 (item) + 8 (gap) */
#var-list.has-list-selection .var-item.node-selected ~ .dividerSection,
#comp-list.has-list-selection .comp-item.node-selected ~ .dividerSection {
  top: 86px; /* 44 (own divider) + 34 (item) + 8 (gap) */
  z-index: 7;
  transition: top 0.18s ease;
}


.mode-toggle-row {
  /* DS panel "Top" frame = pad [16,16,0,16]: padding/l top + LR, ZERO bottom.
     A non-zero bottom padding here stacks on top of the first divider's own
     padding/xl and reads as an over-tall divider. Locked by RENDERED_ASSERTIONS. */
  padding: var(--padding-l) var(--padding-l) 0 var(--padding-l);
  flex-shrink: 0;
  position: relative;
  isolation: isolate;
  z-index: 7;
  background: var(--bg);
}

/* segmented-control tab-empty state moved to theme.css (base-first) */
/* full-width segmented control (browser mode toggle) */
.segmented-control.full-width { width: 100%; }
/* Each segment takes equal share — content changes (label show/hide) never shift widths */
.segmented-control.full-width button { flex: 1 1 0; min-width: 0; width: 0; }
/* View-mode toggle: equal fixed width, icon stays centred — gap must stay 0 */
#view-mode-toggle button,
#view-mode-toggle button.selected { width: 52px; flex-shrink: 0; justify-content: center; gap: 0; }

/* Progress toast sizing — ensure content isn't clipped */

/* ─── Graph view ────────────────────────────────────────────────────────── */

#view-graph {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-height: 0;
}

#graph-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  background: var(--bg-detail);
}

/* Full-width header row — one dividerSection per column, seamless background.
   Dividers render at the DS base geometry (44px) — same height as every other
   dividerSection in the plugin (compact variants retired 2026-07-11). */
#graph-col-headers {
  display: flex;
  flex-shrink: 0;
  position: sticky;
  top: 0;
  z-index: 7;
  /* No background here — each dividerSection paints its own (see #right-detail
     .dividerSection). The two are flex:1 so together they still read as one
     seamless strip, but an empty column can now opt out of the fill. */
}
/* A column with no label has nothing to occlude, and its opaque strip visibly
   clips the edge lines that run underneath it. Let them through. */
#graph-col-headers .dividerSection.col-empty { background: transparent; }
#right-detail .dividerSection { background: var(--bg-detail); } /* same surface for sticky bg */
#graph-col-headers .dividerSection {
  flex: 1;
  position: static; /* wrapper is the sticky element */
  height: 44px; /* DS dividerSection h — same fixed height as the list contexts */
  margin: 0;
  padding-left: var(--padding-l);
  padding-right: var(--padding-l);
}
#graph-body:not(.has-content) #graph-col-headers { display: none; }

/* Inner cols row holds the two scrollable columns */
#graph-cols {
  flex: 1;
  display: flex;
  min-height: 0;
  overflow: hidden;
  position: relative;
}

.graph-col-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
  z-index: 1;
}




.graph-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  padding: var(--padding-s) var(--padding-l) var(--padding-l);
  overflow-y: auto;
  overflow-x: hidden;
  box-sizing: border-box;
}



#graph-edges {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  overflow: visible;
  z-index: 2;
}

/* ─── Graph node — same .node base + graph-specific layout ─────────────── */

.graph-node {
  width: 100%;
  min-width: 0;
  flex-shrink: 0;
  margin-bottom: var(--gap-m);
}

/* In the graph, when any node is selected, the others recede.
   Appearance (disabled tokens + hover) lives in theme.css against
   .has-selection — token-driven, no opacity, no per-plugin override. */

.graph-node.more {
  justify-content: center;
  border-style: dashed;
  color: var(--text-muted);
  font-size: var(--s-size);
  background: transparent;
  border-color: var(--border);
}
.graph-node.more:hover {
  border-color: var(--text-muted);
  color: var(--text);
  background: var(--bg-secondary);
}

.node-type-icon {
  width: 16px; height: 16px;
  flex-shrink: 0;
  color: var(--text-muted);
  display: flex; align-items: center; justify-content: center;
}

.node-body {
  flex: 1;
  min-width: 0;
}

.node-name {
  flex: 1;        /* take the row's free width... */
  min-width: 0;   /* ...and be allowed to shrink below content width, so a long
                     name truncates instead of overflowing into the chevron */
  font-size: var(--m-size);
  color: inherit; /* node label color comes from the .node state classes (node/label/* tokens) */
  line-height: 1.4;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  direction: rtl;
  text-align: left;
}
/* focus button on comp nodes (visible on hover) */
/* ── Node action buttons (focus / drill / goto) — shared base ── */
.node-focus-btn,
.node-goto-btn,
.node-drill-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  right: 6px;
  /* use buttonTertiary sizing */
  width: var(--button-min-height);
  height: var(--button-min-height);
  padding: 0;
  border: var(--thickness) solid var(--buttonTertiary-background);
  border-radius: var(--radius-full);
  background: var(--buttonTertiary-background);
  color: var(--buttonTertiary-text);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.1s, background 0.15s, color 0.15s;
  pointer-events: none;
  flex-shrink: 0;
}
.node-focus-btn:hover,
.node-goto-btn:hover,
.node-drill-btn:hover {
  background: var(--buttonTertiary-background-active);
  color: var(--buttonTertiary-text-active);
  border-color: transparent;
}

/* show on hover */
.graph-node.comp:hover .node-focus-btn,
.graph-node.comp:hover .node-goto-btn,
.graph-node.desc:hover .node-drill-btn,
.var-item:hover .var-item-chevron,
.comp-item:hover .var-item-chevron { opacity: 1; pointer-events: auto; }

/* focus + goto buttons on graph comp nodes — focus left, goto right */
.graph-node.comp .node-focus-btn { right: 34px; }
.graph-node.comp .node-goto-btn  { right: 6px; }

/* The action buttons are position:absolute and only appear on hover, so they
   reserve no flex space. Reserve the button zone ONLY on hover — otherwise every
   resting row shows a large empty gap on the right (the buttons aren't there).
   On hover a long name truncates before the buttons instead of sliding under them.
   comp: focus(right 34 + 24w) → 58px; desc: drill(right 6 + 24w) → 30px. */
.graph-node.comp:hover .node-body { padding-right: 62px; }
.graph-node.desc:hover .node-body { padding-right: 34px; }

/* focus button on browser comp-item rows — sits left of the chevron */
.comp-item-focus-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  right: 34px; /* 6px chevron pos + 24px chevron width + 4px gap */
  width: var(--button-min-height); height: var(--button-min-height);
  padding: 0;
  border: var(--thickness) solid var(--buttonTertiary-background);
  border-radius: var(--radius-full);
  background: var(--buttonTertiary-background);
  color: var(--buttonTertiary-text);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  opacity: 0;
  transition: opacity 0.1s, background 0.15s, color 0.15s;
  pointer-events: none;
  flex-shrink: 0;
}
.comp-item-focus-btn:hover {
  background: var(--buttonTertiary-background-active);
  color: var(--buttonTertiary-text-active);
  border-color: transparent;
}

/* Explicitly target SVGs inside action buttons — prevents .node svg (theme.css)
   from overriding icon color via direct targeting (direct beats inherited) */
.node-focus-btn svg,
.node-goto-btn svg,
.node-drill-btn svg,
.comp-item-focus-btn svg { color: var(--buttonTertiary-text); }

.node-focus-btn:hover svg,
.node-goto-btn:hover svg,
.node-drill-btn:hover svg,
.comp-item-focus-btn:hover svg { color: var(--buttonTertiary-text-active); }

/* Library-component indicator: appearance comes from .tooltipButton in the base —
   only its size and placement are app-specific. Shown for components whose master
   lives in an external library, in the slot the Focus button uses for local ones. */
.lib-badge svg { width: 12px; height: 12px; }
/* Hover-only, like the focus button it replaces. Absolute in the focus slot for
   graph nodes and comp-item rows, so it never reserves space in the default state
   and only appears (with its tooltip) when the row is hovered. */
.graph-node.comp .lib-badge,
.comp-item .lib-badge,
.var-item .lib-badge {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  right: 34px;
  width: var(--button-min-height);
  height: var(--button-min-height);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.1s;
}
.graph-node.comp:hover .lib-badge,
.comp-item:hover .lib-badge,
.var-item:hover .lib-badge { opacity: 1; pointer-events: auto; }
/* List rows reveal it on hover in the buttonList action slot (no default space). */
.buttonList .lib-badge { margin-left: auto; display: none; }
.buttonList:not(.selected):hover .lib-badge,
.buttonList:not(.selected).hovered .lib-badge { display: flex; }
/* Component names read left-to-right, so truncate the END (keep the start),
   unlike token paths where the meaningful part is the tail (rtl). */
.graph-node.comp .node-name { direction: ltr; }


/* col placeholder/loading state */
.col-placeholder {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--gap-m);
  color: var(--text-muted);
  padding: var(--padding-xl) var(--padding-m);
  text-align: center;
  font-size: var(--s-size);
  opacity: 0.55;
  width: 100%;
}

/* ─── List view ─────────────────────────────────────────────────────────── */

#view-list {
  flex: 1;
  min-height: 0;
  margin: 0;
  padding: 0 var(--padding-l);
}


.list-sec-body { flex-shrink: 0; padding-bottom: 0; } /* Rows→next divider flush (pad 0, gap 0) */

.lrow.dimmed { opacity: 0.65; }

.lrow-icon {
  width: 16px; height: 16px;
  flex-shrink: 0;
  color: var(--buttonList-iconPrimary);
  display: flex; align-items: center; justify-content: center;
}

.lrow-name {
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}


/* ─── External var detail (library) ────────────────────────────────────── */


/* layout-only: let the DS title group fill the bar so the name can ellipsis */
.statusBar-title:has(.detail-var-name) { flex: 1; }
.detail-var-name {
  flex: 1;
  min-width: 0;
  font-size: var(--m-size);
  font-weight: var(--m-weight);
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* layout padding only — base styles in theme.css */
.section-label { padding: var(--padding-s) var(--padding-m) var(--padding-xs); }

.ref-var-row {
  display: flex;
  align-items: center;
  gap: var(--gap-m);
  padding: var(--padding-xs) var(--padding-m);
  min-height: 28px;
}
.ref-var-row:hover { background: var(--bg-secondary); }

.ref-var-name {
  flex: 1;
  min-width: 0;
  font-size: var(--m-size);
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ref-coll-tag {
  font-size: var(--s-size);
  color: var(--text-muted);
  flex-shrink: 0;
}

/* ─── Status bar ────────────────────────────────────────────────────────── */

#status-bar {
  border-bottom: var(--thickness) solid var(--divider);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  background: var(--bg-detail);
  order: -1;
  position: relative;
  z-index: 7;
}
/* #sb-main-row geometry comes from the .statusBar base class in theme.css */
#sb-main-row .badge {
  align-self: center;
}

.sb-type-icon {
  width: 16px; height: 16px;
  flex-shrink: 0;
  color: var(--statusbar-icon);
  display: flex; align-items: center; justify-content: center;
}

#sb-name {
  font-size: var(--l-size);
  font-weight: var(--m-weight);
  color: var(--statusbar-text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
  flex-shrink: 1;
}

/* Library indicator in the status bar — shown in place of the (hidden) focus
   button for external library components. Muted,
  non-interactive {
  display: flex;
  align-items: center;
  gap: var(--gap-s);
  flex-shrink: 0;
}
/* ─── Misc ──────────────────────────────────────────────────────────────── */

/* ─── Component browser ─────────────────────────────────────────────── */
#comp-list { flex: 1; overflow-y: overlay; }
.comp-item { width: 100%; margin-bottom: var(--gap-m); }
.comp-token-count {
  flex-shrink: 0;
  font-size: var(--s-size);
  font-weight: var(--m-weight);
  color: var(--text-muted);
  background: var(--bg-secondary);
  border: var(--thickness) solid var(--border);
  border-radius: var(--radius-full);
  padding: var(--padding-xxs) var(--padding-s);

  min-width: 18px;
  text-align: center;
}
/* Deselected items when selection is active — consolidated above with var-list/all-list */
/* col-3 hidden in component detail mode */
/* comp-mode: col3 stays visible but empty — consistent two-column layout */

/* Library/remote component marker — explicit element placed before the name */
.comp-library-tag {
  flex-shrink: 0;
  margin-right: var(--gap-s);
  font-size: var(--s-size);
  font-weight: var(--m-weight);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
  opacity: 0.55;
}
/* Component names render LTR so leading punctuation (e.g. ".tableCell")
   keeps its prefix in the right visual position. The rtl-start ellipsis
   used by variable names is not needed for short component names. */
.comp-item .var-name {
  direction: ltr;
}
/* Reserve the absolute action-button zone only on hover (they appear on hover),
   so resting rows have no empty gap and a long name only re-truncates when the
   buttons actually show. comp: focus(right 34+24)+chevron → 62px; var: chevron → 34px. */
.comp-item:hover .var-name { padding-right: 62px; }
.var-item:hover .var-name                    { padding-right: 34px; } /* chevron only */
.var-item[data-remote="1"]:hover .var-name   { padding-right: 62px; } /* lib badge + chevron */

/* comp-list sticky rules now merged with var-list rules above */


/* ─── Canvas scan ───────────────────────────────────────────────────────── */
#canvas-scan-btn { flex-shrink: 0; display: flex; align-items: center; gap: var(--gap-m); }
#canvas-scan-btn.scanning { opacity: 0.6; pointer-events: none; }
.scan-status-label { font-size: var(--m-size); color: var(--text-muted); white-space: nowrap; font-weight: var(--m-weight); }
.scan-status-change { height: var(--button-min-height); padding: 0 var(--padding-s); font-size: var(--m-size); flex-shrink: 0; }
.scan-status-change.icon-only { padding: 0 var(--padding-xs); display: inline-flex; align-items: center; justify-content: center; }

#canvas-scan-bar {
  padding: var(--padding-xs) var(--padding-m);
  display: flex;
  align-items: center;
  gap: var(--gap-m);
  font-size: var(--s-size);
  color: var(--text-muted);
  border-bottom: var(--thickness) solid var(--divider);
  flex-shrink: 0;
}
#canvas-scan-bar .spinner { width: 14px; height: 14px; border-width: var(--thickness); flex-shrink: 0; }

/* canvas usage count on var-items */
.var-canvas-count {
  flex-shrink: 0;
  font-size: var(--m-size);
  font-weight: var(--m-weight);
  color: var(--text-muted);
  opacity: 0.7;
  white-space: nowrap;
}

#toast-container { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); z-index: 9999; }
.tt { position: fixed; z-index: 9998; pointer-events: none; }

/* ─── Modal ──────────────────────────────────────────────────────────────── */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  align-items: center;
  justify-content: center;
  z-index: 10000;
}
.modal.is-open {
  display: flex;
}
.modal-overlay {
  position: absolute;
  inset: 0;
  background: var(--overlay-bg);
  backdrop-filter: blur(4px);
}
.modal-card {
  position: relative;
  background: var(--modal-background);
  border-radius: var(--radius-modal);
  z-index: 10001;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: var(--padding-l);
  gap: var(--gap-s);
  width: 288px;
  animation: modal-in var(--modal-duration) var(--modal-easing) both;
}
.modal.is-closing .modal-card    { animation: modal-out var(--modal-duration-out) var(--modal-easing-out) both; }
.modal-overlay                   { animation: modal-bg-in var(--modal-duration) var(--modal-easing) both; }
.modal.is-closing .modal-overlay { animation: modal-bg-out var(--modal-duration-out) var(--modal-easing-out) both; }.modal-card h2 {
  font-size: var(--l-size);
  font-weight: var(--m-weight);
  margin: 0;
  color: var(--modal-title);
}.modal-footer {
  display: flex;
  flex-direction: row;
  gap: var(--gap-m);
  width: 100%;
  margin-top: var(--gap-l);
}
.modal-footer button {
  flex: 1;
  height: var(--button-min-height);
  display: flex;
  align-items: center;
  justify-content: center;
}
#modal-confirm-btn:disabled { opacity: 0.24; pointer-events: none; }

/* ─── Depth selector modal ───────────────────────────────────────────────── */
#deep-scan-modal .modal-card {
  width: 320px;
  align-items: flex-start;
  text-align: left;
  gap: 0;
}#deep-scan-modal h2 { font-size: var(--l-size); margin-bottom: var(--padding-xl); }
.depth-options {
  /* Single source for the label's line box — the circle column and the connector
     both derive their vertical geometry from it. */
  --depth-label-lh: calc(var(--m-size) * 1.3);
  /* Ring + connector share one stroke weight so they read as a single track.
     Deliberately 2px, not general/thickness (1.5px) — at 16px the thinner ring
     disappears next to the connector. Local to this control by design. */
  --depth-stroke: 2px;
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: var(--gap-s);
  margin-bottom: -4px;
}
.depth-option {
  display: flex;
  align-items: flex-start;
  gap: var(--gap-m);
  position: relative;
  padding-bottom: 0;
}
/* Vertical connector — accent colour always, hidden via scaleY(0), grows from top dot */
.depth-option:not(:last-child)::after {
  content: '';
  position: absolute;
  left: 7px;
  top: calc(var(--depth-label-lh) / 2 + 8px); /* circle centre + radius = its bottom edge */
  bottom: -4px;
  width: 0;
  border-left: var(--depth-stroke) dashed var(--accent);
  transform: scaleY(0);
  transform-origin: top center;
  transition: transform    0.32s cubic-bezier(0.4, 0, 0.2, 1),
              border-style 0.28s cubic-bezier(0.4, 0, 0.2, 1);
}

/* ── Selection: dashed, grow down ── */
.depth-options[data-depth="2"] #depth-opt-1::after,
.depth-options[data-depth="3"] #depth-opt-1::after { transform: scaleY(1); border-left-style: dashed; }
.depth-options[data-depth="3"] #depth-opt-2::after { transform: scaleY(1); border-left-style: dashed; }

/* ── Sequential stagger: growing deeper → 1→2 first at 2x speed, 2→3 follows ── */
.depth-options.lines-going-deeper #depth-opt-1::after,
.depth-options.lines-going-deeper[data-depth="3"] #depth-opt-2::after { transition-duration: 0.16s; }
.depth-options.lines-going-deeper[data-depth="3"] #depth-opt-2::after { transition-delay: 0.16s; }
/* ── Sequential stagger: going back → 2→3 shrinks at 2x speed, 1→2 follows ── */
.depth-options.lines-going-back #depth-opt-2::after,
.depth-options.lines-going-back[data-depth="1"] #depth-opt-1::after { transition-duration: 0.16s; }
.depth-options.lines-going-back[data-depth="1"] #depth-opt-1::after { transition-delay: 0.16s; }

/* ── Done: solid, grow down (declared after selection so it overrides dashed) ── */
.depth-options[data-done="2"] #depth-opt-1::after,
.depth-options[data-done="3"] #depth-opt-1::after { transform: scaleY(1); border-left-style: solid; }
.depth-options[data-done="3"] #depth-opt-2::after { transform: scaleY(1); border-left-style: solid; }

/* Pass-through circles: no outer ring, just the inner dot in accent */
.depth-options[data-depth="2"] #depth-opt-1 .depth-circle,
.depth-options[data-depth="3"] #depth-opt-1 .depth-circle,
.depth-options[data-depth="3"] #depth-opt-2 .depth-circle {
  border-color: transparent;
  background: transparent;
}
.depth-options[data-depth="2"] #depth-opt-1 .depth-circle::after,
.depth-options[data-depth="3"] #depth-opt-1 .depth-circle::after,
.depth-options[data-depth="3"] #depth-opt-2 .depth-circle::after { background: var(--accent); transform: scale(1); }

/* Dot scales in from 0.6 when a depth is selected */
.depth-circle::after { transform: scale(0.6); }
.depth-options[data-depth="1"] .depth-circle::after,
.depth-options[data-depth="2"] .depth-circle::after,
.depth-options[data-depth="3"] .depth-circle::after { transform: scale(1); }

/* Endpoint circle: accent ring, no fill, accent dot — ID selector beats .done specificity */
.depth-options[data-depth="1"] #depth-opt-1 .depth-circle,
.depth-options[data-depth="2"] #depth-opt-2 .depth-circle,
.depth-options[data-depth="3"] #depth-opt-3 .depth-circle { border-color: var(--accent); background: transparent; }
.depth-options[data-depth="1"] #depth-opt-1 .depth-circle::after,
.depth-options[data-depth="2"] #depth-opt-2 .depth-radio-input:checked + .depth-circle::after,
.depth-options[data-depth="3"] #depth-opt-3 .depth-circle::after { background: var(--accent); }

.depth-circle-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  /* Match the label's first line box and centre the 16px circle inside it, so the
     dot sits on the label's optical centre. A fixed top padding can't do this —
     it drifts as soon as the type scale changes. */
  height: var(--depth-label-lh);
  justify-content: center;
  flex-shrink: 0;
}
.depth-radio-input { display: none; }

.depth-circle {
  width: 16px; height: 16px;
  border-radius: 50%;
  border: var(--depth-stroke) solid var(--radioButton-border-unselected);
  background: var(--radioButton-background);
  flex-shrink: 0;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: border-color 0.24s cubic-bezier(0.4, 0, 0.2, 1),
              background   0.24s cubic-bezier(0.4, 0, 0.2, 1),
              transform    0.24s cubic-bezier(0.4, 0, 0.2, 1),
              opacity      0.24s cubic-bezier(0.4, 0, 0.2, 1);
  box-sizing: border-box;
}
.depth-circle::after {
  content: '';
  width: var(--dividerSection-height); height: var(--dividerSection-height);
  border-radius: 50%;
  background: transparent;
  transition: background 0.24s cubic-bezier(0.4, 0, 0.2, 1),
              transform  0.24s cubic-bezier(0.4, 0, 0.2, 1);
}
/* Completed/done state */
.depth-option.done .depth-circle {
  border-color: var(--radioButton-border-selected);
  background: var(--radioButton-border-selected);
}
/* Default checked state */
.depth-radio-input:checked + .depth-circle { border-color: var(--radioButton-border-current); background: var(--radioButton-background-selected); }
.depth-radio-input:checked + .depth-circle::after { background: var(--radioButton-border-current); }
/* Done dot — declared after :checked so it overrides and contrasts the filled background */
.depth-option.done .depth-circle::after { background: var(--radioButton-background); }

/* ── No external libraries: disable Level 2 ── */
/* Connectors only appear when Level 3 is selected (handled by data-depth="3" rules above) */
.depth-option.unavailable { pointer-events: none; opacity: 0.4; }
.depth-option.unavailable .depth-radio-input { pointer-events: none; }
/* Unavailable circle: center dot only, no outer ring */
.depth-option.unavailable .depth-circle {
  border-color: transparent;
  background: transparent;
}
.depth-option.unavailable .depth-circle::after { background: var(--radioButton-border); }
.depth-desc-unavailable { display: none; }
.depth-option.unavailable .depth-desc-default { display: none; }
.depth-option.unavailable .depth-desc-unavailable { display: block; }

/* ── "Would be un-done" feedback: selecting a lower level un-fills circles above it ── */
.depth-options[data-depth="1"] #depth-opt-2.done .depth-circle,
.depth-options[data-depth="1"] #depth-opt-3.done .depth-circle,
.depth-options[data-depth="2"] #depth-opt-3.done .depth-circle {
  background: transparent;
  border-color: var(--radioButton-border);
}
.depth-options[data-depth="1"] #depth-opt-2.done .depth-circle::after,
.depth-options[data-depth="1"] #depth-opt-3.done .depth-circle::after,
.depth-options[data-depth="2"] #depth-opt-3.done .depth-circle::after { background: transparent; }

/* Shrink done connectors above selection back to top dot */
.depth-options[data-done="2"][data-depth="1"] #depth-opt-1::after,
.depth-options[data-done="3"][data-depth="1"] #depth-opt-1::after { transform: scaleY(0); }
.depth-options[data-done="3"][data-depth="2"] #depth-opt-2::after { transform: scaleY(0); }
/* When Local is selected, also hide the Extended→Full connector */
.depth-options[data-done="3"][data-depth="1"] #depth-opt-2::after { transform: scaleY(0); }

.depth-option { cursor: pointer; }
.depth-text-col {
  flex: 1;
  padding-bottom: var(--padding-l);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: var(--gap-xs);
}
.depth-text-col .depth-label {
  display: block;
  font-size: var(--m-size);
  color: var(--radioButton-text);
  line-height: var(--depth-label-lh);
}
.depth-option.done .depth-label { color: var(--radioButton-text-selected); }
/* "Would be un-done" options revert to unselected text styling */
.depth-options[data-depth="1"] #depth-opt-2 .depth-label,
.depth-options[data-depth="1"] #depth-opt-3 .depth-label,
.depth-options[data-depth="2"] #depth-opt-3 .depth-label { color: var(--radioButton-text-unselected); }
.depth-text-col .depth-desc {
  font-size: var(--m-size);
  color: var(--radioButton-description);
  line-height: 1.4;
}
/* Selected endpoint label: full contrast */
.depth-options[data-depth="1"] #depth-opt-1 .depth-label,
.depth-options[data-depth="2"] #depth-opt-2 .depth-label,
.depth-options[data-depth="3"] #depth-opt-3 .depth-label { color: var(--radioButton-text-current); }

</style>
</head>
<body>

<div class="plugin-wrapper">

  <!-- ═══════════════════════ TOP ACTIONBAR -->
  <div class="actionbar actionbar-split">
    <div id="canvas-scan-btn" class="scan-status-row">
      <button class="buttonTertiary scan-status-change icon-only" id="scan-status-change-btn" title="Change scan type">
        <svg width="16" height="16"><use href="#icon-settings"/></svg>
      </button>
      <span class="scan-status-label" id="scan-status-level">Local Scan</span>
    </div>

    <div class="search-wrap" id="search-wrap">
      <svg class="search-icon" width="16" height="16"><use href="#icon-search"/></svg>
      <input class="search-input" id="search-input" type="text" placeholder="Search…" autocomplete="off"/>
      <button class="search-clear" id="search-clear" tabindex="-1" aria-label="Clear search">
        <svg width="16" height="16"><use href="#icon-clear"/></svg>
      </button>
    </div>

    <div id="last-scan-bar" class="last-scan-row hidden">
      <span class="scan-age-text">Scanned <span id="scan-age-label">—</span></span>
      <button id="rescan-btn" class="buttonTertiary buttonRescan" title="Rescan">
        <svg width="16" height="16"><use href="#icon-update"/></svg>
      </button>
    </div>
  </div>
  <div class="dividerLine"></div>

  <div class="plugin-layout">

    <!-- ═══════════════════════════════════════════ LEFT PANEL: VAR LIST -->
    <div class="left-panel">

      <div class="mode-toggle-row">
        <div class="segmented-control full-width" id="browser-mode-toggle">
          <span class="seg-pill" aria-hidden="true"></span>
          <button id="btn-mode-tokens" class="selected"><svg width="16" height="16"><use href="#icon-variable"/></svg><span class="tab-label">Tokens</span></button>
          <button id="btn-mode-comps"><svg width="16" height="16"><use href="#icon-object-component"/></svg><span class="tab-label">Components</span></button>
        </div>
      </div>

      <div id="canvas-scan-bar" class="hidden"></div>

      <div id="browser-body" style="flex:1;min-height:0;position:relative;display:flex;flex-direction:column;">
        <div id="browser-loading" class="loading-state hidden">
          <span id="loading-text" style="font-size:var(--m-size)">Loading…</span>
        </div>

        <div id="all-list" class="scroll-area hidden"></div>
        <div id="var-list" class="scroll-area hidden"></div>
        <div id="comp-list" class="scroll-area hidden"></div>

        <div id="browser-empty" class="empty-state hidden" style="position:absolute;inset:0;">
          <div class="empty-state-content">
            <svg width="56" height="56"><use href="#icon-empty-search"/></svg>
            <p id="browser-empty-text">No results match<br>your search.</p>
            <button class="buttonSecondary" id="browser-empty-clear"><span>Clear search</span></button>
          </div>
        </div>
      </div>

    </div>

    <!-- ═══════════════════════════════════════════ RIGHT PANEL -->
    <div class="right-panel">

      <!-- Placeholder: no var selected -->
      <div id="right-placeholder" class="empty-state">
        <div class="empty-state-content">
          <svg width="56" height="56"><use href="#icon-empty-token" id="right-placeholder-icon"/></svg>
          <p id="right-placeholder-text">Select an item<br>to see what it affects.</p>
        </div>
      </div>

      <!-- Graph / list detail (shown after selecting a local var) -->
      <div id="right-detail" class="hidden">

        <!-- Status bar — ancestors breadcrumb (top row) + name/impact/toggle (main row) -->
        <div id="status-bar" class="hidden">
          <div id="sb-main-row" class="statusBar">
            <div class="statusBar-title">
              <div class="sb-type-icon" id="sb-type-icon"></div>
              <span id="sb-name"></span>
            </div>
            <span id="sb-impact" class="badge"></span>
            <span id="sb-canvas-count" class="var-canvas-count hidden"></span>
            <button id="sb-focus-btn" class="buttonTertiary hidden" data-tip="Focus on canvas">
              <svg width="16" height="16"><use href="#icon-focus"/></svg>
            </button>
            <span id="sb-lib-badge" class="tooltipButton sb-lib-badge hidden" data-tip="From an external library. No canvas focus."><svg width="12" height="12"><use href="#icon-library"/></svg></span>
            <div style="flex:1;"></div>
            <button id="sb-export-btn" class="buttonQuaternary" data-tip="Copy report to clipboard">
              <svg width="16" height="16"><use href="#icon-copy"/></svg>
            </button>
            <div class="segmented-control" id="view-mode-toggle" style="flex-shrink:0;">
              <span class="seg-pill" aria-hidden="true"></span>
              <button id="btn-view-graph" class="selected" title="Graph view">
                <svg width="16" height="16"><use href="#icon-tree"/></svg>
              </button>
              <button id="btn-view-list" title="List view">
                <svg width="16" height="16"><use href="#icon-list"/></svg>
              </button>
            </div>
          </div>
        </div>

        <!-- Toolbar: column headers + view toggle -->
        <!-- ── Graph view ── -->
        <div id="view-graph">
          <div id="graph-body">
            <!-- Single full-width header row spanning both columns -->
            <div id="graph-col-headers">
              <div class="dividerSection" id="gcol-2-lbl-wrap"><div class="dividerSection-content"><span id="gcol-2-lbl">Alias tokens</span><span class="div-sep">·</span><span class="count" id="gcol-2-count"></span></div></div>
              <div class="dividerSection" id="gcol-3-lbl-wrap"><div class="dividerSection-content">Affected components<span class="div-sep">·</span><span class="count" id="gcol-3-count"></span></div><button class="dividerSection-action buttonSecondary place-action-btn" data-tip="Place affected components on canvas"><svg width="16" height="16"><use href="#icon-fit"/></svg></button></div>
            </div>
            <div id="graph-cols">
              <div class="graph-col-wrap" id="gcol-2-wrap">
                <div class="graph-col" id="gcol-2"></div>
              </div>
              <div class="graph-col-wrap" id="gcol-3-wrap">
                <div class="graph-col" id="gcol-3"></div>
              </div>
            </div>
            <svg id="graph-edges" aria-hidden="true"></svg>
            <div id="graph-empty" class="empty-state hidden" style="position:absolute;inset:0;z-index:1;">
              <div class="empty-state-content">
                <svg width="56" height="56"><use href="#icon-empty-graph"/></svg>
                <p>No alias tokens or components<br>reference this variable.</p>
              </div>
            </div>
          </div>
        </div>

        <!-- ── List view ── -->
        <div id="view-list" class="scroll-area hidden">

          <div class="dividerSection hidden" id="list-alias-hdr"></div>
          <div class="list-sec-body" id="list-alias-body"></div>

          <div class="dividerSection hidden" id="list-comp-hdr"></div>
          <div class="list-sec-body" id="list-comp-body"></div>

        </div>

      </div>

      <!-- Library variable detail (remote var selected) -->
      <div id="right-library" class="hidden" style="display:flex;flex-direction:column;flex:1;overflow:hidden;">
        <div class="statusBar">
          <div class="statusBar-title">
            <div class="var-type-icon" id="lib-detail-type"></div>
            <span class="detail-var-name" id="lib-detail-name"></span>
          </div>
        </div>
        <div style="padding:var(--padding-xs) var(--padding-m) var(--padding-s);font-size:var(--s-size);color:var(--text-muted);flex-shrink:0;border-bottom:var(--thickness) solid var(--divider);" id="lib-detail-coll"></div>
        <div class="section-label">Referenced by</div>
        <div id="lib-ref-list" style="flex:1;overflow-y:auto;"></div>
        <div id="lib-ref-empty" class="empty-state hidden"><div class="empty-state-content"><p>No local variables alias this.</p></div></div>
      </div>

    </div>

  </div><!-- /.plugin-layout -->

</div><!-- /.plugin-wrapper -->

<!-- Cross-panel connection lines: left list → graph nodes -->
<svg id="cross-edges" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:6;">
  <path id="ce-spine" fill="none" stroke-linecap="round"/>
  <path id="ce-bracket" fill="none" stroke-linecap="round"/>
</svg>

<div id="toast-container"></div>
<div id="progress-container"></div>

<!-- Depth Selector Modal -->
<div id="deep-scan-modal" class="modal">
  <div class="modal-overlay"></div>
  <div class="modal-card">
    <h2>Choose scan type</h2>

    <div class="depth-options">

      <!-- Level 1: always done — status only, not a radio -->
      <div class="depth-option done" id="depth-opt-1">
        <div class="depth-circle-col">
          <input class="depth-radio-input" type="radio" name="scan-depth" id="depth-radio-1" value="1"/>
          <label class="depth-circle" for="depth-radio-1"></label>
        </div>
        <label class="depth-text-col" for="depth-radio-1">
          <span class="depth-label">Local</span>
          <span class="depth-desc">Scans only the current file for tokens, components, and their relationships.</span>
        </label>
      </div>

      <!-- Level 2: radio -->
      <div class="depth-option" id="depth-opt-2">
        <div class="depth-circle-col">
          <input class="depth-radio-input" type="radio" name="scan-depth" id="depth-radio-2" value="2"/>
          <label class="depth-circle" for="depth-radio-2"></label>
        </div>
        <label class="depth-text-col" for="depth-radio-2">
          <span class="depth-label">Extended</span>
          <span class="depth-desc depth-desc-default">Scans the current file and linked libraries for token and component relationships.</span>
          <span class="depth-desc depth-desc-unavailable">No external libraries linked to this file.</span>
        </label>
      </div>

      <!-- Level 3: radio -->
      <div class="depth-option" id="depth-opt-3">
        <div class="depth-circle-col">
          <input class="depth-radio-input" type="radio" name="scan-depth" id="depth-radio-3" value="3"/>
          <label class="depth-circle" for="depth-radio-3"></label>
        </div>
        <label class="depth-text-col" for="depth-radio-3">
          <span class="depth-label">Full</span>
          <span class="depth-desc">Scans everything above, then checks the entire canvas to find every component usage.</span>
        </label>
      </div>

    </div>

    <div class="modal-footer">
      <button class="buttonSecondary" id="modal-cancel-btn"><span>Cancel</span></button>
      <button class="buttonPrimary" id="modal-confirm-btn"><span>Apply and Scan</span></button>
    </div>
  </div>
</div>

<div id="tt" class="tt"></div>

<!--@UI-->
<script>

// Returns the selection highlight color — matches .node.node-selected border
// Uses #D4D4D4 in dark mode, accent blue in light mode
function getSelectionColor() {
  var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  return getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || (isDark ? '#ededed' : '#0a0a0a');
}

// ─── State ────────────────────────────────────────────────────────────────────

var _variables           = [];
var _collections         = [];
var _remoteVariables     = [];
// How much a remote variable is actually used. When one library variable arrives under
// several per-file ids, the entry with usage is the one components reference — keep it.
function remoteVarUsage(v) {
  return (v.aliasCount || 0) + (v.dependentCount || 0) + (v.componentCount || 0);
}
// One library variable can arrive under several per-file ids; only its key is stable.
function dedupeRemoteByKey(list) {
  var byKey = {}, out = [];
  var usage = remoteVarUsage;
  for (var i = 0; i < list.length; i++) {
    var v = list[i];
    if (!v.libraryKey) { out.push(v); continue; }
    if (byKey[v.libraryKey] === undefined) { byKey[v.libraryKey] = out.length; out.push(v); continue; }
    var at = byKey[v.libraryKey];
    if (usage(v) > usage(out[at])) out[at] = v;
  }
  return out;
}
var _remoteCollections   = [];
var _filterQuery         = '';
var _searchTimer         = null;
var _selectedId          = null;
var _selectedRemoteId    = null;
var _currentComponents   = null;   // null = not yet fetched; [] = empty
// Node ids the backend labelled focusable (had a pageId) but that turned out to
// be unreachable when focus was attempted — i.e. actually external. Once known,
// their rows render as a library badge instead of a focus button.
var _unreachableNodes    = new Set();
var _componentIndexBuilt = false;

// Graph state
var _currentChain        = null;
var _varComponentCounts  = {};
var _viewMode            = 'graph';
var _detailMode          = null;   // 'variable' | 'component' | null — what the right panel is showing
var _currentComp         = null;   // the comp object when _detailMode === 'component'
var _graphDescVars       = [];     // descendant vars currently visible in col-2
var _graphCompList       = [];     // component nodes currently visible in col-3
var _allDescVars         = [];     // full descendant list (for expand)
var _allCompList         = [];     // full sorted component list (for expand)
var _descCompEdges       = [];     // [{descIdx, compIdx}] for alias→component edges
var _rootCompIdxs        = [];     // compIdx[] for components that bind to the root variable directly
var _edgeRafPending      = false;
var _selectedGraphNodeEl = null;   // currently highlighted graph node
var _collapseTimer       = null;   // timer for display:none after fade

// Section-divider tracking — unstick the selected item's own divider once
// the next section's divider has scrolled into its sticky position.
var _trackedSelDiv  = null;   // divider that owns the selected item
var _trackedNextDiv = null;   // next divider after the selected item
var _trackedNextTop = 0;      // natural offsetTop of the next divider
var _trackedList    = null;   // scroll container being tracked

// Component browser state
var _browserMode          = 'all';  // 'all' | 'tokens' | 'components'
var _allBrowserComponents = [];
var _selectedCompNodeId   = null;
var _compBrowserLoaded    = false;

// Origin scroll positions — restored when a sticky-selected item is re-clicked
var _selectedVarOriginScroll  = null;
var _selectedCompOriginScroll = null;

// Canvas deep-scan state
var _displayDepth        = 1;      // What depth is currently displayed (can go up or down freely)
var _hasExternalLibraries = false; // Detected at init — hides Extended if false
var _externalScanDone    = false;  // Remote vars loaded (now happens automatically at init)
var _lastScanDepth       = null;   // persisted across sessions via clientStorage
var _lastScanTimestamp   = null;   // Unix ms of last completed scan (from cache or fresh)
var _canvasScanDone      = false;  // Level 3 completed (canvas instance count)
var _canvasScanRunning   = false;
var _canvasBindings      = {}; // varId → total (instances + direct)
var _canvasInstanceCounts = {}; // varId → instance count
var _canvasDirectCounts   = {}; // varId → direct canvas-node count
var _canvasComponents     = []; // per-component canvas scan results


// Column resize state

// ─── Boot ──────────────────────────────────────────────────────────────────────

window.onmessage = function (event) {
  var msg = event.data.pluginMessage;
  if (!msg) return;
  switch (msg.type) {
    case 'init-data':         return onInitData(msg);
    case 'init-progress':     return onInitProgress(msg);
    case 'index-progress':    return onIndexProgress(msg.text, msg.scanned, msg.total);
    case 'index-ready':       return onIndexReady(msg.components, msg.remoteVars, msg.remoteColls, msg.varComponentCounts, msg.varImpactScores);
    case 'chain-result':           return onChainResult(msg.chain, msg.styles, msg.components, msg.impact);
    case 'referenced-by':          return onReferencedBy(msg);
    case 'usage-scan-progress':    return onCanvasScanProgress(msg.pct);
    case 'usage-scan-ready':       return onCanvasScanReady(msg);
    case 'usage-scan-error':       return onCanvasScanError(msg.message);
    case 'usage-scan-cancelled':   return onCanvasScanCancelled();
    case 'scan-cache-write-failed':
      showError('Cache write #' + msg.attempt + ' failed: ' + (msg.error || '?'));
      return;
    case 'place-progress':
      return showScanProgress('Placing components… ' + Math.round((msg.done / msg.total) * 100) + '%', msg.eta || '');
    case 'place-done':        return onPlaceDone(msg);
    case 'place-cancelled':
      _placing = false;
      return dismissProgress();
    case 'place-error':
      _placing = false;
      dismissProgress();
      showError(msg.message || 'Could not place components');
      return;
    case 'focus-unavailable':
      // A user clicked focus and it failed — retag that row and tell them why.
      markNodeUnreachable(msg.nodeId);
      showToast('This component lives in an external library — it has no canvas location.');
      return;
    case 'error':             return onError(msg.message);
  }
};

_initStartTime = Date.now();
showScanProgress('Loading…', '', function () {
  parent.postMessage({ pluginMessage: { type: 'close' } }, '*');
});
parent.postMessage({ pluginMessage: { type: 'init' } }, '*');

// ─── Init ──────────────────────────────────────────────────────────────────────

var _initStartTime      = null;
var _initTargetPct      = 0;
var _initDisplayPct     = 0;
var _initTickTimer      = null;
var _initHasCachedScan  = false;
var _initLabel          = 'Local scan';

function _initTick() {
  _initTickTimer = null;
  if (_initDisplayPct >= 99) { _updateInitDisplay(); return; }

  var gap = _initTargetPct - _initDisplayPct;
  if (gap > 0.5) {
    // Behind real target — catch up with easing
    _initDisplayPct += Math.max(0.5, gap * 0.06);
  } else {
    // Reached target — keep slowly creeping (max 8% ahead of real target, cap 99)
    var cap = Math.min(99, _initTargetPct + 8);
    if (_initDisplayPct < cap) _initDisplayPct += 0.08;
  }
  _initDisplayPct = Math.min(_initDisplayPct, 99);
  _updateInitDisplay();
  _initTickTimer = setTimeout(_initTick, 120);
}

var _initEtaShown = false; // once ETA appears, never remove it

function _updateInitDisplay() {
  var pct     = Math.round(_initDisplayPct);
  var eta     = '';
  var elapsed = (Date.now() - _initStartTime) / 1000;
  if (_initDisplayPct > 0 && elapsed >= 5) {
    // Use display pct so ETA updates continuously, not just on backend messages
    // Apply 1.5x multiplier for conservative estimate
    var remaining = Math.round(elapsed / _initDisplayPct * (100 - _initDisplayPct) * 1.5);
    if (remaining >= 60) {
      var m = Math.floor(remaining / 60), s = remaining % 60;
      eta = '~' + m + 'm ' + (s > 0 ? s + 's' : '') + ' remaining';
    } else if (remaining > 0) {
      eta = '~' + remaining + 's remaining';
    }
  }
  if (eta) _initEtaShown = true;
  showScanProgress(_initLabel + '… ' + pct + '%', _initEtaShown ? (eta || '…') : '');
}

function onInitProgress(msg) {
  var pct = (msg && typeof msg === 'object' ? msg.pct : msg) || 0;
  if (msg && msg.hasCachedScan) {
    _initHasCachedScan = true;
    var d = msg.cachedDepth;
    _initLabel = d >= 3 ? 'Full scan' : d === 2 ? 'Extended scan' : 'Local scan';
    return; // toast stays — onInitData dismisses it when content is ready
  }
  if (_initHasCachedScan) return; // suppress bar — cached view renders on init-data
  _initTargetPct = Math.max(_initTargetPct, pct); // never go backward
  if (!_initStartTime) _initStartTime = Date.now();
  if (!_initTickTimer) _initTickTimer = setTimeout(_initTick, 0);
}

function onInitData(msg) {
  _variables         = msg.variables   || [];
  _collections       = msg.collections || [];
  // Collapse on the library key here too: a single payload can already carry the
  // same variable under two ids when the file is on an older library publish.
  _remoteVariables   = dedupeRemoteByKey(msg.remoteVars || []);
  _remoteCollections = msg.remoteColls || [];

  // Component index is always built at startup — absorb data immediately
  _componentIndexBuilt = true;
  _varComponentCounts  = msg.varComponentCounts || {};
  // External libraries are considered present when the library API reports them
  // OR when the file actually references remote tokens (the API is unreliable —
  // it misses libraries that are used but not formally added to the file).
  _hasExternalLibraries = !!msg.hasExternalLibraries || _remoteVariables.length > 0;
  // Mark external vars as loaded if remote vars came in with init-data
  if (_remoteVariables.length > 0) _externalScanDone = true;
  // _lastScanDepth is session-only — set by triggerCanvasScan(), never loaded from storage

  var allVarsInit = _variables.concat(_remoteVariables);
  for (var k = 0; k < allVarsInit.length; k++) {
    var vid = allVarsInit[k].id;
    if (msg.varImpactScores && msg.varImpactScores[vid] !== undefined)
      allVarsInit[k].impactScore = msg.varImpactScores[vid];
    if (_varComponentCounts[vid] !== undefined)
      allVarsInit[k].componentCount = _varComponentCounts[vid];
  }

  // Component browser data included with init — mark as loaded immediately
  if (msg.browserComponents) {
    _allBrowserComponents = (msg.browserComponents || []).filter(function (c) { return c.nodeName && c.nodeName.trim() !== ''; });
    _compBrowserLoaded    = true;
  }

  _initStartTime     = null;
  _initTargetPct     = 0;
  _initDisplayPct    = 0;
  _initEtaShown      = false;
  _initHasCachedScan = false;
  if (_initTickTimer) { clearTimeout(_initTickTimer); _initTickTimer = null; }
  var progCont = document.getElementById('progress-container');
  if (progCont) progCont.innerHTML = '';

  document.getElementById('browser-loading').classList.add('hidden');
  // Default to Tokens tab
  _browserMode = 'tokens';
  syncBrowserModeButtons('tokens');
  updatePlaceholderText('tokens');
  var phIcon = document.getElementById('right-placeholder-icon');
  if (phIcon) phIcon.setAttribute('href', '#icon-empty-token');

  if (msg.cachedScan) {
    // Restore cached canvas scan in the same paint as init — no double-render
    _lastScanTimestamp = msg.cachedScan.ts;
    _lastScanDepth     = msg.cachedScan.depth;
    var cs = Object.assign({}, msg.cachedScan, { _fromCache: true });
    onCanvasScanReady(cs);
    showScanBar(msg.cachedScan.ts, msg.cachedScan.depth);
  } else {
    // No cached canvas scan — the local analysis that just finished IS the scan,
    // so surface it. Without this the bar (and rescan) only ever appeared after a
    // canvas scan, which read as a broken build to anyone opening a fresh file.
    _lastScanTimestamp = Date.now();
    _lastScanDepth     = 1;
    showScanBar(_lastScanTimestamp, 1);
    renderBrowser();
  }
}

// ─── Divider component (used by list and graph views) ───────────────────────

function makeDivider(label, tier, count) {
  return '<div class="dividerSection"><div class="dividerSection-content">' +
    (tier ? '<span class="tier-dot ' + tier + '"></span>' : '') +
    label +
    '<span class="div-sep">·</span>' +
    '<span class="count">' + count + '</span>' +
  '</div></div>';
}

// Inner content only — for pre-existing .dividerSection containers (#list-alias-hdr, #list-comp-hdr)
// that must not be double-wrapped in another .dividerSection div.
function makeDividerContent(label, tier, count) {
  return '<div class="dividerSection-content">' +
    (tier ? '<span class="tier-dot ' + tier + '"></span>' : '') +
    label +
    '<span class="div-sep">·</span>' +
    '<span class="count">' + count + '</span>' +
  '</div>';
}

// ─── Left panel browser ──────────────────────────────────────────────────────

// Loose multi-word search: every space-separated word must appear somewhere
// in the combined searchable string (name + "/" + collectionName).
// Searching "border color" matches "buttonSecondary/border/color".
function matchesSearch(name, collectionName, query) {
  if (!query) return true;
  var haystack = (name + '/' + (collectionName || '')).toLowerCase();
  var words = query.toLowerCase().split(/\s+/);
  for (var wi = 0; wi < words.length; wi++) {
    if (words[wi] && haystack.indexOf(words[wi]) === -1) return false;
  }
  return true;
}

// Update tab empty-state based on current search query results
function updateBrowserTabStates() {
  if (!_filterQuery) {
    // No search — all tabs always have content (or at least aren't search-empty)
    var btnT = document.getElementById('btn-mode-tokens');
    var btnC = document.getElementById('btn-mode-comps');
    if (btnT) btnT.classList.remove('tab-empty');
    if (btnC) btnC.classList.remove('tab-empty');
    return;
  }
  var q = _filterQuery.toLowerCase();
  var hasVars = false;
  for (var i = 0; i < _variables.length; i++) {
    if (matchesSearch(_variables[i].name, _variables[i].collectionName, q)) { hasVars = true; break; }
  }
  if (!hasVars && _displayDepth >= 2) {
    for (var j = 0; j < _remoteVariables.length; j++) {
      if (matchesSearch(_remoteVariables[j].name, _remoteVariables[j].collectionName, q)) { hasVars = true; break; }
    }
  }
  var hasComps = false;
  for (var k = 0; k < _allBrowserComponents.length; k++) {
    var c = _allBrowserComponents[k];
    if (_displayDepth < 2 && c.isRemote) continue;
    if (matchesSearch(c.nodeName, '', q)) { hasComps = true; break; }
  }
  var btnTokens = document.getElementById('btn-mode-tokens');
  var btnComps  = document.getElementById('btn-mode-comps');
  if (btnTokens) btnTokens.classList.toggle('tab-empty', !hasVars);
  if (btnComps)  btnComps.classList.toggle('tab-empty',  !hasComps);
  // If the active tab has no results but the other does, switch immediately
  if (_browserMode === 'tokens' && !hasVars && hasComps) {
    switchBrowserMode('components');
  } else if (_browserMode === 'components' && !hasComps && hasVars) {
    switchBrowserMode('tokens');
  }
}

function renderBrowser() {
  if (_browserMode === 'components') { renderComponentBrowser(); return; }
  var q = _filterQuery.toLowerCase();

  // All tokens — local AND external library — are graded by impact and grouped
  // into the same High/Medium/Low/Unused tiers. Remote tokens only appear once
  // an Extended/Full scan has surfaced them (and their component counts).
  var allVars = [];
  for (var i = 0; i < _variables.length; i++) {
    if (matchesSearch(_variables[i].name, _variables[i].collectionName, q)) allVars.push(_variables[i]);
  }
  if (_displayDepth >= 2) {
    for (var j = 0; j < _remoteVariables.length; j++) {
      if (matchesSearch(_remoteVariables[j].name, _remoteVariables[j].collectionName, q)) allVars.push(_remoteVariables[j]);
    }
  }

  var listEl  = document.getElementById('var-list');
  if (allVars.length === 0) {
    listEl.innerHTML = '';
    showBrowserEmpty(true);
    document.body.classList.add('browser-empty');
    if (q) updateBrowserTabStates();
    return;
  }
  showBrowserEmpty(false);
  document.body.classList.remove('browser-empty');

  var high = [], medium = [], low = [], none = [];
  for (var k = 0; k < allVars.length; k++) {
    var v = allVars[k];
    var s = varImpactScore(v);
    if (s === 0)      none.push(v);
    else if (s > 100) high.push(v);
    else if (s > 40)  medium.push(v);
    else              low.push(v);
  }

  function scoreAlphSort(arr) {
    return arr.slice().sort(function(a, b) {
      var diff = varImpactScore(b) - varImpactScore(a);
      return diff !== 0 ? diff : (a.name < b.name ? -1 : a.name > b.name ? 1 : 0);
    });
  }

  var html = '';
  function renderSection(label, tier, vars) {
    if (vars.length === 0) return;
    html += makeDivider(label, tier, vars.length);
    var sorted = scoreAlphSort(vars);
    for (var i = 0; i < sorted.length; i++) html += renderVarRow(sorted[i]);
  }
  renderSection('High',   'high',   high);
  renderSection('Medium', 'medium', medium);
  renderSection('Low',    'low',    low);
  renderSection('Unused', 'none',   none);

  listEl.innerHTML = html;
  document.getElementById('comp-list').classList.add('hidden');
  listEl.classList.remove('hidden');
  setupDividerTracking('var-list');
  updateBrowserTabStates();
}

function renderVarRow(v) {
  var isRemote   = !!v.isRemote;
  var isSelected = isRemote ? v.id === _selectedRemoteId : v.id === _selectedId;
  // External-library tokens get the same library indicator + tooltip as external
  // components, so their origin is clear at a glance.
  var libBadge = isRemote
    ? '<span class="tooltipButton lib-badge" data-tip="From an external library."><svg width="12" height="12"><use href="#icon-library"/></svg></span>'
    : '';
  return '<button class="node var-item' + (isSelected ? ' node-selected' : '') + '" data-id="' + esc(v.id) + '" data-remote="' + (isRemote ? '1' : '0') + '">' +
    '<div class="var-type-icon">' + varTypeIconHtml(v.resolvedType, 16) + '</div>' +
    '<span class="var-name">' + esc(nodeLabelName(v.name)) + '</span>' +
    libBadge +
    '<span class="node-goto-btn var-item-chevron"><svg width="16" height="16"><use href="#icon-arrow-right"/></svg></span>' +
  '</button>';
}

function varImpactScoreBase(v) {
  if (v.isRemote) return (v.aliasCount || 0) * 6 + (v.componentCount || 0) * 4;
  return (v.dependentCount || 0) * 6 + (v.componentCount || 0) * 4;
}

function varImpactScore(v) {
  // depth=1 → local only (component count + token refs, no canvas instances)
  if (_displayDepth <= 1) return varImpactScoreBase(v);
  // depth=2 → component-based (extended libs included, but no instance traversal)
  if (_displayDepth === 2) return v._preCanvasScore !== undefined ? v._preCanvasScore : varImpactScoreBase(v);
  // depth=3 → full (includes canvas instance counts)
  if (v.impactScore !== undefined) return v.impactScore;
  return varImpactScoreBase(v);
}

// ─── Single source of truth for selection clearing ────────────────────────────
// Call this before setting any new selection so no stale .node-selected can survive.
function clearAllSelections() {
  _selectedId               = null;
  _selectedRemoteId         = null;
  _selectedCompNodeId       = null;
  _currentComponents        = null;
  _selectedVarOriginScroll  = null;
  _selectedCompOriginScroll = null;
  if (_trackedSelDiv) _trackedSelDiv.classList.remove('divider-away');
  _trackedSelDiv = null; _trackedNextDiv = null; _trackedList = null;
  ['all-list', 'var-list', 'comp-list'].forEach(function (id) {
    var el = document.getElementById(id);
    if (!el) return;
    el.classList.remove('has-list-selection');
    el.querySelectorAll('.node-selected').forEach(function (n) { n.classList.remove('node-selected'); });
  });
}

function onVarClick(e) {
  // Support both direct call (currentTarget = item) and delegated call (item passed as arg)
  var item     = (e instanceof Event) ? e.target.closest('.var-item') : e;
  if (!item) return;
  if (e instanceof Event && e.target.closest('.node-drill-btn, .node-focus-btn')) return;
  // The chevron always SELECTS — never toggles — so it can't deselect an
  // already-selected row the way the row body does.
  var viaChevron = (e instanceof Event) && !!e.target.closest('.node-goto-btn, .var-item-chevron');
  var id       = item.getAttribute('data-id');
  var isRemote = item.getAttribute('data-remote') === '1';
  if (!id) return;

  var alreadySelected = (isRemote && id === _selectedRemoteId) || (!isRemote && id === _selectedId);
  // Chevron on the already-selected token → no-op. It must never deselect, and
  // re-running the analyze would re-fetch and re-render, flickering the content.
  if (viaChevron && alreadySelected) return;

  var _activeVarList = document.getElementById('var-list');

  // Re-click the row body on an already-selected item → scroll to origin, then
  // deselect. Not reachable via the chevron (handled above).
  if (!viaChevron && alreadySelected) {
    var originScroll = _selectedVarOriginScroll;
    if (originScroll !== null) _activeVarList.scrollTo({ top: originScroll, behavior: 'smooth' });
    setTimeout(function () {
      clearAllSelections();
      resetRightPanel();
    }, 320);
    return;
  }

  // Record origin scroll, then wipe every other selection
  var savedScroll = _activeVarList.scrollTop;
  clearAllSelections();
  _selectedVarOriginScroll = savedScroll;

  if (isRemote) {
    _selectedRemoteId = id;
    _selectedId       = null;
  } else {
    _selectedId       = id;
    _selectedRemoteId = null;
    _currentComponents = null;
  }
  var items = _activeVarList.querySelectorAll('.var-item');
  for (var i = 0; i < items.length; i++) {
    var iid  = items[i].getAttribute('data-id');
    var irem = items[i].getAttribute('data-remote') === '1';
    items[i].classList.toggle('node-selected', iid === id && irem === isRemote);
  }
  _activeVarList.classList.add('has-list-selection');
  setupDividerTracking('var-list');

  var col3El = document.getElementById('gcol-3');
  if (col3El) col3El.scrollTop = 0;

  if (isRemote) {
    _currentComponents = null;
    resetRightPanel();
    var rv = findRemoteVar(id);
    parent.postMessage({ pluginMessage: {
      type: 'analyze-remote', variableId: id,
      varName:        rv ? rv.name        : null,
      resolvedType:   rv ? rv.resolvedType : null,
      collectionName: rv ? (rv.collectionName || rv.libraryName || '') : '',
    } }, '*');
  } else {
    resetRightPanel();
    parent.postMessage({ pluginMessage: { type: 'analyze', variableId: id } }, '*');
  }
}

// ─── Panel visibility ─────────────────────────────────────────────────────────

function showRightPanel(which) {
  document.getElementById('right-placeholder').classList.toggle('hidden', which !== 'placeholder');
  document.getElementById('right-detail').classList.toggle('hidden', which !== 'detail');
  var libEl = document.getElementById('right-library');
  libEl.classList.toggle('hidden', which !== 'library');
  libEl.style.display = which === 'library' ? 'flex' : 'none';

  // Re-position the pill whenever the detail panel becomes visible —
  // offsetLeft/offsetWidth are 0 on hidden elements so init can't do it.
  if (which === 'detail') {
    updateSegPill(document.getElementById('view-mode-toggle'), true);
  }
}

function resetRightPanel() {
  // Always clear selection state before rebuilding the graph
  clearGraphSelectionState();
  _detailMode  = null;
  _currentComp = null;

  var col2 = document.getElementById('gcol-2');
  var col3 = document.getElementById('gcol-3');
  if (col2) col2.innerHTML = '';
  if (col3) col3.innerHTML = '';
  var svg = document.getElementById('graph-edges');
  if (svg) svg.innerHTML = '';
  clearCrossEdges();
  var bodyEl = document.getElementById('graph-body');
  if (bodyEl) bodyEl.classList.remove('has-content', 'comp-mode');
  var lbl2reset = document.getElementById('gcol-2-lbl');
  if (lbl2reset) lbl2reset.textContent = 'Alias tokens';
  var c2 = document.getElementById('gcol-2-count');
  var c3 = document.getElementById('gcol-3-count');
  if (c2) c2.textContent = '';
  if (c3) c3.textContent = '';
  var g3hdr = document.getElementById('gcol-3-lbl-wrap');
  setColHdrVisible(g3hdr, false); // stays in the flex row so column widths hold
  _graphDescVars = [];
  _graphCompList = [];
  _allDescVars   = [];
  _allCompList   = [];
  _descCompEdges = [];
  var ccEl = document.getElementById('sb-canvas-count');
  if (ccEl) ccEl.classList.add('hidden');
  var focusBtn = document.getElementById('sb-focus-btn');
  if (focusBtn) focusBtn.classList.add('hidden');

  // Delay the placeholder — if content arrives within 120ms we skip the flash
  clearTimeout(_placeholderTimer);
  _placeholderTimer = setTimeout(function () {
    showRightPanel('placeholder');
  }, 120);
}

// ─── Chain result ─────────────────────────────────────────────────────────────

function onChainResult(chain, styles, components, impact) {
  clearTimeout(_placeholderTimer); // content arrived — skip placeholder flash
  _currentChain      = chain;
  _currentComponents = (components !== null && components !== undefined) ? components : null;
  _detailMode        = 'variable';
  _currentComp       = null;
  // Impact score is canonical from init/canvas scan — do not overwrite with detail analysis result.

  // Reset detail view scroll on every new selection
  var viewList = document.getElementById('view-list');
  if (viewList) viewList.scrollTop = 0;
  var gcol2 = document.getElementById('gcol-2');
  var gcol3 = document.getElementById('gcol-3');
  if (gcol2) gcol2.scrollTop = 0;
  if (gcol3) gcol3.scrollTop = 0;

  renderGraph(chain);
  if (_viewMode === 'list') {
    renderListView(chain);
    renderListComponents(_currentComponents);
  }

  // Auto-select the single item when there's only one linked alias or component
  requestAnimationFrame(function () {
    var descs = chain.descendants || [];
    var comps = _currentComponents || [];
    if (_viewMode === 'list') {
      if (descs.length === 1 && comps.length !== 1) {
        var aliasRow = document.querySelector('#list-alias-body .buttonList[data-id]');
        if (aliasRow) onListAliasClick({ currentTarget: aliasRow, target: aliasRow });
      } else if (comps.length === 1 && descs.length !== 1) {
        var compRow = document.querySelector('#list-comp-body .buttonList[data-node-id]');
        if (compRow) onListCompClick({ target: compRow });
      }
    } else {
      if (descs.length === 1 && comps.length !== 1) {
        var descNode = document.querySelector('#gcol-2 .var-node');
        if (descNode) descNode.click();
      } else if (comps.length === 1 && descs.length !== 1) {
        var compNode = document.querySelector('#gcol-3 .comp-item');
        if (compNode) compNode.click();
      }
    }
  });

  updateStatusBar(chain, _currentComponents !== null ? _currentComponents.length : null);
  var sb = document.getElementById('status-bar');
  if (sb) sb.classList.remove('hidden');
  showRightPanel('detail');

  // When reached via drill/navigation the selected list row smooth-scrolls into
  // view, so the first edge draw can measure it mid-scroll (or before it's marked
  // selected) and end up drawing nothing. Redraw once the scroll settles so the
  // connectors always appear — harmless (idempotent) when the first draw succeeded.
  if (_viewMode === 'graph') setTimeout(scheduleDrawEdges, 380);
 

  // Component index is built at init — no lazy scan needed
}

// ─── Graph rendering ──────────────────────────────────────────────────────────

// Show/hide a graph column's header label. Both columns stay in the flex row
// either way so the two columns keep their alignment — but a hidden label also
// drops the divider's background, since an empty opaque strip would clip the
// edge lines drawn underneath it.
function setColHdrVisible(el, visible) {
  if (!el) return;
  el.style.visibility = visible ? '' : 'hidden';
  el.classList.toggle('col-empty', !visible);
}

function renderGraph(chain) {
  if (!chain) return;

  var col2 = document.getElementById('gcol-2');
  var col3 = document.getElementById('gcol-3');
  if (!col2 || !col3) return;

  col2.innerHTML = '';
  col3.innerHTML = '';
  _graphDescVars       = [];
  _graphCompList       = [];
  _allDescVars         = [];
  _allCompList         = [];
  _descCompEdges       = [];
  _rootCompIdxs        = [];
  _selectedGraphNodeEl = null;

  var svg = document.getElementById('graph-edges');
  if (svg) svg.innerHTML = '';

  // ── Col 2: Descendants ──
  var descendants = chain.descendants || [];
  _allDescVars   = descendants;
  _graphDescVars = descendants;
  var graphEmptyEl = document.getElementById('graph-empty');
  if (graphEmptyEl) graphEmptyEl.classList.add('hidden');

  var hasDescs = descendants.length > 0;
  var hasComps = _currentComponents !== null && _currentComponents.length > 0;

  var cnt2        = document.getElementById('gcol-2-count');
  var gcol2lbl    = document.getElementById('gcol-2-lbl-wrap');
  var gcol3lbl    = document.getElementById('gcol-3-lbl-wrap');
  var gcol2wrap   = document.getElementById('gcol-2-wrap');
  var gcol3wrap   = document.getElementById('gcol-3-wrap');
  var colHeaders  = document.getElementById('graph-col-headers');
  var bodyElG     = document.getElementById('graph-body');

  if (cnt2) cnt2.textContent = hasDescs ? descendants.length : '';

  // Both columns always visible — divider labels hidden via visibility (not display)
  // to preserve column alignment in the flex header row
  setColHdrVisible(gcol2lbl, hasDescs);
  if (gcol2wrap) gcol2wrap.style.display     = '';
  setColHdrVisible(gcol3lbl, hasComps);
  if (gcol3wrap) gcol3wrap.style.display     = '';
  if (colHeaders) colHeaders.style.display = (hasDescs || hasComps) ? '' : 'none';
  if (bodyElG) bodyElG.classList.add('has-content');

  // ── Col 2: Descendants ──
  if (hasDescs) {
    var descHtml = '';
    for (var di = 0; di < descendants.length; di++) {
      descHtml += makeVarNode(descendants[di], 'desc', descendants[di].id);
    }
    col2.innerHTML = descHtml;
  } else {
    col2.innerHTML = '';
  }

  // ── Col 3: Components ──
  if (_currentComponents !== null) {
    renderComponents(_currentComponents);
  } else {
    col3.innerHTML = '<div class="col-placeholder"><div class="spinner"></div><span id="comp-load-text">Indexing…</span></div>';
    if (bodyElG) bodyElG.classList.add('has-content');
    scheduleDrawEdges();
  }

  scheduleDrawEdges();
}

function makeVarNode(v, cssClass, dataId) {
  var isExternal = !!(v && v.isExternal);
  // External vars are not in the local list — don't set data-id or drill button
  var idAttr   = (dataId && !isExternal) ? ' data-id="' + esc(dataId) + '"' : '';
  var externalAttr = isExternal ? ' data-external="1"' : '';
  var drillBtn = (cssClass === 'desc' && !isExternal)
    ? '<button class="node-drill-btn" data-drill-id="' + esc(dataId) + '" data-tip="Select in list">' +
        '<svg width="16" height="16"><use href="#icon-arrow-right"/></svg>' +
      '</button>'
    : '';
  var externalBadge = isExternal
    ? '<span class="tooltipButton lib-badge node-lib-badge" data-tip="From external library — run Full scan to explore">' +
        '<svg width="12" height="12"><use href="#icon-library"/></svg></span>'
    : '';
  return '<div class="node graph-node ' + cssClass + (isExternal ? ' node-external' : '') + '"' + idAttr + externalAttr + '>' +
    '<div class="node-type-icon">' + varTypeIconHtml(v.resolvedType, 16) + '</div>' +
    '<div class="node-body">' +
      '<div class="node-name" title="' + esc(v.name) + '">' + esc(nodeLabelName(v.name)) + '</div>' +
      externalBadge +
    '</div>' +
    drillBtn +
  '</div>';
}

function nodeLabelName(name) {
  return name || '';
}

// A component the backend marked focusable turned out to be unreachable (external).
// Record it so every future render shows a library badge, and patch the rows already
// on screen without a full re-render — swap each focus control for the library badge.
var LIB_BADGE_HTML = '<span class="tooltipButton lib-badge" data-tip="From an external library. No canvas focus."><svg width="12" height="12"><use href="#icon-library"/></svg></span>';
function markNodeUnreachable(nodeId) {
  if (!nodeId || _unreachableNodes.has(nodeId)) return;
  _unreachableNodes.add(nodeId);
  var sel = '.node-focus-btn[data-node-id="' + nodeId + '"], ' +
            '.buttonList-action[data-node-id="' + nodeId + '"], ' +
            '.comp-item-focus-btn[data-node-id="' + nodeId + '"]';
  var btns = document.querySelectorAll(sel);
  for (var i = 0; i < btns.length; i++) {
    var tmp = document.createElement('template');
    tmp.innerHTML = LIB_BADGE_HTML;
    btns[i].replaceWith(tmp.content.firstChild);
  }
}

function makeCompNodeHtml(c) {
  var count = c.boundCount || 1;
  var gotoBtn =
    '<button class="node-goto-btn" data-goto-node-id="' + esc(c.nodeId) + '" data-tip="Select component">' +
      '<svg width="16" height="16"><use href="#icon-arrow-right"/></svg>' +
    '</button>';
  var focusBtn = (c.pageId && !_unreachableNodes.has(c.nodeId))
    ? '<button class="node-focus-btn" data-node-id="' + esc(c.nodeId) + '" data-page-id="' + esc(c.pageId) + '" data-tip="Focus on canvas">' +
        '<svg width="16" height="16"><use href="#icon-focus"/></svg>' +
      '</button>'
