<style>
  /* ── Font Scaling Lab: plugin-specific styles ── */
  /* Plugin-local vars — no DS token equivalent */
  :root {
    --canvas-bg: #E6E6E6;
    --clipped-color: #DB0000;
    --clipped-text: #FFFFFF;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --canvas-bg: #1F1F1F;
      --clipped-color: #FE6767;
      --clipped-text: #171717;
    }
  }

  /* Preview images */
  /* ── Zoom / pan container (scaled preview) ── */
  .zoom-wrap {
    position: relative;
    overflow: hidden;
    background-color: var(--canvas-bg);
    background-image:
      linear-gradient(45deg, rgba(0,0,0,0.04) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.04) 75%),
      linear-gradient(45deg, rgba(0,0,0,0.04) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.04) 75%);
    background-size: 16px 16px;
    background-position: 0 0, 8px 8px;
    border: 1.2px solid var(--border);
    border-radius: 6px;
    min-height: 100px;
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
  }
  @media (prefers-color-scheme: dark) {
    .zoom-wrap {
      background-image:
        linear-gradient(45deg, rgba(255,255,255,0.04) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.04) 75%),
        linear-gradient(45deg, rgba(255,255,255,0.04) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.04) 75%);
    }
  }
  .zoom-wrap.dragging { cursor: grabbing; }
  /* Resize handle cursors take priority over grab/grabbing */
  body[style*="resize"] .zoom-wrap,
  body[style*="resize"] .zoom-wrap.dragging { cursor: inherit; }
  .zoom-canvas {
    position: absolute;
    top: 0; left: 0;
    transform-origin: 0 0;
    will-change: transform;
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .zoom-canvas.no-transition { transition: none; }
  .zoom-canvas img { display: block; max-width: none; }

  /* Issue overlays — HTML rectangles drawn directly over the preview image.
     Always visible with a 2px coloured border; hover adds an outer glow ring. */
  #issue-overlays { position: absolute; top: 0; left: 0; pointer-events: none; }
  .issue-overlay {
    position: absolute; box-sizing: border-box;
    border: 2px solid transparent;
    pointer-events: all;
    cursor: default;
  }
  .issue-overlay[data-nid] { cursor: pointer; }
  .issue-overlay.t-clipped {
    border-color: var(--clipped-color);
    background: rgba(219, 0, 0, 0.25);
  }
  .issue-overlay.t-clipped.active { box-shadow: 0 0 0 4px rgba(219,0,0,0.35); }
  @media (prefers-color-scheme: dark) {
    .issue-overlay.t-clipped {
      background: rgba(254, 103, 103, 0.25);
    }
    .issue-overlay.t-clipped.active { box-shadow: 0 0 0 4px rgba(254,103,103,0.35); }
  }
  .issue-overlay.dimmed { opacity: 0.15; transition: opacity 0.15s; }
  /* When a highlight is pinned, hide every other highlight (overlay + label)
     so the focus is exclusively on the selected one. */
  .zoom-wrap.has-pin .issue-overlay:not(.active),
  .zoom-wrap.has-pin .overlay-label:not(.active) { display: none; }
  .issue-overlay { transition: opacity 0.15s, box-shadow 0.12s; }

  /* Label badges live outside zoom-canvas so they never blur at any zoom level */
  #label-layer {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    overflow: visible;
  }
  .overlay-label {
    position: absolute;
    background: var(--clipped-color);
    color: var(--clipped-text);
    font-size: var(--s-size);
    font-weight: 500;
    letter-spacing: 0.2px;
    height: var(--button-min-height);
    max-width: 200px;
    padding: 0 8px 0 6px;
    gap: 5px;
    border-radius: 0;
    display: flex;
    align-items: center;
    white-space: nowrap;
    overflow: hidden;
    pointer-events: none;
    opacity: 0;
  }
  .overlay-label-text {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }
  .overlay-label.active { opacity: 1; }
  /* Once pinned (already focused), the focus-in-preview hint icon is unneeded */
  .overlay-label.pinned svg { display: none; }
  .overlay-label[data-nid] { cursor: pointer; pointer-events: all; }
  .overlay-label { transition: opacity 0.12s, left 0.35s cubic-bezier(0.4,0,0.2,1), top 0.35s cubic-bezier(0.4,0,0.2,1); }
  .overlay-label.no-transition { transition: opacity 0.12s; }
  .zoom-hint {
    position: absolute;
    bottom: 6px; left: 50%;
    transform: translateX(-50%);
    /* DS tooltipPopover (821:72473): 4/8 padding, radii/tooltip, 1.5px border,
       10px/700 label. Was a hand-rolled chip on a hardcoded translucent black. */
    background: var(--tooltipPopover-background);
    border: var(--thickness) solid var(--tooltipPopover-border);
    color: var(--tooltipPopover-text);
    font-size: var(--s-size);
    font-weight: var(--s-weight);
    padding: var(--padding-xs) var(--padding-s);
    border-radius: var(--radius-tooltip);
    pointer-events: none;
    white-space: nowrap;
    opacity: 1;
    transition: opacity 0.4s ease;
  }
  .zoom-hint.hidden { opacity: 0; }
  .zoom-reset {
    position: absolute;
    bottom: 12px; right: 12px;
    display: none;
  }
  .zoom-wrap.zoomed .zoom-reset { display: inline-flex; }

  /* Issues */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0 6px;
  }
  .section-title {
    font-size: var(--s-size);
    font-weight: var(--s-weight);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-muted);
  }

  .content-row {
    display: flex;
    flex-direction: row;
    align-items: stretch;
    gap: 0;
    flex: 1;
    min-height: 0;
  }
  #issues-panel {
    width: 200px;
    min-height: 0;
    overflow-x: hidden;
    min-width: 120px;
    max-width: 400px;
  }
  #issues-panel .issues-list { min-height: 0; }
  #preview-grid {
    flex: 1;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: row;
  }
  #preview-grid .zoom-wrap {
    flex: 1;
    min-width: 0;
    min-height: 0;
    border: none;
    border-radius: 0;
  }

  /* ── Pinned-element details side panel ── */
  #details-panel {
    width: 0;
    min-width: 0;
  }
  #details-panel.open { width: 260px; }
  #details-panel:not(.open) .sidePanelResize { display: none; }
  .details-type-icon { color: var(--text-muted); flex-shrink: 0; display: block; }
  .details-header-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .details-title-row { display: flex; align-items: center; gap: 6px; }
  .details-title {
    font-size: var(--l-size);
    font-weight: var(--m-weight);
    color: var(--text);
    word-break: break-word;
  }
  .details-close { margin-top: 1px; }
  /* .details-status uses base .badge component */
  .details-actions {
    padding: 0 12px 10px 12px;
    flex-shrink: 0;
    background: var(--bg);
  }
  .details-actions:empty { display: none; }
  #details-focus {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 0 var(--padding-s);
    white-space: nowrap;
  }
  .details-section {
    padding: 10px 0;
  }
  .details-section h4 {
    font-size: var(--s-size);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-muted);
    margin: 0 0 6px 0;
    font-weight: var(--m-weight);
  }
  .details-row {
    display: flex; justify-content: space-between; gap: var(--gap-m);
    padding: 3px 0;
    font-size: var(--m-size);
    line-height: 1.45;
  }
  .details-row .label { color: var(--text-muted); flex-shrink: 0; }
  .details-row .value {
    color: var(--text);
    text-align: right;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    min-width: 0;
  }
  .details-row .value .src {
    display: block;
    font-size: var(--s-size);
    color: var(--text-muted);
    margin-top: 1px;
  }
  .details-path {
    font-size: var(--s-size);
    color: var(--text-muted);
    line-height: 1.5;
    word-break: break-word;
  }
  .details-path .sep { opacity: 0.5; padding: 0 3px; }
  .details-fix-row {
    padding: 4px 0;
    line-height: 1.45;
    font-size: var(--m-size);
  }
  .details-fix-row .what  { color: var(--clipped-color); }
  .details-fix-row .arrow { color: var(--text-muted); padding: 0 4px; }
  .details-fix-row .fix   { color: var(--semantic-positive); }
  .details-scale .arrow,
  .details-row .arrow { color: var(--text-muted); padding: 0 2px; }
  .details-description {
    font-size: var(--m-size);
    line-height: 1.5;
    color: var(--text);
    font-weight: 500;
    margin-top: var(--gap-s);
  }

  /* Suggested Fixes */
  .details-fixes-header {
    font-size: var(--m-size);
    font-weight: var(--m-weight);
    color: var(--text);
    margin: 0;
  }
  .fix-row {
    display: flex;
    gap: 10px;
    padding: var(--padding-m) 0;
    border-top: none;
    background-image: linear-gradient(var(--divider), var(--divider));
    background-size: 24px 1px;
    background-repeat: no-repeat;
    background-position: 24px 0;
  }
  .details-fixes-header + .fix-row { background: none; padding-top: var(--padding-l); }
  .fix-row:last-child { padding-bottom: 0; }
  .details-section + .details-section.details-fixes-section { border-top: none; }
  .details-fixes-section { padding-bottom: 0; }
  .fix-icon {
    flex-shrink: 0;
    color: var(--text-muted);
    margin-top: 1px;
  }
  .fix-body { flex: 1; min-width: 0; }
  .fix-title-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 2px;
  }
  .fix-title {
    font-size: var(--m-size);
    font-weight: var(--m-weight);
    color: var(--text);
  }
  .fix-star { color: var(--text-muted); flex-shrink: 0; }
  .fix-desc {
    font-size: var(--m-size);
    color: var(--text-muted);
    line-height: 1.4;
  }
  .fix-action {
    margin-top: var(--gap-m);
  }

  .issues-list { display: flex; flex-direction: column; }

  .issue-group { display: flex; flex-direction: column; }
  .issue-group + .issue-group { border-top: var(--divider-border); }
  .issue-group-header {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 0 6px;
    cursor: pointer; user-select: none; -webkit-user-select: none;
  }
  .issue-group-label { display: flex; align-items: center; gap: 6px; font-size: var(--l-size); font-weight: var(--s-weight); color: var(--text); flex: 1; min-width: 0; }
  .dividerSection + .issue-item { margin-top: 0; }
  .issue-primary > span.txt {
    min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .issue-type-icon { color: var(--text-muted); flex-shrink: 0; display: block; }
  .issue-legend-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; margin-top: 3px; }
  .t-clipped .issue-legend-dot { background: var(--clipped-color); }
  /* .tooltipButton (DS trigger) carries the appearance; nothing local needed. */
  .issue-group-count { font-size: var(--s-size); font-weight: var(--m-weight); color: var(--text-muted); flex-shrink: 0; }
  .issue-chevron { flex-shrink: 0; color: var(--text-muted); transition: transform 0.18s ease; }
  .issue-group.collapsed .issue-chevron { transform: rotate(-90deg); }
  .issue-group-body { display: flex; flex-direction: column; padding-bottom: var(--padding-xs); }
  .issue-group.collapsed .issue-group-body { display: none; }

  /* Divider between adjacent rows comes from border-bottom on .buttonList */
  .issue-meta { flex: 1; min-width: 0; }
  .issue-primary {
    display: flex; align-items: center; gap: 6px;
    font-size: var(--m-size); color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .issue-secondary {
    font-size: var(--m-size); color: var(--text-muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin-top: 1px;
  }
  .issue-reasons {
    margin-top: var(--gap-s);
    display: flex; flex-direction: column; gap: var(--gap-xs);
  }
  .issue-reason {
    font-size: var(--s-size);
    color: var(--text-muted);
    line-height: 1.4;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .issue-reason b { color: var(--text); font-weight: 500; }
  .issue-focus,
  .issue-preview-center {
    width: var(--button-min-height);
    padding: 0;
  }

  .no-issues {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: var(--padding-xl) 0;
    color: var(--text);
    font-size: var(--m-size);
    font-weight: 500;
    text-align: center;
  }
  .no-issues svg { color: var(--text-secondary); }

  /* Frame name inside focus button */
  .frame-name {
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }



  /* Vertically center all action bar items */

  #gen-btn { justify-content: center; width: var(--button-min-height); padding: 0; }
  #gen-btn:disabled, #gen-btn:disabled:hover { opacity: 0.24; background: var(--buttonPrimary-background); color: var(--buttonPrimary-text); cursor: not-allowed; }

  /* Scale stepper */
  #scale-stepper { display: flex; align-items: center; gap: 3px; }
  .scale-step-btn {
    border-radius: 50%;
  }
  .scale-step-btn:disabled { opacity: 0.24; cursor: not-allowed; }
  #scale-input {
    width: 58px; height: var(--button-min-height);
    text-align: center;
    border: 1.2px solid var(--border);
    border-radius: var(--radius-full);
    background: transparent;
    color: var(--text);
    font-size: var(--m-size);
    font-weight: var(--m-weight);
    font-family: inherit;
    outline: none;
    padding: 0 6px;
    cursor: default;
  }
  #scale-input:focus {
    border-color: var(--text-muted);
    cursor: text;
  }

</style>
</head>

<!-- Active UI -->
<div id="results-ui" style="display:none; flex-direction:column; flex:1; min-height:0;">

  <!-- Action bar: scale controls + generate -->
  <div id="actionbar" class="actionbar">
    <button id="focus-frame-btn" class="buttonTertiary" data-tip="Focus in canvas" style="min-width:0;max-width:240px;" disabled>
      <span id="frame-name" class="frame-name"></span>
      <svg width="16" height="16" style="flex-shrink:0;"><use href="#icon-focus"/></svg>
    </button>
    <div id="scale-stepper" style="margin-left:auto;">
      <button id="scale-dec" class="buttonSecondary scale-step-btn" aria-label="Decrease scale">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="2.5" y1="6" x2="9.5" y2="6"/></svg>
      </button>
      <input id="scale-input" type="text" value="125%" inputmode="numeric" autocomplete="off" spellcheck="false" />
      <button id="scale-inc" class="buttonSecondary scale-step-btn" aria-label="Increase scale">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="6" y1="2.5" x2="6" y2="9.5"/><line x1="2.5" y1="6" x2="9.5" y2="6"/></svg>
      </button>
    </div>
    <button id="gen-btn" class="buttonPrimary buttonRescan" data-tip="Generate preview" style="margin-left:10px;">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1.5 6A4.5 4.5 0 0 1 9 2.5l1-1"/>
        <path d="M10.5 6A4.5 4.5 0 0 1 3 9.5l-1 1"/>
        <polyline points="9.5,1 10.5,3.5 8,3.5"/>
        <polyline points="2.5,11 1.5,8.5 4,8.5"/>
      </svg>
    </button>
  </div>
  <div class="dividerLine"></div>

  <!-- Scrollable results -->
  <div class="scroll-area" style="margin:0 -16px; padding:0; flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden;">
    <div class="content-row">

      <!-- Issues sidebar (left, resizable, hidden until first generate) -->
      <div id="issues-panel" class="sidePanel sidePanel--left" style="display:none;">
        <div class="issues-list sidePanelBody" id="issues-list"></div>
        <div id="panel-resize-handle" class="sidePanelResize"></div>
      </div>

      <!-- Preview (right, flex:1, hidden until first generate) -->
      <div id="preview-grid" style="display:none;">
        <div class="zoom-wrap" id="zoom-wrap">
          <div class="zoom-canvas" id="zoom-canvas">
            <img id="img-scaled" src="" alt="Scaled" />
            <div id="issue-overlays"></div>
          </div>
          <div id="label-layer"></div>
          <button class="buttonSecondary zoom-reset" id="zoom-reset">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-linecap="round">
              <circle cx="6" cy="6" r="4.5" stroke-width="1" stroke-dasharray="4.95 2.12" stroke-dashoffset="2.47" transform="rotate(-90 6 6)"/>
              <circle cx="6" cy="6" r="0.8" fill="currentColor" stroke="none"/>
            </svg>
            <span>Reset view</span>
          </button>
          <div class="zoom-hint" id="zoom-hint">Scroll to zoom · Drag to pan</div>
        </div>
        <!-- Details panel for the pinned highlight -->
        <aside id="details-panel" class="sidePanel sidePanel--right">
          <div class="sidePanelResize" id="details-resize-handle"></div>
          <div class="sidePanelHeader details-header">
            <div class="details-header-text">
              <div class="details-title-row">
                <svg class="details-type-icon" id="details-type-icon" width="16" height="16"><use href="#icon-object-frame"/></svg>
                <span class="details-title" id="details-title"></span>
              </div>
            </div>
            <button class="buttonSecondary details-close" id="details-close">
              <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                <line x1="1" y1="1" x2="9" y2="9"/><line x1="9" y1="1" x2="1" y2="9"/>
              </svg>
            </button>
          </div>
          <div class="sidePanelBody" id="details-body"></div>
        </aside>
      </div>

    </div>
  </div>
</div>

<script>
  const ISSUE_CFG = {
    overflow: { label: 'Text overflow', severity: 'red' },
  };

  const SCALE_PRESETS = [100, 110, 125, 150, 175, 200];
  let scalePercent = 125;
  let scale = 1.25;
  let hasSel = false;
  let hasGenerated = false;
  let generationCancelled = false;
  let currentIssues = [];
  let frameW = 0, frameH = 0;
  let currentSelNodeId = null;
  let lastScannedNodeId = null;
  let lastScannedScale = null;
  let _dirty = false;

  function setDirty(val) {
    // Once a result exists the button should always be refreshable — canvas
    // content may have changed even if selection and scale are the same.
    _dirty = hasGenerated ? true : val;
    const canScan = hasSel || (hasGenerated && lastScannedNodeId != null);
    genBtn.disabled = !canScan || !_dirty;
  }

  // ── Scale stepper ─────────────────────────────────────────────────────
  const scaleInput = document.getElementById('scale-input');
  const scaleDec   = document.getElementById('scale-dec');
  const scaleInc   = document.getElementById('scale-inc');

  function applyScalePercent(pct, markDirty) {
    pct = Math.min(Math.max(Math.round(pct), 100), 200);
    scalePercent = pct;
    scale = pct / 100;
    scaleInput.value = pct + '%';
    scaleDec.disabled = pct <= 100;
    scaleInc.disabled = pct >= 200;
    if (markDirty !== false) setDirty(scale !== lastScannedScale || currentSelNodeId !== lastScannedNodeId);
  }

  scaleDec.addEventListener('click', () => {
    const prev = SCALE_PRESETS.filter(p => p < scalePercent).pop();
    if (prev != null) applyScalePercent(prev);
  });

  scaleInc.addEventListener('click', () => {
    const next = SCALE_PRESETS.find(p => p > scalePercent);
    if (next != null) applyScalePercent(next);
  });

  scaleInput.addEventListener('focus', () => {
    scaleInput.value = String(scalePercent);
    scaleInput.select();
  });

  scaleInput.addEventListener('blur', () => {
    const raw = parseFloat(scaleInput.value);
    if (!isNaN(raw) && raw >= 100 && raw <= 200) {
      applyScalePercent(raw);
    } else {
      scaleInput.value = scalePercent + '%';
    }
  });

  scaleInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { scaleInput.blur(); return; }
    if (e.key === 'ArrowUp') {
      e.preventDefault();
      const next = SCALE_PRESETS.find(p => p > scalePercent);
      if (next != null) applyScalePercent(next);
    }
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      const prev = SCALE_PRESETS.filter(p => p < scalePercent).pop();
      if (prev != null) applyScalePercent(prev);
    }
  });

  applyScalePercent(125, false);

  // ── Focus frame button ────────────────────────────────────────────────
  const focusFrameBtn = document.getElementById('focus-frame-btn');
  let lockedFrameId = null; // mirrors lockedNodeId in code.js, set from preview-result
  focusFrameBtn.addEventListener('click', () => {
    if (lockedFrameId) parent.postMessage({ pluginMessage: { type: 'focus-node', nodeId: lockedFrameId } }, '*');
  });

  // ── Generate button ───────────────────────────────────────────────────
  const genBtn = document.getElementById('gen-btn');
  genBtn.addEventListener('click', () => {
    if (genBtn.disabled) return;
    // New scan invalidates the current pinned highlight — drop it before
    // refreshing so the side panel closes and the preview resets.
    if (typeof clearPin === 'function') clearPin();
    setGenerating(true);
    parent.postMessage({ pluginMessage: { type: 'preview', scale, dpr: window.devicePixelRatio || 2 } }, '*');
  });

  // ── Empty-state scan button — triggers a full generate ───────────────
  document.getElementById('scan-btn').addEventListener('click', () => {
    if (typeof clearPin === 'function') clearPin();
    setGenerating(true);
    parent.postMessage({ pluginMessage: { type: 'preview', scale, dpr: window.devicePixelRatio || 2 } }, '*');
  });

  // ── Helpers ───────────────────────────────────────────────────────────
  const GEN_ICON = `<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 6A4.5 4.5 0 0 1 9 2.5l1-1"/><path d="M10.5 6A4.5 4.5 0 0 1 3 9.5l-1 1"/><polyline points="9.5,1 10.5,3.5 8,3.5"/><polyline points="2.5,11 1.5,8.5 4,8.5"/></svg>`;
  const GEN_SPIN = `<span class="toast-spinner" style="border-color:currentColor;border-top-color:transparent;opacity:1;width:10px;height:10px;"></span>`;

  function setGenerating(on) {
    if (on) genBtn.disabled = true;
    genBtn.innerHTML = GEN_ICON;

    if (on) {
      generationCancelled = false;
      showProgress('Generating preview…', { cls: 'progress-scan', cancel: () => {
        generationCancelled = true;
        parent.postMessage({ pluginMessage: { type: 'preview-cancel' } }, '*');
        dismissProgress();
        genBtn.disabled = false;
        setDirty(true);
      }});
    } else {
      dismissProgress();
    }
  }

  function bytesToDataUrl(bytes) {
    const arr = new Uint8Array(bytes);
    let b = '';
    const chunk = 8192;
    for (let i = 0; i < arr.length; i += chunk) {
      b += String.fromCharCode(...arr.subarray(i, Math.min(i + chunk, arr.length)));
    }
    return 'data:image/png;base64,' + btoa(b);
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function showEmpty() {
    document.getElementById('empty-state').style.display = '';
    document.getElementById('results-ui').style.display = 'none';
    window._manualH = 0;
    if (window._sendHeight) window._sendHeight();
  }
  function showResults() {
    document.getElementById('empty-state').style.display = 'none';
    document.getElementById('results-ui').style.display = 'flex';
    if (window._sendHeight) window._sendHeight();
  }

  // ── Message handler ───────────────────────────────────────────────────
  window.onmessage = ({ data }) => {
    const msg = data.pluginMessage;
    if (!msg) return;

    if (msg.type === 'panel-width')    applyPanelWidth(msg.width);
    if (msg.type === 'details-width')  applyDetailsWidth(msg.width);
    if (msg.type === 'selection')      handleSelection(msg.data);
    if (msg.type === 'sel-state') {
      hasSel = msg.valid;
      currentSelNodeId = msg.nodeId || null;
      focusFrameBtn.disabled = !lockedFrameId;
      document.getElementById('scan-btn').disabled = !msg.valid;
      setDirty(currentSelNodeId !== lastScannedNodeId || scale !== lastScannedScale);
    }
    if (msg.type === 'preview-result') handlePreview(msg);
    if (msg.type === 'error')          handleError(msg.message);
  };

  function handleSelection(d) {
    const scanBtn = document.getElementById('scan-btn');
    const emptyP  = document.querySelector('.empty-state p');

    if (d.error) {
      hasSel = false;
      scanBtn.disabled = true;
      if (!hasGenerated) {
        const errs = { 'no-selection': 'Select a frame, component set, or instance to start previewing.', 'multi-selection': 'Select only one frame.', 'invalid-type': 'Select a frame, component, component set, or group.' };
        emptyP.textContent = errs[d.error] || d.error;
        showEmpty();
      }
      return;
    }

    hasSel = true;
    scanBtn.disabled = false;
    emptyP.textContent = 'Select a frame, component set, or instance to start previewing.';
    document.getElementById('frame-name').textContent = d.name || '';
    if (d.nodeId) { currentSelNodeId = d.nodeId; lockedFrameId = d.nodeId; focusFrameBtn.disabled = false; }
    setDirty(currentSelNodeId !== lastScannedNodeId || scale !== lastScannedScale);

    if (hasGenerated) showResults(); else showEmpty();

  }

  function handlePreview({ name, frameId, original, scaled, issues, scale: s, frameW: fw, frameH: fh }) {
    if (generationCancelled) { generationCancelled = false; return; }
    hasGenerated = true;
    lastScannedNodeId = frameId || null;
    lastScannedScale = s;
    setGenerating(false);
    setDirty(true); // always allow re-scan after a result — canvas may have changed
    if (name) document.getElementById('frame-name').textContent = name;
    if (frameId) { lockedFrameId = frameId; focusFrameBtn.disabled = false; }
    showResults();

    // Sort: truncation (silent data loss) first, then overflow.  Stable order
    // within each severity preserves the discovery (DFS) order from the plugin.
    const SEV_RANK = { truncation: 0, overflow: 1 };
    issues = issues.slice().map((iss, i) => ({ iss: iss, i: i })).sort((a, b) => {
      const ra = SEV_RANK[a.iss.severity] != null ? SEV_RANK[a.iss.severity] : 99;
      const rb = SEV_RANK[b.iss.severity] != null ? SEV_RANK[b.iss.severity] : 99;
      return ra - rb || a.i - b.i;
    }).map(e => e.iss);

    currentIssues = issues;
    frameW = fw || 1;
    frameH = fh || 1;
    document.getElementById('img-scaled').src = bytesToDataUrl(scaled);
    document.getElementById('preview-grid').style.display = 'flex';
    renderOverlays(issues);

    const list = document.getElementById('issues-list');

    if (issues.length === 0) {
      list.innerHTML = '<div class="no-issues">'
        + '<svg width="56" height="56" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M28.0004 7.99951C39.0459 7.99978 48.0004 16.955 48.0004 28.0005C48.0001 39.0458 39.0457 48.0002 28.0004 48.0005C16.9549 48.0005 7.99968 39.046 7.99942 28.0005C7.99942 16.9548 16.9547 7.99951 28.0004 7.99951ZM28.0004 10.0005C18.0593 10.0005 10.0004 18.0594 10.0004 28.0005C10.0007 37.9414 18.0594 46.0005 28.0004 46.0005C37.9411 46.0002 46.0001 37.9412 46.0004 28.0005C46.0004 18.0595 37.9413 10.0008 28.0004 10.0005ZM38.6645 20.6021L39.3725 21.3091L24.5775 36.104C24.1871 36.4945 23.554 36.4944 23.1635 36.104L16.6273 29.5679L18.0414 28.1538L23.8695 33.9829L37.9574 19.895L38.6645 20.6021Z" fill="currentColor"/></svg>'
        + '<span>No issues found</span>'
        + '</div>';
    } else {
      // Count items per severity to render section headers with totals
      var nTr = 0, nCl = 0;
      for (var ic = 0; ic < issues.length; ic++) {
        if (issues[ic].severity === 'truncation') nTr++; else nCl++;
      }
      const SECTION_LABELS = {
        truncation: { label: 'Truncated', total: nTr, tip: 'Content is silently hidden at design time' },
        clipped:    { label: 'Clipped',   total: nCl, tip: 'Content extends past its container' },
      };
      // Per-type icon + render size (tuned individually).
      const TYPE_ICONS = {
        TEXT:           { href: '#icon-object-text',          size: 16 },
        FRAME:          { href: '#icon-object-frame',         size: 16 },
        COMPONENT:      { href: '#icon-object-component',     size: 16 },
        INSTANCE:       { href: '#icon-object-variant',     size: 16 },
        COMPONENT_SET:  { href: '#icon-object-component', size: 16 },
      };

      var html = '';
      var lastSeverity = null;
      for (var ii = 0; ii < issues.length; ii++) {
        const iss     = issues[ii];
        // Section divider when severity changes (issues are already sorted)
        if (iss.severity !== lastSeverity) {
          const sec = SECTION_LABELS[iss.severity] || { label: 'Issues', total: 0, tip: '' };
          html += '<div class="dividerSection"><div class="dividerSection-content">'
                +   escHtml(sec.label) + ' <span class="count">· ' + sec.total + '</span>'
                + '</div></div>';
          lastSeverity = iss.severity;
        }
        const primary = iss.chars || iss.name || iss.parentName || 'Unnamed layer';
        const previewBtn = '';
        const tIcon    = TYPE_ICONS[iss.kind] || TYPE_ICONS.FRAME;
        const typeHref = tIcon.href;
        const typeSize = tIcon.size;
        const _oob = iss.outOfBounds;
        const _oobTip = _oob === 'full'
          ? 'Layer is completely outside the frame and hidden on canvas.'
          : _oob === 'partial'
          ? 'Layer is partially outside the frame. The clipped portion is hidden on canvas.'
          : '';
        const clippedInfo = _oob
          ? '<span class="tooltipButton" data-tip="' + _oobTip + '" onclick="event.stopPropagation()">'
          + '<svg width="12" height="12"><use href="#icon-info"/></svg>'
          + '</span>'
          : '';
        html += '<div class="buttonList issue-item t-' + iss.type + '" data-iid="' + ii + '">'
              + '<div class="issue-meta">'
              + '<div class="issue-primary">'
              +   '<svg class="issue-type-icon" width="' + typeSize + '" height="' + typeSize + '"><use href="' + typeHref + '"/></svg>'
              +   '<span class="txt">' + escHtml(primary) + '</span>'
              +   clippedInfo
              + '</div>'
              + '</div>'
              + previewBtn
              + '<svg width="16" height="16" class="buttonList-arrow"><use href="#icon-arrow-right"/></svg>'
              + '</div>';
      }
      requestAnimationFrame(() => { list.innerHTML = html; });
    }
    // Stash issues so the details side-panel can look them up by iid
    window._currentIssues = issues;
    document.getElementById('issues-panel').style.display = 'flex';
    document.getElementById('panel-resize-handle').style.display = '';
    if (window._sendHeight) window._sendHeight();

  }

  function renderOverlays(issues) {
    const container  = document.getElementById('issue-overlays');
    const labelLayer = document.getElementById('label-layer');
    container.innerHTML  = '';
    labelLayer.innerHTML = '';
    if (!frameW || !frameH) return;
    // Use frameW/H as the coordinate reference for percentage calculations.
    // img.onload will confirm the container size matches the actual rendered image.
    container.style.width  = frameW + 'px';
    container.style.height = frameH + 'px';
    const refW = frameW, refH = frameH;
    for (var i = 0; i < issues.length; i++) {
      const b = issues[i].bounds;
      if (!b) continue;
      const el = document.createElement('div');
      el.className = 'issue-overlay t-' + issues[i].type;
      el.dataset.iid = i;
      if (issues[i].nodeId) el.dataset.nid = issues[i].nodeId;
      el.style.left   = (b.x / refW * 100) + '%';
      el.style.top    = (b.y / refH * 100) + '%';
      el.style.width  = (b.w / refW * 100) + '%';
      el.style.height = (b.h / refH * 100) + '%';
      container.appendChild(el);

      // Label lives outside zoom-canvas — never blurs at any zoom
      const lbl = document.createElement('div');
      lbl.className = 'overlay-label';
      lbl.dataset.iid = i;
      if (issues[i].nodeId) lbl.dataset.nid = issues[i].nodeId;
      const badgeText = issues[i].chars || issues[i].name || issues[i].parentName || '';
      lbl.innerHTML = (badgeText ? '<span class="overlay-label-text">' + escHtml(badgeText) + '</span>' : '')
        + '<svg width="16" height="16" style="display:block;flex-shrink:0"><use href="#icon-fit"/></svg>';
      labelLayer.appendChild(lbl);
    }
  }

  function handleError(msg) {
    setGenerating(false);
    showError(escHtml(msg));
  }

  // ── Pan / Zoom for scaled preview ─────────────────────────────────────
  (function () {
    const wrap     = document.getElementById('zoom-wrap');
    const canvas   = document.getElementById('zoom-canvas');
    const img      = document.getElementById('img-scaled');
    const resetBtn = document.getElementById('zoom-reset');
    const hint     = document.getElementById('zoom-hint');

    let tx = 0, ty = 0, z = 1, fitZ = 1;
    let initTx = 0, initTy = 0;
    let dragging = false, ox = 0, oy = 0, otx = 0, oty = 0;
    let dragDist = 0;
    let hintTimer = null, wheelEndTimer = null;

    function apply() {
      canvas.style.transform = `translate(${tx}px,${ty}px) scale(${z})`;
      updateLabelPositions();
    }

    function updateLabelPositions() {
      const oc = document.getElementById('issue-overlays');
      const cw = parseFloat(oc.style.width)  || 1;
      const ch = parseFloat(oc.style.height) || 1;
      const overlays = document.querySelectorAll('.issue-overlay');
      const labels   = document.querySelectorAll('.overlay-label');
      overlays.forEach((ov, i) => {
        const lbl = labels[i];
        if (!lbl) return;
        // Compute target screen position directly from tx/ty/z — no getBCR during animation
        const ox = parseFloat(ov.style.left) / 100 * cw;
        const oy = parseFloat(ov.style.top)  / 100 * ch;
        lbl.style.left = (tx + ox * z) + 'px';
        lbl.style.top  = (ty + oy * z - lbl.offsetHeight) + 'px';
      });
    }

    // Compute the wrap's effective available width — accounts for the details
    // panel sliding in/out so the math is correct mid-transition too.
    function availWidth() {
      const grid = document.getElementById('preview-grid');
      const dp   = document.getElementById('details-panel');
      let detailsW = 0;
      if (dp && dp.classList.contains('open')) {
        detailsW = dp.offsetWidth || 260;
      }
      return Math.max(((grid ? grid.clientWidth : wrap.clientWidth) - detailsW), 1);
    }
    // Reset: fit image to container and center it
    function reset() {
      const iw = parseFloat(img.style.width)  || img.naturalWidth  || 1;
      const ih = parseFloat(img.style.height) || img.naturalHeight || 1;
      const ww = availWidth();
      const wh = wrap.clientHeight || 1;
      fitZ = Math.min(ww / iw, wh / ih, 1);
      z  = fitZ;
      tx = Math.round((ww - iw * z) / 2);
      ty = Math.round((wh - ih * z) / 2);
      initTx = tx; initTy = ty;
      wrap.classList.remove('zoomed');
      apply();
    }

    function showHint() {
      hint.classList.remove('hidden');
      clearTimeout(hintTimer);
      hintTimer = setTimeout(() => hint.classList.add('hidden'), 2200);
    }

    img.addEventListener('load', () => {
      const dpr = window.devicePixelRatio || 2;
      const w = img.naturalWidth  / dpr;
      const h = img.naturalHeight / dpr;
      img.style.width  = w + 'px';
      img.style.height = h + 'px';
      // Keep overlay container in exact sync with rendered image — single source of truth
      const overlays = document.getElementById('issue-overlays');
      overlays.style.width  = w + 'px';
      overlays.style.height = h + 'px';
      reset();
      showHint();
    });

    // Wheel → zoom toward cursor
    wrap.addEventListener('wheel', e => {
      e.preventDefault();
      canvas.classList.add('no-transition');
      document.querySelectorAll('.overlay-label').forEach(l => l.classList.add('no-transition'));
      clearTimeout(wheelEndTimer);
      wheelEndTimer = setTimeout(() => {
        canvas.classList.remove('no-transition');
        document.querySelectorAll('.overlay-label').forEach(l => l.classList.remove('no-transition'));
      }, 150);
      const r  = wrap.getBoundingClientRect();
      const mx = e.clientX - r.left;
      const my = e.clientY - r.top;
      const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
      const nz = Math.max(fitZ * 0.25, Math.min(z * factor, 12));
      tx = mx - (mx - tx) * (nz / z);
      ty = my - (my - ty) * (nz / z);
      z  = nz;
      wrap.classList.toggle('zoomed', Math.abs(z - fitZ) > 0.01 || Math.abs(tx - initTx) > 1 || Math.abs(ty - initTy) > 1);
      apply();
    }, { passive: false });

    // Drag → pan (yield to resize handles on bottom/right edges).
    // Panning never clears the pinned highlight — the user explicitly wants
    // the selection to survive while they navigate the preview.
    wrap.addEventListener('mousedown', e => {
      if (e.button !== 0) return;
      if (window.innerHeight - e.clientY <= 12 || window.innerWidth - e.clientX <= 12) return;
      canvas.classList.add('no-transition');
      document.querySelectorAll('.overlay-label').forEach(l => l.classList.add('no-transition'));
      dragging = true; dragDist = 0;
      ox = e.clientX; oy = e.clientY;
      otx = tx; oty = ty;
      wrap.classList.add('dragging');
      e.preventDefault();
    });
    window.addEventListener('mousemove', e => {
      if (!dragging) return;
      dragDist += Math.abs(e.clientX - ox - (tx - otx)) + Math.abs(e.clientY - oy - (ty - oty));
      tx = otx + (e.clientX - ox);
      ty = oty + (e.clientY - oy);
      wrap.classList.toggle('zoomed', Math.abs(tx - initTx) > 1 || Math.abs(ty - initTy) > 1 || Math.abs(z - fitZ) > 0.01);
      apply();
    });
    window.addEventListener('mouseup', () => {
      dragging = false;
      wrap.classList.remove('dragging');
      canvas.classList.remove('no-transition');
      document.querySelectorAll('.overlay-label').forEach(l => l.classList.remove('no-transition'));
    });

    // Click on overlay or badge → pin + open details + zoom to fit the overlay.
    // Clicking the already-pinned highlight re-centers / re-fits the view (so
    // the user can pan/zoom around and snap back with a click).
    // Single-clicking empty preview does NOT close the pin — the user must
    // double-click outside the highlight to dismiss (see dblclick below).
    wrap.addEventListener('click', e => {
      if (dragDist > 4) return;
      const ov = e.target.closest('.issue-overlay');
      if (ov) {
        if (pinnedIid != null) {
          // Re-frame the already-pinned highlight; ignore clicks on others.
          if (ov.dataset.iid === pinnedIid) window._centerOnIid(pinnedIid);
          return;
        }
        pinnedIid = ov.dataset.iid;
        setActiveIid(pinnedIid);
        centerAfterOpenDetails(pinnedIid);
      }
      // Empty preview area on a single click → no-op
    });
    document.getElementById('label-layer').addEventListener('click', e => {
      const lbl = e.target.closest('.overlay-label');
      if (!lbl) return;
      if (pinnedIid != null) {
        // Re-frame the already-pinned highlight; ignore clicks on others.
        if (lbl.dataset.iid === pinnedIid) window._centerOnIid(pinnedIid);
        return;
      }
      pinnedIid = lbl.dataset.iid;
      setActiveIid(pinnedIid);
      centerAfterOpenDetails(pinnedIid);
    });

    // Reset to 100%
    resetBtn.addEventListener('click', e => { e.stopPropagation(); reset(); });
    // Double-click outside the highlight clears the pin (and resets the view);
    // double-click elsewhere just resets zoom/pan.
    wrap.addEventListener('dblclick', e => {
      const ov = e.target.closest('.issue-overlay');
      if (pinnedIid != null && !ov) {
        clearPin();
        return;
      }
      reset();
    });

    // Refresh fit-zoom whenever the wrap resizes.  When the user is NOT zoomed
    // (i.e. plain fit view), also re-fit and re-center the image.  When they
    // ARE zoomed/pinned, leave tx/ty alone — re-centering during the details
    // panel's open/close transition would clobber the overlay-centered pan
    // that _centerOnIid just set.
    new ResizeObserver(() => {
      const iw = parseFloat(img.style.width);
      if (!iw) return;
      const ih = parseFloat(img.style.height);
      const ww = wrap.clientWidth  || 1;
      const wh = wrap.clientHeight || 1;
      fitZ = Math.min(ww / iw, wh / ih, 1);
      if (wrap.classList.contains('zoomed')) return; // preserve user/pinned view
      z = fitZ;
      tx = Math.round((ww - iw * z) / 2);
      ty = Math.round((wh - ih * z) / 2);
      initTx = tx; initTy = ty;
      apply();
    }).observe(wrap);

    // Exposed so the details panel close / clear-pin flow can reset the view
    window._previewReset = reset;


    // Zoom into a specific overlay so it fills the available preview area
    // (subtracting the details side-panel's width when it's open), then center.
    // Computes a *local* fit-zoom for the current available area so we never
    // pick a floor zoom that makes the image overflow the narrower wrap.
    window._centerOnIid = function(iid) {
      const ov = document.querySelector('.issue-overlay[data-iid="' + iid + '"]');
      if (!ov) return;
      const iw = parseFloat(img.style.width)  || 1;
      const ih = parseFloat(img.style.height) || 1;
      const ow = parseFloat(ov.style.width)  / 100 * iw;
      const oh = parseFloat(ov.style.height) / 100 * ih;
      const cx = parseFloat(ov.style.left) / 100 * iw + ow / 2;
      const cy = parseFloat(ov.style.top)  / 100 * ih + oh / 2;
      const ww = availWidth();
      const wh = wrap.clientHeight || 1;
      // Fit zoom for the CURRENT area — the image must always fit, even when
      // the right panel is open.  This is the floor for the chosen zoom.
      const fitZNow = Math.min(ww / iw, wh / ih, 1);
      // Target zoom: overlay fills ~75% of the available area on its tighter axis
      const PAD = 0.75;
      const fitZoom = Math.min((ww * PAD) / ow, (wh * PAD) / oh);
      z = Math.max(fitZNow, Math.min(8, fitZoom));
      tx = ww / 2 - cx * z;
      ty = wh / 2 - cy * z;
      wrap.classList.toggle('zoomed', Math.abs(tx - initTx) > 1 || Math.abs(ty - initTy) > 1 || Math.abs(z - fitZNow) > 0.01);
      apply();
    };
  })();

  // ── Auto-resize to content ────────────────────────────────────────────
  (function () {
    function contentHeight() {
      const empty = document.getElementById('empty-state');
      if (empty && empty.style.display !== 'none') {
        return Math.max(empty.scrollHeight, 160);
      }
      // Results view fills the window — preserve current height
      return window.innerHeight;
    }

    function sendHeight() {
      if (window._manualH) return;
      const h = Math.min(contentHeight(), 820);
      const w = window._manualW || window.innerWidth;
      parent.postMessage({ pluginMessage: { type: 'ui-resize', width: Math.round(w), height: Math.round(h) } }, '*');
    }

    window._sendHeight = sendHeight;
    const ro = new ResizeObserver(sendHeight);
    ro.observe(document.getElementById('empty-state'));
    ro.observe(document.getElementById('results-ui'));
  })();

  // ── Manual resize (drag bottom / right edges) ─────────────────────────
  initWindowResize({ edges: 'both', minW: 480, maxW: 1400, minH: 160, maxH: 900 });

  // ── Issue overlay hover sync ──────────────────────────────────────────
  // Pinned iid persists until the user interacts with the preview or selects
  // a different highlight. Set by clicking "show in canvas" on an issue.
  let pinnedIid = null;
  function setActiveIid(iid) {
    document.querySelectorAll('.issue-overlay').forEach(o => {
      const match = o.dataset.iid === iid;
      o.classList.toggle('active', match);
      o.classList.toggle('dimmed', !match);
    });
    document.querySelectorAll('.overlay-label').forEach(lbl => {
      const match = lbl.dataset.iid === iid;
      lbl.classList.toggle('active', match);
      // Pinned = the active label IS the pinned one (icon hidden in that case)
      lbl.classList.toggle('pinned', match && pinnedIid != null && pinnedIid === iid);
    });
    document.querySelectorAll('.issue-item').forEach(item => {
      const isPinned = item.dataset.iid === pinnedIid;
      item.classList.toggle('hovered', item.dataset.iid === iid && !isPinned);
      item.classList.toggle('selected', isPinned);
    });
    // Toggle the wrap-level "has-pin" flag so CSS hides every non-active
    // overlay/label whenever something is pinned.
    const zw = document.getElementById('zoom-wrap');
    if (zw) zw.classList.toggle('has-pin', pinnedIid != null);
  }
  function clearActive() {
    document.querySelectorAll('.issue-overlay').forEach(o => {
      o.classList.remove('active', 'dimmed');
    });
    document.querySelectorAll('.overlay-label').forEach(lbl => lbl.classList.remove('active'));
    document.querySelectorAll('.issue-item').forEach(item => item.classList.remove('hovered', 'selected'));
    // Restore pinned highlight if any — only fully clears when nothing is pinned.
    if (pinnedIid != null) setActiveIid(pinnedIid);
  }
  function clearPin() {
    if (pinnedIid == null) return;
    pinnedIid = null;
    document.querySelectorAll('.issue-overlay').forEach(o => o.classList.remove('active', 'dimmed'));
    document.querySelectorAll('.overlay-label').forEach(lbl => lbl.classList.remove('active', 'pinned'));
    document.querySelectorAll('.issue-item').forEach(item => item.classList.remove('hovered', 'selected'));
    const zw = document.getElementById('zoom-wrap');
    if (zw) zw.classList.remove('has-pin');
    closeDetails();
    // Reset preview zoom + pan back to fit-to-window
    if (window._previewReset) window._previewReset();
  }

  // ── Pinned-element details side panel ────────────────────────────────
  const SIZING_LABEL = {
    NONE: 'None',
    HORIZONTAL: 'Horizontal', VERTICAL: 'Vertical',
    FIXED: 'Fixed', HUG: 'Hug', FILL: 'Fill',
    AUTO: 'Auto',
    'WIDTH_AND_HEIGHT': 'Width and height',
    'HEIGHT': 'Height',
    'TRUNCATE': 'Truncate',
  };
  function lbl(v) { return SIZING_LABEL[v] || v; }
  function row(label, val) {
    return '<div class="details-row"><span class="label">' + escHtml(label) + '</span><span class="value">' + val + '</span></div>';
  }
  // Map a fix title to a fitting icon from the sprite
  function fixIconHref(title) {
    var t = (title || '').toLowerCase();
    if (t.indexOf('line cap') !== -1) return '#icon-suggestion-removeline';
    if (t.indexOf('truncation') !== -1) return '#icon-suggestion-removeline';
    if (t.indexOf('width & height') !== -1 || t === 'set text resize to hug') return '#icon-suggestion-resize';
    if (t.indexOf('width to hug') !== -1)  return '#icon-suggestion-hug-width';
    if (t.indexOf('height to hug') !== -1) return '#icon-suggestion-hug-height';
    if (t.indexOf('width to fill') !== -1) return '#icon-suggestion-fill-width';
    if (t.indexOf('height to fill') !== -1)return '#icon-suggestion-fill-height';
    if (t.indexOf('hug height') !== -1)    return '#icon-suggestion-hug-height';
    if (t.indexOf('hug width') !== -1)     return '#icon-suggestion-hug-width';
    return '#icon-suggestion-resize';
  }
  // Shared mapping — used by both the issue list and the details header
  const DETAILS_TYPE_ICONS = {
    TEXT:           '#icon-object-text',
    FRAME:          '#icon-object-frame',
    COMPONENT:      '#icon-object-component',
    INSTANCE:       '#icon-object-variant',
    COMPONENT_SET:  '#icon-object-component',
  };
  function renderDetails(iss) {
    const body  = document.getElementById('details-body');
    const title = document.getElementById('details-title');
    if (!iss) { body.innerHTML = ''; title.textContent = ''; return; }
    // Match the label used in the issue list (same priority order)
    title.textContent = iss.chars || iss.name || iss.parentName || iss.kind || 'Issue';
    const isTrunc = iss.severity === 'truncation';
    const statusLabel = isTrunc ? 'Truncated' : 'Clipped';
    // Sync the type icon to match the list row
    const typeIconEl = document.getElementById('details-type-icon');
    if (typeIconEl) {
      const href = DETAILS_TYPE_ICONS[iss.kind] || '#icon-object-frame';
      const useEl = typeIconEl.querySelector('use');
      if (useEl) useEl.setAttribute('href', href);
    }
    var html = '';

    // 1. Status badge + plain-English description + View on Canvas button
    if (iss.description || iss.nodeId) {
      var statusHtml = '<div class="badge ' + (isTrunc ? 'truncated' : 'clipped') + '">' + escHtml(statusLabel) + '</div>';
      var descHtml = iss.description ? '<div class="details-description">' + escHtml(iss.description) + '</div>' : '';
      var viewBtn = iss.nodeId
        ? '<button class="buttonSecondary fix-action" data-nid="' + escHtml(iss.nodeId) + '"><span>View on Canvas</span><svg width="16" height="16"><use href="#icon-focus"/></svg></button>'
        : '';
      html += '<div class="details-section">' + statusHtml + descHtml + viewBtn + '</div>';
    }

    // 4. Suggested Fixes
    if (iss.suggestedFixes && iss.suggestedFixes.length) {
      var fixesHtml = '';
      for (var fi = 0; fi < iss.suggestedFixes.length; fi++) {
        var fix = iss.suggestedFixes[fi];
        var iconHref = fixIconHref(fix.title);
        fixesHtml += '<div class="fix-row">'
                  +   '<svg class="fix-icon" width="14" height="14"><use href="' + iconHref + '"/></svg>'
                  +   '<div class="fix-body">'
                  +     '<div class="fix-title-row"><span class="fix-title">' + escHtml(fix.title) + '</span></div>'
                  +     '<div class="fix-desc">' + escHtml(fix.description) + '</div>'
                  +   '</div>'
                  + '</div>';
      }
      html += '<div class="details-section details-fixes-section">'
           +   '<div class="details-fixes-header">Suggested Fixes</div>'
           +   fixesHtml
           + '</div>';
    }

    // 5. Bound variables
    if (iss.bindings && iss.bindings.length) {
      var bHtml = '';
      for (var bi = 0; bi < iss.bindings.length; bi++) {
        bHtml += row(iss.bindings[bi].property, escHtml(iss.bindings[bi].name));
      }
      html += '<div class="details-section"><h4>Variables</h4>' + bHtml + '</div>';
    }

    // 6. Scale comparison
    if (iss.scale) {
      var scHtml = '';
      function pair(a, b, unit) { return escHtml(a + (unit || '')) + '<span class="arrow">→</span>' + escHtml(b + (unit || '')); }
      if (iss.scale.fontSize) scHtml += row('Font size', pair(iss.scale.fontSize.original, iss.scale.fontSize.current, 'px'));
      if (iss.scale.width)    scHtml += row('Width',     pair(iss.scale.width.original,    iss.scale.width.current));
      if (iss.scale.height)   scHtml += row('Height',    pair(iss.scale.height.original,   iss.scale.height.current));
      if (scHtml) html += '<div class="details-section details-scale"><h4>100% → ' + Math.round(scalePercent) + '%</h4>' + scHtml + '</div>';
    }

    body.innerHTML = html;
  }
  // Opens the details panel and centers the overlay in the remaining space.
  // If the panel was closed, the 0.18s slide-in transition must complete before
  // centering — otherwise availWidth() still sees width:0 and centers in the
  // full area, causing the overlay to end up behind the panel.
  function centerAfterOpenDetails(iid) {
    const dp = document.getElementById('details-panel');
    const wasOpen = dp && dp.classList.contains('open');
    if (typeof openDetailsForIid === 'function') openDetailsForIid(iid);
    if (wasOpen) {
      if (window._centerOnIid) window._centerOnIid(iid);
    } else {
      setTimeout(() => { if (window._centerOnIid) window._centerOnIid(iid); }, 185);
    }
  }

  function openDetailsForIid(iid) {
    const issues = window._currentIssues;
    if (!issues) return;
    const iss = issues[Number(iid)];
    if (!iss) return;
    renderDetails(iss);
    const dp = document.getElementById('details-panel');
    if (_savedDetailsWidth) dp.style.width = _savedDetailsWidth + 'px';
    dp.classList.add('open');
  }
  function closeDetails() {
    const dp = document.getElementById('details-panel');
    dp.classList.remove('open');
    dp.style.width = ''; // clear inline style so CSS width:0 takes over
  }
  document.getElementById('details-close').addEventListener('click', () => clearPin());

  // Suggested-fix "View on Canvas" buttons (delegated — body innerHTML is replaced)
  document.getElementById('details-body').addEventListener('click', e => {
    const btn = e.target.closest('.fix-action');
    if (!btn) return;
    const nid = btn.dataset.nid;
    if (nid) parent.postMessage({ pluginMessage: { type: 'focus-node', nodeId: nid } }, '*');
  });

  // List → overlay: highlight only (no pan/center on hover).
  // The preview centers only when the user clicks the dedicated preview button.
  const issuesList = document.getElementById('issues-list');
  issuesList.addEventListener('mouseover', e => {
    const item = e.target.closest('.issue-item');
    if (item && item.dataset.iid !== pinnedIid) setActiveIid(item.dataset.iid);
  });
  issuesList.addEventListener('mouseleave', clearActive);

  // Overlay → list (disabled while pinned — only list hover may change active)
  document.getElementById('zoom-wrap').addEventListener('mouseover', e => {
    if (pinnedIid != null) return;
    const ov = e.target.closest('.issue-overlay');
    if (ov) {
      const iid = ov.dataset.iid;
      setActiveIid(iid);
      const listItem = document.querySelector('.issue-item[data-iid="' + iid + '"]');
      if (listItem) listItem.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    } else if (!e.target.closest('.overlay-label')) {
      clearActive();
    }
  });
  document.getElementById('zoom-wrap').addEventListener('mouseleave', clearActive);

  // Badge hover — keep active when mouse moves from overlay to badge and back
  const labelLayer = document.getElementById('label-layer');
  labelLayer.addEventListener('mouseover', e => {
    if (pinnedIid != null) return;
    const lbl = e.target.closest('.overlay-label');
    if (lbl) setActiveIid(lbl.dataset.iid);
  });
  labelLayer.addEventListener('mouseleave', e => {
    const to = e.relatedTarget;
    if (to && (to.closest('.issue-overlay') || to.closest('.overlay-label'))) return;
    clearActive();
  });

  // ── Issue list interactions (delegated — survives innerHTML replacement) ──
  document.getElementById('issues-list').addEventListener('click', e => {
    // Preview-center button → pin + center overlay in the preview
    const previewBtn = e.target.closest('.issue-preview-center');
    if (previewBtn) {
      pinnedIid = previewBtn.dataset.iid;
      setActiveIid(pinnedIid);
      centerAfterOpenDetails(pinnedIid);
      return;
    }
    // Click anywhere on item → pin + center overlay
    const item = e.target.closest('.issue-item');
    if (item) {
      pinnedIid = item.dataset.iid;
      setActiveIid(pinnedIid);
      centerAfterOpenDetails(pinnedIid);
      return;
    }
    // Collapse/expand group header
    const header = e.target.closest('.issue-group-header');
    if (header) {
      header.closest('.issue-group').classList.toggle('collapsed');
    }
  });

  // ── Panel resize ─────────────────────────────────────────────────────
  function applyPanelWidth(w) {
    const panel = document.getElementById('issues-panel');
    panel.style.width = Math.min(Math.max(w, 120), 400) + 'px';
  }
  let _savedDetailsWidth = null;
  function applyDetailsWidth(w) {
    const clamped = Math.min(Math.max(w, 200), 480);
    _savedDetailsWidth = clamped;
    const panel = document.getElementById('details-panel');
    if (!panel) return;
    // Only write to DOM when the panel is actually open (drag-resize while open).
    // Restoring from storage must NOT set the inline style on a closed panel —
    // it would override the CSS width:0 and make the panel visible on startup.
    if (panel.classList.contains('open')) panel.style.width = clamped + 'px';
  }

  initSidePanelResize(document.getElementById('issues-panel'), {
    min: 120, max: 400, defaultWidth: 200,
    onSave: w => parent.postMessage({ pluginMessage: { type: 'save-panel-width', width: w } }, '*')
  });
  initSidePanelResize(document.getElementById('details-panel'), {
    defaultWidth: 260,
    onDrag: w => applyDetailsWidth(w),
    onSave: w => parent.postMessage({ pluginMessage: { type: 'save-details-width', width: w } }, '*')
  });

  // ── Init ──────────────────────────────────────────────────────────────
  parent.postMessage({ pluginMessage: { type: 'ready' } }, '*');
</script>
</body>
</html>
